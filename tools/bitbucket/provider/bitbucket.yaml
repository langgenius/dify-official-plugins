credentials_for_provider:
  bitbucket_url:
    type: text-input
    required: true
    label:
      en_US: Bitbucket URL
      zh_Hans: Bitbucket URL
      pt_BR: URL do Bitbucket
    placeholder:
      en_US: https://api.bitbucket.org
      zh_Hans: https://api.bitbucket.org
      pt_BR: https://api.bitbucket.org
    help:
      en_US: The base URL of your Bitbucket instance 
      zh_Hans: 您的 Bitbucket 实例的基础 URL
      pt_BR: A URL base da sua instância do Bitbucket
    url: https://developer.atlassian.com/cloud/bitbucket/rest/
  username:
    type: text-input
    label:
      en_US: Atlassian Account Email
      zh_Hans: Atlassian 帐户邮箱
      pt_BR: Email da conta Atlassian
    required: true
    help:
      en_US: Enter the email associated with your Atlassian account.
      zh_Hans: 请输入 Atlassian 帐户绑定的邮箱。
      pt_BR: Insira o email associado à sua conta Atlassian.
  password:
    type: secret-input
    label:
      en_US: Bitbucket API Token
      zh_Hans: Bitbucket API 令牌
      pt_BR: Token de API do Bitbucket
    required: true
    help:
      en_US: Create a scoped API token for Bitbucket Cloud.
      zh_Hans: 请创建带有所需权限的 Bitbucket Cloud API 令牌。
      pt_BR: Crie um token de API com escopos para o Bitbucket Cloud.
    url: https://support.atlassian.com/bitbucket-cloud/docs/create-an-api-token/
identity:
  author: langgenius
  name: bitbucket
  label:
    en_US: Bitbucket Cloud
    zh_Hans: Bitbucket Cloud
    pt_BR: Bitbucket Cloud
  description:
    en_US: Provides tools to interact with Bitbucket.
    zh_Hans: 提供与 Bitbucket 交互的工具。
    pt_BR: Fornece ferramentas para interagir com o Bitbucket.
  icon: icon.svg
  icon_dark: icon-dark.svg
tools:
  - tools/add_pull_request_comment.yaml
  - tools/get_pull_request.yaml
  - tools/list_pull_request.yaml
  - tools/get_repository.yaml
  - tools/get_workspace.yaml
  - tools/list_repository.yaml
  - tools/list_workspace.yaml
extra:
  python:
    source: provider/bitbucket.py
