credentials_for_provider:
  api_base_url:
    label:
      en_US: API Base URL
      zh_Hans: API 基础地址
    type: text-input
    required: false
    default: https://lark-plugin-api.solutionsuite.cn/lark-plugin
    placeholder:
      en_US: https://lark-plugin-api.solutionsuite.cn/lark-plugin
      zh_Hans: https://lark-plugin-api.solutionsuite.cn/lark-plugin
    help:
      en_US: Base URL of a compatible proxy service, including its path prefix. Leave blank to use the default service. The Feishu Open Platform API is not a direct replacement.
      zh_Hans: 兼容代理服务的基础地址，需包含路径前缀。留空使用默认服务，不能直接替换为飞书开放平台 API 地址。
  app_id:
    help:
      en_US: Get your app_id and app_secret from Feishu
      zh_Hans: 从飞书获取您的 app_id 和 app_secret
    label:
      en_US: APP ID
    placeholder:
      en_US: Please input your feishu app id
      zh_Hans: 请输入你的飞书 app id
    required: true
    type: text-input
    url: https://open.larkoffice.com/app
  app_secret:
    label:
      en_US: APP Secret
    placeholder:
      en_US: Please input your app secret
      zh_Hans: 请输入你的飞书 app secret
    required: true
    type: secret-input
extra:
  python:
    source: provider/feishu_document.py
identity:
  author: Doug Lea
  description:
    en_US: 'Lark cloud document, requires the following permissions: docx:document、drive:drive、docs:document.content:read.

      '
    zh_Hans: '飞书云文档，需要开通以下权限: docx:document、drive:drive、docs:document.content:read。

      '
  icon: icon.svg
  icon_dark: icon-dark.svg
  label:
    en_US: Lark Cloud Document
    zh_Hans: 飞书云文档
  name: feishu_document
  tags:
  - social
  - productivity
tools:
- tools/create_document.yaml
- tools/get_document_content.yaml
- tools/write_document.yaml
- tools/list_document_blocks.yaml
