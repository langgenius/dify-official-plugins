description:
  en_US: "AIHubMix image generation and editing. Two tools reach every image model the gateway serves, including the latest GPT Image, Gemini, Qwen Image, Wan, GLM and Agnes releases. The model list and each model's parameters are read from the gateway at call time, so new models show up without a plugin update."
  zh_Hans: "AIHubMix 图像生成与编辑。两个工具覆盖网关上的全部图像模型，包括 GPT Image、Gemini、Qwen Image、Wan、GLM、Agnes 等系列的最新版本。模型列表与每个模型支持的参数都在调用时实时从网关读取，新上线的模型无需升级插件即可使用。"
  ja_JP: "AIHubMix の画像生成と編集。2 つのツールでゲートウェイが提供するすべての画像モデル（GPT Image、Gemini、Qwen Image、Wan、GLM、Agnes などの最新世代を含む）に対応します。モデル一覧と各モデルのパラメータは呼び出し時にゲートウェイから取得されるため、新しいモデルもプラグイン更新なしで利用できます。"
  pt_BR: "Geração e edição de imagens AIHubMix. Duas ferramentas alcançam todos os modelos de imagem do gateway, incluindo os lançamentos mais recentes de GPT Image, Gemini, Qwen Image, Wan, GLM e Agnes. A lista de modelos e os parâmetros de cada um são lidos do gateway no momento da chamada, então modelos novos aparecem sem atualizar o plugin."
icon: icon.svg
