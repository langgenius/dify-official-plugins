name: aihubmix-image
label:
  en_US: AIHubMix Image
  ja_JP: AIHubMix Image
  zh_Hans: AIHubMix Image
  pt_BR: AIHubMix Image
description:
  en_US: "AIHubMix image generation and editing. Two tools cover the image models the gateway serves — GPT Image, Gemini, Qwen-Image, GLM, Wan and more — with the model list and each model's parameters read from the gateway at call time."
  zh_Hans: "AIHubMix 图像生成与编辑。两个工具覆盖网关上的图像模型 —— GPT Image、Gemini、Qwen-Image、GLM、Wan 等；模型列表与每个模型支持的参数都在调用时实时从网关读取。"
  ja_JP: "AIHubMix の画像生成と編集。2 つのツールでゲートウェイが提供する画像モデル（GPT Image、Gemini、Qwen-Image、GLM、Wan など）に対応し、モデル一覧と各モデルのパラメータは呼び出し時にゲートウェイから取得します。"
  pt_BR: "Geração e edição de imagens AIHubMix. Duas ferramentas cobrem os modelos de imagem do gateway — GPT Image, Gemini, Qwen-Image, GLM, Wan e outros — com a lista de modelos e os parâmetros de cada um lidos do gateway no momento da chamada."
icon: icon.svg
