identity:
  author: "langgenius"
  name: "aihubmix-image"
  label:
    en_US: "aihubmix-image"
    zh_Hans: "aihubmix-image"
    pt_BR: "aihubmix-image"
    ja_JP: "aihubmix-image"
  description:
    en_US: "Image generation and editing through the AIHubMix unified image endpoint. The model dropdown is filled from the gateway with your API key and currently offers GPT Image 2.5 Sunburst and Flare, GPT Image 2, Gemini 3 Pro Image, Gemini 3.1 Flash Image and Flash Lite Image, Gemini 2.5 Flash Image, Qwen Image 2.0 and 2.0 Pro, Wan2.7 Image and Image Pro, GLM Image and Agnes Image 2.1 Flash."
    zh_Hans: "基于 AIHubMix 统一图像接口的图像生成与编辑。模型下拉用你的 API Key 实时从网关拉取，目前可选 GPT Image 2.5 Sunburst / Flare、GPT Image 2、Gemini 3 Pro Image、Gemini 3.1 Flash Image / Flash Lite Image、Gemini 2.5 Flash Image、Qwen Image 2.0 / 2.0 Pro、Wan2.7 Image / Image Pro、GLM Image、Agnes Image 2.1 Flash。"
    pt_BR: "Geração e edição de imagens pelo endpoint unificado de imagem do AIHubMix. A lista de modelos vem do gateway com sua API Key e atualmente oferece GPT Image 2.5 Sunburst e Flare, GPT Image 2, Gemini 3 Pro Image, Gemini 3.1 Flash Image e Flash Lite Image, Gemini 2.5 Flash Image, Qwen Image 2.0 e 2.0 Pro, Wan2.7 Image e Image Pro, GLM Image e Agnes Image 2.1 Flash."
    ja_JP: "AIHubMix の統合画像エンドポイントによる画像生成と編集。モデル一覧は API キーでゲートウェイから取得され、現在は GPT Image 2.5 Sunburst / Flare、GPT Image 2、Gemini 3 Pro Image、Gemini 3.1 Flash Image / Flash Lite Image、Gemini 2.5 Flash Image、Qwen Image 2.0 / 2.0 Pro、Wan2.7 Image / Image Pro、GLM Image、Agnes Image 2.1 Flash を選択できます。"
  icon: icon.svg

# The key must be `credentials_for_provider` and the value a mapping keyed by credential
# name: the SDK reads it through that alias (ToolProviderConfiguration.credentials_schema)
# and injects each key as the credential's `name`. Spelling it `credentials_schema`, or
# passing a list, leaves the provider with no credentials at all -- Dify then reports no
# supported credential types and renders no way to enter the API key.
credentials_for_provider:
  api_key:
    type: "secret-input"
    required: true
    label:
      en_US: "API Key"
      zh_Hans: "API 密钥"
      pt_BR: "Chave API"
      ja_JP: "APIキー"
    placeholder:
      en_US: "Enter your AIHubMix API Key"
      zh_Hans: "请输入您的 AIHubMix API 密钥"
      pt_BR: "Digite sua chave API AIHubMix"
      ja_JP: "AIHubMix APIキーを入力してください"
    help:
      en_US: "API Key is used to authenticate requests to the AIHubMix API. Get your API key from https://docs.aihubmix.com/token"
      zh_Hans: "API 密钥用于认证请求到 AIHubMix API。请从 https://docs.aihubmix.com/token 获取您的 API 密钥"
      pt_BR: "A chave API é usada para autenticar solicitações à API AIHubMix. Obtenha sua chave em https://docs.aihubmix.com/token"
      ja_JP: "APIキーはAIHubMix APIへのリクエスト認証に使用されます。https://docs.aihubmix.com/token からAPIキーを取得してください"
    url: "https://docs.aihubmix.com/token"

  base_url:
    type: "select"
    required: false
    default: "https://api.inferera.com"
    label:
      en_US: "API Base URL"
      zh_Hans: "API 接口地址"
      pt_BR: "URL Base da API"
      ja_JP: "API ベース URL"
    options:
      - value: "https://api.inferera.com"
        label:
          en_US: "https://api.inferera.com"
          zh_Hans: "https://api.inferera.com"
          pt_BR: "https://api.inferera.com"
          ja_JP: "https://api.inferera.com"
      - value: "https://aihubmix.com"
        label:
          en_US: "https://aihubmix.com"
          zh_Hans: "https://aihubmix.com"
          pt_BR: "https://aihubmix.com"
          ja_JP: "https://aihubmix.com"
    help:
      en_US: "The API gateway base URL. Defaults to Inferera."
      zh_Hans: "API 网关的基础地址，默认使用 Inferera。"
      pt_BR: "A URL base do gateway da API. Padrão: Inferera."
      ja_JP: "API ゲートウェイのベース URL。デフォルトは Inferera です。"

