identity:
  name: confluence_upload_attachment
  author: langgenius
  label:
    en_US: Upload Attachment
    zh_Hans: 上传附件
    ja_JP: 添付ファイルをアップロード
description:
  human:
    en_US: Attach a file (or text) to a page
    zh_Hans: 给页面上传附件（文件或文本）
    ja_JP: ページにファイル（またはテキスト）を添付します
  llm: Attach a file to a Confluence page. Pass a file, or text content together with a file name to attach it as a text file.
parameters:
- name: page_id
  type: string
  required: true
  label:
    en_US: Page ID
    zh_Hans: 页面 ID
    ja_JP: ページ ID
  human_description:
    en_US: The page's numeric ID (from search or the page URL)
    zh_Hans: 页面的数字 ID（来自搜索或页面 URL）
    ja_JP: ページの数値 ID（検索結果またはページ URL から）
  llm_description: The numeric page ID, e.g. 65812 (from the search tool or the page URL .../pages/65812/...).
  form: llm
- name: file
  type: file
  required: false
  label:
    en_US: File
    zh_Hans: 文件
    ja_JP: ファイル
  human_description:
    en_US: The file to attach
    zh_Hans: 要上传的文件
    ja_JP: 添付するファイル
  llm_description: The file to attach.
  form: llm
- name: file_content
  type: string
  required: false
  label:
    en_US: Text Content
    zh_Hans: 文本内容
    ja_JP: テキスト内容
  human_description:
    en_US: Text to attach as a file
    zh_Hans: 作为文件上传的文本
    ja_JP: ファイルとして添付するテキスト
  llm_description: Text to attach as a file when no file is given; needs file_name.
  form: llm
- name: file_name
  type: string
  required: false
  label:
    en_US: File Name
    zh_Hans: 文件名
    ja_JP: ファイル名
  human_description:
    en_US: e.g. notes.txt
    zh_Hans: 如 notes.txt
    ja_JP: '例: notes.txt'
  llm_description: File name; required with text content. Uploading a name that exists adds a new version.
  form: llm
- name: comment
  type: string
  required: false
  label:
    en_US: Version Comment
    zh_Hans: 版本说明
    ja_JP: バージョン コメント
  human_description:
    en_US: Optional note for the file
    zh_Hans: 可选的文件说明
    ja_JP: ファイルへの任意のメモ
  llm_description: Optional comment for the attachment version.
  form: llm
output_schema:
  type: object
  properties:
    attachment_id:
      type: string
      description: ID of the attachment
    title:
      type: string
      description: File name
    size:
      type: integer
      description: Size in bytes
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/confluence_upload_attachment.py
