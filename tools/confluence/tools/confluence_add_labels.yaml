identity:
  name: confluence_add_labels
  author: langgenius
  label:
    en_US: Add Labels
    zh_Hans: 添加标签
    ja_JP: ラベルを追加
description:
  human:
    en_US: Add labels to a page
    zh_Hans: 给页面添加标签
    ja_JP: ページにラベルを追加します
  llm: Add one or more labels to a Confluence page.
parameters:
- name: page_id
  type: string
  required: true
  label:
    en_US: Page ID
    zh_Hans: 页面 ID
    ja_JP: ページ ID
  human_description:
    en_US: The page's numeric ID (from search or the page URL)
    zh_Hans: 页面的数字 ID（来自搜索或页面 URL）
    ja_JP: ページの数値 ID（検索結果またはページ URL から）
  llm_description: The numeric page ID, e.g. 65812 (from the search tool or the page URL .../pages/65812/...).
  form: llm
- name: labels
  type: string
  required: true
  label:
    en_US: Labels
    zh_Hans: 标签
    ja_JP: ラベル
  human_description:
    en_US: Comma-separated, e.g. release-notes, q3
    zh_Hans: 逗号分隔，如 release-notes, q3
    ja_JP: 'カンマ区切り（例: release-notes, q3）'
  llm_description: Comma-separated labels; they are lowercased and spaces become hyphens.
  form: llm
output_schema:
  type: object
  properties:
    labels:
      type: array
      description: The page's labels after the change
      items:
        type: string
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/confluence_add_labels.py
