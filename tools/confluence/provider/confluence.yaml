identity:
  author: langgenius
  name: confluence
  label:
    en_US: Confluence
    zh_Hans: Confluence
    ja_JP: Confluence
    pt_BR: Confluence
  description:
    en_US: Interact with Confluence to manage pages and spaces.
    zh_Hans: 连接到 Confluence 来管理页面和空间。
    ja_JP: Confluence に接続してページとスペースを管理します。
    pt_BR: Interaja com o Confluence para gerenciar páginas e espaços.
  icon: icon.svg
credentials_for_provider:
  auth_mode:
    type: select
    required: false
    default: token
    label:
      en_US: Mode
      zh_Hans: 模式
      ja_JP: モード
    options:
    - value: token
      label:
        en_US: API token / personal access token
        zh_Hans: API 令牌 / 个人访问令牌
        ja_JP: API トークン / 個人用アクセス トークン
    - value: per_user
      label:
        en_US: Each user signs in (own Atlassian account, for chat agents)
        zh_Hans: 每个用户自己登录（各自的 Atlassian 账号，适用于对话 Agent）
        ja_JP: ユーザーごとにサインイン（本人の Atlassian アカウント、チャット エージェント向け）
    help:
      en_US: 'API token: everybody uses the account of the token below (Confluence URL, Username, Access Token). Each user
        signs in (Confluence Cloud): the first time a chat user needs Confluence, the tool returns an Atlassian sign-in link;
        after signing in, the tools act as that user. Needs an Atlassian OAuth 2.0 (3LO) app (Client ID, Client Secret) and
        the Sign-in Callback URL below.'
      zh_Hans: API 令牌：所有人都使用下方令牌对应的账号（Confluence URL、用户名、访问令牌）。每个用户自己登录（Confluence Cloud）：聊天用户第一次用到 Confluence 时，工具会返回 Atlassian
        登录链接；登录后，工具以该用户的身份操作。需要一个 Atlassian OAuth 2.0 (3LO) 应用（客户端 ID、客户端密钥）以及下方的登录回调 URL。
      ja_JP: 'API トークン: 全員が下のトークンのアカウントを使います（Confluence URL、ユーザー名、アクセス トークン）。ユーザーごとにサインイン（Confluence Cloud）: チャットのユーザーが初めて
        Confluence を使うとき、ツールが Atlassian のサインイン リンクを返し、サインイン後はそのユーザー本人として操作します。Atlassian OAuth 2.0 (3LO) アプリ（クライアント ID、クライアント
        シークレット）と下のサインイン コールバック URL が必要です。'
  url:
    type: text-input
    required: false
    label:
      en_US: Confluence URL
      zh_Hans: Confluence URL
      ja_JP: Confluence URL
    placeholder:
      en_US: https://your-domain.atlassian.net
      zh_Hans: https://your-domain.atlassian.net
      ja_JP: https://your-domain.atlassian.net
    help:
      en_US: 'API token mode: your Confluence Cloud site (https://your-domain.atlassian.net) or Server URL. Each user signs
        in: optional; when people can reach several Atlassian sites, the site to use (otherwise the first Confluence site
        they grant).'
      zh_Hans: API 令牌模式：您的 Confluence Cloud 站点（https://your-domain.atlassian.net）或 Server 的 URL。每个用户自己登录：可选；当用户能访问多个 Atlassian
        站点时，用它指定使用哪个站点（否则使用其授权的第一个 Confluence 站点）。
      ja_JP: 'API トークン モード: Confluence Cloud のサイト（https://your-domain.atlassian.net）または Server の URL。ユーザーごとのサインイン: 任意。複数の
        Atlassian サイトにアクセスできる場合に使うサイトを指定します（省略時は許可された最初の Confluence サイト）。'
  username:
    type: text-input
    required: false
    label:
      en_US: Username
      zh_Hans: 用户名
      ja_JP: ユーザー名
    placeholder:
      en_US: example@example.com
      zh_Hans: example@example.com
      ja_JP: example@example.com
    help:
      en_US: 'API token mode only: your Atlassian email (Cloud) or username (Server). Leave it empty to send the token as
        a Server / Data Center personal access token.'
      zh_Hans: 仅 API 令牌模式：Atlassian 登录邮箱（Cloud）或用户名（Server）。留空则把令牌作为 Server / Data Center 的个人访问令牌使用。
      ja_JP: 'API トークン モードのみ: Atlassian のメール（Cloud）またはユーザー名（Server）。空欄にするとトークンを Server / Data Center の個人用アクセス トークンとして送ります。'
  token:
    type: secret-input
    required: false
    label:
      en_US: Access Token
      zh_Hans: 访问令牌
      ja_JP: アクセス トークン
    placeholder:
      en_US: API token (Cloud) or password / personal access token (Server)
      zh_Hans: API 令牌（Cloud）或密码 / 个人访问令牌（Server）
      ja_JP: API トークン（Cloud）またはパスワード / 個人用アクセス トークン（Server）
    help:
      en_US: API token mode only. Create an API token from your Atlassian account settings.
      zh_Hans: 仅 API 令牌模式。从您的 Atlassian 帐户设置创建 API 令牌。
      ja_JP: API トークン モードのみ。Atlassian アカウントの設定で API トークンを作成します。
    url: https://id.atlassian.com/manage-profile/security/api-tokens
  client_id:
    type: text-input
    required: false
    label:
      en_US: Client ID
      zh_Hans: 客户端 ID
      ja_JP: クライアント ID
    placeholder:
      en_US: Only for "Each user signs in"
      zh_Hans: 仅用于“每个用户自己登录”
      ja_JP: ユーザーごとのサインインのみ
    help:
      en_US: The Client ID of your OAuth 2.0 (3LO) app (Atlassian developer console > your app > Settings).
      zh_Hans: OAuth 2.0 (3LO) 应用的客户端 ID（Atlassian 开发者控制台 > 应用 > Settings）。
      ja_JP: OAuth 2.0 (3LO) アプリのクライアント ID（Atlassian developer console > アプリ > Settings）。
    url: https://developer.atlassian.com/console/myapps/
  client_secret:
    type: secret-input
    required: false
    label:
      en_US: Client Secret
      zh_Hans: 客户端密钥
      ja_JP: クライアント シークレット
    placeholder:
      en_US: Only for "Each user signs in"
      zh_Hans: 仅用于“每个用户自己登录”
      ja_JP: ユーザーごとのサインインのみ
    help:
      en_US: The app's Secret (developer console > your app > Settings). Rotating it signs every user out.
      zh_Hans: 应用的 Secret（开发者控制台 > 应用 > Settings）。更换后所有用户都需要重新登录。
      ja_JP: アプリの Secret（developer console > アプリ > Settings）。変更すると全員がサインアウトされます。
    url: https://developer.atlassian.com/console/myapps/
  redirect_uri:
    type: text-input
    required: false
    label:
      en_US: Sign-in Callback URL
      zh_Hans: 登录回调 URL
      ja_JP: サインイン コールバック URL
    placeholder:
      en_US: Only for "Each user signs in", e.g. https://dify.example.com/e/xxxx/confluence/callback
      zh_Hans: 仅用于“每个用户自己登录”，例如 https://dify.example.com/e/xxxx/confluence/callback
      ja_JP: 'ユーザーごとのサインインのみ。例: https://dify.example.com/e/xxxx/confluence/callback'
    help:
      en_US: Create this plugin's endpoint (plugin details > Endpoints), paste its /confluence/callback URL here, and set
        the same URL as the app's Callback URL (developer console > your app > Authorization > OAuth 2.0 (3LO)).
      zh_Hans: 先创建本插件的端点（插件详情 > 端点），把它的 /confluence/callback URL 粘贴到这里，并在开发者控制台 > 应用 > Authorization > OAuth 2.0 (3LO) 中把同一个
        URL 设为 Callback URL。
      ja_JP: このプラグインのエンドポイントを作成し（プラグインの詳細 > エンドポイント）、その /confluence/callback の URL をここに貼り付け、同じ URL を developer console > アプリ
        > Authorization > OAuth 2.0 (3LO) の Callback URL に設定してください。
  scopes:
    type: text-input
    required: false
    label:
      en_US: Scopes
      zh_Hans: 权限范围
      ja_JP: スコープ
    placeholder:
      en_US: Leave empty for the default
      zh_Hans: 留空使用默认值
      ja_JP: 空欄で既定値
    help:
      en_US: 'Only for "Each user signs in". Default (granular Confluence scopes): read:page:confluence write:page:confluence
        delete:page:confluence read:space:confluence read:hierarchical-content:confluence read:content-details:confluence
        read:comment:confluence write:comment:confluence delete:comment:confluence read:label:confluence write:label:confluence
        read:attachment:confluence write:attachment:confluence delete:attachment:confluence read:user:confluence. offline_access
        is added automatically. Every scope requested must be added to the app (developer console > Permissions > Confluence
        API).'
      zh_Hans: 仅用于“每个用户自己登录”。默认（Confluence 细粒度权限）：read:page:confluence write:page:confluence delete:page:confluence read:space:confluence
        read:hierarchical-content:confluence read:content-details:confluence read:comment:confluence write:comment:confluence
        delete:comment:confluence read:label:confluence write:label:confluence read:attachment:confluence write:attachment:confluence
        delete:attachment:confluence read:user:confluence。offline_access 会自动加上。请求的每个权限都必须先添加到应用中（开发者控制台 > Permissions > Confluence
        API）。
      ja_JP: 'ユーザーごとのサインインのみ。既定（Confluence の詳細スコープ）: read:page:confluence write:page:confluence delete:page:confluence read:space:confluence
        read:hierarchical-content:confluence read:content-details:confluence read:comment:confluence write:comment:confluence
        delete:comment:confluence read:label:confluence write:label:confluence read:attachment:confluence write:attachment:confluence
        delete:attachment:confluence read:user:confluence。offline_access は自動で追加されます。要求するスコープはすべてアプリに追加しておく必要があります（developer
        console > Permissions > Confluence API）。'
oauth_schema:
  client_schema:
  - name: client_id
    type: text-input
    required: true
    label:
      en_US: Client ID
      zh_Hans: 客户端 ID
      ja_JP: クライアント ID
    help:
      en_US: The Client ID of your OAuth 2.0 (3LO) app (Atlassian developer console > your app > Settings).
      zh_Hans: OAuth 2.0 (3LO) 应用的客户端 ID（Atlassian 开发者控制台 > 应用 > Settings）。
      ja_JP: OAuth 2.0 (3LO) アプリのクライアント ID（Atlassian developer console > アプリ > Settings）。
    url: https://developer.atlassian.com/console/myapps/
  - name: client_secret
    type: secret-input
    required: true
    label:
      en_US: Client Secret
      zh_Hans: 客户端密钥
      ja_JP: クライアント シークレット
    help:
      en_US: The app's Secret (developer console > your app > Settings).
      zh_Hans: 应用的 Secret（开发者控制台 > 应用 > Settings）。
      ja_JP: アプリの Secret（developer console > アプリ > Settings）。
    url: https://developer.atlassian.com/console/myapps/
  - name: site_url
    type: text-input
    required: false
    label:
      en_US: Confluence Site URL
      zh_Hans: Confluence 站点 URL
      ja_JP: Confluence サイト URL
    placeholder:
      en_US: https://your-domain.atlassian.net (optional)
      zh_Hans: https://your-domain.atlassian.net（可选）
      ja_JP: https://your-domain.atlassian.net（任意）
    help:
      en_US: Only needed when the account can reach several Atlassian sites; otherwise the first Confluence site granted is
        used.
      zh_Hans: 仅当账号能访问多个 Atlassian 站点时需要；否则使用授权的第一个 Confluence 站点。
      ja_JP: アカウントが複数の Atlassian サイトにアクセスできる場合のみ必要です。省略時は許可された最初の Confluence サイトを使います。
  - name: scopes
    type: text-input
    required: false
    label:
      en_US: Scopes
      zh_Hans: 权限范围
      ja_JP: スコープ
    placeholder:
      en_US: Leave empty for the default
      zh_Hans: 留空使用默认值
      ja_JP: 空欄で既定値
    help:
      en_US: 'Default (granular Confluence scopes): read:page:confluence write:page:confluence delete:page:confluence read:space:confluence
        read:hierarchical-content:confluence read:content-details:confluence read:comment:confluence write:comment:confluence
        delete:comment:confluence read:label:confluence write:label:confluence read:attachment:confluence write:attachment:confluence
        delete:attachment:confluence read:user:confluence. offline_access is added automatically. Every scope requested must
        be added to the app (developer console > Permissions > Confluence API).'
      zh_Hans: 默认（Confluence 细粒度权限）：read:page:confluence write:page:confluence delete:page:confluence read:space:confluence
        read:hierarchical-content:confluence read:content-details:confluence read:comment:confluence write:comment:confluence
        delete:comment:confluence read:label:confluence write:label:confluence read:attachment:confluence write:attachment:confluence
        delete:attachment:confluence read:user:confluence。offline_access 会自动加上。请求的每个权限都必须先添加到应用中（开发者控制台 > Permissions > Confluence
        API）。
      ja_JP: '既定（Confluence の詳細スコープ）: read:page:confluence write:page:confluence delete:page:confluence read:space:confluence
        read:hierarchical-content:confluence read:content-details:confluence read:comment:confluence write:comment:confluence
        delete:comment:confluence read:label:confluence write:label:confluence read:attachment:confluence write:attachment:confluence
        delete:attachment:confluence read:user:confluence。offline_access は自動で追加されます。要求するスコープはすべてアプリに追加しておく必要があります（developer
        console > Permissions > Confluence API）。'
  credentials_schema:
  - name: access_token
    type: secret-input
    label:
      en_US: Access Token
      zh_Hans: 访问令牌
      ja_JP: アクセス トークン
  - name: refresh_token
    type: secret-input
    label:
      en_US: Refresh Token
      zh_Hans: 刷新令牌
      ja_JP: リフレッシュ トークン
  - name: cloud_id
    type: text-input
    label:
      en_US: Cloud ID
      zh_Hans: Cloud ID
      ja_JP: Cloud ID
  - name: site_url
    type: text-input
    label:
      en_US: Site URL
      zh_Hans: 站点 URL
      ja_JP: サイト URL
  - name: account
    type: text-input
    label:
      en_US: Account
      zh_Hans: 账号
      ja_JP: アカウント
tools:
- tools/create_page.yaml
- tools/get_page.yaml
- tools/get_space.yaml
- tools/list_page_of_space.yaml
- tools/list_space.yaml
- tools/remove_page.yaml
- tools/confluence_search.yaml
- tools/confluence_read_page.yaml
- tools/confluence_update_page.yaml
- tools/confluence_list_child_pages.yaml
- tools/confluence_list_comments.yaml
- tools/confluence_add_comment.yaml
- tools/confluence_delete_comment.yaml
- tools/confluence_get_labels.yaml
- tools/confluence_add_labels.yaml
- tools/confluence_remove_label.yaml
- tools/confluence_list_attachments.yaml
- tools/confluence_upload_attachment.yaml
- tools/confluence_get_attachment.yaml
- tools/confluence_delete_attachment.yaml
- tools/confluence_sign_out.yaml
extra:
  python:
    source: provider/confluence.py
