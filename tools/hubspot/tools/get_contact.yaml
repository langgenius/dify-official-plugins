identity:
  name: get_contact
  author: langgenius
  label:
    en_US: Get Contact
    zh_Hans: 获取联系人
    pt_BR: Obter Contato
    ja_JP: 連絡先を取得
description:
  human:
    en_US: Retrieve a contact from HubSpot by ID
    zh_Hans: 通过 ID 从 HubSpot 获取联系人
    pt_BR: Recuperar um contato do HubSpot por ID
    ja_JP: ID を指定して HubSpot から連絡先を取得します
  llm: Retrieves a single HubSpot contact by its id. Optionally specify which properties to return.
parameters:
  - name: contact_id
    type: string
    required: true
    label:
      en_US: Contact ID
      zh_Hans: 联系人 ID
      pt_BR: ID do Contato
      ja_JP: 連絡先 ID
    human_description:
      en_US: The ID of the contact to retrieve
      zh_Hans: 要获取的联系人的 ID
      pt_BR: O ID do contato a recuperar
      ja_JP: 取得する連絡先の ID
    llm_description: The HubSpot ID of the contact to retrieve.
    form: llm
  - name: properties
    type: string
    required: false
    label:
      en_US: Properties
      zh_Hans: 返回属性
      pt_BR: Propriedades
      ja_JP: 取得プロパティ
    human_description:
      en_US: Comma-separated property names to return
      zh_Hans: 要返回的属性名，逗号分隔
      pt_BR: Nomes de propriedades a retornar, separados por vírgula
      ja_JP: 返すプロパティ名（カンマ区切り）
    llm_description: Optional comma-separated list of properties to include in the result.
    form: llm
extra:
  python:
    source: tools/get_contact.py
