identity:
  name: remove_contact_from_list
  author: langgenius
  label:
    en_US: Remove Contact from List
    zh_Hans: 从列表移除联系人
    pt_BR: Remover Contato da Lista
    ja_JP: 連絡先をリストから削除
description:
  human:
    en_US: Remove one or more contacts from a HubSpot contact list
    zh_Hans: 从 HubSpot 联系人列表移除一个或多个联系人
    pt_BR: Remover um ou mais contatos de uma lista de contatos do HubSpot
    ja_JP: 1 つ以上の連絡先を HubSpot の連絡先リストから削除します
  llm: Removes one or more contacts from a HubSpot contact list by list id. Provide contact ids as a comma-separated string.
parameters:
  - name: list_id
    type: string
    required: true
    label:
      en_US: List ID
      zh_Hans: 列表 ID
      pt_BR: ID da Lista
      ja_JP: リスト ID
    human_description:
      en_US: The id of the contact list
      zh_Hans: 联系人列表的 ID
      pt_BR: O id da lista de contatos
      ja_JP: 連絡先リストの ID
    llm_description: The unique id of the HubSpot contact list.
    form: llm
  - name: contact_ids
    type: string
    required: true
    label:
      en_US: Contact IDs
      zh_Hans: 联系人 ID
      pt_BR: IDs de Contatos
      ja_JP: 連絡先 ID
    human_description:
      en_US: Comma-separated contact ids to remove
      zh_Hans: 要移除的联系人 ID，逗号分隔
      pt_BR: IDs de contatos a remover, separados por vírgula
      ja_JP: 削除する連絡先 ID（カンマ区切り）
    llm_description: Comma-separated list of contact ids to remove from the list.
    form: llm
extra:
  python:
    source: tools/remove_contact_from_list.py
