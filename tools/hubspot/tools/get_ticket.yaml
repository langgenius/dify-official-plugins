identity:
  name: get_ticket
  author: langgenius
  label:
    en_US: Get Ticket
    zh_Hans: 获取工单
    pt_BR: Obter Ticket
    ja_JP: チケットを取得
    zh_Hant: 取得工單
    ko_KR: 티켓 가져오기
description:
  human:
    en_US: Get a ticket from HubSpot by ID
    zh_Hans: 通过 ID 获取 HubSpot 工单
    pt_BR: Obter um ticket do HubSpot pelo ID
    ja_JP: ID を指定して HubSpot のチケットを取得します
    zh_Hant: 透過 ID 取得 HubSpot 工單
    ko_KR: ID로 HubSpot 티켓을 가져옵니다
  llm: Retrieves a single ticket from HubSpot CRM by its ID, optionally returning specific properties.
parameters:
  - name: ticket_id
    type: string
    required: true
    label:
      en_US: Ticket ID
      zh_Hans: 工单 ID
      pt_BR: ID do Ticket
      ja_JP: チケット ID
      zh_Hant: 工單 ID
      ko_KR: 티켓 ID
    human_description:
      en_US: The ID of the ticket to retrieve
      zh_Hans: 要获取的工单 ID
      pt_BR: O ID do ticket a obter
      ja_JP: 取得するチケットの ID
      zh_Hant: 要取得的工單 ID
      ko_KR: 가져올 티켓의 ID
    llm_description: The unique ID of the ticket to retrieve.
    form: llm
  - name: properties
    type: string
    required: false
    label:
      en_US: Properties
      zh_Hans: 返回属性
      pt_BR: Propriedades
      ja_JP: 取得プロパティ
      zh_Hant: 返回屬性
      ko_KR: 반환 속성
    human_description:
      en_US: Comma-separated property names to return
      zh_Hans: 要返回的属性名，逗号分隔
      pt_BR: Nomes de propriedades a retornar, separados por vírgula
      ja_JP: 返すプロパティ名（カンマ区切り）
      zh_Hant: 要返回的屬性名稱，逗號分隔
      ko_KR: 반환할 속성 이름(쉼표로 구분)
    llm_description: Optional comma-separated list of properties to include in the result.
    form: llm
extra:
  python:
    source: tools/get_ticket.py
