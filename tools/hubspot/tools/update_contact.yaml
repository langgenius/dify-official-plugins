      en_US: A JSON object of additional contact properties to merge
      zh_Hans: 要合并的附加联系人属性的 JSON 对象
      pt_BR: Um objeto JSON com propriedades adicionais do contato a mesclar
      ja_JP: マージする追加の連絡先プロパティの JSON オブジェクト
      zh_Hant: 要合併的附加聯絡人屬性的 JSON 物件
      ko_KR: 병합할 추가 연락처 속성의 JSON 객체
    llm_description: Optional JSON object of extra HubSpot contact properties to merge, e.g. {"jobtitle":"CEO","lifecyclestage":"lead"}.
    form: llm
extra:
  python:
    source: tools/update_contact.py
