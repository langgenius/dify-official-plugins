      en_US: The contact's company name
      zh_Hans: 联系人的公司名称
      pt_BR: O nome da empresa do contato
      ja_JP: 連絡先の会社名
      zh_Hant: 聯絡人的公司名稱
      ko_KR: 연락처의 회사명
    llm_description: The contact's company name.
    form: llm
  - name: properties
    type: string
    required: false
    label:
      en_US: Additional Properties (JSON)
      zh_Hans: 附加属性（JSON）
      pt_BR: Propriedades Adicionais (JSON)
      ja_JP: 追加プロパティ（JSON）
      zh_Hant: 附加屬性（JSON）
      ko_KR: 추가 속성(JSON)
