identity:
  name: search_engagements
  author: langgenius
  label:
    en_US: Search Engagements
    zh_Hans: 搜索互动
    pt_BR: Pesquisar Engajamentos
    ja_JP: エンゲージメントを検索
    zh_Hant: 搜尋互動
    ko_KR: 참여 검색
description:
  human:
    en_US: Search or list engagements, with optional filter and sort
    zh_Hans: 搜索或列出互动，可选过滤和排序
    pt_BR: Pesquisar ou listar engajamentos, com filtro e ordenação opcionais
    ja_JP: エンゲージメントを検索または一覧表示します（フィルターと並び替えは任意）
    zh_Hant: 搜尋或列出互動，可選過濾與排序
    ko_KR: 참여를 검색하거나 나열합니다(선택적 필터 및 정렬)
  llm: Search or list HubSpot engagements of the given type (notes, tasks, meetings, calls, emails). Optionally full-text query, filter by a property (property/operator/value), and sort by a property. Leave everything empty to list recent engagements.
parameters:
  - name: engagement_type
    type: select
    required: false
    default: notes
    options:
      - value: notes
        label: {en_US: Notes, zh_Hans: 备注, pt_BR: Notas, ja_JP: メモ, zh_Hant: 備註, ko_KR: 메모}
      - value: tasks
        label: {en_US: Tasks, zh_Hans: 任务, pt_BR: Tarefas, ja_JP: タスク, zh_Hant: 任務, ko_KR: 작업}
      - value: meetings
        label: {en_US: Meetings, zh_Hans: 会议, pt_BR: Reuniões, ja_JP: 会議, zh_Hant: 會議, ko_KR: 회의}
      - value: calls
        label: {en_US: Calls, zh_Hans: 通话, pt_BR: Chamadas, ja_JP: 通話, zh_Hant: 通話, ko_KR: 통화}
      - value: emails
        label: {en_US: Emails, zh_Hans: 邮件, pt_BR: E-mails, ja_JP: メール, zh_Hant: 郵件, ko_KR: 이메일}
    label:
      en_US: Engagement Type
      zh_Hans: 互动类型
      pt_BR: Tipo de Engajamento
      ja_JP: エンゲージメントタイプ
      zh_Hant: 互動類型
      ko_KR: 참여 유형
    human_description:
      en_US: The type of engagement object
      zh_Hans: 互动对象的类型
      pt_BR: O tipo de objeto de engajamento
      ja_JP: エンゲージメントオブジェクトの種類
      zh_Hant: 互動物件的類型
      ko_KR: 참여 객체의 유형
    llm_description: The engagement object type - one of notes, tasks, meetings, calls, emails. Defaults to notes.
    form: llm
  - name: query
    type: string
    required: false
    label:
      en_US: Query
      zh_Hans: 查询
      pt_BR: Consulta
      ja_JP: クエリ
      zh_Hant: 查詢
      ko_KR: 검색어
    human_description:
      en_US: Full-text search across default searchable properties
      zh_Hans: 对默认可搜索属性进行全文搜索
      pt_BR: Busca de texto completo nas propriedades pesquisáveis padrão
      ja_JP: 既定の検索可能プロパティに対する全文検索
      zh_Hant: 對預設可搜尋屬性進行全文搜尋
      ko_KR: 기본 검색 가능 속성에 대한 전체 텍스트 검색
    llm_description: Optional full-text search string.
    form: llm
  - name: filter_property
    type: string
    required: false
    label:
      en_US: Filter Property
      zh_Hans: 过滤属性
      pt_BR: Propriedade de Filtro
      ja_JP: フィルタープロパティ
      zh_Hant: 過濾屬性
      ko_KR: 필터 속성
    human_description:
      en_US: Property name to filter on (e.g. hs_timestamp, hs_task_status)
      zh_Hans: 用于过滤的属性名（如 hs_timestamp、hs_task_status）
      pt_BR: Nome da propriedade para filtrar (ex. hs_timestamp, hs_task_status)
      ja_JP: フィルターに使うプロパティ名（例 hs_timestamp、hs_task_status）
      zh_Hant: 用於過濾的屬性名稱（如 hs_timestamp、hs_task_status）
      ko_KR: 필터링할 속성 이름(예 hs_timestamp, hs_task_status)
    llm_description: Optional property name to filter by, e.g. hs_timestamp, hs_task_status, createdate.
    form: llm
  - name: filter_operator
    type: select
    required: false
    default: EQ
    options:
      - value: EQ
        label: {en_US: Equal, zh_Hans: 等于, pt_BR: Igual, ja_JP: 等しい, zh_Hant: 等於, ko_KR: 같음}
      - value: NEQ
        label: {en_US: Not equal, zh_Hans: 不等于, pt_BR: Diferente, ja_JP: 等しくない, zh_Hant: 不等於, ko_KR: 같지 않음}
      - value: GT
        label: {en_US: Greater than, zh_Hans: 大于, pt_BR: Maior que, ja_JP: より大きい, zh_Hant: 大於, ko_KR: 초과}
      - value: GTE
        label: {en_US: Greater or equal, zh_Hans: 大于等于, pt_BR: Maior ou igual, ja_JP: 以上, zh_Hant: 大於等於, ko_KR: 이상}
      - value: LT
        label: {en_US: Less than, zh_Hans: 小于, pt_BR: Menor que, ja_JP: より小さい, zh_Hant: 小於, ko_KR: 미만}
      - value: LTE
        label: {en_US: Less or equal, zh_Hans: 小于等于, pt_BR: Menor ou igual, ja_JP: 以下, zh_Hant: 小於等於, ko_KR: 이하}
      - value: CONTAINS_TOKEN
        label: {en_US: Contains, zh_Hans: 包含, pt_BR: Contém, ja_JP: 含む, zh_Hant: 包含, ko_KR: 포함}
      - value: HAS_PROPERTY
        label: {en_US: Has property, zh_Hans: 存在该属性, pt_BR: Possui propriedade, ja_JP: プロパティあり, zh_Hant: 存在該屬性, ko_KR: 속성 있음}
    label:
      en_US: Filter Operator
      zh_Hans: 过滤运算符
      pt_BR: Operador de Filtro
      ja_JP: フィルター演算子
      zh_Hant: 過濾運算子
      ko_KR: 필터 연산자
    human_description:
      en_US: Comparison operator for the filter
      zh_Hans: 过滤所用的比较运算符
      pt_BR: Operador de comparação do filtro
      ja_JP: フィルターの比較演算子
      zh_Hant: 過濾所用的比較運算子
      ko_KR: 필터에 사용할 비교 연산자
    llm_description: Comparison operator for the filter. Defaults to EQ.
    form: llm
  - name: filter_value
    type: string
    required: false
    label:
      en_US: Filter Value
      zh_Hans: 过滤值
      pt_BR: Valor do Filtro
      ja_JP: フィルター値
      zh_Hant: 過濾值
      ko_KR: 필터 값
    human_description:
      en_US: Value to compare against (not needed for HAS_PROPERTY)
      zh_Hans: 用于比较的值（HAS_PROPERTY 时不需要）
      pt_BR: Valor para comparação (não necessário para HAS_PROPERTY)
      ja_JP: 比較する値（HAS_PROPERTY では不要）
      zh_Hant: 用於比較的值（HAS_PROPERTY 時不需要）
      ko_KR: 비교할 값(HAS_PROPERTY에는 불필요)
    llm_description: Value to compare against; omit for HAS_PROPERTY / NOT_HAS_PROPERTY.
    form: llm
  - name: sort_by
    type: string
    required: false
    label:
      en_US: Sort By
      zh_Hans: 排序字段
      pt_BR: Ordenar Por
      ja_JP: 並び替え項目
      zh_Hant: 排序欄位
      ko_KR: 정렬 기준
    human_description:
      en_US: Property to sort by (e.g. createdate, hs_timestamp)
      zh_Hans: 用于排序的属性（如 createdate、hs_timestamp）
      pt_BR: Propriedade para ordenar (ex. createdate, hs_timestamp)
      ja_JP: 並び替えに使うプロパティ（例 createdate、hs_timestamp）
      zh_Hant: 用於排序的屬性（如 createdate、hs_timestamp）
      ko_KR: 정렬할 속성(예 createdate, hs_timestamp)
    llm_description: Optional property name to sort results by, e.g. createdate.
    form: llm
  - name: sort_direction
    type: select
    required: false
    default: DESCENDING
    options:
      - value: DESCENDING
        label: {en_US: Descending (newest first), zh_Hans: 降序（最新在前）, pt_BR: Decrescente, ja_JP: 降順, zh_Hant: 降序, ko_KR: 내림차순}
      - value: ASCENDING
        label: {en_US: Ascending (oldest first), zh_Hans: 升序（最早在前）, pt_BR: Crescente, ja_JP: 昇順, zh_Hant: 升序, ko_KR: 오름차순}
    label:
      en_US: Sort Direction
      zh_Hans: 排序方向
      pt_BR: Direção da Ordenação
      ja_JP: 並び替え方向
      zh_Hant: 排序方向
      ko_KR: 정렬 방향
    human_description:
      en_US: Ascending or descending
      zh_Hans: 升序或降序
      pt_BR: Crescente ou decrescente
      ja_JP: 昇順または降順
      zh_Hant: 升序或降序
      ko_KR: 오름차순 또는 내림차순
    llm_description: Sort direction; DESCENDING (default) or ASCENDING.
    form: llm
  - name: properties
    type: string
    required: false
    label:
      en_US: Properties
      zh_Hans: 返回属性
      pt_BR: Propriedades
      ja_JP: 取得プロパティ
      zh_Hant: 返回屬性
      ko_KR: 반환 속성
    human_description:
      en_US: Comma-separated property names to return
      zh_Hans: 要返回的属性名，逗号分隔
      pt_BR: Nomes de propriedades a retornar, separados por vírgula
      ja_JP: 返すプロパティ名（カンマ区切り）
      zh_Hant: 要返回的屬性名稱，逗號分隔
      ko_KR: 반환할 속성 이름(쉼표로 구분)
    llm_description: Optional comma-separated list of properties to include in each result.
    form: llm
  - name: limit
    type: number
    required: false
    default: 20
    label:
      en_US: Limit
      zh_Hans: 数量限制
      pt_BR: Limite
      ja_JP: 上限数
      zh_Hant: 數量限制
      ko_KR: 개수 제한
    human_description:
      en_US: Maximum number of results (1-100)
      zh_Hans: 返回结果的最大数量（1-100）
      pt_BR: Número máximo de resultados (1-100)
      ja_JP: 返す結果の最大数（1〜100）
      zh_Hant: 返回結果的最大數量（1-100）
      ko_KR: 최대 결과 수(1~100)
    llm_description: Maximum number of results to return, 1-100. Defaults to 20.
    form: llm
  - name: after
    type: string
    required: false
    label:
      en_US: After (cursor)
      zh_Hans: 分页游标
      pt_BR: Após (cursor)
      ja_JP: カーソル
      zh_Hant: 分頁游標
      ko_KR: 커서
    human_description:
      en_US: Pagination cursor from a previous response
      zh_Hans: 上一次响应返回的分页游标
      pt_BR: Cursor de paginação de uma resposta anterior
      ja_JP: 前回の応答で返されたページングカーソル
      zh_Hant: 上一次回應返回的分頁游標
      ko_KR: 이전 응답에서 반환된 페이지네이션 커서
    llm_description: Optional pagination cursor (paging.next.after) from a previous response.
    form: llm
extra:
  python:
    source: tools/search_engagements.py
