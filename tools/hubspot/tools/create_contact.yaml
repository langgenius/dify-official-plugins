identity:
  name: create_contact
  author: langgenius
  label:
    en_US: Create Contact
    zh_Hans: 创建联系人
    pt_BR: Criar Contato
    ja_JP: 連絡先を作成
description:
  human:
    en_US: Create a new contact in HubSpot
    zh_Hans: 在 HubSpot 中创建新联系人
    pt_BR: Criar um novo contato no HubSpot
    ja_JP: HubSpot に新しい連絡先を作成します
  llm: Creates a contact in HubSpot CRM. Provide common fields (email, firstname, lastname, phone, company, website, jobtitle) and/or a JSON object of additional properties.
parameters:
  - name: email
    type: string
    required: false
    label:
      en_US: Email
      zh_Hans: 邮箱
      pt_BR: E-mail
      ja_JP: メールアドレス
    human_description:
      en_US: The contact's email address
      zh_Hans: 联系人的电子邮箱地址
      pt_BR: O endereço de e-mail do contato
      ja_JP: 連絡先のメールアドレス
    llm_description: The contact's email address (recommended as the unique identifier).
    form: llm
  - name: firstname
    type: string
    required: false
    label:
      en_US: First Name
      zh_Hans: 名字
      pt_BR: Nome
      ja_JP: 名
    human_description:
      en_US: The contact's first name
      zh_Hans: 联系人的名字
      pt_BR: O primeiro nome do contato
      ja_JP: 連絡先の名
    llm_description: The contact's first name.
    form: llm
  - name: lastname
    type: string
    required: false
    label:
      en_US: Last Name
      zh_Hans: 姓氏
      pt_BR: Sobrenome
      ja_JP: 姓
    human_description:
      en_US: The contact's last name
      zh_Hans: 联系人的姓氏
      pt_BR: O sobrenome do contato
      ja_JP: 連絡先の姓
    llm_description: The contact's last name.
    form: llm
  - name: phone
    type: string
    required: false
    label:
      en_US: Phone
      zh_Hans: 电话
      pt_BR: Telefone
      ja_JP: 電話番号
    human_description:
      en_US: The contact's phone number
      zh_Hans: 联系人的电话号码
      pt_BR: O número de telefone do contato
      ja_JP: 連絡先の電話番号
    llm_description: The contact's phone number.
    form: llm
  - name: company
    type: string
    required: false
    label:
      en_US: Company
      zh_Hans: 公司
      pt_BR: Empresa
      ja_JP: 会社
    human_description:
      en_US: The contact's company name
      zh_Hans: 联系人的公司名称
      pt_BR: O nome da empresa do contato
      ja_JP: 連絡先の会社名
    llm_description: The contact's company name.
    form: llm
  - name: properties
    type: string
    required: false
    label:
      en_US: Additional Properties (JSON)
      zh_Hans: 附加属性（JSON）
      pt_BR: Propriedades Adicionais (JSON)
      ja_JP: 追加プロパティ（JSON）
    human_description:
      en_US: A JSON object of additional contact properties
      zh_Hans: 附加联系人属性的 JSON 对象
      pt_BR: Um objeto JSON com propriedades adicionais do contato
      ja_JP: 追加の連絡先プロパティの JSON オブジェクト
    llm_description: Optional JSON object of extra HubSpot contact properties, e.g. {"jobtitle":"CEO","lifecyclestage":"lead"}.
    form: llm
extra:
  python:
    source: tools/create_contact.py
