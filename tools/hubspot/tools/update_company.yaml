identity:
  name: update_company
  author: langgenius
  label:
    en_US: Update Company
    zh_Hans: 更新公司
    pt_BR: Atualizar Empresa
    ja_JP: 会社を更新
description:
  human:
    en_US: Update an existing company in HubSpot
    zh_Hans: 更新 HubSpot 中的现有公司
    pt_BR: Atualizar uma empresa existente no HubSpot
    ja_JP: HubSpot の既存の会社を更新します
  llm: Updates a company in HubSpot CRM by its id. Provide common fields (name, domain, phone, city, industry, website) and/or a JSON object of additional properties to merge.
parameters:
  - name: company_id
    type: string
    required: true
    label:
      en_US: Company ID
      zh_Hans: 公司 ID
      pt_BR: ID da Empresa
      ja_JP: 会社 ID
    human_description:
      en_US: The ID of the company to update
      zh_Hans: 要更新的公司的 ID
      pt_BR: O ID da empresa a atualizar
      ja_JP: 更新する会社の ID
    llm_description: The HubSpot ID of the company to update.
    form: llm
  - name: name
    type: string
    required: false
    label:
      en_US: Name
      zh_Hans: 名称
      pt_BR: Nome
      ja_JP: 名前
    human_description:
      en_US: The company's name
      zh_Hans: 公司的名称
      pt_BR: O nome da empresa
      ja_JP: 会社名
    llm_description: The company's name.
    form: llm
  - name: domain
    type: string
    required: false
    label:
      en_US: Domain
      zh_Hans: 域名
      pt_BR: Domínio
      ja_JP: ドメイン
    human_description:
      en_US: The company's primary domain name
      zh_Hans: 公司的主域名
      pt_BR: O domínio principal da empresa
      ja_JP: 会社の主要ドメイン
    llm_description: The company's primary domain name.
    form: llm
  - name: phone
    type: string
    required: false
    label:
      en_US: Phone
      zh_Hans: 电话
      pt_BR: Telefone
      ja_JP: 電話番号
    human_description:
      en_US: The company's phone number
      zh_Hans: 公司的电话号码
      pt_BR: O número de telefone da empresa
      ja_JP: 会社の電話番号
    llm_description: The company's phone number.
    form: llm
  - name: city
    type: string
    required: false
    label:
      en_US: City
      zh_Hans: 城市
      pt_BR: Cidade
      ja_JP: 市区町村
    human_description:
      en_US: The company's city
      zh_Hans: 公司所在城市
      pt_BR: A cidade da empresa
      ja_JP: 会社の市区町村
    llm_description: The company's city.
    form: llm
  - name: industry
    type: string
    required: false
    label:
      en_US: Industry
      zh_Hans: 行业
      pt_BR: Setor
      ja_JP: 業種
    human_description:
      en_US: The company's industry
      zh_Hans: 公司所属行业
      pt_BR: O setor da empresa
      ja_JP: 会社の業種
    llm_description: The company's industry.
    form: llm
  - name: website
    type: string
    required: false
    label:
      en_US: Website
      zh_Hans: 网站
      pt_BR: Site
      ja_JP: ウェブサイト
    human_description:
      en_US: The company's website URL
      zh_Hans: 公司的网站地址
      pt_BR: O URL do site da empresa
      ja_JP: 会社のウェブサイト URL
    llm_description: The company's website URL.
    form: llm
  - name: properties
    type: string
    required: false
    label:
      en_US: Additional Properties (JSON)
      zh_Hans: 附加属性（JSON）
      pt_BR: Propriedades Adicionais (JSON)
      ja_JP: 追加プロパティ（JSON）
    human_description:
      en_US: A JSON object of additional company properties to merge
      zh_Hans: 要合并的附加公司属性的 JSON 对象
      pt_BR: Um objeto JSON com propriedades adicionais da empresa a mesclar
      ja_JP: マージする追加の会社プロパティの JSON オブジェクト
    llm_description: Optional JSON object of extra HubSpot company properties to merge, e.g. {"numberofemployees":"100","country":"USA"}.
    form: llm
extra:
  python:
    source: tools/update_company.py
