  - tools/delete_company.yaml
  - tools/get_company.yaml
  - tools/search_companies.yaml
  - tools/create_deal.yaml
  - tools/update_deal.yaml
  - tools/delete_deal.yaml
  - tools/get_deal.yaml
  - tools/search_deals.yaml
  - tools/create_ticket.yaml
