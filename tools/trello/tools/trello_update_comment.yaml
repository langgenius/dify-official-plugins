identity:
  name: trello_update_comment
  author: langgenius
  label:
    en_US: Update Comment
    zh_Hans: 修改评论
    ja_JP: コメントを編集
description:
  human:
    en_US: Change a comment's text
    zh_Hans: 修改评论内容
    ja_JP: コメントの本文を変更
  llm: Change the text of a comment on a Trello card (only its author may).
parameters:
- name: card_id
  type: string
  required: true
  label:
    en_US: Card ID
    zh_Hans: 卡片 ID
    ja_JP: カード ID
  human_description:
    en_US: Card ID (from the list or search tools)
    zh_Hans: 卡片 ID（可从列表或搜索工具获取）
    ja_JP: カード ID（一覧または検索ツールから）
  llm_description: The card ID (or its short link), from the search or list tools.
  form: llm
- name: comment_id
  type: string
  required: true
  label:
    en_US: Comment ID
    zh_Hans: 评论 ID
    ja_JP: コメント ID
  human_description:
    en_US: Comment ID (from the list or search tools)
    zh_Hans: 评论 ID（可从列表或搜索工具获取）
    ja_JP: コメント ID（一覧または検索ツールから）
  llm_description: The comment ID, from trello_list_comments.
  form: llm
- name: text
  type: string
  required: true
  label:
    en_US: Text
    zh_Hans: 内容
    ja_JP: 本文
  human_description:
    en_US: Comment text
    zh_Hans: 评论内容
    ja_JP: コメント本文
  llm_description: The comment text.
  form: llm
output_schema:
  type: object
  properties:
    comment_id:
      type: string
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/trello_update_comment.py
