description:
  human:
    en_US: Updates specified attributes of a Trello card, such as its name, description,
      list ID, and board ID, by providing the card's unique ID.
    pt_BR: Atualiza atributos específicos de um cartão Trello, como seu nome, descrição,
      ID da lista e ID do quadro, fornecendo o ID único do cartão.
    zh_Hans: 通过提供卡片的唯一 ID，更新 Trello 卡片的特定属性，如其名称、描述、列表 ID 和看板 ID。
  llm: Modify a Trello card's key details, including name, description, and its placement
    on the board, by using the card's ID. Enables precise and targeted updates to
    card information.
extra:
  python:
    source: tools/update_card.py
identity:
  author: Yash Parmar
  label:
    en_US: Update Card by ID
    pt_BR: Atualizar Cartão por ID
    zh_Hans: 通过 ID 更新卡片
  name: update_card_by_id
parameters:
- form: llm
  human_description:
    en_US: The unique identifier of the Trello card you intend to update.
    pt_BR: O identificador único do cartão Trello que você pretende atualizar.
    zh_Hans: 您打算更新的 Trello 卡片的唯一标识符。
  label:
    en_US: Card ID
    pt_BR: ID do Cartão
    zh_Hans: 卡片 ID
  llm_description: Input the ID of the Trello card to be updated to ensure the correct
    card is targeted.
  name: id
  required: true
  type: string
- form: llm
  human_description:
    en_US: Optional. The new name to assign to the card.
    pt_BR: Opcional. O novo nome a ser atribuído ao cartão.
    zh_Hans: 可选。要分配给卡片的新名称。
  label:
    en_US: New Name
    pt_BR: Novo Nome
    zh_Hans: 新名称
  llm_description: Specify a new name for the card if changing it. This name is what
    will be displayed on the Trello board.
  name: name
  required: false
  type: string
- form: llm
  human_description:
    en_US: Optional. The new description to assign to the card.
    pt_BR: Opcional. A nova descrição a ser atribuída ao cartão.
    zh_Hans: 可选。要分配给卡片的新描述。
  label:
    en_US: New Description
    pt_BR: Nova Descrição
    zh_Hans: 新描述
  llm_description: Provide a new description for the card if you wish to update it;
    this description provides additional context about the card.
  name: desc
  required: false
  type: string
- form: llm
  human_description:
    en_US: Optional. The ID of the list to which the card should be moved.
    pt_BR: Opcional. O ID da lista para a qual o cartão deve ser movido.
    zh_Hans: 可选。卡片应移动到的列表的 ID。
  label:
    en_US: List ID
    pt_BR: ID da Lista
    zh_Hans: 列表 ID
  llm_description: Enter the ID of the list where you want to move the card. This
    action relocates the card to the specified list.
  name: idList
  required: false
  type: string
- form: llm
  human_description:
    en_US: Optional. The ID of the board to which the card should be moved.
    pt_BR: Opcional. O ID do quadro para o qual o cartão deve ser movido.
    zh_Hans: 可选。卡片应移动到的看板的 ID。
  label:
    en_US: Board ID
    pt_BR: ID do Quadro
    zh_Hans: 看板 ID
  llm_description: Provide the ID of the board where you want to move the card. This
    action relocates the card to the specified board.
  name: idBoard
  required: false
  type: string
- form: llm
  human_description:
    en_US: ISO date, e.g. 2026-12-31T17:00:00Z
    ja_JP: 'ISO 日時（例: 2026-12-31T17:00:00Z）'
    zh_Hans: ISO 时间，如 2026-12-31T17:00:00Z
  label:
    en_US: Due
    ja_JP: 期限
    zh_Hans: 截止时间
  llm_description: Due date (ISO 8601).
  name: due
  required: false
  type: string
- form: llm
  human_description:
    en_US: Mark the due date done
    ja_JP: 期限を完了にする
    zh_Hans: 将截止项标记为完成
  label:
    en_US: Due Complete
    ja_JP: 期限完了
    zh_Hans: 已完成
  llm_description: Whether the due date is marked complete.
  name: dueComplete
  required: false
  type: boolean
- form: llm
  human_description:
    en_US: Archive (true) or restore (false)
    ja_JP: アーカイブ（true）または復元（false）
    zh_Hans: 归档（true）或恢复（false）
  label:
    en_US: Archived
    ja_JP: アーカイブ
    zh_Hans: 已归档
  llm_description: true archives the card, false restores it.
  name: closed
  required: false
  type: boolean
- form: llm
  human_description:
    en_US: top, bottom or a number
    ja_JP: top、bottom、または数値
    zh_Hans: top、bottom 或数字
  label:
    en_US: Position
    ja_JP: 位置
    zh_Hans: 位置
  llm_description: 'Position in its list: top, bottom or a number.'
  name: pos
  required: false
  type: string
- form: llm
  human_description:
    en_US: Comma-separated member IDs (replaces)
    ja_JP: カンマ区切りのメンバー ID（置き換え）
    zh_Hans: 逗号分隔的成员 ID（会替换）
  label:
    en_US: Member IDs
    ja_JP: メンバー ID
    zh_Hans: 成员 ID
  llm_description: Comma-separated member IDs to assign; replaces the current members.
  name: idMembers
  required: false
  type: string
- form: llm
  human_description:
    en_US: Comma-separated label IDs (replaces)
    ja_JP: カンマ区切りのラベル ID（置き換え）
    zh_Hans: 逗号分隔的标签 ID（会替换）
  label:
    en_US: Label IDs
    ja_JP: ラベル ID
    zh_Hans: 标签 ID
  llm_description: Comma-separated label IDs; replaces the current labels.
  name: idLabels
  required: false
  type: string
