identity:
  name: trello_delete_attachment
  author: langgenius
  label:
    en_US: Delete Attachment
    zh_Hans: 删除附件
    ja_JP: 添付ファイルを削除
description:
  human:
    en_US: Delete an attachment
    zh_Hans: 删除附件
    ja_JP: 添付ファイルを削除
  llm: Delete an attachment from a Trello card. Only when the user clearly asks for it.
parameters:
- name: card_id
  type: string
  required: true
  label:
    en_US: Card ID
    zh_Hans: 卡片 ID
    ja_JP: カード ID
  human_description:
    en_US: Card ID (from the list or search tools)
    zh_Hans: 卡片 ID（可从列表或搜索工具获取）
    ja_JP: カード ID（一覧または検索ツールから）
  llm_description: The card ID (or its short link), from the search or list tools.
  form: llm
- name: attachment_id
  type: string
  required: true
  label:
    en_US: Attachment ID
    zh_Hans: 附件 ID
    ja_JP: 添付ファイル ID
  human_description:
    en_US: Attachment ID (from the list or search tools)
    zh_Hans: 附件 ID（可从列表或搜索工具获取）
    ja_JP: 添付ファイル ID（一覧または検索ツールから）
  llm_description: The attachment ID, from trello_list_attachments.
  form: llm
output_schema:
  type: object
  properties:
    deleted:
      type: boolean
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/trello_delete_attachment.py
