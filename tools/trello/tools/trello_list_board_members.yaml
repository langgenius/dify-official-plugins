identity:
  name: trello_list_board_members
  author: langgenius
  label:
    en_US: List Board Members
    zh_Hans: 列出看板成员
    ja_JP: ボードのメンバー一覧
description:
  human:
    en_US: Who is on a board
    zh_Hans: 看板上的成员
    ja_JP: ボードのメンバー
  llm: List the members of a Trello board (IDs are used to assign cards).
parameters:
- name: board_id
  type: string
  required: true
  label:
    en_US: Board ID
    zh_Hans: 看板 ID
    ja_JP: ボード ID
  human_description:
    en_US: Board ID (from the list or search tools)
    zh_Hans: 看板 ID（可从列表或搜索工具获取）
    ja_JP: ボード ID（一覧または検索ツールから）
  llm_description: The board ID, from fetch_all_boards or search.
  form: llm
output_schema:
  type: object
  properties:
    members:
      type: array
      items:
        type: object
    count:
      type: integer
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/trello_list_board_members.py
