description:
  human:
    en_US: Creates a new Trello board with a specified name. This tool allows users
      to quickly add new boards to their Trello account, facilitating project organization
      and management.
    pt_BR: Cria um novo quadro Trello com um nome especificado. Esta ferramenta permite
      que os usuários adicionem rapidamente novos quadros à sua conta Trello, facilitando
      a organização e gestão de projetos.
    zh_Hans: 使用指定的名称创建一个新的 Trello 看板。此工具允许用户快速向其 Trello 账户添加新的看板，促进项目组织和管理。
  llm: Create a new Trello board using the specified name. This functionality simplifies
    the addition of boards, enhancing project organization and management within Trello.
extra:
  python:
    source: tools/create_board.py
identity:
  author: Yash Parmar
  label:
    en_US: Create Board
    pt_BR: Criar Quadro
    zh_Hans: 创建看板
  name: create_board
parameters:
- form: llm
  human_description:
    en_US: The name for the new Trello board. This name helps in identifying and organizing
      your projects on Trello.
    pt_BR: O nome para o novo quadro Trello. Este nome ajuda a identificar e organizar
      seus projetos no Trello.
    zh_Hans: 新 Trello 看板的名称。这个名称有助于在 Trello 上识别和组织您的项目。
  label:
    en_US: Board Name
    pt_BR: Nome do Quadro
    zh_Hans: 看板名称
  llm_description: Specify the name for your new Trello board, aiding in project identification
    and organization within Trello.
  name: name
  required: true
  type: string
- form: llm
  human_description:
    en_US: Optional. The Workspace (ID or name) to create the board in; by default
      the first Workspace of the account.
    ja_JP: 任意。ボードを作成するワークスペース（ID または名前）。既定はアカウントの最初のワークスペースです。
    pt_BR: Opcional. O Workspace (ID ou nome) onde criar o quadro; por padrão, o primeiro
      Workspace da conta.
    zh_Hans: 可选。要在其中创建看板的 Workspace（ID 或名称）；默认使用账号的第一个 Workspace。
  label:
    en_US: Workspace
    ja_JP: ワークスペース
    pt_BR: Workspace
    zh_Hans: Workspace
  llm_description: Optional Workspace ID (from trello_list_workspaces). Leave empty
    to use the first Workspace.
  name: idOrganization
  required: false
  type: string
