identity:
  name: trello_remove_board_member
  author: langgenius
  label:
    en_US: Remove Board Member
    zh_Hans: 移除看板成员
    ja_JP: ボードからメンバーを削除
description:
  human:
    en_US: Remove a member from a board
    zh_Hans: 从看板移除成员
    ja_JP: ボードからメンバーを削除
  llm: Remove a member from a Trello board. Only when the user clearly asks for it.
parameters:
- name: board_id
  type: string
  required: true
  label:
    en_US: Board ID
    zh_Hans: 看板 ID
    ja_JP: ボード ID
  human_description:
    en_US: Board ID (from the list or search tools)
    zh_Hans: 看板 ID（可从列表或搜索工具获取）
    ja_JP: ボード ID（一覧または検索ツールから）
  llm_description: The board ID, from fetch_all_boards or search.
  form: llm
- name: member_id
  type: string
  required: true
  label:
    en_US: Member ID
    zh_Hans: 成员 ID
    ja_JP: メンバー ID
  human_description:
    en_US: Member ID (from the list or search tools)
    zh_Hans: 成员 ID（可从列表或搜索工具获取）
    ja_JP: メンバー ID（一覧または検索ツールから）
  llm_description: The member's ID or username.
  form: llm
output_schema:
  type: object
  properties:
    removed:
      type: boolean
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/trello_remove_board_member.py
