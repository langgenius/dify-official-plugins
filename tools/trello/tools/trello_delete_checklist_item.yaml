parameters:
- name: checklist_id
  type: string
  required: true
  label:
    en_US: Checklist ID
    zh_Hans: 清单 ID
    ja_JP: チェックリスト ID
  human_description:
    en_US: Checklist ID (from the list or search tools)
    zh_Hans: 清单 ID（可从列表或搜索工具获取）
    ja_JP: チェックリスト ID（一覧または検索ツールから）
  llm_description: The checklist ID, from trello_list_checklists.
  form: llm
- name: item_id
  type: string
  required: true
  label:
    en_US: Checklist Item ID
    zh_Hans: 清单项 ID
    ja_JP: チェック項目 ID
  human_description:
    en_US: Checklist Item ID (from the list or search tools)
    zh_Hans: 清单项 ID（可从列表或搜索工具获取）
    ja_JP: チェック項目 ID（一覧または検索ツールから）
  llm_description: The checklist item ID, from trello_list_checklists.
  form: llm
output_schema:
  type: object
  properties:
    deleted:
      type: boolean
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
