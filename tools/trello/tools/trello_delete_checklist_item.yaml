identity:
  name: trello_delete_checklist_item
  author: langgenius
  label:
    en_US: Delete Checklist Item
    zh_Hans: 删除清单项
    ja_JP: チェック項目を削除
description:
  human:
    en_US: Delete an item from a checklist
    zh_Hans: 删除清单中的条目
    ja_JP: チェックリストから項目を削除
