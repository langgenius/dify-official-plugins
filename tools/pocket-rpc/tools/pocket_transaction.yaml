description:
  human:
    en_US: Get a transaction by hash on a chain, served over Pocket
      Network's free public RPC. No API key, no payment.
    zh_Hans: 按哈希获取指定链上的一笔交易，通过 Pocket Network 的免费公共 RPC 提供。无需 API 密钥，无需付款。
  llm: Get a transaction by hash on a chain, served over Pocket Network's
    free public RPC. No API key, no payment.
extra:
  python:
    source: tools/pocket_transaction.py
identity:
  author: langgenius
  label:
    en_US: Pocket Transaction
    zh_Hans: Pocket 交易
  name: pocket_transaction
parameters:
  - name: chain
    default: ethereum
    form: llm
    human_description:
      en_US: The chain to query.
      zh_Hans: 要查询的链。
    label:
      en_US: Chain
      zh_Hans: 链
    llm_description: The chain to query.
    options:
      - label:
          en_US: Ethereum
        value: ethereum
      - label:
          en_US: Base
        value: base
      - label:
          en_US: Polygon
        value: polygon
      - label:
          en_US: Arbitrum One
        value: arbitrum-one
      - label:
          en_US: Optimism
        value: optimism
      - label:
          en_US: Celo
        value: celo
    required: true
    type: select
  - name: tx_hash
    form: llm
    human_description:
      en_US: The transaction hash to look up (0x with 64 hex characters).
      zh_Hans: 要查询的交易哈希（0x 开头的 64 位十六进制字符）。
    label:
      en_US: Transaction hash
      zh_Hans: 交易哈希
    llm_description: The transaction hash to look up.
    required: true
    type: string
