identity:
  author: langgenius
  name: google_docs
  label:
    en_US: Google Docs
    zh_Hans: Google Docs
    ja_JP: Google Docs
  description:
    en_US: 'Read, create and edit Google Docs: Markdown in and out, find and replace, tables'
    zh_Hans: 读取、创建和编辑 Google 文档：Markdown 读写、查找替换、表格
    ja_JP: Google ドキュメントの読み取り・作成・編集（Markdown の入出力、検索と置換、表）
  icon: icon.svg
  tags:
  - productivity
credentials_for_provider:
  auth_mode:
    type: select
    required: false
    default: per_user
    label:
      en_US: Mode
      zh_Hans: 模式
      ja_JP: モード
    options:
    - value: per_user
      label:
        en_US: Each user signs in (own Google account, for chat agents)
        zh_Hans: 每个用户自己登录（各自的 Google 账号，适用于对话 Agent）
        ja_JP: ユーザーごとにサインイン（本人の Google アカウント、チャット エージェント向け）
    help:
      en_US: The first time a chat user needs Google Docs, the tool returns a Google sign-in link; after they sign in, the
        tools act as that user. (To use one shared account instead, use OAuth.) Needs a Google OAuth client (Web application)
        and the Sign-in Callback URL below.
      zh_Hans: 聊天用户第一次用到 Google Docs 时，工具会返回 Google 登录链接；登录后，工具以该用户的身份操作。（要共用一个账号，请用 OAuth。）需要一个 Google OAuth 客户端（Web 应用）以及下方的登录回调
        URL。
      ja_JP: チャットのユーザーが初めて Google Docs を使うとき、ツールが Google のサインイン リンクを返し、サインイン後はそのユーザー本人として操作します。（共有アカウントを使う場合は OAuth を使用）Google
        OAuth クライアント（ウェブ アプリケーション）と下のサインイン コールバック URL が必要です。
  client_id:
    type: text-input
    required: true
    label:
      en_US: Client ID
      zh_Hans: 客户端 ID
      ja_JP: クライアント ID
    placeholder:
      en_US: xxxx.apps.googleusercontent.com
      zh_Hans: xxxx.apps.googleusercontent.com
      ja_JP: xxxx.apps.googleusercontent.com
    help:
      en_US: Google Cloud Console > Google Auth Platform > Clients > your Web application client.
      zh_Hans: Google Cloud 控制台 > Google Auth Platform > Clients > 你的 Web 应用客户端。
      ja_JP: Google Cloud コンソール > Google Auth Platform > クライアント > ウェブ アプリケーションのクライアント。
    url: https://console.cloud.google.com/auth/clients
  client_secret:
    type: secret-input
    required: true
    label:
      en_US: Client Secret
      zh_Hans: 客户端密钥
      ja_JP: クライアント シークレット
    help:
      en_US: The client's secret. Rotating it signs every user out.
      zh_Hans: 该客户端的密钥。更换后所有用户都需要重新登录。
      ja_JP: クライアントのシークレット。変更すると全員がサインアウトされます。
    url: https://console.cloud.google.com/auth/clients
  redirect_uri:
    type: text-input
    required: true
    label:
      en_US: Sign-in Callback URL
      zh_Hans: 登录回调 URL
      ja_JP: サインイン コールバック URL
    placeholder:
      en_US: e.g. https://dify.example.com/e/xxxx/google_docs/callback
      zh_Hans: 例如 https://dify.example.com/e/xxxx/google_docs/callback
      ja_JP: '例: https://dify.example.com/e/xxxx/google_docs/callback'
    help:
      en_US: Create this plugin's endpoint (plugin details > Endpoints), paste its /google_docs/callback URL here, and add
        the same URL to the OAuth client's Authorized redirect URIs.
      zh_Hans: 先创建本插件的端点（插件详情 > 端点），把它的 /google_docs/callback URL 粘贴到这里，并把同一个 URL 加到 OAuth 客户端的“已获授权的重定向 URI”中。
      ja_JP: このプラグインのエンドポイントを作成し（プラグインの詳細 > エンドポイント）、その /google_docs/callback の URL をここに貼り付け、同じ URL を OAuth クライアントの承認済みのリダイレクト
        URI に追加してください。
oauth_schema:
  client_schema:
  - name: client_id
    type: text-input
    required: true
    label:
      en_US: Client ID
      zh_Hans: 客户端 ID
      ja_JP: クライアント ID
    help:
      en_US: Google Cloud Console > Google Auth Platform > Clients (Web application), with the Google Docs API and Google
        Drive API enabled.
      zh_Hans: Google Cloud 控制台 > Google Auth Platform > Clients（Web 应用），并启用 Google Docs API 和 Google Drive API。
      ja_JP: Google Cloud コンソール > Google Auth Platform > クライアント（ウェブ アプリケーション）。Google Docs API と Google Drive API を有効にしてください。
    url: https://console.cloud.google.com/auth/clients
  - name: client_secret
    type: secret-input
    required: true
    label:
      en_US: Client Secret
      zh_Hans: 客户端密钥
      ja_JP: クライアント シークレット
    url: https://console.cloud.google.com/auth/clients
  credentials_schema:
  - name: access_token
    type: secret-input
    label:
      en_US: Access Token
      zh_Hans: 访问令牌
      ja_JP: アクセス トークン
  - name: refresh_token
    type: secret-input
    label:
      en_US: Refresh Token
      zh_Hans: 刷新令牌
      ja_JP: リフレッシュ トークン
tools:
- tools/google_docs_find_documents.yaml
- tools/google_docs_get_document.yaml
- tools/google_docs_create_document.yaml
- tools/google_docs_append_content.yaml
- tools/google_docs_replace_text.yaml
- tools/google_docs_insert_table.yaml
- tools/google_docs_sign_out.yaml
extra:
  python:
    source: provider/google_docs.py
