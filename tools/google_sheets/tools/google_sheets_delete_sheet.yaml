identity:
  name: google_sheets_delete_sheet
  author: langgenius
  label:
    en_US: Delete Sheet
    zh_Hans: 删除工作表
    ja_JP: シートを削除
description:
  human:
    en_US: Delete a sheet (tab) and its data
    zh_Hans: 删除工作表及其数据
    ja_JP: シート（タブ）とデータを削除
  llm: Delete a sheet (tab) and all its data. Only when the user clearly asks for it.
parameters:
- name: spreadsheet_id
  type: string
  required: true
  label:
    en_US: Spreadsheet
    zh_Hans: 电子表格
    ja_JP: スプレッドシート
  human_description:
    en_US: ID or URL of the spreadsheet
    zh_Hans: 电子表格的 ID 或 URL
    ja_JP: スプレッドシートの ID または URL
  llm_description: The spreadsheet ID or its URL (…/spreadsheets/d/<id>/edit), e.g. from google_sheets_find_spreadsheets.
  form: llm
- name: sheet
  type: string
  required: true
  label:
    en_US: Sheet
    zh_Hans: 工作表
    ja_JP: シート
  human_description:
    en_US: Sheet name
    zh_Hans: 工作表名称
    ja_JP: シート名
  llm_description: The sheet name.
  form: llm
output_schema:
  type: object
  properties:
    deleted:
      type: boolean
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/google_sheets_delete_sheet.py
