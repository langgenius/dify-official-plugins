identity:
  author: langgenius
  name: microsoft_todo
  label:
    en_US: Microsoft To Do
    zh_Hans: 微软待办
    ja_JP: マイクロソフトToDo
  description:
    en_US: Access Microsoft To Do tasks and lists in Dify
    zh_Hans: 在 Dify 中访问微软待办任务和列表
    ja_JP: DifyでMicrosoft To Doのタスクとリストにアクセス
  icon: icon.png
credentials_for_provider:
  auth_mode:
    type: select
    required: false
    default: service_principal
    label:
      en_US: Mode
      zh_Hans: 模式
      ja_JP: モード
      pt_BR: Modo
    options:
    - value: service_principal
      label:
        en_US: Service Principal (app identity, a named user's tasks)
        zh_Hans: Service Principal（应用身份，访问指定用户的任务）
        ja_JP: サービス プリンシパル（アプリ ID、指定したユーザーのタスク）
        pt_BR: Service Principal (identidade do aplicativo, tarefas de um usuário definido)
    - value: per_user
      label:
        en_US: Each user signs in (own tasks, for chat agents)
        zh_Hans: 每个用户自己登录（各自的任务，适用于对话 Agent）
        ja_JP: ユーザーごとにサインイン（本人のタスク、チャット エージェント向け）
        pt_BR: Cada usuário faz login (próprias tarefas, para agentes de chat)
    help:
      en_US: 'Each user signs in: the first time a chat user needs To Do, the tool returns a Microsoft sign-in link for them;
        after signing in, the tools work on that user''s own tasks. Needs the Sign-in Callback URL below and delegated Graph
        permissions on the app.'
      zh_Hans: 每个用户自己登录：聊天用户第一次用到 To Do 时，工具会返回 Microsoft 登录链接；登录后，工具操作的是该用户自己的任务。需要填写下方的登录回调 URL，并为应用配置委托的 Graph 权限。
      ja_JP: 'ユーザーごとにサインイン: チャットのユーザーが初めて To Do を使うとき、ツールが Microsoft のサインイン リンクを返します。サインイン後は、そのユーザー本人のタスクを操作します。下のサインイン コールバック
        URL と、アプリへの委任された Graph のアクセス許可が必要です。'
      pt_BR: 'Cada usuário faz login: na primeira vez que um usuário do chat precisar do To Do, a ferramenta retorna um link
        de login da Microsoft; depois disso, as ferramentas atuam nas tarefas desse usuário. Requer a URL de retorno de login
        abaixo e permissões delegadas do Graph no aplicativo.'
  tenant_id:
    type: text-input
    required: true
    label:
      en_US: Tenant ID
      zh_Hans: 租户 ID
      ja_JP: テナント ID
      pt_BR: ID do Locatário
    placeholder:
      en_US: Directory (tenant) ID, e.g. 00000000-0000-0000-0000-000000000000
      zh_Hans: 目录（租户）ID，例如 00000000-0000-0000-0000-000000000000
      ja_JP: 'ディレクトリ（テナント）ID、例: 00000000-0000-0000-0000-000000000000'
      pt_BR: ID do diretório (locatário), ex. 00000000-0000-0000-0000-000000000000
    help:
      en_US: Your directory (tenant) ID, from Microsoft Entra ID > Overview or the app registration's Overview. Service Principal
        must use it ('common' does not work); with Each user signs in it limits sign-in to your organization.
      zh_Hans: 目录（租户）ID，可在 Microsoft Entra ID > 概述或应用注册的概述页找到。Service Principal 必须填它（不能用 'common'）；“每个用户自己登录”模式下，填它可以只允许本组织的账号登录。
      ja_JP: ディレクトリ（テナント）ID です。Microsoft Entra ID > 概要、またはアプリ登録の概要で確認できます。サービス プリンシパルでは必須です（'common' は使えません）。ユーザーごとのサインインでは、自組織のアカウントだけがサインインできるようにします。
      pt_BR: O ID do diretório (locatário), em Microsoft Entra ID > Visão geral ou na Visão geral do registro do aplicativo.
        O Service Principal precisa dele ('common' não funciona); no modo em que cada usuário faz login, ele restringe o login
        à sua organização.
    url: https://portal.azure.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Overview
  client_id:
    type: text-input
    required: true
    label:
      en_US: Client ID
      zh_Hans: 客户端 ID
      ja_JP: クライアント ID
      pt_BR: ID do Cliente
    placeholder:
      en_US: Application (client) ID of the app registration
      zh_Hans: 应用注册的应用程序（客户端）ID
      ja_JP: アプリ登録のアプリケーション（クライアント）ID
      pt_BR: ID do aplicativo (cliente) do registro de aplicativo
    help:
      en_US: The Application (client) ID on the app registration's Overview page.
      zh_Hans: 应用注册“概述”页上的“应用程序(客户端) ID”。
      ja_JP: アプリ登録の「概要」ページにある「アプリケーション (クライアント) ID」です。
      pt_BR: O ID do aplicativo (cliente) na página Visão geral do registro do aplicativo.
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  client_secret:
    type: secret-input
    required: true
    label:
      en_US: Client Secret
      zh_Hans: 客户端密钥
      ja_JP: クライアントシークレット
      pt_BR: Segredo do Cliente
    placeholder:
      en_US: Client secret value of the app registration
      zh_Hans: 应用注册的客户端密钥值
      ja_JP: アプリ登録のクライアントシークレットの値
      pt_BR: Valor do segredo do cliente do registro de aplicativo
    help:
      en_US: Copy the secret's Value (not its Secret ID). Service Principal needs the Graph application permission Tasks.ReadWrite.All
        with admin consent. Each user signs in needs the delegated permissions User.Read, Tasks.ReadWrite, offline_access.
      zh_Hans: 复制密钥的“值”（不是“机密 ID”）。Service Principal 需要已获管理员同意的 Graph 应用程序权限 Tasks.ReadWrite.All；“每个用户自己登录”需要委托权限 User.Read、Tasks.ReadWrite、offline_access。
      ja_JP: シークレットの「値」をコピーしてください（シークレット ID ではありません）。サービス プリンシパルには管理者の同意を付与した Graph のアプリケーションのアクセス許可 Tasks.ReadWrite.All、ユーザーごとのサインインには委任されたアクセス許可
        User.Read、Tasks.ReadWrite、offline_access が必要です。
      pt_BR: Copie o Valor do segredo (não o ID do segredo). O Service Principal precisa da permissão de aplicativo do Graph
        Tasks.ReadWrite.All com consentimento do administrador; o modo em que cada usuário faz login precisa das permissões
        delegadas User.Read, Tasks.ReadWrite, offline_access.
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  task_user:
    type: text-input
    required: false
    label:
      en_US: Default Task Owner
      zh_Hans: 默认任务所有者
      ja_JP: 既定のタスク所有者
      pt_BR: Proprietário Padrão das Tarefas
    placeholder:
      en_US: e.g. alice@contoso.com
      zh_Hans: 例如 alice@contoso.com
      ja_JP: 例 alice@contoso.com
      pt_BR: ex. alice@contoso.com
    help:
      en_US: 'Service Principal: the user (user principal name or user ID) whose tasks the tools work on; a tool''s Task Owner
        setting overrides it. Not used when each user signs in.'
      zh_Hans: Service Principal：工具要操作其任务的用户（用户主体名称或用户 ID），工具的“任务所有者”设置会覆盖此值。每个用户自己登录时不使用。
      ja_JP: 'サービス プリンシパル: ツールがタスクを操作するユーザー（ユーザー プリンシパル名またはユーザー ID）。ツールの「タスクの所有者」が優先されます。ユーザーごとのサインインでは使いません。'
      pt_BR: 'Service Principal: o usuário (nome principal ou ID) cujas tarefas as ferramentas usam; a configuração Proprietário
        das Tarefas da ferramenta tem prioridade. Não é usado quando cada usuário faz login.'
  redirect_uri:
    type: text-input
    required: false
    label:
      en_US: Sign-in Callback URL
      zh_Hans: 登录回调 URL
      ja_JP: サインイン コールバック URL
      pt_BR: URL de Retorno do Login
    placeholder:
      en_US: Only for "Each user signs in", e.g. https://dify.example.com/e/xxxx/todo/callback
      zh_Hans: 仅用于“每个用户自己登录”，例如 https://dify.example.com/e/xxxx/todo/callback
      ja_JP: 'ユーザーごとのサインインのみ。例: https://dify.example.com/e/xxxx/todo/callback'
      pt_BR: Somente para "Cada usuário faz login", ex. https://dify.example.com/e/xxxx/todo/callback
    help:
      en_US: Create this plugin's endpoint (plugin details > Endpoints), paste its /todo/callback URL here, and add the same
        URL to the app registration's Web redirect URIs.
      zh_Hans: 先创建本插件的端点（插件详情 > 端点），把它的 /todo/callback URL 粘贴到这里，并把同一个 URL 加到应用注册的 Web 重定向 URI 中。
      ja_JP: このプラグインのエンドポイントを作成し（プラグインの詳細 > エンドポイント）、その /todo/callback の URL をここに貼り付け、同じ URL をアプリ登録の Web リダイレクト URI に追加してください。
      pt_BR: Crie o endpoint deste plugin (detalhes do plugin > Endpoints), cole aqui a URL /todo/callback e adicione a mesma
        URL aos URIs de redirecionamento Web do registro de aplicativo.
  cloud:
    type: select
    required: false
    default: global
    label:
      en_US: Microsoft Cloud
      zh_Hans: Microsoft 云
      ja_JP: Microsoft クラウド
      pt_BR: Nuvem da Microsoft
    help: &id001
      en_US: Choose a national cloud only if your Microsoft 365 tenant lives there; it changes the sign-in and Graph endpoints.
      zh_Hans: 仅当您的 Microsoft 365 租户位于国家云时才选择；它会同时改变登录和 Graph 地址。
      ja_JP: Microsoft 365 テナントが各国のクラウドにある場合のみ選択します。サインインと Graph のエンドポイントが変わります。
      pt_BR: Escolha uma nuvem nacional somente se o seu locatário do Microsoft 365 estiver nela; isso altera os endpoints
        de login e do Graph.
    options: &id002
    - value: global
      label:
        en_US: Global (graph.microsoft.com)
        zh_Hans: 全球 (graph.microsoft.com)
        ja_JP: グローバル (graph.microsoft.com)
        pt_BR: Global (graph.microsoft.com)
    - value: usgov
      label:
        en_US: US Government (graph.microsoft.us)
        zh_Hans: 美国政府 (graph.microsoft.us)
        ja_JP: 米国政府 (graph.microsoft.us)
        pt_BR: Governo dos EUA (graph.microsoft.us)
    - value: dod
      label:
        en_US: US Government DoD (dod-graph.microsoft.us)
        zh_Hans: 美国政府 DoD (dod-graph.microsoft.us)
        ja_JP: 米国政府 DoD (dod-graph.microsoft.us)
        pt_BR: Governo dos EUA DoD (dod-graph.microsoft.us)
    - value: china
      label:
        en_US: China, operated by 21Vianet (microsoftgraph.chinacloudapi.cn)
        zh_Hans: 中国，世纪互联运营 (microsoftgraph.chinacloudapi.cn)
        ja_JP: 中国、21Vianet 運営 (microsoftgraph.chinacloudapi.cn)
        pt_BR: China, operado pela 21Vianet (microsoftgraph.chinacloudapi.cn)
oauth_schema:
  client_schema:
  - name: client_id
    type: secret-input
    required: true
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/CreateApplicationBlade/quickStartType~/null/isMSAApp~/false
    placeholder:
      en_US: Please input your Client ID
      zh_Hans: 请输入你的 Client ID
      ja_JP: Client ID を入力してください
      pt_BR: Insira seu Client ID
    help:
      en_US: Client ID is used to authenticate requests to the Microsoft API.
      zh_Hans: Client ID 用于认证请求到 Microsoft API。
      ja_JP: Client ID は Microsoft API へのリクエスト認証に使用されます。
      pt_BR: Client ID é usado para autenticar solicitações à API do Microsoft.
    label:
      en_US: Client ID
      zh_Hans: Client ID
      ja_JP: Client ID
  - name: client_secret
    type: secret-input
    required: true
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/CreateApplicationBlade/quickStartType~/null/isMSAApp~/false
    placeholder:
      en_US: Please input your Client Secret
      zh_Hans: 请输入你的 Client Secret
      ja_JP: Client Secret を入力してください
      pt_BR: Insira seu Client Secret
    help:
      en_US: Client Secret is used to authenticate requests to the Microsoft API.
      zh_Hans: Client Secret 用于认证请求到 Microsoft API。
      ja_JP: Client Secret は Microsoft API へのリクエスト認証に使用されます。
      pt_BR: Client Secret é usado para autenticar solicitações à API do Microsoft.
    label:
      en_US: Client Secret
      zh_Hans: Client Secret
      ja_JP: Client Secret
  - name: tenant_id
    type: text-input
    required: false
    default: common
    label:
      en_US: Tenant ID
      zh_Hans: 租户 ID
      ja_JP: テナント ID
      pt_BR: ID do Locatário
    placeholder:
      en_US: common, organizations, or your directory (tenant) ID
      zh_Hans: common、organizations 或您的目录（租户）ID
      ja_JP: common、organizations、またはディレクトリ（テナント）ID
      pt_BR: common, organizations ou o ID do diretório (locatário)
    help:
      en_US: Leave 'common' for any work or personal account (the behaviour before this setting existed); your directory ID
        limits sign-in to your organization.
      zh_Hans: 保留 common 表示任何工作或个人账号都可登录（与之前的行为相同）；填写目录 ID 则只允许本组织的账号。
      ja_JP: common のままにすると、職場または個人のどのアカウントでもサインインできます（従来の動作）。ディレクトリ ID を指定すると自組織のアカウントに限定されます。
      pt_BR: Deixe 'common' para qualquer conta corporativa ou pessoal (o comportamento anterior); o ID do diretório restringe
        o login à sua organização.
  - name: cloud
    type: select
    required: false
    default: global
    label:
      en_US: Microsoft Cloud
      zh_Hans: Microsoft 云
      ja_JP: Microsoft クラウド
      pt_BR: Nuvem da Microsoft
    help: *id001
    options: *id002
  credentials_schema:
  - name: access_tokens
    type: secret-input
    label:
      en_US: Access Token
      zh_Hans: 访问令牌
      ja_JP: アクセス トークン
  - name: access_token
    type: secret-input
    label:
      en_US: Access Token
      zh_Hans: 访问令牌
      ja_JP: アクセス トークン
      pt_BR: Token de Acesso
  - name: refresh_token
    type: secret-input
    label:
      en_US: Refresh Token
      zh_Hans: 刷新令牌
      ja_JP: リフレッシュ トークン
      pt_BR: Token de Atualização
