identity:
  name: create_task
  author: langgenius
  label:
    en_US: Create Task
    zh_Hans: 创建任务
    ja_JP: タスクを作成
description:
  human:
    en_US: Create a task in the Microsoft To Do list
    zh_Hans: 在 Microsoft To Do 列表中创建任务
    ja_JP: Microsoft To Do リストにタスクを作成
  llm: Create a task in the Microsoft To Do list
parameters:
- name: list_id
  type: string
  required: true
  label:
    en_US: List Id
    zh_Hans: 列表ID
    ja_JP: リストID
  human_description:
    en_US: The id of the list to create the task in
    zh_Hans: 要在其中创建任务的列表ID
    ja_JP: タスクを作成するリストのID
  llm_description: The id of the list to create the task in, type is string
  form: llm
- name: title
  type: string
  required: true
  label:
    en_US: Title
    zh_Hans: 标题
    ja_JP: タイトル
  human_description:
    en_US: The title of the task to create
    zh_Hans: 要创建的任务标题
    ja_JP: 作成するタスクのタイトル
  llm_description: The title of the task to create, type is string
  form: llm
- name: due_date
  type: string
  required: false
  label:
    en_US: Due Date
    zh_Hans: 截止日期
    ja_JP: 期限日
  human_description:
    en_US: The due date of the task to create
    zh_Hans: 要创建任务的截止日期
    ja_JP: 作成するタスクの期限日
  llm_description: The due date of the task to create, type is string, format is YYYY-MM-DD
  form: llm
- name: body_text
  type: string
  required: false
  label:
    en_US: Body Text
    zh_Hans: 正文
    ja_JP: 本文
  human_description:
    en_US: The body text of the task to create
    zh_Hans: 要创建任务的正文内容
    ja_JP: 作成するタスクの本文
  llm_description: The body text of the task to create, type is string
  form: llm
- name: reminder_datetime
  type: string
  required: false
  form: llm
  label:
    en_US: Reminder
    zh_Hans: 提醒时间
    ja_JP: リマインダー
  human_description:
    en_US: ISO 8601 date-time for a reminder
    zh_Hans: 提醒的 ISO 8601 日期时间
    ja_JP: リマインダーの ISO 8601 日時
  llm_description: When to remind the user, as an ISO 8601 date-time (with an offset, or taken as UTC).
- name: importance
  type: select
  required: false
  form: llm
  label:
    en_US: Importance
    zh_Hans: 重要性
    ja_JP: 重要度
  human_description:
    en_US: low, normal or high
    zh_Hans: 低、普通或高
    ja_JP: 低・標準・高
  llm_description: low, normal or high.
  options:
  - value: low
    label:
      en_US: Low
      zh_Hans: 低
      ja_JP: 低
  - value: normal
    label:
      en_US: Normal
      zh_Hans: 普通
      ja_JP: 標準
  - value: high
    label:
      en_US: High
      zh_Hans: 高
      ja_JP: 高
- name: status
  type: select
  required: false
  form: llm
  label:
    en_US: Status
    zh_Hans: 状态
    ja_JP: 状態
  human_description:
    en_US: The task's status
    zh_Hans: 任务状态
    ja_JP: タスクの状態
  llm_description: notStarted, inProgress, completed, waitingOnOthers or deferred.
  options:
  - value: notStarted
    label:
      en_US: Not started
      zh_Hans: 未开始
      ja_JP: 未着手
  - value: inProgress
    label:
      en_US: In progress
      zh_Hans: 进行中
      ja_JP: 進行中
  - value: completed
    label:
      en_US: Completed
      zh_Hans: 已完成
      ja_JP: 完了
  - value: waitingOnOthers
    label:
      en_US: Waiting on others
      zh_Hans: 等待他人
      ja_JP: 他の人を待機中
  - value: deferred
    label:
      en_US: Deferred
      zh_Hans: 已推迟
      ja_JP: 延期
- name: task_user
  type: string
  required: false
  form: form
  label:
    en_US: Task Owner
    zh_Hans: 任务所有者
    ja_JP: タスクの所有者
  human_description:
    en_US: 'Service Principal only: the user (user principal name or user ID) whose tasks to use. Leave empty for the credential''s
      default.'
    zh_Hans: 仅限 Service Principal：要操作其任务的用户（用户主体名称或用户 ID）。留空则使用凭据中的默认值。
    ja_JP: 'サービス プリンシパルのみ: タスクを操作するユーザー（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定値を使います。'
output_schema:
  type: object
  properties:
    task_id:
      type: string
      description: Task ID
    title:
      type: string
      description: Title
    status:
      type: string
      description: notStarted, inProgress, completed, waitingOnOthers or deferred
    body_text:
      type: string
      description: Notes
    due_date:
      type: string
      description: Due date and time
    created_date:
      type: string
      description: Created (UTC)
    importance:
      type: string
      description: low, normal or high
    reminder:
      type: string
      description: Reminder date and time, empty if none
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/create_task.py
