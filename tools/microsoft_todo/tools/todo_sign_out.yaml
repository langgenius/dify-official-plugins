identity:
  name: todo_sign_out
  display_name: Sign Out of To Do
  author: Dify
  label:
    en_US: Sign Out of To Do
    zh_Hans: 退出 To Do 登录
    ja_JP: To Do からサインアウト
description:
  human:
    en_US: 'Each user signs in mode only: forget the current user''s Microsoft sign-in'
    zh_Hans: 仅限“每个用户自己登录”模式：清除当前用户的 Microsoft 登录
    ja_JP: 'ユーザーごとのサインイン モードのみ: 現在のユーザーの Microsoft サインインを削除します'
  llm: Sign the current user out of the To Do tools (forget their stored To Do sign-in; other Microsoft tools such as Outlook
    keep theirs). Use only when the user asks to sign out of To Do, or to sign out or switch accounts in general.
parameters: []
output_schema:
  type: object
  properties:
    signed_out:
      type: boolean
      description: True when a stored sign-in was removed
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/todo_sign_out.py
