identity:
  name: todo_get_linked_resource
  author: langgenius
  label:
    en_US: Get Linked Resource
    zh_Hans: 获取关联资源
    ja_JP: リンク リソースを取得
description:
  human:
    en_US: One linked resource of a task
    zh_Hans: 任务的一个关联资源
    ja_JP: タスクのリンク リソース 1 件
  llm: Get one linked resource of a task.
parameters:
- name: list_id
  type: string
  required: true
  form: llm
  label:
    en_US: List ID
    zh_Hans: 列表 ID
    ja_JP: リスト ID
  human_description:
    en_US: The ID of the task list
    zh_Hans: 任务列表的 ID
    ja_JP: タスク リストの ID
  llm_description: The ID of the task list (from the get lists tool).
- name: task_id
  type: string
  required: true
  form: llm
  label:
    en_US: Task ID
    zh_Hans: 任务 ID
    ja_JP: タスク ID
  human_description:
    en_US: The ID of the task
    zh_Hans: 任务的 ID
    ja_JP: タスクの ID
  llm_description: The ID of the task (from a get tasks tool).
- name: linked_resource_id
  type: string
  required: true
  form: llm
  label:
    en_US: Linked Resource ID
    zh_Hans: 关联资源 ID
    ja_JP: リンク リソース ID
  human_description:
    en_US: The ID of the linked resource
    zh_Hans: 关联资源的 ID
    ja_JP: リンク リソースの ID
  llm_description: The ID of the linked resource (from the list linked resources tool).
- name: task_user
  type: string
  required: false
  form: form
  label:
    en_US: Task Owner
    zh_Hans: 任务所有者
    ja_JP: タスクの所有者
  human_description:
    en_US: 'Service Principal only: the user (user principal name or user ID) whose tasks to use. Leave empty for the credential''s
      default.'
    zh_Hans: 仅限 Service Principal：要操作其任务的用户（用户主体名称或用户 ID）。留空则使用凭据中的默认值。
    ja_JP: 'サービス プリンシパルのみ: タスクを操作するユーザー（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定値を使います。'
output_schema:
  type: object
  properties:
    linked_resource_id:
      type: string
      description: Linked resource ID
    display_name:
      type: string
      description: Title
    application_name:
      type: string
      description: App the item is in
    external_id:
      type: string
      description: The item's ID in that app
    web_url:
      type: string
      description: Link to the item
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/todo_get_linked_resource.py
