identity:
  name: complete_task
  author: langgenius
  label:
    en_US: Complete Task
    zh_Hans: 完成任务
    ja_JP: タスクを完了
description:
  human:
    en_US: Complete a task in the Microsoft To Do list
    zh_Hans: 在 Microsoft To Do 列表中完成任务
    ja_JP: Microsoft To Do リストのタスクを完了する
  llm: Complete a task in the Microsoft To Do list
parameters:
- name: task_id
  type: string
  required: true
  label:
    en_US: Task Id
    zh_Hans: 任务ID
    ja_JP: タスクID
  human_description:
    en_US: The id of the task to complete
    zh_Hans: 要完成的任务ID
    ja_JP: 完了するタスクのID
  llm_description: The id of the task to complete, type is string
  form: llm
- name: list_id
  type: string
  required: true
  label:
    en_US: List Id
    zh_Hans: 列表ID
    ja_JP: リストID
  human_description:
    en_US: The id of the list the task belongs to
    zh_Hans: 任务所属的列表ID
    ja_JP: タスクが属するリストのID
  llm_description: The id of the list the task belongs to, type is string
  form: llm
- name: task_user
  type: string
  required: false
  form: form
  label:
    en_US: Task Owner
    zh_Hans: 任务所有者
    ja_JP: タスクの所有者
  human_description:
    en_US: 'Service Principal only: the user (user principal name or user ID) whose tasks to use. Leave empty for the credential''s
      default.'
    zh_Hans: 仅限 Service Principal：要操作其任务的用户（用户主体名称或用户 ID）。留空则使用凭据中的默认值。
    ja_JP: 'サービス プリンシパルのみ: タスクを操作するユーザー（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定値を使います。'
output_schema:
  type: object
  properties:
    task_id:
      type: string
      description: Task ID
    title:
      type: string
      description: Title
    status:
      type: string
      description: notStarted, inProgress, completed, waitingOnOthers or deferred
    body_text:
      type: string
      description: Notes
    due_date:
      type: string
      description: Due date and time
    created_date:
      type: string
      description: Created (UTC)
    importance:
      type: string
      description: low, normal or high
    reminder:
      type: string
      description: Reminder date and time, empty if none
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/complete_task.py
