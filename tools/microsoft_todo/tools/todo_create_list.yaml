identity:
  name: todo_create_list
  author: langgenius
  label:
    en_US: Create List
    zh_Hans: 创建列表
    ja_JP: リストを作成
description:
  human:
    en_US: Create a task list
    zh_Hans: 创建任务列表
    ja_JP: タスク リストを作成します
  llm: Create a Microsoft To Do task list.
parameters:
- name: display_name
  type: string
  required: true
  form: llm
  label:
    en_US: List Name
    zh_Hans: 列表名称
    ja_JP: リスト名
  human_description:
    en_US: Name of the list
    zh_Hans: 列表名称
    ja_JP: リストの名前
  llm_description: Name of the task list.
- name: task_user
  type: string
  required: false
  form: form
  label:
    en_US: Task Owner
    zh_Hans: 任务所有者
    ja_JP: タスクの所有者
  human_description:
    en_US: 'Service Principal only: the user (user principal name or user ID) whose tasks to use. Leave empty for the credential''s
      default.'
    zh_Hans: 仅限 Service Principal：要操作其任务的用户（用户主体名称或用户 ID）。留空则使用凭据中的默认值。
    ja_JP: 'サービス プリンシパルのみ: タスクを操作するユーザー（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定値を使います。'
output_schema:
  type: object
  properties:
    list_id:
      type: string
      description: List ID
    display_name:
      type: string
      description: List name
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/todo_create_list.py
