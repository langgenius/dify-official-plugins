version: 1.0.0
type: plugin
author: langgenius
name: microsoft_todo
label:
  en_US: Microsoft To Do
  zh_Hans: 微软待办
  ja_JP: マイクロソフトToDo
description:
  en_US: Access Microsoft To Do tasks and lists in Dify
  zh_Hans: 在 Dify 中访问微软待办任务和列表
  ja_JP: DifyでMicrosoft To Doのタスクとリストにアクセス
icon: icon.png
resource:
  memory: 268435456
  # endpoint + storage: only used by the "Each user signs in" credential mode (sign-in callback, per-user tokens).
  permission:
    endpoint:
      enabled: true
    storage:
      enabled: true
      size: 10485760
plugins:
  tools:
  - provider/microsoft_todo.yaml
  endpoints:
  - group/todo_signin.yaml
meta:
  version: 0.0.1
  arch:
  - amd64
  - arm64
  runner:
    language: python
    version: '3.12'
    entrypoint: main
  minimum_dify_version: 1.7.0
created_at: '2025-07-17T23:25:53.108316Z'
privacy: PRIVACY.md
verified: false
