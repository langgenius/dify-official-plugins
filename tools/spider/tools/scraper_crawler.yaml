description:
  human:
    en_US: A tool for scraping & crawling webpages. Input should be a url.
    zh_Hans: 用于抓取和爬取网页的工具。输入应该是一个网址。
  llm: A tool for scraping & crawling webpages. Input should be a url.
extra:
  python:
    source: tools/scraper_crawler.py
identity:
  author: William Espegren
  label:
    en_US: Web Scraper & Crawler
    zh_Hans: 网页抓取与爬虫
  name: scraper_crawler
parameters:
- form: llm
  human_description:
    en_US: url to be scraped or crawled
    zh_Hans: 要抓取或爬取的网址
  label:
    en_US: URL
    zh_Hans: 网址
  llm_description: url to either be scraped or crawled
  name: url
  required: true
  type: string
- default: crawl
  form: form
  human_description:
    en_US: used for selecting to either scrape the website or crawl the entire website
      following subpages
    zh_Hans: 用于选择抓取网站或爬取整个网站及其子页面
  label:
    en_US: Mode
    zh_Hans: 模式
  name: mode
  options:
  - label:
      en_US: scrape
      zh_Hans: 抓取
    value: scrape
  - label:
      en_US: crawl
      zh_Hans: 爬取
    value: crawl
  required: true
  type: select
- default: 10
  form: form
  human_description:
    en_US: specify the maximum number of pages to crawl per website. the crawler will
      stop after reaching this limit. 0 removes the limit, and the crawl runs until it
      finds no more pages or the credit balance runs out.
    zh_Hans: 指定每个网站要爬取的最大页面数。爬虫将在达到此限制后停止。0 表示不限制，爬取会持续到没有更多页面或额度用完。
  label:
    en_US: maximum number of pages to crawl
    zh_Hans: 最大爬取页面数
  min: 0
  name: limit
  required: false
  type: number
- default: 25
  form: form
  human_description:
    en_US: the crawl limit for maximum depth. 0 removes the limit.
    zh_Hans: 最大爬取深度的限制。0 表示不限制。
  label:
    en_US: maximum depth of pages to crawl
    zh_Hans: 最大爬取深度
  min: 0
  name: depth
  required: false
  type: number
- form: form
  human_description:
    en_US: blacklist a set of paths that you do not want to crawl, separated by commas.
      you can use regex patterns to help with the list.
    zh_Hans: 指定一组不想爬取的路径。您可以使用正则表达式模式来帮助定义列表。
  label:
    en_US: url patterns to exclude
    zh_Hans: 要排除的URL模式
  name: blacklist
  placeholder:
    en_US: /blog/*, /about
  required: false
  type: string
- form: form
  human_description:
    en_US: Whitelist a set of paths that you want to crawl, separated by commas, ignoring
      all other routes that do not match the patterns. You can use regex patterns to
      help with the list.
    zh_Hans: 指定一组要爬取的路径，忽略所有不匹配模式的其他路由。您可以使用正则表达式模式来帮助定义列表。
  label:
    en_US: URL patterns to include
    zh_Hans: 要包含的URL模式
  name: whitelist
  placeholder:
    en_US: /blog/*, /about
  required: false
  type: string
- default: false
  form: form
  human_description:
    en_US: Use Mozilla's readability to pre-process the content for reading. This
      may drastically improve the content for LLM usage.
    zh_Hans: 如果启用，爬虫将仅返回页面的主要内容，不包括标题、导航、页脚等。
  label:
    en_US: Pre-process the content for LLM usage
    zh_Hans: 仅返回页面的主要内容
  name: readability
  required: false
  type: boolean
