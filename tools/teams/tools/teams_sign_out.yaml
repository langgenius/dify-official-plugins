identity:
  name: teams_sign_out
  display_name: Sign Out of Teams
  author: Dify
  label:
    en_US: Sign Out of Teams
    ko_KR: Teams 로그아웃
    zh_Hans: 退出 Teams 登录
    pt_BR: Sair do Teams
    ja_JP: Teams からサインアウト
    zh_Hant: 登出 Teams
description:
  human:
    en_US: "Each user signs in mode only: forget the current user's Microsoft sign-in"
    ko_KR: "사용자별 로그인 모드 전용: 현재 사용자의 Microsoft 로그인을 삭제합니다"
    zh_Hans: "仅限“每个用户自己登录”模式：清除当前用户的 Microsoft 登录"
    pt_BR: "Somente no modo de login por usuário: esquece o login da Microsoft do usuário atual"
    ja_JP: "ユーザーごとのサインイン モードのみ: 現在のユーザーの Microsoft サインインを削除します"
    zh_Hant: "僅限「每個使用者自行登入」模式：清除目前使用者的 Microsoft 登入"
  llm: Sign the current user out of the Microsoft Teams tools (forget their stored Teams sign-in; other Microsoft tools such as Outlook keep theirs). Use only when the user asks to sign out of Teams, or to sign out or switch accounts in general.
parameters: []
output_schema:
  type: object
  properties:
    signed_out:
      type: boolean
      description: True when a stored sign-in was removed
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/teams_sign_out.py
