[project]
name = "parallel"
version = "0.0.1"
description = "Parallel Search MCP tools for Dify"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dify_plugin>=0.9.0",
    "mcp>=1.26.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
