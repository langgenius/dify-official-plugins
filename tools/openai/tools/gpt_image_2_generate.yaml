description:
  human:
    en_US: GPT Image 2 / 2.5 Generate is a text to image generation tool
    zh_Hans: GPT Image 2 / 2.5 Generate 是一个文本到图像的生成工具
  llm: GPT Image 2 / 2.5 Generate is a tool used to generate images from text using OpenAI's GPT Image 2 and GPT Image 2.5 models
extra:
  python:
    source: tools/gpt_image_2_generate.py
identity:
  author: OpenAI
  description:
    en_US: Generate images with OpenAI's GPT Image 2 and GPT Image 2.5 models as a standalone tool.
    zh_Hans: 使用 OpenAI 的 GPT Image 2 和 GPT Image 2.5 模型独立生成图像。
  label:
    en_US: GPT Image 2 / 2.5 Generate
    zh_Hans: GPT 图像 2 / 2.5 生成
  name: gpt_image_2_generate
parameters:
- default: gpt-image-2
  form: form
  human_description:
    en_US: Select GPT Image 2 or GPT Image 2.5. Flare prioritizes speed; Sunburst prioritizes image quality.
    zh_Hans: 选择 GPT Image 2 或 GPT Image 2.5。Flare 优先速度，Sunburst 优先图像质量。
  label:
    en_US: Model
    zh_Hans: 模型
  name: model
  options:
  - label:
      en_US: GPT Image 2
      zh_Hans: GPT Image 2
    value: gpt-image-2
  - label:
      en_US: GPT Image 2.5 Flare
      zh_Hans: GPT Image 2.5 Flare
    value: gpt-image-2.5-flare
  - label:
      en_US: GPT Image 2.5 Sunburst
      zh_Hans: GPT Image 2.5 Sunburst
    value: gpt-image-2.5-sunburst
  required: false
  type: select
- form: llm
  human_description:
    en_US: Detailed description of the image you want to generate.
    zh_Hans: 您想要生成的图像的详细描述。
  label:
    en_US: Prompt
    zh_Hans: 提示词
  llm_description: Detailed image prompt for GPT Image 2 or GPT Image 2.5. Describe the desired image clearly.
  name: prompt
  required: true
  type: string
- default: auto
  form: form
  human_description:
    en_US: >-
      Image size: auto or WIDTHxHEIGHT. Dimensions must be multiples of 16, at most 3840 per edge, with a 1:3 to 3:1 aspect ratio and 655360 to 8294400 pixels. Sizes above 2560x1440 are experimental.
    zh_Hans: 图像尺寸：auto 或 宽x高。宽高须为 16 的倍数、单边不超过 3840，宽高比为 1:3 到 3:1，总像素为 655360 到 8294400。超过 2560x1440 的尺寸为实验性支持。
  label:
    en_US: Image Size
    zh_Hans: 图像大小
  name: size
  required: false
  type: string
- default: 1
  form: form
  human_description:
    en_US: Number of images to generate (between 1 and 10).
    zh_Hans: 要生成的图像数量（1 到 10）。
  label:
    en_US: Number of Images
    zh_Hans: 图像数量
  max: 10
  min: 1
  name: n
  required: false
  type: number
- default: auto
  form: form
  human_description:
    en_US: Image quality. Extra High and Maximum are available only with GPT Image 2.5.
    zh_Hans: 图像质量。超高和最高质量仅适用于 GPT Image 2.5。
  label:
    en_US: Image Quality
    zh_Hans: 图像质量
  name: quality
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
    value: auto
  - label:
      en_US: Low
      zh_Hans: 低
    value: low
  - label:
      en_US: Medium
      zh_Hans: 中
    value: medium
  - label:
      en_US: High
      zh_Hans: 高
    value: high
  - label:
      en_US: Extra High (GPT Image 2.5 only)
      zh_Hans: 超高（仅 GPT Image 2.5）
    value: xhigh
  - label:
      en_US: Maximum (GPT Image 2.5 only)
      zh_Hans: 最高（仅 GPT Image 2.5）
    value: max
  required: false
  type: select
- default: auto
  form: form
  human_description:
    en_US: Background type. Transparent output requires PNG or WebP; support in GPT Image 2 is in preview.
    zh_Hans: 背景类型。透明背景输出需要 PNG 或 WebP 格式；GPT Image 2 的透明背景支持处于预览阶段。
  label:
    en_US: Background
    zh_Hans: 背景
  name: background
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
    value: auto
  - label:
      en_US: Opaque
      zh_Hans: 不透明
    value: opaque
  - label:
      en_US: Transparent
      zh_Hans: 透明
    value: transparent
  required: false
  type: select
- default: auto
  form: form
  human_description:
    en_US: Output image format.
    zh_Hans: 输出图像格式。
  label:
    en_US: Output Format
    zh_Hans: 输出格式
  name: output_format
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
    value: auto
  - label:
      en_US: PNG
      zh_Hans: PNG
    value: png
  - label:
      en_US: JPEG
      zh_Hans: JPEG
    value: jpeg
  - label:
      en_US: WebP
      zh_Hans: WebP
    value: webp
  required: false
  type: select
- default: 100
  form: form
  human_description:
    en_US: Compression level for JPEG or WebP output (0-100).
    zh_Hans: JPEG 或 WebP 输出的压缩级别（0-100）。
  label:
    en_US: Output Compression
    zh_Hans: 输出压缩
  name: output_compression
  max: 100
  min: 0
  required: false
  type: number
- default: auto
  form: form
  human_description:
    en_US: Moderation level.
    zh_Hans: 内容审核级别。
  label:
    en_US: Moderation
    zh_Hans: 内容审核
  name: moderation
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
    value: auto
  - label:
      en_US: Low
      zh_Hans: 低
    value: low
  required: false
  type: select
