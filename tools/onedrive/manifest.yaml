version: 1.0.0
type: plugin
author: langgenius
name: onedrive
label:
  en_US: Microsoft OneDrive
  ja_JP: マイクロソフト OneDrive
  zh_Hans: 微软 OneDrive
  pt_BR: Microsoft OneDrive
description:
  en_US: Access Microsoft OneDrive in Dify
  ja_JP: DifyでMicrosoft OneDriveにアクセス
  zh_Hans: 在 Dify 中访问微软 OneDrive
  pt_BR: Acessar o Microsoft OneDrive no Dify
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 268435456
  # endpoint + storage: only used by the "Each user signs in" credential mode (sign-in callback, per-user tokens).
  permission:
    endpoint:
      enabled: true
    storage:
      enabled: true
      size: 10485760
plugins:
  tools:
    - provider/onedrive.yaml
  endpoints:
    - group/onedrive_signin.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
created_at: 2025-04-21T22:09:22.160377917+08:00
privacy: PRIVACY.md
verified: false
