identity:
  author: langgenius
  name: microsoft_onedrive
  label:
    en_US: Microsoft OneDrive
    zh_Hans: 微软 OneDrive
    ja_JP: マイクロソフト OneDrive
    pt_BR: Microsoft OneDrive
  description:
    en_US: Access Microsoft OneDrive in Dify
    zh_Hans: 在 Dify 中访问微软 OneDrive
    ja_JP: DifyでMicrosoft OneDriveにアクセス
    pt_BR: Acessar o Microsoft OneDrive no Dify
  icon: icon.svg
  icon_dark: icon-dark.svg
credentials_for_provider:
  auth_mode:
    type: select
    required: false
    default: service_principal
    label:
      en_US: Mode
      zh_Hans: 模式
      ja_JP: モード
      pt_BR: Modo
    options:
      - value: service_principal
        label:
          en_US: Service Principal (one app identity, a named drive)
          zh_Hans: Service Principal（应用身份，访问指定用户的网盘）
          ja_JP: サービス プリンシパル（アプリ ID、指定したユーザーのドライブ）
          pt_BR: Service Principal (identidade do aplicativo, uma unidade definida)
      - value: per_user
        label:
          en_US: Each user signs in (own OneDrive, for chat agents)
          zh_Hans: 每个用户自己登录（各自的 OneDrive，适用于对话 Agent）
          ja_JP: ユーザーごとにサインイン（本人の OneDrive、チャット エージェント向け）
          pt_BR: Cada usuário faz login (próprio OneDrive, para agentes de chat)
    help:
      en_US: "Each user signs in: the first time a chat user needs OneDrive, the tool returns a Microsoft sign-in link for them; after signing in, the tools act on that user's own OneDrive. Needs the Sign-in Callback URL below and delegated Graph permissions on the app."
      zh_Hans: "每个用户自己登录：聊天用户第一次用到 OneDrive 时，工具会返回 Microsoft 登录链接；登录后，工具操作的是该用户自己的 OneDrive。需要填写下方的登录回调 URL，并为应用配置委托的 Graph 权限。"
      ja_JP: "ユーザーごとにサインイン: チャットのユーザーが初めて OneDrive を使うとき、ツールが Microsoft のサインイン リンクを返します。サインイン後は、そのユーザー本人の OneDrive を操作します。下のサインイン コールバック URL と、アプリへの委任された Graph のアクセス許可が必要です。"
      pt_BR: "Cada usuário faz login: na primeira vez que um usuário do chat precisar do OneDrive, a ferramenta retorna um link de login da Microsoft; depois disso, as ferramentas atuam no OneDrive desse usuário. Requer a URL de retorno de login abaixo e permissões delegadas do Graph no aplicativo."
  tenant_id:
    type: text-input
    required: true
    label:
      en_US: Tenant ID
      zh_Hans: 租户 ID
      ja_JP: テナント ID
      pt_BR: ID do Locatário
    placeholder:
      en_US: Directory (tenant) ID, e.g. 00000000-0000-0000-0000-000000000000
      zh_Hans: 目录（租户）ID，例如 00000000-0000-0000-0000-000000000000
      ja_JP: 'ディレクトリ（テナント）ID、例: 00000000-0000-0000-0000-000000000000'
      pt_BR: ID do diretório (locatário), ex. 00000000-0000-0000-0000-000000000000
    help:
      en_US: "Your directory (tenant) ID, from Microsoft Entra ID > Overview or the app registration's Overview. Service Principal must use it ('common' does not work); with Each user signs in it limits sign-in to your organization."
      zh_Hans: "目录（租户）ID，可在 Microsoft Entra ID > 概述或应用注册的概述页找到。Service Principal 必须填它（不能用 'common'）；“每个用户自己登录”模式下，填它可以只允许本组织的账号登录。"
      ja_JP: "ディレクトリ（テナント）ID です。Microsoft Entra ID > 概要、またはアプリ登録の概要で確認できます。サービス プリンシパルでは必須です（'common' は使えません）。ユーザーごとのサインインでは、自組織のアカウントだけがサインインできるようにします。"
      pt_BR: "O ID do diretório (locatário), em Microsoft Entra ID > Visão geral ou na Visão geral do registro do aplicativo. O Service Principal precisa dele ('common' não funciona); no modo em que cada usuário faz login, ele restringe o login à sua organização."
    url: https://portal.azure.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Overview
  client_id:
    type: text-input
    required: true
    label:
      en_US: Client ID
      zh_Hans: 客户端 ID
      ja_JP: クライアント ID
      pt_BR: ID do Cliente
    placeholder:
      en_US: Application (client) ID of the app registration
      zh_Hans: 应用注册的应用程序（客户端）ID
      ja_JP: アプリ登録のアプリケーション（クライアント）ID
      pt_BR: ID do aplicativo (cliente) do registro de aplicativo
    help:
      en_US: "The Application (client) ID on the app registration's Overview page."
      zh_Hans: "应用注册“概述”页上的“应用程序(客户端) ID”。"
      ja_JP: "アプリ登録の「概要」ページにある「アプリケーション (クライアント) ID」です。"
      pt_BR: "O ID do aplicativo (cliente) na página Visão geral do registro do aplicativo."
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  client_secret:
    type: secret-input
    required: true
    label:
      en_US: Client Secret
      zh_Hans: 客户端密钥
      ja_JP: クライアントシークレット
      pt_BR: Segredo do Cliente
    placeholder:
      en_US: Client secret value of the app registration
      zh_Hans: 应用注册的客户端密钥值
      ja_JP: アプリ登録のクライアントシークレットの値
      pt_BR: Valor do segredo do cliente do registro de aplicativo
    help:
      en_US: "Copy the secret's Value (not its Secret ID). Service Principal needs the Graph application permission Files.ReadWrite.All (plus Sites.Read.All for search) with admin consent. Each user signs in needs the delegated permissions User.Read, Files.Read.All, Files.ReadWrite.All, offline_access."
      zh_Hans: "复制密钥的“值”（不是“机密 ID”）。Service Principal 需要已获管理员同意的 Graph 应用程序权限 Files.ReadWrite.All（搜索还需要 Sites.Read.All）；“每个用户自己登录”需要委托权限 User.Read、Files.Read.All、Files.ReadWrite.All、offline_access。"
      ja_JP: "シークレットの「値」をコピーしてください（シークレット ID ではありません）。サービス プリンシパルには管理者の同意を付与した Graph のアプリケーションのアクセス許可 Files.ReadWrite.All（検索には Sites.Read.All も）、ユーザーごとのサインインには委任されたアクセス許可 User.Read、Files.Read.All、Files.ReadWrite.All、offline_access が必要です。"
      pt_BR: "Copie o Valor do segredo (não o ID do segredo). O Service Principal precisa da permissão de aplicativo do Graph Files.ReadWrite.All (e Sites.Read.All para a pesquisa) com consentimento do administrador; o modo em que cada usuário faz login precisa das permissões delegadas User.Read, Files.Read.All, Files.ReadWrite.All, offline_access."
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  drive_user:
    type: text-input
    required: false
    label:
      en_US: Default Drive Owner
      zh_Hans: 默认网盘所有者
      ja_JP: 既定のドライブ所有者
      pt_BR: Proprietário Padrão da Unidade
    placeholder:
      en_US: e.g. alice@contoso.com
      zh_Hans: 例如 alice@contoso.com
      ja_JP: 例 alice@contoso.com
      pt_BR: ex. alice@contoso.com
    help:
      en_US: "Service Principal: the user (user principal name or user ID) whose OneDrive the tools act on; a tool's Drive Owner parameter overrides it. Not used when each user signs in."
      zh_Hans: "Service Principal：工具要操作其 OneDrive 的用户（用户主体名称或用户 ID），工具的“网盘所有者”参数会覆盖此值。每个用户自己登录时不使用。"
      ja_JP: "サービス プリンシパル: ツールが操作する OneDrive の所有ユーザー（ユーザー プリンシパル名またはユーザー ID）。ツールの「ドライブ所有者」パラメーターが優先されます。ユーザーごとのサインインでは使いません。"
      pt_BR: "Service Principal: o usuário (nome principal ou ID) cujo OneDrive as ferramentas usam; o parâmetro Proprietário da Unidade da ferramenta tem prioridade. Não é usado quando cada usuário faz login."
  redirect_uri:
    type: text-input
    required: false
    label:
      en_US: Sign-in Callback URL
      zh_Hans: 登录回调 URL
      ja_JP: サインイン コールバック URL
      pt_BR: URL de Retorno do Login
    placeholder:
      en_US: Only for "Each user signs in", e.g. https://dify.example.com/e/xxxx/onedrive/callback
      zh_Hans: 仅用于“每个用户自己登录”，例如 https://dify.example.com/e/xxxx/onedrive/callback
      ja_JP: "ユーザーごとのサインインのみ。例: https://dify.example.com/e/xxxx/onedrive/callback"
      pt_BR: Somente para "Cada usuário faz login", ex. https://dify.example.com/e/xxxx/onedrive/callback
    help:
      en_US: "Create this plugin's endpoint (plugin details > Endpoints), paste its /onedrive/callback URL here, and add the same URL to the app registration's Web redirect URIs."
      zh_Hans: "先创建本插件的端点（插件详情 > 端点），把它的 /onedrive/callback URL 粘贴到这里，并把同一个 URL 加到应用注册的 Web 重定向 URI 中。"
      ja_JP: "このプラグインのエンドポイントを作成し（プラグインの詳細 > エンドポイント）、その /onedrive/callback の URL をここに貼り付け、同じ URL をアプリ登録の Web リダイレクト URI に追加してください。"
      pt_BR: "Crie o endpoint deste plugin (detalhes do plugin > Endpoints), cole aqui a URL /onedrive/callback e adicione a mesma URL aos URIs de redirecionamento Web do registro de aplicativo."
  cloud:
    type: select
    required: false
    default: global
    label: &id001
      en_US: Microsoft Cloud
      zh_Hans: Microsoft 云
      ja_JP: Microsoft クラウド
      pt_BR: Nuvem da Microsoft
    options: &id002
    - value: global
      label:
        en_US: Global (graph.microsoft.com)
        zh_Hans: 全球 (graph.microsoft.com)
        ja_JP: グローバル (graph.microsoft.com)
        pt_BR: Global (graph.microsoft.com)
    - value: usgov
      label:
        en_US: US Government (graph.microsoft.us)
        zh_Hans: 美国政府 (graph.microsoft.us)
        ja_JP: 米国政府 (graph.microsoft.us)
        pt_BR: Governo dos EUA (graph.microsoft.us)
    - value: dod
      label:
        en_US: US Government DoD (dod-graph.microsoft.us)
        zh_Hans: 美国政府 DoD (dod-graph.microsoft.us)
        ja_JP: 米国政府 DoD (dod-graph.microsoft.us)
        pt_BR: Governo dos EUA DoD (dod-graph.microsoft.us)
    - value: china
      label:
        en_US: China, operated by 21Vianet (microsoftgraph.chinacloudapi.cn)
        zh_Hans: 中国，世纪互联运营 (microsoftgraph.chinacloudapi.cn)
        ja_JP: 中国、21Vianet 運営 (microsoftgraph.chinacloudapi.cn)
        pt_BR: China, operado pela 21Vianet (microsoftgraph.chinacloudapi.cn)
oauth_schema:
  client_schema:
  - name: client_id
    type: secret-input
    required: true
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/CreateApplicationBlade/quickStartType~/null/isMSAApp~/false
    placeholder:
      en_US: Please input your Client ID
      zh_Hans: 请输入你的 Client ID
      ja_JP: クライアント ID を入力してください
      pt_BR: Insira seu Client ID
    help:
      en_US: Client ID is used to authenticate requests to the Microsoft API.
      zh_Hans: Client ID 用于认证请求到 Microsoft API。
      ja_JP: クライアント ID は Microsoft API へのリクエストの認証に使用されます。
      pt_BR: O Client ID é usado para autenticar solicitações à API da Microsoft.
    label:
      en_US: Client ID
      zh_Hans: Client ID
      ja_JP: クライアント ID
      pt_BR: Client ID
  - name: client_secret
    type: secret-input
    required: true
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/CreateApplicationBlade/quickStartType~/null/isMSAApp~/false
    placeholder:
      en_US: Please input your Client Secret
      zh_Hans: 请输入你的 Client Secret
      ja_JP: クライアントシークレットを入力してください
      pt_BR: Insira seu Client Secret
    help:
      en_US: Client Secret is used to authenticate requests to the Microsoft API.
      zh_Hans: Client Secret 用于认证请求到 Microsoft API。
      ja_JP: クライアントシークレットは Microsoft API へのリクエストの認証に使用されます。
      pt_BR: O Client Secret é usado para autenticar solicitações à API da Microsoft.
    label:
      en_US: Client Secret
      zh_Hans: Client Secret
      ja_JP: クライアントシークレット
      pt_BR: Client Secret
  - name: tenant_id
    type: text-input
    required: false
    default: common
    label:
      en_US: Tenant ID
      zh_Hans: 租户 ID
      ja_JP: テナント ID
      pt_BR: ID do Locatário
    placeholder:
      en_US: Leave as common for multi-tenant / personal accounts
      zh_Hans: 多租户或个人账户请保留 common
      ja_JP: マルチテナント / 個人アカウントの場合は common のまま
      pt_BR: Deixe common para multilocatário / contas pessoais
    help:
      en_US: Your directory (tenant) ID or domain. Required when the app registration is single-tenant ('common' only works for multi-tenant apps).
      zh_Hans: 您的目录（租户）ID 或域名。应用注册为单租户时必须填写（'common' 仅适用于多租户应用）。
      ja_JP: ディレクトリ（テナント）ID またはドメイン。アプリ登録がシングルテナントの場合は必須です（'common' はマルチテナント アプリでのみ使えます）。
      pt_BR: O ID ou domínio do seu diretório (locatário). Obrigatório quando o registro do aplicativo é de locatário único ('common' só funciona para aplicativos multilocatário).
    url: https://portal.azure.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Overview
  - name: cloud
    type: select
    required: false
    default: global
    label: *id001
    help:
      en_US: Choose a national cloud only if your Microsoft 365 tenant lives there; it changes the sign-in and Graph endpoints.
      zh_Hans: 仅当您的 Microsoft 365 租户位于国家云时才选择；会同时更改登录和 Graph 端点。
      ja_JP: Microsoft 365 テナントが各国のクラウドにある場合のみ選択してください。サインインと Graph のエンドポイントが変わります。
      pt_BR: Escolha uma nuvem nacional somente se o seu locatário do Microsoft 365 estiver nela; isso altera os endpoints de login e do Graph.
    options: *id002
  credentials_schema:
  - name: access_token
    type: secret-input
    label:
      en_US: Access Token
      zh_Hans: 访问令牌
      ja_JP: アクセストークン
      pt_BR: Token de Acesso
  - name: refresh_token
    type: secret-input
    label:
      en_US: Refresh Token
      zh_Hans: 刷新令牌
      ja_JP: リフレッシュトークン
      pt_BR: Token de Atualização
  - name: expires_at
    type: secret-input
    label:
      en_US: Expires At
      zh_Hans: 过期时间
      ja_JP: 有効期限
      pt_BR: Expira Em
tools:
- tools/get_file_by_id.yaml
- tools/delete_file_by_id.yaml
- tools/search_file.yaml
- tools/upload_file.yaml
- tools/onedrive_list_folder.yaml
- tools/onedrive_create_folder.yaml
- tools/onedrive_rename.yaml
- tools/onedrive_copy.yaml
- tools/onedrive_share.yaml
- tools/onedrive_sign_out.yaml
extra:
  python:
    source: provider/onedrive.py
