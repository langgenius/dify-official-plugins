identity:
  name: search_file
  author: langgenius
  label:
    en_US: Search File or Folder by Name
    zh_Hans: 根据名称搜索文件或文件夹
    pt_BR: Pesquisar arquivo por nome
description:
  human:
    en_US: Search for files or folders by name
    zh_Hans: 根据名称搜索文件或文件夹
    pt_BR: Pesquisar arquivos ou pastas por nome
  llm: Search for files or folders by name
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: File or Folder Name
      zh_Hans: 文件或文件夹名称
      pt_BR: Nome do arquivo ou pasta
    human_description:
      en_US: The name of the file or folder to search
      zh_Hans: 要搜索的文件或文件夹名称
      pt_BR: O nome do arquivo ou pasta a ser pesquisado
    llm_description: The name of the file or folder to search
    form: llm
  - name: limit
    type: number
    required: false
    label:
      en_US: Count Limit
      zh_Hans: 文件数量限制
      pt_BR: Limite de contagem
    human_description:
      en_US: The maximum number of files to return, default is 10
      zh_Hans: 要返回的最大文件数，默认为10
      pt_BR: O número máximo de arquivos a serem retornados, padrão é 10
    llm_description: The maximum number of files to return, default is 10
    form: llm
  - name: drive_user
    type: string
    required: false
    label:
      en_US: Drive Owner
      zh_Hans: 网盘所有者
      ja_JP: ドライブ所有者
      pt_BR: Proprietário da Unidade
    human_description:
      en_US: 'Service Principal only: the user (user principal name or user ID) whose OneDrive to use. Leave empty for the credential''s default.'
      zh_Hans: 仅限 Service Principal：要使用其 OneDrive 的用户（用户主体名称或用户 ID）。留空则使用凭据中的默认值。
      ja_JP: 'サービス プリンシパルのみ: OneDrive を使うユーザー（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定値を使います。'
      pt_BR: 'Somente Service Principal: o usuário (nome principal ou ID) cujo OneDrive usar. Deixe vazio para usar o padrão da credencial.'
    form: form
output_schema:
  type: object
  properties:
    items:
      type: array
      description: Matching files and folders
      items:
        type: object
        properties:
          id:
            type: string
            description: Drive item ID
          name:
            type: string
            description: File or folder name
          is_folder:
            type: boolean
            description: True for a folder
          mime_type:
            type: string
            description: MIME type of a file, empty for folders
          size:
            type: integer
            description: Size in bytes
          web_url:
            type: string
            description: Link to open the item in OneDrive
          download_url:
            type: string
            description: Short-lived pre-authenticated download link (files only)
          path:
            type: string
            description: Path of the parent folder
          last_modified:
            type: string
            description: Last modified time (ISO 8601)
    count:
      type: integer
      description: Number of items returned
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/search_file.yaml
