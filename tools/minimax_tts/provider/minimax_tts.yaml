identity:
  author: devin
  name: minimax_tts
  label:
    en_US: Minimax TTS Tool
    zh_Hans: Minimax TTS 工具
  description:
    en_US: TTS tools provided by Minimax.
    zh_Hans: Minimax 提供的 TTS 工具。
  icon: minimax_tts.png
  tags:
    - utilities
    - productivity
credentials_for_provider:
  group_id:
    type: text-input
    required: true
    label:
      en_US: Minimax group_id
      zh_Hans: Minimax group_id
    placeholder:
      en_US: Please input your Minimax group_id
      zh_Hans: 请输入你的 Minimax group_id
    help:
      en_US: Get your group_id from Minimax
      zh_Hans: 获取您的 Minimax group_id
    url: https://api.minimax.chat/user-center/basic-information/interface-key
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Minimax api key
      zh_Hans: Minimax api key
    placeholder:
      en_US: Please input your Minimax api key
      zh_Hans: 请输入你的 Minimax api key
    help:
      en_US: Get your api key from Minimax
      zh_Hans: 获取您的 Minimax api key
    url: https://api.minimax.chat/user-center/basic-information/interface-key
  api_endpoint:
    type: select
    required: false
    default: legacy
    label:
      en_US: API Endpoint
      zh_Hans: API 端点
    help:
      en_US: MiniMax runs separate account systems; pick the platform your key was created on.
      zh_Hans: MiniMax 国内与国际平台账号体系相互独立，请选择创建密钥的平台。
    options:
      - value: legacy
        label:
          en_US: api.minimax.chat (legacy, current default)
          zh_Hans: api.minimax.chat（旧域名，当前默认）
      - value: china
        label:
          en_US: api.minimaxi.com (China)
          zh_Hans: api.minimaxi.com（中国大陆）
      - value: international
        label:
          en_US: api.minimax.io (International)
          zh_Hans: api.minimax.io（国际站）
tools:
  - tools/tts.yaml
extra:
  python:
    source: provider/minimax_tts.py 