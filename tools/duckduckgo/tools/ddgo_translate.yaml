identity:
  name: ddgo_translate
  author: hjlarry
  label:
    en_US: DuckDuckGo Translate (deprecated)
    zh_Hans: DuckDuckGo 翻译（已弃用）
description:
  human:
    en_US: Deprecated and non-functional. DuckDuckGo no longer exposes a translation endpoint; use a dedicated translation tool or an LLM node instead.
    zh_Hans: 已弃用且无法使用。DuckDuckGo 不再提供翻译接口，请改用专门的翻译工具或 LLM 节点。
  llm: Deprecated and non-functional. Do not call this tool; use an LLM node instead.
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Translate Content
      zh_Hans: 翻译内容
    human_description:
      en_US: The translate content.
      zh_Hans: 要翻译的内容。
    llm_description: Key words for translate
    form: llm
  - name: translate_to
    type: select
    required: true
    options:
      - value: en
        label:
          en_US: English
          zh_Hans: 英语
      - value: zh-Hans
        label:
          en_US: Simplified Chinese
          zh_Hans: 简体中文
      - value: zh-Hant
        label:
          en_US: Traditional Chinese
          zh_Hans: 繁体中文
      - value: ja
        label:
          en_US: Japanese
          zh_Hans: 日语
    default: en
    label:
      en_US: Choose Language
      zh_Hans: 选择语言
    human_description:
      en_US: select the language to translate.
      zh_Hans: 选择要翻译的语言
    form: form
  - name: proxy_server
    type: string
    required: false
    placeholder:
      en_US: "http://user:pass@example.com:3128"
      zh_Hans: "http://user:pass@example.com:3128"
    label:
      en_US: Proxy server
      zh_Hans: 代理服务器
    human_description:
      en_US: "Supports http/https/socks proxies. Example: http://user:pass@example.com:3128."
      zh_Hans: "支持 http/https/socks 代理。示例：http://user:pass@example.com:3128。"
    form: form
extra:
  python:
    source: tools/ddgo_translate.py