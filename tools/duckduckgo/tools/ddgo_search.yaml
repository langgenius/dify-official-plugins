identity:
  name: ddgo_search
  author: yash_parmar
  label:
    en_US: DuckDuckGo Search
    zh_Hans: DuckDuckGo 搜索
description:
  human:
    en_US: Perform searches on DuckDuckGo and get results.
    zh_Hans: 在 DuckDuckGo 上进行搜索并获取结果。
  llm: Perform searches on DuckDuckGo and get results.
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Query string
      zh_Hans: 查询语句
    human_description:
      en_US: The search query.
      zh_Hans: 搜索查询语句。
    llm_description: Key words for searching
    form: llm
  - name: max_results
    type: number
    required: true
    default: 5
    label:
      en_US: Max results
      zh_Hans: 最大结果数量
    human_description:
      en_US: The maximum number of results to return.
      zh_Hans: 最大结果数量
    form: form
  - name: require_summary
    type: boolean
    default: false
    label:
      en_US: Require Summary
      zh_Hans: 是否总结
    human_description:
      en_US: Whether to pass the search results to llm for summarization.
      zh_Hans: 是否需要将搜索结果传给大模型总结
    form: form
  - name: proxy_server
    type: string
    required: false
    placeholder:
      en_US: "http://user:pass@example.com:3128"
      zh_Hans: "http://user:pass@example.com:3128"
    label:
      en_US: Proxy server
      zh_Hans: 代理服务器
    human_description:
      en_US: "Supports http/https/socks proxies. Example: http://user:pass@example.com:3128."
      zh_Hans: "支持 http/https/socks 代理。示例：http://user:pass@example.com:3128。"
    form: form
  - name: backend
    type: string
    required: false
    placeholder:
      en_US: "google,yahoo,brave"
      zh_Hans: "google,yahoo,brave"
    label:
      en_US: Search engines
      zh_Hans: 搜索引擎
    human_description:
      en_US: "Comma-separated engines to query. Available: google, yahoo, brave. Leave empty to ask all of them. The last JSON row and the search_status / engine_status outputs report what each engine did."
      zh_Hans: "逗号分隔的搜索引擎列表。可选：google, yahoo, brave。留空则全部查询。最后一行 JSON 以及 search_status / engine_status 输出会说明每个引擎的结果。"
    form: form
output_schema:
  type: object
  properties:
    search_status:
      type: string
      description: "Outcome of the search: successful, no_result or blocked (every primary engine refused or timed out)."
    engine_status:
      type: object
      description: "Per engine: successful, no_result, blocked or not_applied."
extra:
  python:
    source: tools/ddgo_search.py
