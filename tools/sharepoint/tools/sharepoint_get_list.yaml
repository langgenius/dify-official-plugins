identity:
  name: sharepoint_get_list
  author: langgenius
  label:
    en_US: Get List
    zh_Hans: 获取列表
    ja_JP: リストを取得
description:
  human:
    en_US: A list and its columns
    zh_Hans: 列表及其列
    ja_JP: リストとその列
  llm: Get a list and its columns (internal names, types, whether required) so items can be written with the right column
    names.
parameters:
- name: site
  type: string
  required: true
  form: llm
  label:
    en_US: Site
    zh_Hans: 站点
    ja_JP: サイト
  human_description:
    en_US: Site URL (https://contoso.sharepoint.com/sites/Team), site ID, or root
    zh_Hans: 站点 URL（https://contoso.sharepoint.com/sites/Team）、站点 ID 或 root
    ja_JP: サイトの URL（https://contoso.sharepoint.com/sites/Team）、サイト ID、または root
  llm_description: 'The SharePoint site: its URL (https://contoso.sharepoint.com/sites/Team), its ID from the search sites
    tool, or root.'
- name: list
  type: string
  required: true
  form: llm
  label:
    en_US: List
    zh_Hans: 列表
    ja_JP: リスト
  human_description:
    en_US: List name or ID
    zh_Hans: 列表名称或 ID
    ja_JP: リスト名または ID
  llm_description: The list's ID or name (from the list lists tool), e.g. Tasks or a GUID.
output_schema:
  type: object
  properties:
    list_id:
      type: string
      description: List ID
    name:
      type: string
      description: List name
    description:
      type: string
      description: Description
    template:
      type: string
      description: genericList, documentLibrary...
    web_url:
      type: string
      description: Link
    hidden:
      type: boolean
      description: True for a hidden system list
    columns:
      type: array
      description: Columns
      items:
        type: object
        properties:
          name:
            type: string
            description: Internal name, used in fields
          display_name:
            type: string
            description: Name shown in SharePoint
          type:
            type: string
            description: Column type
          required:
            type: boolean
            description: Required
          read_only:
            type: boolean
            description: Cannot be written
          choices:
            type: array
            description: Allowed values of a choice column
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/sharepoint_get_list.py
