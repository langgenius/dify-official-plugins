identity:
  name: sharepoint_list_items
  author: langgenius
  label:
    en_US: List Items
    zh_Hans: 列出条目
    ja_JP: アイテムを一覧表示
description:
  human:
    en_US: Items of a list, optionally filtered
    zh_Hans: 列表中的条目，可筛选
    ja_JP: リストのアイテム（絞り込み可）
  llm: Get the items of a list with their fields. filter is an OData expression on fields, e.g. fields/Status eq 'Done'.
parameters:
- name: site
  type: string
  required: true
  form: llm
  label:
    en_US: Site
    zh_Hans: 站点
    ja_JP: サイト
  human_description:
    en_US: Site URL (https://contoso.sharepoint.com/sites/Team), site ID, or root
    zh_Hans: 站点 URL（https://contoso.sharepoint.com/sites/Team）、站点 ID 或 root
    ja_JP: サイトの URL（https://contoso.sharepoint.com/sites/Team）、サイト ID、または root
  llm_description: 'The SharePoint site: its URL (https://contoso.sharepoint.com/sites/Team), its ID from the search sites
    tool, or root.'
- name: list
  type: string
  required: true
  form: llm
  label:
    en_US: List
    zh_Hans: 列表
    ja_JP: リスト
  human_description:
    en_US: List name or ID
    zh_Hans: 列表名称或 ID
    ja_JP: リスト名または ID
  llm_description: The list's ID or name (from the list lists tool), e.g. Tasks or a GUID.
- name: filter
  type: string
  required: false
  form: llm
  label:
    en_US: Filter
    zh_Hans: 筛选
    ja_JP: フィルター
  human_description:
    en_US: OData filter, e.g. fields/Status eq 'Done'
    zh_Hans: OData 筛选，例如 fields/Status eq 'Done'
    ja_JP: 'OData フィルター（例: fields/Status eq ''Done''）'
  llm_description: Optional OData $filter on item fields, e.g. fields/Status eq 'Done' or fields/Amount gt 100.
- name: limit
  type: number
  required: false
  form: llm
  label:
    en_US: Limit
    zh_Hans: 数量上限
    ja_JP: 上限
  human_description:
    en_US: Maximum items (default 100)
    zh_Hans: 最多返回条数（默认 100）
    ja_JP: 最大件数（既定 100）
  llm_description: Maximum number of items to return, default 100, up to 5000.
  default: 100
  min: 1
  max: 5000
output_schema:
  type: object
  properties:
    items:
      type: array
      description: Items
      items:
        type: object
        properties:
          item_id:
            type: string
            description: Item ID
          fields:
            type: object
            description: Column values by column name
          web_url:
            type: string
            description: Link
          created:
            type: string
            description: Created
          modified:
            type: string
            description: Last modified
    count:
      type: integer
      description: Number of items
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/sharepoint_list_items.py
