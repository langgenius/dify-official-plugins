identity:
  name: sharepoint_get_item
  author: langgenius
  label:
    en_US: Get Item
    zh_Hans: 获取条目
    ja_JP: アイテムを取得
description:
  human:
    en_US: One list item with its fields
    zh_Hans: 一个列表条目及其字段
    ja_JP: リスト アイテム 1 件とそのフィールド
  llm: Get one list item with its fields.
parameters:
- name: site
  type: string
  required: true
  form: llm
  label:
    en_US: Site
    zh_Hans: 站点
    ja_JP: サイト
  human_description:
    en_US: Site URL (https://contoso.sharepoint.com/sites/Team), site ID, or root
    zh_Hans: 站点 URL（https://contoso.sharepoint.com/sites/Team）、站点 ID 或 root
    ja_JP: サイトの URL（https://contoso.sharepoint.com/sites/Team）、サイト ID、または root
  llm_description: 'The SharePoint site: its URL (https://contoso.sharepoint.com/sites/Team), its ID from the search sites
    tool, or root.'
- name: list
  type: string
  required: true
  form: llm
  label:
    en_US: List
    zh_Hans: 列表
    ja_JP: リスト
  human_description:
    en_US: List name or ID
    zh_Hans: 列表名称或 ID
    ja_JP: リスト名または ID
  llm_description: The list's ID or name (from the list lists tool), e.g. Tasks or a GUID.
- name: item_id
  type: string
  required: true
  form: llm
  label:
    en_US: Item ID
    zh_Hans: 条目 ID
    ja_JP: アイテム ID
  human_description:
    en_US: The list item's ID
    zh_Hans: 列表条目的 ID
    ja_JP: リスト アイテムの ID
  llm_description: The item's ID (from the list items tool).
output_schema:
  type: object
  properties:
    item_id:
      type: string
      description: Item ID
    fields:
      type: object
      description: Column values by column name
    web_url:
      type: string
      description: Link
    created:
      type: string
      description: Created
    modified:
      type: string
      description: Last modified
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/sharepoint_get_item.py
