[project]
name = "sharepoint"
version = "1.0.0"
description = "Microsoft SharePoint tools for Dify (lists, items and document library files via Microsoft Graph)"
readme = "README.md"
requires-python = ">=3.12"

# Managed with uv; refresh the lockfile with `uv lock`.
