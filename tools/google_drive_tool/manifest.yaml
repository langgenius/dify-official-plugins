version: 1.0.0
type: plugin
author: langgenius
name: google_drive_tool
label:
  en_US: Google Drive
  zh_Hans: Google Drive
  ja_JP: Google Drive
description:
  en_US: Search, read, upload, organize and share files in Google Drive and shared drives
  zh_Hans: 在 Google 云端硬盘和共享云端硬盘中搜索、读取、上传、整理和共享文件
  ja_JP: Google ドライブと共有ドライブのファイルを検索・読み取り・アップロード・整理・共有します
icon: icon.svg
icon_dark: icon-dark.svg
tags:
- productivity
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    endpoint:
      enabled: true
    storage:
      enabled: true
      size: 10485760
plugins:
  tools:
  - provider/google_drive_tool.yaml
  endpoints:
  - group/google_drive_signin.yaml
meta:
  version: 0.0.1
  arch:
  - amd64
  - arm64
  runner:
    language: python
    version: '3.12'
    entrypoint: main
  minimum_dify_version: 1.7.0
created_at: '2026-11-02T12:00:00Z'
privacy: PRIVACY.md
verified: false
