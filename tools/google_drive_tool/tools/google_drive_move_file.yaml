identity:
  name: google_drive_move_file
  author: langgenius
  label:
    en_US: Move File
    zh_Hans: 移动文件
    ja_JP: ファイルを移動
description:
  human:
    en_US: Move a file or folder
    zh_Hans: 移动文件或文件夹
    ja_JP: ファイルやフォルダーを移動
  llm: Move a Google Drive file or folder into another folder.
parameters:
- name: file_id
  type: string
  required: true
  label:
    en_US: File ID
    zh_Hans: 文件 ID
    ja_JP: ファイル ID
  human_description:
    en_US: From search or list folder
    zh_Hans: 可从搜索或列出文件夹获取
    ja_JP: 検索・フォルダー一覧から
  llm_description: The file or folder ID, from google_drive_search or google_drive_list_folder (or the /d/<id>/ part of its
    link).
  form: llm
- name: folder_id
  type: string
  required: true
  label:
    en_US: To Folder
    zh_Hans: 目标文件夹
    ja_JP: 移動先フォルダー
  human_description:
    en_US: Destination folder ID
    zh_Hans: 目标文件夹 ID
    ja_JP: 移動先のフォルダー ID
  llm_description: The destination folder ID ('root' for My Drive).
  form: llm
output_schema:
  type: object
  properties:
    file_id:
      type: string
    parents:
      type: array
      items:
        type: string
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/google_drive_move_file.py
