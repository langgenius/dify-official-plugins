identity:
  name: remove_reaction
  author: langgenius
  label:
    en_US: "Remove Reaction"
    zh_Hans: "移除表情回应"
description:
  human:
    en_US: "Remove an emoji reaction from a message."
    zh_Hans: "从一条消息移除表情回应。"
  llm: "Remove an emoji reaction from a Slack message using reactions.remove."
parameters:
  - name: channel
    type: string
    required: true
    label:
      en_US: "Channel"
      zh_Hans: "频道"
    human_description:
      en_US: "Channel ID of the message."
      zh_Hans: "消息所在的频道 ID。"
    llm_description: "The channel ID where the message lives."
    form: llm
  - name: timestamp
    type: string
    required: true
    label:
      en_US: "Message Timestamp"
      zh_Hans: "消息时间戳"
    human_description:
      en_US: "ts of the message."
      zh_Hans: "该消息的 ts。"
    llm_description: "The ts of the message."
    form: llm
  - name: name
    type: string
    required: true
    label:
      en_US: "Emoji Name"
      zh_Hans: "表情名称"
    human_description:
      en_US: "Emoji name without colons."
      zh_Hans: "不带冒号的表情名称。"
    llm_description: "The emoji name without colons, e.g. 'thumbsup'."
    form: llm
extra:
  python:
    source: tools/remove_reaction.py
