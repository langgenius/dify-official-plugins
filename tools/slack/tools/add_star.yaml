identity:
  name: add_star
  author: langgenius
  label:
    en_US: "Add Star"
    zh_Hans: "添加星标"
description:
  human:
    en_US: "Star a message or file (requires a User Token)."
    zh_Hans: "为消息或文件添加星标（需要用户令牌）。"
  llm: "Add a star to a Slack message or file using stars.add. Provide either channel+timestamp (for a message) or a file ID. Requires a User Token with stars:write."
parameters:
  - name: channel
    type: string
    required: false
    label:
      en_US: "Channel"
      zh_Hans: "频道"
    human_description:
      en_US: "Channel ID (with timestamp) to star a message."
      zh_Hans: "频道 ID（配合时间戳）以为消息加星标。"
    llm_description: "The channel ID of the message to star. Use with 'timestamp'."
    form: llm
  - name: timestamp
    type: string
    required: false
    label:
      en_US: "Message Timestamp"
      zh_Hans: "消息时间戳"
    human_description:
      en_US: "ts of the message to star."
      zh_Hans: "要加星标的消息的 ts。"
    llm_description: "The ts of the message to star. Use with 'channel'."
    form: llm
  - name: file
    type: string
    required: false
    label:
      en_US: "File ID"
      zh_Hans: "文件 ID"
    human_description:
      en_US: "File ID to star (instead of a message)."
      zh_Hans: "要加星标的文件 ID（替代消息）。"
    llm_description: "A file ID to star instead of a message."
    form: llm
extra:
  python:
    source: tools/add_star.py
