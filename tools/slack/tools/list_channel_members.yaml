identity:
  name: list_channel_members
  author: langgenius
  label:
    en_US: "List Channel Members"
    zh_Hans: "列出频道成员"
description:
  human:
    en_US: "List the members of a channel."
    zh_Hans: "列出某个频道的成员。"
  llm: "List the user IDs that are members of a Slack channel using conversations.members."
parameters:
  - name: channel
    type: string
    required: true
    label:
      en_US: "Channel"
      zh_Hans: "频道"
    human_description:
      en_US: "Channel ID."
      zh_Hans: "频道 ID。"
    llm_description: "The channel ID whose members to list."
    form: llm
  - name: limit
    type: number
    required: false
    default: 100
    label:
      en_US: "Limit"
      zh_Hans: "数量限制"
    human_description:
      en_US: "Max members to return (max 1000)."
      zh_Hans: "返回的最大成员数（最多 1000）。"
    llm_description: "Maximum number of members per page. Max 1000, default 100."
    form: llm
  - name: cursor
    type: string
    required: false
    label:
      en_US: "Cursor"
      zh_Hans: "游标"
    human_description:
      en_US: "Pagination cursor from a previous response."
      zh_Hans: "上一次响应返回的分页游标。"
    llm_description: "Pagination cursor to fetch the next page."
    form: llm
extra:
  python:
    source: tools/list_channel_members.py
