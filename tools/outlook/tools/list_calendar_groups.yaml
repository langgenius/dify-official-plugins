identity:
  name: list_calendar_groups
  author: langgenius
  label:
    en_US: List Calendar Groups
    ko_KR: 캘린더 그룹 목록
    zh_Hans: 列出日历组
    pt_BR: Listar Grupos de Calendários
    ja_JP: カレンダー グループ一覧
    zh_Hant: 列出行事曆群組
description:
  human:
    en_US: List the calendar groups, e.g. My Calendars and People's calendars (calendars shared with you)
    ko_KR: '캘린더 그룹 목록을 가져옵니다. 예: 내 캘린더, 다른 사람의 캘린더(공유된 캘린더)'
    zh_Hans: 列出日历组，例如“我的日历”和“他人的日历”（共享给您的日历）
    pt_BR: Listar os grupos de calendários, ex. Meus Calendários e Calendários de Pessoas (compartilhados com você)
    ja_JP: 'カレンダー グループを一覧表示します。例: マイ カレンダー、他のユーザーの予定表（共有されたカレンダー）'
    zh_Hant: 列出行事曆群組，例如「我的行事曆」和「其他人的行事曆」（共用給您的行事曆）
  llm: List the Outlook calendar groups of the mailbox. Calendars other people shared with the user (for example executives' calendars) are usually in the group named People's calendars; pass its id as calendar_group_id to List Calendars, List Events, Search Events or Get Schedule.
parameters:
- name: mailbox
  type: string
  required: false
  label:
    en_US: Mailbox
    ko_KR: 사서함
    zh_Hans: 邮箱
    pt_BR: Caixa de Correio
    ja_JP: メールボックス
    zh_Hant: 信箱
  human_description:
    en_US: 'Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential''s default mailbox.'
    ko_KR: '서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다.'
    zh_Hans: 仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。
    pt_BR: 'Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial.'
    ja_JP: 'サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。'
    zh_Hant: 僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。
  form: form
extra:
  python:
    source: tools/list_calendar_groups.py
