identity:
  name: add_attachment_to_draft
  display_name: Add Attachment to Draft
  author: Dify
  label:
    en_US: Add Attachment to Draft
    ko_KR: 초안에 첨부 파일 추가
    zh_Hans: 向草稿添加附件
    pt_BR: Adicionar Anexo ao Rascunho
    ja_JP: 下書きに添付ファイルを追加
    zh_Hant: 向草稿添加附件
description:
  human:
    en_US: Add a file attachment to a draft email
    ko_KR: 초안 이메일에 파일 첨부 추가
    zh_Hans: 向草稿邮件添加文件附件
    pt_BR: Adicionar um anexo a um rascunho de e-mail
    ja_JP: 下書きメールにファイルを添付
    zh_Hant: 向草稿郵件添加檔案附件
  llm: Add a file attachment to an existing draft email in Outlook using Microsoft Graph API

parameters:
  - name: draft_id
    type: string
    required: true
    label:
      en_US: Draft ID
      ko_KR: 초안 ID
      zh_Hans: 草稿ID
      pt_BR: ID do Rascunho
      ja_JP: 下書きID
      zh_Hant: 草稿ID
    human_description:
      en_US: The unique identifier of the draft email
      ko_KR: 초안 이메일의 고유 식별자
      zh_Hans: 草稿邮件的唯一标识符
      pt_BR: O identificador único do rascunho de e-mail
      ja_JP: 下書きメールの一意の識別子
      zh_Hant: 草稿郵件的唯一識別符
    llm_description: The unique identifier of the draft email to add the attachment to, this ID can be obtained from the list_draft tool
    form: llm

  - name: file_to_attach
    type: files
    required: true
    label:
      en_US: Files to Attach
      ko_KR: 첨부할 파일
      zh_Hans: 要附加的文件
      pt_BR: Arquivos para Anexar
      ja_JP: 添付するファイル
      zh_Hant: 要附加的檔案
    human_description:
      en_US: The files to attach to the draft email
      ko_KR: 초안 이메일에 첨부할 파일
      zh_Hans: 要附加到草稿邮件的文件
      pt_BR: Os arquivos para anexar ao rascunho de e-mail
      ja_JP: 下書きメールに添付するファイル
      zh_Hant: 要附加到草稿郵件的檔案
    llm_description: The files to attach to the draft email, you can upload multiple files
    form: llm

  - name: attachment_name
    type: string
    required: false
    label:
      en_US: Attachment Name
      ko_KR: 첨부 파일 이름
      zh_Hans: 附件名称
      pt_BR: Nome do Anexo
      ja_JP: 添付ファイル名
      zh_Hant: 附件名稱
    human_description:
      en_US: Optional name for the attachment
      ko_KR: 첨부 파일의 선택적 이름
      zh_Hans: 可选的附件名称
      pt_BR: Nome opcional para o anexo
      ja_JP: 添付ファイルのオプション名
      zh_Hant: 可選的附件名稱
    llm_description: Optional name for the attachment, if not provided, a default name will be used
    form: llm
  - name: mailbox
    type: string
    required: false
    label:
      en_US: Mailbox
      ko_KR: 사서함
      zh_Hans: 邮箱
      pt_BR: Caixa de Correio
      ja_JP: メールボックス
      zh_Hant: 信箱
    human_description:
      en_US: "Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential's default mailbox."
      ko_KR: "서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다."
      zh_Hans: "仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。"
      pt_BR: "Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial."
      ja_JP: "サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。"
      zh_Hant: "僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。"
    form: form
output_schema:
  type: object
  properties:
    attachments:
      type: array
      description: Attachments added
      items:
        type: object
        properties:
          id:
            type: string
            description: Attachment ID
          name:
            type: string
            description: File name
          size:
            type: integer
            description: Size in bytes
    count:
      type: integer
      description: Number of items returned
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/add_attachment_to_draft.py