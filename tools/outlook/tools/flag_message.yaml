identity:
  name: flag_email
  display_name: Flag Email
  author: Dify
  label:
    en_US: Flag Email
    ko_KR: 이메일 플래그 지정
    zh_Hans: 标记邮件
    pt_BR: Marcar E-mail
    ja_JP: メールにフラグ
    zh_Hant: 標記郵件
description:
  human:
    en_US: Flag an email message for follow-up
    ko_KR: 후속 조치를 위해 이메일 메시지에 플래그 지정
    zh_Hans: 标记邮件以便跟进
    pt_BR: Marcar um e-mail para acompanhamento
    ja_JP: メールにフォローアップ用のフラグを設定
    zh_Hant: 標記郵件以便跟進
  llm: Flag an email message in Outlook using Microsoft Graph API, supports setting flag status and due date

parameters:
  - name: email_id
    type: string
    required: true
    label:
      en_US: Email ID
      ko_KR: 이메일 ID
      zh_Hans: 邮件ID
      pt_BR: ID do E-mail
      ja_JP: メールID
      zh_Hant: 郵件ID
    human_description:
      en_US: The unique identifier of the email to flag
      ko_KR: 플래그를 지정할 이메일의 고유 식별자
      zh_Hans: 要标记的邮件的唯一标识符
      pt_BR: O identificador único do e-mail para marcar
      ja_JP: フラグを付けるメールの一意の識別子
      zh_Hant: 要標記的郵件的唯一識別符
    llm_description: The unique identifier of the email to flag, this ID can be obtained from the list_messages tool
    form: llm
  - name: flag_status
    type: string
    required: false
    default: flagged
    label:
      en_US: Flag Status
      ko_KR: 플래그 상태
      zh_Hans: 标记状态
      pt_BR: Status da Marcação
      ja_JP: フラグ状態
      zh_Hant: 標記狀態
    human_description:
      en_US: The status of the flag
      ko_KR: 플래그의 상태
      zh_Hans: 标记的状态
      pt_BR: O status da marcação
      ja_JP: フラグの状態
      zh_Hant: 標記的狀態
    llm_description: The status of the flag, can be flagged or complete, default is flagged
    form: llm
  - name: due_date_days
    type: number
    required: false
    min: 0
    label:
      en_US: Due Date Days
      ko_KR: 기한 일수
      zh_Hans: 到期天数
      pt_BR: Dias para Vencimento
      ja_JP: 期限日数
      zh_Hant: 到期天數
    human_description:
      en_US: Number of days from now until the flag is due
      ko_KR: 지금부터 플래그 기한까지의 일수
      zh_Hans: 从现在到标记到期的天数
      pt_BR: Número de dias a partir de agora até o vencimento da marcação
      ja_JP: フラグの期限までの日数
      zh_Hant: 從現在到標記到期的天數
    llm_description: Number of days from now until the flag is due, optional, if not provided, no due date will be set
    form: llm
  - name: flag_message
    type: string
    required: false
    label:
      en_US: Flag Message
      ko_KR: 플래그 메시지
      zh_Hans: 标记消息
      pt_BR: Mensagem da Marcação
      ja_JP: フラグメッセージ
      zh_Hant: 標記訊息
    human_description:
      en_US: Optional message to include with the flag
      ko_KR: 플래그에 포함할 선택적 메시지
      zh_Hans: 可选的标记消息
      pt_BR: Mensagem opcional para incluir com a marcação
      ja_JP: フラグに含めるオプションのメッセージ
      zh_Hant: 可選的標記訊息
    llm_description: Optional message to include with the flag, can be used to provide context or instructions
    form: llm
  - name: mailbox
    type: string
    required: false
    label:
      en_US: Mailbox
      ko_KR: 사서함
      zh_Hans: 邮箱
      pt_BR: Caixa de Correio
      ja_JP: メールボックス
      zh_Hant: 信箱
    human_description:
      en_US: "Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential's default mailbox."
      ko_KR: "서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다."
      zh_Hans: "仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。"
      pt_BR: "Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial."
      ja_JP: "サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。"
      zh_Hant: "僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。"
    form: form
output_schema:
  type: object
  properties:
    message_id:
      type: string
      description: Message ID
    flag_status:
      type: string
      description: flagged, complete or notFlagged
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/flag_message.py