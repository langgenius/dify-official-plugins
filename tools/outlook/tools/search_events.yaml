identity:
  name: search_events
  display_name: Search Events
  author: Dify
  label:
    en_US: Search Events
    ko_KR: 이벤트 검색
    zh_Hans: 搜索事件
    pt_BR: Pesquisar Eventos
    ja_JP: イベントを検索
    zh_Hant: 搜尋事件
description:
  human:
    en_US: Search calendar events by keyword and/or date range
    ko_KR: 키워드 및/또는 날짜 범위로 캘린더 이벤트를 검색합니다
    zh_Hans: 按关键词和/或日期范围搜索日历事件
    pt_BR: Pesquisar eventos de calendário por palavra-chave e/ou intervalo de datas
    ja_JP: キーワードや日付範囲でカレンダーイベントを検索
    zh_Hant: 依關鍵字和/或日期範圍搜尋行事曆事件
  llm: Search the user's Outlook calendar events using Microsoft Graph. Provide a keyword (matches subject/body) and/or a date range (start_date/end_date). Giving both narrows a date range by keyword. The date-range path pages through all results.
parameters:
  - name: query
    type: string
    required: false
    label:
      en_US: Keyword
      ko_KR: 키워드
      zh_Hans: 关键词
      pt_BR: Palavra-chave
      ja_JP: キーワード
      zh_Hant: 關鍵字
    human_description:
      en_US: Keyword to match against event subject and body
      ko_KR: 이벤트 제목과 본문에 일치시킬 키워드
      zh_Hans: 用于匹配事件标题和正文的关键词
      pt_BR: Palavra-chave para corresponder ao assunto e corpo do evento
      ja_JP: イベントの件名・本文に一致させるキーワード
      zh_Hant: 用於比對事件標題與內文的關鍵字
    llm_description: Keyword to search event subject and body. Optional if a date range is given.
    form: llm
  - name: start_date
    type: string
    required: false
    label:
      en_US: Start Date
      ko_KR: 시작 날짜
      zh_Hans: 开始日期
      pt_BR: Data de Início
      ja_JP: 開始日
      zh_Hant: 開始日期
    human_description:
      en_US: Start of the date range (e.g. 2026-09-01 or 2026-09-01T09:00:00+09:00)
      ko_KR: 날짜 범위의 시작(예 2026-09-01 또는 2026-09-01T09:00:00+09:00)
      zh_Hans: 日期范围的开始（如 2026-09-01 或 2026-09-01T09:00:00+09:00）
      pt_BR: Início do intervalo de datas (ex. 2026-09-01 ou 2026-09-01T09:00:00+09:00)
      ja_JP: 日付範囲の開始（例 2026-09-01 または 2026-09-01T09:00:00+09:00）
      zh_Hant: 日期範圍的開始（如 2026-09-01 或 2026-09-01T09:00:00+09:00）
    llm_description: Optional start of the date range, ISO date or datetime (timezone offsets like +09:00 or -05:00 are preserved). If only start is given, the range extends one year forward.
    form: llm
  - name: end_date
    type: string
    required: false
    label:
      en_US: End Date
      ko_KR: 종료 날짜
      zh_Hans: 结束日期
      pt_BR: Data de Fim
      ja_JP: 終了日
      zh_Hant: 結束日期
    human_description:
      en_US: End of the date range (e.g. 2026-09-30 or 2026-09-30T18:00:00+09:00)
      ko_KR: 날짜 범위의 끝(예 2026-09-30 또는 2026-09-30T18:00:00+09:00)
      zh_Hans: 日期范围的结束（如 2026-09-30 或 2026-09-30T18:00:00+09:00）
      pt_BR: Fim do intervalo de datas (ex. 2026-09-30 ou 2026-09-30T18:00:00+09:00)
      ja_JP: 日付範囲の終了（例 2026-09-30 または 2026-09-30T18:00:00+09:00）
      zh_Hant: 日期範圍的結束（如 2026-09-30 或 2026-09-30T18:00:00+09:00）
    llm_description: Optional end of the date range, ISO date or datetime. If only end is given, the range starts from now. Must be after start_date.
    form: llm
  - name: limit
    type: number
    required: false
    default: 25
    min: 1
    max: 100
    label:
      en_US: Limit
      ko_KR: 제한
      zh_Hans: 数量
      pt_BR: Limite
      ja_JP: 件数
      zh_Hant: 數量
    human_description:
      en_US: Maximum number of events to return
      ko_KR: 반환할 최대 이벤트 수
      zh_Hans: 要返回的最大事件数
      pt_BR: Número máximo de eventos a retornar
      ja_JP: 返すイベントの最大数
      zh_Hant: 要返回的最大事件數
    llm_description: Maximum number of events to return, between 1 and 100, default is 25.
    form: llm
  - name: calendar_id
    type: string
    required: false
    label:
      en_US: Calendar ID
      ko_KR: 캘린더 ID
      zh_Hans: 日历 ID
      pt_BR: ID do Calendário
      ja_JP: カレンダー ID
      zh_Hant: 行事曆 ID
    human_description:
      en_US: The ID of the calendar to search; defaults to the primary calendar
      ko_KR: 검색할 캘린더의 ID이며, 기본값은 기본 캘린더입니다
      zh_Hans: 要搜索的日历 ID；默认为主日历
      pt_BR: O ID do calendário a pesquisar; o padrão é o calendário principal
      ja_JP: 検索するカレンダーの ID。デフォルトはプライマリカレンダー
      zh_Hant: 要搜尋的行事曆 ID；預設為主行事曆
    llm_description: The ID of the calendar to search. If omitted, the primary calendar is used.
    form: llm
extra:
  python:
    source: tools/search_events.py
