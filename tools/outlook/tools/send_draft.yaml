identity:
  name: send_draft
  display_name: Send Draft
  author: Dify
  label:
    en_US: Send Draft
    ko_KR: 초안 보내기
    zh_Hans: 发送草稿
    pt_BR: Enviar Rascunho
    ja_JP: 下書きを送信
    zh_Hant: 發送草稿
description:
  human:
    en_US: Send a draft email message through Outlook using Microsoft Graph API, requires a draft ID from the draft_message tool
    ko_KR: Microsoft Graph API를 사용하여 Outlook을 통해 초안 이메일을 보냅니다. draft_message 도구에서 얻은 초안 ID가 필요합니다
    zh_Hans: 通过Outlook使用Microsoft Graph API发送草稿电子邮件，需要从draft_message工具中获取草稿ID
    pt_BR: Envia uma mensagem de e-mail rascunho através do Outlook usando a API do Microsoft Graph, requer um ID de rascunho do tool draft_message
    ja_JP: Outlookを使用してMicrosoft Graph API経由で下書きメールを送信する。draft_messageツールから下書きIDが必要です。
    zh_Hant: 通過Outlook使用Microsoft Graph API發送草稿電子郵件，需要從draft_message工具中獲取草稿ID
  llm: Send a draft email message through Outlook using Microsoft Graph API, requires a draft ID from the draft_message tool

parameters:
  - name: draft_id
    type: string
    required: true
    label:
      en_US: Draft ID
      ko_KR: 초안 ID
      zh_Hans: 草稿ID
      pt_BR: ID do Rascunho
      ja_JP: 下書きID
      zh_Hant: 草稿ID
    human_description:
      en_US: The unique identifier of the draft message to send
      ko_KR: 보낼 초안 메시지의 고유 식별자
      zh_Hans: 要发送的草稿消息的唯一标识符
      pt_BR: O identificador único do rascunho para enviar
      ja_JP: 送信する下書きの一意の識別子
      zh_Hant: 要發送的草稿訊息的唯一識別符
    llm_description: The unique identifier of the draft message to send, this ID can be obtained from the draft_message tool
    form: llm
  - name: mailbox
    type: string
    required: false
    label:
      en_US: Mailbox
      ko_KR: 사서함
      zh_Hans: 邮箱
      pt_BR: Caixa de Correio
      ja_JP: メールボックス
      zh_Hant: 信箱
    human_description:
      en_US: "Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential's default mailbox."
      ko_KR: "서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다."
      zh_Hans: "仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。"
      pt_BR: "Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial."
      ja_JP: "サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。"
      zh_Hant: "僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。"
    form: form
output_schema:
  type: object
  properties:
    draft_id:
      type: string
      description: ID of the sent draft
    subject:
      type: string
      description: Subject
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/send_draft.py