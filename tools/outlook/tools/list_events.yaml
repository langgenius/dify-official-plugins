identity:
  name: list_events
  display_name: List Events
  author: Dify
  label:
    en_US: List Events
    zh_Hans: 列出事件
    pt_BR: Listar Eventos
    ja_JP: イベント一覧
    zh_Hant: 列出事件
description:
  human:
    en_US: List calendar events from your Outlook account
    zh_Hans: 列出您的 Outlook 账户中的日历事件
    pt_BR: Listar eventos de calendário da sua conta do Outlook
    ja_JP: Outlook アカウントのカレンダーイベントを一覧表示
    zh_Hant: 列出您的 Outlook 帳戶中的行事曆事件
  llm: List calendar events from the users Outlook account using Microsoft Graph API, ordered by start time
parameters:
  - name: top
    type: number
    required: false
    default: 25
    label:
      en_US: Top
      zh_Hans: 数量
      pt_BR: Quantidade
      ja_JP: 件数
      zh_Hant: 數量
    human_description:
      en_US: Maximum number of events to return
      zh_Hans: 要返回的最大事件数
      pt_BR: Número máximo de eventos a retornar
      ja_JP: 返すイベントの最大数
      zh_Hant: 要返回的最大事件數
    llm_description: Maximum number of events to return, default is 25
    form: llm
  - name: order
    type: select
    required: false
    default: desc
    options:
      - value: desc
        label:
          en_US: Descending (latest first)
          zh_Hans: 降序（最新在前）
          pt_BR: Decrescente (mais recentes primeiro)
          ja_JP: 降順（最新が先頭）
          zh_Hant: 降序（最新在前）
      - value: asc
        label:
          en_US: Ascending (oldest first)
          zh_Hans: 升序（最早在前）
          pt_BR: Crescente (mais antigos primeiro)
          ja_JP: 昇順（古い順）
          zh_Hant: 升序（最早在前）
    label:
      en_US: Sort Order
      zh_Hans: 排序
      pt_BR: Ordem de classificação
      ja_JP: 並び順
      zh_Hant: 排序
    human_description:
      en_US: Sort events by start time - descending (latest first) or ascending (oldest first)
      zh_Hans: 按开始时间排序 - 降序（最新在前）或升序（最早在前）
      pt_BR: Ordenar eventos por horário de início - decrescente (mais recentes primeiro) ou crescente (mais antigos primeiro)
      ja_JP: 開始時刻でイベントを並べ替え - 降順（最新が先頭）または昇順（古い順）
      zh_Hant: 按開始時間排序 - 降序（最新在前）或升序（最早在前）
    llm_description: Sort order by event start time. Use 'desc' for latest first (default) or 'asc' for oldest first.
    form: llm
  - name: calendar_id
    type: string
    required: false
    label:
      en_US: Calendar ID
      zh_Hans: 日历 ID
      pt_BR: ID do Calendário
      ja_JP: カレンダー ID
      zh_Hant: 行事曆 ID
    human_description:
      en_US: The ID of the calendar to list events from; defaults to the primary calendar
      zh_Hans: 要列出事件的日历 ID；默认为主日历
      pt_BR: O ID do calendário para listar eventos; o padrão é o calendário principal
      ja_JP: イベントを一覧表示するカレンダーの ID。デフォルトはプライマリカレンダー
      zh_Hant: 要列出事件的行事曆 ID；預設為主行事曆
    llm_description: The ID of the calendar to list events from. If omitted, events from the primary calendar are returned
    form: llm
extra:
  python:
    source: tools/list_events.py
