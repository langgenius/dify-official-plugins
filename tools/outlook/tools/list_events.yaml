identity:
  name: list_events
  display_name: List Events
  author: Dify
  label:
    en_US: List Events
    ko_KR: 이벤트 목록
    zh_Hans: 列出事件
    pt_BR: Listar Eventos
    ja_JP: イベント一覧
    zh_Hant: 列出事件
description:
  human:
    en_US: List calendar events from your Outlook account
    ko_KR: Outlook 계정의 캘린더 이벤트를 나열합니다
    zh_Hans: 列出您的 Outlook 账户中的日历事件
    pt_BR: Listar eventos de calendário da sua conta do Outlook
    ja_JP: Outlook アカウントのカレンダーイベントを一覧表示
    zh_Hant: 列出您的 Outlook 帳戶中的行事曆事件
  llm: List calendar events from the users Outlook account using Microsoft Graph API, ordered by start time
parameters:
  - name: limit
    type: number
    required: false
    default: 25
    min: 1
    max: 100
    label:
      en_US: Limit
      ko_KR: 제한
      zh_Hans: 限制
      pt_BR: Limite
      ja_JP: 制限
      zh_Hant: 限制
    human_description:
      en_US: Maximum number of events to return
      ko_KR: 반환할 최대 이벤트 수
      zh_Hans: 要返回的最大事件数
      pt_BR: Número máximo de eventos a retornar
      ja_JP: 返すイベントの最大数
      zh_Hant: 要返回的最大事件數
    llm_description: Maximum number of events to return, between 1 and 100, default is 25
    form: llm
  - name: calendar_id
    type: string
    required: false
    label:
      en_US: Calendar ID
      ko_KR: 캘린더 ID
      zh_Hans: 日历 ID
      pt_BR: ID do Calendário
      ja_JP: カレンダー ID
      zh_Hant: 行事曆 ID
    human_description:
      en_US: The ID of the calendar to list events from; defaults to the primary calendar
      ko_KR: 이벤트를 나열할 캘린더의 ID이며, 기본값은 기본 캘린더입니다
      zh_Hans: 要列出事件的日历 ID；默认为主日历
      pt_BR: O ID do calendário para listar eventos; o padrão é o calendário principal
      ja_JP: イベントを一覧表示するカレンダーの ID。デフォルトはプライマリカレンダー
      zh_Hant: 要列出事件的行事曆 ID；預設為主行事曆
    llm_description: The ID of the calendar to list events from. If omitted, events from the primary calendar are returned
    form: llm
  - name: calendar_group_id
    type: string
    required: false
    label:
      en_US: Calendar Group ID
      ko_KR: 캘린더 그룹 ID
      zh_Hans: 日历组 ID
      pt_BR: ID do Grupo de Calendários
      ja_JP: カレンダー グループ ID
      zh_Hant: 行事曆群組 ID
    human_description:
      en_US: 'Optional: search every calendar in this group and merge the results; ignored when Calendar ID is set'
      ko_KR: '선택: 이 그룹의 모든 캘린더를 검색해 결과를 합칩니다. 캘린더 ID를 지정하면 무시됩니다'
      zh_Hans: 可选：在此日历组的所有日历中查找并合并结果；填写了日历 ID 时忽略
      pt_BR: 'Opcional: pesquisa todos os calendários deste grupo e junta os resultados; ignorado quando o ID do Calendário é informado'
      ja_JP: '任意: このグループのすべてのカレンダーを検索して結果をまとめます。カレンダー ID を指定した場合は無視されます'
      zh_Hant: 選填：在此行事曆群組的所有行事曆中查找並合併結果；填寫了行事曆 ID 時忽略
    llm_description: Optional ID of a calendar group from List Calendar Groups. Every calendar in the group is queried and the events are merged, each tagged with its calendar and owner. Ignored when calendar_id is given.
    form: llm
  - name: mailbox
    type: string
    required: false
    label:
      en_US: Mailbox
      ko_KR: 사서함
      zh_Hans: 邮箱
      pt_BR: Caixa de Correio
      ja_JP: メールボックス
      zh_Hant: 信箱
    human_description:
      en_US: "Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential's default mailbox."
      ko_KR: "서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다."
      zh_Hans: "仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。"
      pt_BR: "Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial."
      ja_JP: "サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。"
      zh_Hant: "僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。"
    form: form
extra:
  python:
    source: tools/list_events.py
