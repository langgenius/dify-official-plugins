identity:
  name: get_event
  display_name: Get Event
  author: Dify
  label:
    en_US: Get Event
    ko_KR: 이벤트 가져오기
    zh_Hans: 获取事件
    pt_BR: Obter Evento
    ja_JP: イベント取得
    zh_Hant: 取得事件
description:
  human:
    en_US: Get the details of a calendar event from your Outlook account
    ko_KR: Outlook 계정에서 캘린더 이벤트의 세부 정보를 가져옵니다
    zh_Hans: 获取您的 Outlook 账户中日历事件的详细信息
    pt_BR: Obter os detalhes de um evento de calendário da sua conta do Outlook
    ja_JP: Outlook アカウントのカレンダーイベントの詳細を取得
    zh_Hant: 取得您的 Outlook 帳戶中行事曆事件的詳細資訊
  llm: Get the details of a single calendar event from the users Outlook account using Microsoft Graph API
parameters:
  - name: event_id
    type: string
    required: true
    label:
      en_US: Event ID
      ko_KR: 이벤트 ID
      zh_Hans: 事件 ID
      pt_BR: ID do Evento
      ja_JP: イベント ID
      zh_Hant: 事件 ID
    human_description:
      en_US: The ID of the event to retrieve
      ko_KR: 가져올 이벤트의 ID
      zh_Hans: 要检索的事件的 ID
      pt_BR: O ID do evento a recuperar
      ja_JP: 取得するイベントの ID
      zh_Hant: 要檢索的事件的 ID
    llm_description: The ID of the event to retrieve
    form: llm
  - name: mailbox
    type: string
    required: false
    label:
      en_US: Mailbox
      ko_KR: 사서함
      zh_Hans: 邮箱
      pt_BR: Caixa de Correio
      ja_JP: メールボックス
      zh_Hant: 信箱
    human_description:
      en_US: "Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential's default mailbox."
      ko_KR: "서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다."
      zh_Hans: "仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。"
      pt_BR: "Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial."
      ja_JP: "サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。"
      zh_Hant: "僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。"
    form: form
output_schema:
  type: object
  properties:
    event_id:
      type: string
      description: Event ID
    subject:
      type: string
      description: Subject
    start:
      type: string
      description: Start date-time
    end:
      type: string
      description: End date-time
    time_zone:
      type: string
      description: Time zone of start and end
    location:
      type: string
      description: Location
    web_link:
      type: string
      description: Link to the event in Outlook
    online_meeting_url:
      type: string
      description: Teams join link, if it is an online meeting
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/get_event.py
