identity:
  name: list_messages
  display_name: List Messages
  author: Dify
  label:
    en_US: List Messages
    ko_KR: 메시지 목록
    zh_Hans: 列出消息
    pt_BR: Listar Mensagens
    ja_JP: メッセージ一覧
    zh_Hant: 列出訊息
description:
  human:
    en_US: List messages from your Outlook inbox
    ko_KR: Outlook 받은 편지함의 메시지 목록을 표시합니다
    zh_Hans: 列出您的 Outlook 收件箱中的消息
    pt_BR: Listar mensagens da sua caixa de entrada do Outlook
    ja_JP: Outlook の受信トレイからメッセージを一覧表示
    zh_Hant: 列出您的 Outlook 收件箱中的訊息
  llm: List messages from the users Outlook inbox using Microsoft Graph API, supports filtering and pagination

parameters:
  - name: folder
    type: string
    required: false
    default: inbox
    label:
      en_US: Folder
      ko_KR: 폴더
      zh_Hans: 文件夹
      pt_BR: Pasta
      ja_JP: フォルダ
      zh_Hant: 資料夾
    human_description:
      en_US: The folder to list messages from
      ko_KR: 메시지 목록을 표시할 폴더
      zh_Hans: 要列出消息的文件夹
      pt_BR: A pasta para listar mensagens
      ja_JP: メッセージを一覧表示するフォルダ
      zh_Hant: 要列出訊息的資料夾
    llm_description: The folder to list messages from, default is inbox, other options include sentitems, drafts, deleteditems, archive
    form: llm
  - name: search
    type: string
    required: false
    label:
      en_US: Search
      ko_KR: 검색
      zh_Hans: 搜索
      pt_BR: Pesquisar
      ja_JP: 検索
      zh_Hant: 搜尋
    human_description:
      en_US: Search query to filter messages
      ko_KR: 메시지를 필터링하기 위한 검색 쿼리
      zh_Hans: 用于过滤消息的搜索查询
      pt_BR: Consulta de pesquisa para filtrar mensagens
      ja_JP: メッセージをフィルタリングする検索クエリ
      zh_Hant: 用於過濾訊息的搜尋查詢
    llm_description: Search query to filter messages, supports subject, sender, recipient, and body content search
    form: llm
  - name: limit
    type: number
    required: false
    default: 10
    min: 1
    max: 100
    label:
      en_US: Limit
      ko_KR: 제한
      zh_Hans: 限制
      pt_BR: Limite
      ja_JP: 制限
      zh_Hant: 限制
    human_description:
      en_US: Maximum number of messages to return
      ko_KR: 반환할 최대 메시지 수
      zh_Hans: 要返回的最大消息数
      pt_BR: Número máximo de mensagens a retornar
      ja_JP: 返すメッセージの最大数
      zh_Hant: 要返回的最大訊息數
    llm_description: Maximum number of messages to return, between 1 and 100, default is 10
    form: llm
  - name: include_body
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Body
      ko_KR: 본문 포함
      zh_Hans: 包含正文
      pt_BR: Incluir Corpo
      ja_JP: 本文を含める
      zh_Hant: 包含內文
    human_description:
      en_US: Whether to include the full message body in the response
      ko_KR: 응답에 전체 메시지 본문을 포함할지 여부
      zh_Hans: 是否在响应中包含完整的消息正文
      pt_BR: Se deve incluir o corpo completo da mensagem na resposta
      ja_JP: レスポンスにメッセージの本文全体を含めるかどうか
      zh_Hant: 是否在回應中包含完整的訊息內文
    llm_description: Whether to include the full message body in the response, default is false to keep responses concise
    form: llm
  - name: mailbox
    type: string
    required: false
    label:
      en_US: Mailbox
      ko_KR: 사서함
      zh_Hans: 邮箱
      pt_BR: Caixa de Correio
      ja_JP: メールボックス
      zh_Hant: 信箱
    human_description:
      en_US: "Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential's default mailbox."
      ko_KR: "서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다."
      zh_Hans: "仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。"
      pt_BR: "Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial."
      ja_JP: "サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。"
      zh_Hant: "僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。"
    form: form
extra:
  python:
    source: tools/list_messages.py 