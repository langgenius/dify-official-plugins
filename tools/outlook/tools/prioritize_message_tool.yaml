identity:
  name: prioritize_email
  display_name: Prioritize Email
  author: Dify
  label:
    en_US: Prioritize Email
    ko_KR: 이메일 우선순위 설정
    zh_Hans: 设置邮件优先级
    pt_BR: Priorizar E-mail
    ja_JP: メールの優先度設定
    zh_Hant: 設置郵件優先級
description:
  human:
    en_US: Set the priority level of an email message
    ko_KR: 이메일 메시지의 우선순위 수준 설정
    zh_Hans: 设置邮件的优先级级别
    pt_BR: Definir o nível de prioridade de um e-mail
    ja_JP: メールの優先度を設定
    zh_Hant: 設置郵件的優先級別
  llm: Set the priority level of an email message in Outlook using Microsoft Graph API

parameters:
  - name: email_id
    type: string
    required: true
    label:
      en_US: Email ID
      ko_KR: 이메일 ID
      zh_Hans: 邮件ID
      pt_BR: ID do E-mail
      ja_JP: メールID
      zh_Hant: 郵件ID
    human_description:
      en_US: The unique identifier of the email to prioritize
      ko_KR: 우선순위를 설정할 이메일의 고유 식별자
      zh_Hans: 要设置优先级的邮件的唯一标识符
      pt_BR: O identificador único do e-mail para priorizar
      ja_JP: 優先度を設定するメールの一意の識別子
      zh_Hant: 要設置優先級的郵件的唯一識別符
    llm_description: The unique identifier of the email to prioritize, this ID can be obtained from the list_messages tool
    form: llm

  - name: priority_level
    type: string
    required: false
    default: high
    label:
      en_US: Priority Level
      ko_KR: 우선순위 수준
      zh_Hans: 优先级
      pt_BR: Nível de Prioridade
      ja_JP: 優先度
      zh_Hant: 優先級
    human_description:
      en_US: The priority level to set for the email
      ko_KR: 이메일에 설정할 우선순위 수준
      zh_Hans: 要为邮件设置的优先级
      pt_BR: O nível de prioridade a ser definido para o e-mail
      ja_JP: メールに設定する優先度
      zh_Hant: 要為郵件設置的優先級
    llm_description: The priority level to set for the email, can be low, normal, or high, default is high
    form: llm
  - name: mailbox
    type: string
    required: false
    label:
      en_US: Mailbox
      ko_KR: 사서함
      zh_Hans: 邮箱
      pt_BR: Caixa de Correio
      ja_JP: メールボックス
      zh_Hant: 信箱
    human_description:
      en_US: "Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential's default mailbox."
      ko_KR: "서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다."
      zh_Hans: "仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。"
      pt_BR: "Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial."
      ja_JP: "サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。"
      zh_Hant: "僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。"
    form: form
extra:
  python:
    source: tools/prioritize_message_tool.py