identity:
  name: list_draft_emails
  display_name: List Draft Emails
  author: Dify
  label:
    en_US: List Draft Emails
    ko_KR: 초안 이메일 목록
    zh_Hans: 列出草稿邮件
    pt_BR: Listar Rascunhos
    ja_JP: 下書きメール一覧
    zh_Hant: 列出草稿郵件
description:
  human:
    en_US: List your draft emails
    ko_KR: 초안 이메일 목록을 표시합니다
    zh_Hans: 列出您的草稿邮件
    pt_BR: Listar seus rascunhos de e-mail
    ja_JP: 下書きメールを一覧表示
    zh_Hant: 列出您的草稿郵件
  llm: List draft emails from the Outlook drafts folder using Microsoft Graph API, supports filtering and pagination

parameters:
  - name: limit
    type: number
    required: false
    default: 10
    min: 1
    max: 100
    label:
      en_US: Limit
      ko_KR: 제한
      zh_Hans: 限制
      pt_BR: Limite
      ja_JP: 制限
      zh_Hant: 限制
    human_description:
      en_US: Maximum number of draft emails to return
      ko_KR: 반환할 초안 이메일의 최대 개수
      zh_Hans: 要返回的最大草稿邮件数
      pt_BR: Número máximo de rascunhos a retornar
      ja_JP: 返す下書きメールの最大数
      zh_Hant: 要返回的最大草稿郵件數
    llm_description: Maximum number of draft emails to return, between 1 and 100, default is 10
    form: llm
  - name: search
    type: string
    required: false
    label:
      en_US: Search
      ko_KR: 검색
      zh_Hans: 搜索
      pt_BR: Pesquisar
      ja_JP: 検索
      zh_Hant: 搜尋
    human_description:
      en_US: Search query to filter draft emails
      ko_KR: 초안 이메일을 필터링하는 검색 쿼리
      zh_Hans: 用于过滤草稿邮件的搜索查询
      pt_BR: Consulta de pesquisa para filtrar rascunhos
      ja_JP: 下書きメールをフィルタリングする検索クエリ
      zh_Hant: 用於過濾草稿郵件的搜尋查詢
    llm_description: Search query to filter draft emails, supports subject, recipient, and body content search
    form: llm
  - name: include_attachments_info
    type: boolean
    required: false
    default: true
    label:
      en_US: Include Attachments Info
      ko_KR: 첨부 파일 정보 포함
      zh_Hans: 包含附件信息
      pt_BR: Incluir Informações de Anexos
      ja_JP: 添付ファイル情報を含める
      zh_Hant: 包含附件資訊
    human_description:
      en_US: Whether to include attachment information in the response
      ko_KR: 응답에 첨부 파일 정보를 포함할지 여부
      zh_Hans: 是否在响应中包含附件信息
      pt_BR: Se deve incluir informações de anexos na resposta
      ja_JP: レスポンスに添付ファイル情報を含めるかどうか
      zh_Hant: 是否在回應中包含附件資訊
    llm_description: Whether to include attachment information in the response, default is true
    form: llm
  - name: mailbox
    type: string
    required: false
    label:
      en_US: Mailbox
      ko_KR: 사서함
      zh_Hans: 邮箱
      pt_BR: Caixa de Correio
      ja_JP: メールボックス
      zh_Hant: 信箱
    human_description:
      en_US: "Service Principal only: the mailbox to act on (user principal name or user ID). Leave empty to use the credential's default mailbox."
      ko_KR: "서비스 주체 전용: 작업할 사서함(사용자 계정 이름 또는 사용자 ID). 비워 두면 자격 증명의 기본 사서함을 사용합니다."
      zh_Hans: "仅限 Service Principal：要操作的邮箱（用户主体名称或用户 ID）。留空则使用凭据中的默认邮箱。"
      pt_BR: "Somente Service Principal: a caixa de correio em que atuar (nome principal do usuário ou ID do usuário). Deixe vazio para usar a caixa padrão da credencial."
      ja_JP: "サービス プリンシパルのみ: 操作するメールボックス（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定のメールボックスを使います。"
      zh_Hant: "僅限 Service Principal：要操作的信箱（使用者主體名稱或使用者 ID）。留空則使用憑證中的預設信箱。"
    form: form
extra:
  python:
    source: tools/list_draft.py 