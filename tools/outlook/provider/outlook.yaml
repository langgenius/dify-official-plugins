    - name: "client_id"
      type: "text-input"
      required: true
      label:
        en_US: "Client ID"
        ko_KR: "클라이언트 ID"
        zh_Hans: "客户端 ID"
        pt_BR: "ID do Cliente"
        ja_JP: "クライアント ID"
        zh_Hant: "客戶端 ID"
      placeholder:
        en_US: "Please input your Azure AD application client ID"
        ko_KR: "Azure AD 애플리케이션 클라이언트 ID를 입력하세요"
