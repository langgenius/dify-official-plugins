credentials_for_provider:
  api_base_url:
    label:
      en_US: API Base URL
      zh_Hans: API 基础地址
    type: text-input
    required: false
    default: https://lark-plugin-api.solutionsuite.cn/lark-plugin
    placeholder:
      en_US: https://lark-plugin-api.solutionsuite.cn/lark-plugin
      zh_Hans: https://lark-plugin-api.solutionsuite.cn/lark-plugin
    help:
      en_US: Base URL of a compatible proxy service, including its path prefix. Leave blank to use the default service. The Feishu Open Platform API is not a direct replacement.
      zh_Hans: 兼容代理服务的基础地址，需包含路径前缀。留空使用默认服务，不能直接替换为飞书开放平台 API 地址。
  app_id:
    help:
      en_US: Get your app_id and app_secret from Feishu
      zh_Hans: 从飞书获取您的 app_id 和 app_secret
    label:
      en_US: APP ID
    placeholder:
      en_US: Please input your feishu app id
      zh_Hans: 请输入你的飞书 app id
    required: true
    type: text-input
    url: https://open.larkoffice.com/app
  app_secret:
    label:
      en_US: APP Secret
    placeholder:
      en_US: Please input your app secret
      zh_Hans: 请输入你的飞书 app secret
    required: true
    type: secret-input
extra:
  python:
    source: provider/feishu_calendar.py
identity:
  author: Doug Lea
  description:
    en_US: 'Feishu calendar, requires the following permissions: calendar:calendar:read、calendar:calendar、contact:user.id:readonly.

      '
    zh_Hans: '飞书日历，需要开通以下权限: calendar:calendar:read、calendar:calendar、contact:user.id:readonly。

      '
  icon: icon.svg
  icon_dark: icon-dark.svg
  label:
    en_US: Feishu Calendar
    zh_Hans: 飞书日历
  name: feishu_calendar
  tags:
  - social
  - productivity
tools:
- tools/add_event_attendees.yaml
- tools/search_events.yaml
- tools/get_primary_calendar.yaml
- tools/create_event.yaml
- tools/delete_event.yaml
- tools/list_events.yaml
- tools/update_event.yaml
