identity:
  name: jira_delete_attachment
  author: langgenius
  label:
    en_US: Delete Attachment
    zh_Hans: 删除附件
    ja_JP: 添付ファイルを削除
description:
  human:
    en_US: Remove an attachment from its issue
    zh_Hans: 删除附件
    ja_JP: 添付ファイルを削除します
  llm: Delete an attachment from a Jira issue. Only when the user clearly asks for it.
parameters:
- name: attachment_id
  type: string
  required: true
  label:
    en_US: Attachment ID
    zh_Hans: 附件 ID
    ja_JP: 添付ファイル ID
  human_description:
    en_US: The attachment's ID (from List Attachments)
    zh_Hans: 附件 ID（可从“列出附件”获取）
    ja_JP: 添付ファイル ID（添付ファイル一覧から取得）
  llm_description: The attachment ID, from the list attachments tool.
  form: llm
output_schema:
  type: object
  properties:
    deleted:
      type: boolean
      description: True when the attachment was deleted
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/jira_delete_attachment.py
