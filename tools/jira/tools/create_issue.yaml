identity:
  name: create_issue
  author: langgenius
  label:
    en_US: Create Jira Issue
    zh_Hans: 创建 Jira 问题
    pt_BR: Criar Issue
description:
  human:
    en_US: Creates a new issue in Jira.
    zh_Hans: 在 Jira 中创建一个新的问题。
    pt_BR: Criar uma nova issue em um projeto.
  llm: Creates a new issue in Jira. Needs the project key or ID and an issue type ID (from the list issue types tool); summary and description, and optionally assignee, priority, labels, due date, parent and custom fields. Returns the details of the created issue.
parameters:
  - name: project_key
    type: string
    required: true
    label:
      en_US: Project Key or ID
      zh_Hans: 项目 Key 或 ID
      pt_BR: Chave do Projeto
    human_description:
      en_US: The Key of the Jira project to retrieve details for (e.g., 'PROJ').
      zh_Hans: 要获取详情的 Jira 项目的 Key (例如 'PROJ') 或 ID (例如 '10001')。
      pt_BR: A chave do projeto onde a issue será criada.
    llm_description: The unique key (e.g., 'PROJ') or ID (e.g., '10001') for the Jira project for which details are requested. This field is mandatory.
    form: llm
  - name: summary
    type: string
    required: true
    label:
      en_US: Summary
      zh_Hans: 问题摘要
      pt_BR: Resumo
    human_description:
      en_US: The summary for the new Jira issue.
      zh_Hans: 新 Jira 问题的摘要信息。
      pt_BR: Um breve resumo da issue.
    llm_description: The detailed summary of the issue to be created in Jira. This field is mandatory.
    form: llm
  - name: issue_type_id
    type: string
    required: true
    label:
      en_US: Issue Type ID
      zh_Hans: 问题类型 ID
      pt_BR: Tipo de Issue
    human_description:
      en_US: The ID of the Jira issue type to be used for the new issue.
      zh_Hans: 要用于新问题的 Jira 问题类型的 ID。
      pt_BR: O ID do tipo de issue do Jira a ser usado para a nova issue.
    llm_description: The unique ID for the Jira issue type that will be assigned to the new issue. This field is mandatory.
    form: llm
  - name: description
    type: string
    required: false
    label:
      en_US: Description
      zh_Hans: 问题描述
      pt_BR: Descrição
    human_description:
      en_US: The detailed description for the new Jira issue.
      zh_Hans: 新 Jira 问题的详细描述信息。
      pt_BR: Uma descrição detalhada da issue.
    llm_description: The detailed description of the issue to be created in Jira. This field is optional.
    form: llm
  - name: assignee
    type: string
    required: false
    label:
      en_US: Assignee
      zh_Hans: 经办人
      ja_JP: 担当者
    human_description:
      en_US: Account ID (Cloud) or username (Server); 'none' unassigns
      zh_Hans: 账号 ID（Cloud）或用户名（Server）；填 none 取消分配
      ja_JP: アカウント ID（Cloud）またはユーザー名（Server）。none で割り当て解除
    llm_description: Assignee's account ID on Jira Cloud (find it with the search users tool) or username on Jira Server; 'none'
      unassigns.
    form: llm
  - name: priority
    type: string
    required: false
    label:
      en_US: Priority
      zh_Hans: 优先级
      ja_JP: 優先度
    human_description:
      en_US: Priority name, e.g. High
      zh_Hans: 优先级名称，如 High
      ja_JP: '優先度の名前（例: High）'
    llm_description: Priority name such as Highest, High, Medium, Low.
    form: llm
  - name: labels
    type: string
    required: false
    label:
      en_US: Labels
      zh_Hans: 标签
      ja_JP: ラベル
    human_description:
      en_US: Comma-separated labels (replaces the existing ones); 'none' clears them
      zh_Hans: 逗号分隔的标签（替换现有标签）；填 none 清空
      ja_JP: カンマ区切りのラベル（既存のラベルを置き換え）。none で全削除
    llm_description: Comma-separated labels; they replace the issue's labels. 'none' removes all labels.
    form: llm
  - name: due_date
    type: string
    required: false
    label:
      en_US: Due Date
      zh_Hans: 截止日期
      ja_JP: 期限
    human_description:
      en_US: YYYY-MM-DD; 'none' clears it
      zh_Hans: YYYY-MM-DD；填 none 清空
      ja_JP: YYYY-MM-DD。none で削除
    llm_description: Due date as YYYY-MM-DD, or 'none' to clear it.
    form: llm
  - name: parent_key
    type: string
    required: false
    label:
      en_US: Parent Issue Key
      zh_Hans: 父问题 Key
      ja_JP: 親課題キー
    human_description:
      en_US: Parent issue (for a sub-task, or an epic in team-managed projects)
      zh_Hans: 父问题（子任务的父问题，或团队管理项目中的史诗）
      ja_JP: 親課題（サブタスクの親、またはチーム管理対象プロジェクトのエピック）
    llm_description: Key of the parent issue, for a sub-task or to put the issue under an epic.
    form: llm
  - name: custom_fields
    type: string
    required: false
    label:
      en_US: Custom Fields (JSON)
      zh_Hans: 自定义字段（JSON）
      ja_JP: カスタム フィールド（JSON）
    human_description:
      en_US: 'JSON object of other fields, e.g. {"customfield_10016": 3}'
      zh_Hans: '其他字段的 JSON 对象，如 {"customfield_10016": 3}'
      ja_JP: 'その他のフィールドの JSON オブジェクト（例: {"customfield_10016": 3}）'
    llm_description: 'Any other fields as a JSON object of field ID to value, e.g. {"customfield_10016": 3}.'
    form: llm
extra:
  python:
    source: tools/create_issue.py