identity:
  name: jira_add_attachment
  author: langgenius
  label:
    en_US: Add Attachment
    zh_Hans: 添加附件
    ja_JP: 添付ファイルを追加
description:
  human:
    en_US: Attach a file (or text) to an issue
    zh_Hans: 给问题上传附件（文件或文本）
    ja_JP: 課題にファイル（またはテキスト）を添付します
  llm: Attach a file to a Jira issue. Pass a file, or text content together with a file name to attach it as a text file.
parameters:
- name: issue_key
  type: string
  required: true
  label:
    en_US: Issue Key
    zh_Hans: 问题 Key
    ja_JP: 課題キー
  human_description:
    en_US: The issue key (e.g. PROJ-123) or ID
    zh_Hans: 问题 Key（如 PROJ-123）或 ID
    ja_JP: '課題キー（例: PROJ-123）または ID'
  llm_description: The Jira issue key such as PROJ-123 (or its numeric ID).
  form: llm
- name: file
  type: file
  required: false
  label:
    en_US: File
    zh_Hans: 文件
    ja_JP: ファイル
  human_description:
    en_US: The file to attach
    zh_Hans: 要上传的文件
    ja_JP: 添付するファイル
  llm_description: The file to attach.
  form: llm
- name: file_content
  type: string
  required: false
  label:
    en_US: Text Content
    zh_Hans: 文本内容
    ja_JP: テキスト内容
  human_description:
    en_US: Text to attach as a file (instead of a file)
    zh_Hans: 作为文件上传的文本（代替文件）
    ja_JP: ファイルとして添付するテキスト（ファイルの代わり）
  llm_description: Text to attach as a file when no file is given; needs file_name.
  form: llm
- name: file_name
  type: string
  required: false
  label:
    en_US: File Name
    zh_Hans: 文件名
    ja_JP: ファイル名
  human_description:
    en_US: Name for the attachment, e.g. notes.txt
    zh_Hans: 附件名称，如 notes.txt
    ja_JP: '添付ファイル名（例: notes.txt）'
  llm_description: File name for the attachment; required with text content.
  form: llm
output_schema:
  type: object
  properties:
    attachment_id:
      type: string
      description: ID of the new attachment
    filename:
      type: string
      description: Its file name
    size:
      type: integer
      description: Its size in bytes
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/jira_add_attachment.py
