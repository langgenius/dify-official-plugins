identity:
  name: jira_update_comment
  author: langgenius
  label:
    en_US: Update Comment
    zh_Hans: 更新评论
    ja_JP: コメントを更新
description:
  human:
    en_US: Replace a comment's text
    zh_Hans: 修改评论内容
    ja_JP: コメントの本文を置き換えます
  llm: Replace the text of an existing comment on a Jira issue.
parameters:
- name: issue_key
  type: string
  required: true
  label:
    en_US: Issue Key
    zh_Hans: 问题 Key
    ja_JP: 課題キー
  human_description:
    en_US: The issue key (e.g. PROJ-123) or ID
    zh_Hans: 问题 Key（如 PROJ-123）或 ID
    ja_JP: '課題キー（例: PROJ-123）または ID'
  llm_description: The Jira issue key such as PROJ-123 (or its numeric ID).
  form: llm
- name: comment_id
  type: string
  required: true
  label:
    en_US: Comment ID
    zh_Hans: 评论 ID
    ja_JP: コメント ID
  human_description:
    en_US: The comment's ID (from List Comments)
    zh_Hans: 评论 ID（可从“列出评论”获取）
    ja_JP: コメント ID（コメント一覧から取得）
  llm_description: The comment ID, from the list comments tool.
  form: llm
- name: comment
  type: string
  required: true
  label:
    en_US: Comment
    zh_Hans: 评论
    ja_JP: コメント
  human_description:
    en_US: Comment text; Markdown is converted for Jira Cloud
    zh_Hans: 评论内容；在 Jira Cloud 上会转换 Markdown
    ja_JP: コメント本文。Jira Cloud では Markdown を変換します
  llm_description: The comment text. Markdown (bold, lists, links, code) is supported.
  form: llm
output_schema:
  type: object
  properties:
    comment_id:
      type: string
      description: The updated comment
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/jira_update_comment.py
