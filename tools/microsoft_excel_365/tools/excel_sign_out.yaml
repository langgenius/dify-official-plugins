identity:
  name: excel_sign_out
  display_name: Sign Out of Excel
  author: Dify
  label:
    en_US: Sign Out of Excel
    zh_Hans: 退出 Excel 登录
    ja_JP: Excel からサインアウト
description:
  human:
    en_US: "Each user signs in mode only: forget the current user's Microsoft sign-in"
    zh_Hans: "仅限“每个用户自己登录”模式：清除当前用户的 Microsoft 登录"
    ja_JP: "ユーザーごとのサインイン モードのみ: 現在のユーザーの Microsoft サインインを削除します"
  llm: Sign the current user out of the Excel tools (forget their stored Excel sign-in; other Microsoft tools such as Outlook or OneDrive keep theirs). Use only when the user asks to sign out of Excel, or to sign out or switch accounts in general.
parameters: []
output_schema:
  type: object
  properties:
    signed_out:
      type: boolean
      description: True when a stored sign-in was removed
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/excel_sign_out.py
