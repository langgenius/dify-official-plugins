identity:
  name: list_workbooks
  author: langgenius
  label:
    en_US: List Workbooks
    zh_Hans: 列出工作簿
    ja_JP: ワークブックのリスト
  icon: icon.svg

description:
  human:
    en_US: List all Excel workbooks accessible to the user in OneDrive or SharePoint
    zh_Hans: 列出用户在 OneDrive 或 SharePoint 中可访问的所有 Excel 工作簿
    ja_JP: OneDriveまたはSharePointでユーザーがアクセス可能なすべてのExcelワークブックをリストする
  llm: List all Excel workbooks that the user has access to, with optional filtering by folder or search query

parameters:
  - name: site_id
    type: string
    required: false
    form: llm
    label:
      en_US: Site ID (only if editing SharePoint Site content)
      zh_Hans: 站点 ID（仅当要编辑 SharePoint Site 内的内容时需要）
      ja_JP: サイトID（SharePoint サイト内の内容を編集する場合のみ）
    human_description:
      en_US: Optional SharePoint site ID. When provided, searches and lists workbooks from this site's drive instead of personal OneDrive.
      zh_Hans: 可选的 SharePoint 站点 ID。若提供，则从该站点的驱动器而非个人 OneDrive 搜索并列出工作簿。
      ja_JP: 任意のSharePointサイトID。指定すると個人のOneDriveではなく、このサイトのドライブから検索・一覧します。
    llm_description: Optional SharePoint site ID. If set, use sites/{site_id}/drive instead of me/drive.
  - name: folder_id
    type: string
    required: false
    form: llm
    label:
      en_US: Folder ID
      zh_Hans: 文件夹 ID
      ja_JP: フォルダID
    human_description:
      en_US: The ID of the folder to list workbooks from (optional)
      zh_Hans: 要列出工作簿的文件夹 ID（可选）
      ja_JP: ワークブックをリストするフォルダのID（オプション）
    llm_description: The ID of a specific folder to list workbooks from. If not provided, lists from root folder.

  - name: search_query
    type: string
    required: false
    form: llm
    label:
      en_US: Search Query
      zh_Hans: 搜索查询
      ja_JP: 検索クエリ
    human_description:
      en_US: Search for workbooks by name (optional)
      zh_Hans: 按名称搜索工作簿（可选）
      ja_JP: 名前でワークブックを検索（オプション）
    llm_description: Optional search query to filter workbooks by name

  - name: max_results
    type: number
    required: false
    default: 20
    form: llm
    label:
      en_US: Maximum Results
      zh_Hans: 最大结果数
      ja_JP: 最大結果数
    human_description:
      en_US: Maximum number of workbooks to return
      zh_Hans: 返回的最大工作簿数量
      ja_JP: 返すワークブックの最大数
    llm_description: Maximum number of workbooks to return (default is 20)
    min: 1
    max: 100

  - name: drive_user
    type: string
    required: false
    form: form
    label:
      en_US: Drive Owner
      zh_Hans: 网盘所有者
      ja_JP: ドライブ所有者
    human_description:
      en_US: 'Service Principal only: the user (user principal name or user ID) whose OneDrive holds the workbooks. Leave empty
        for the credential''s default, or use a Site ID.'
      zh_Hans: 仅限 Service Principal：工作簿所在 OneDrive 的用户（用户主体名称或用户 ID）。留空则使用凭据中的默认值，或使用站点 ID。
      ja_JP: 'サービス プリンシパルのみ: ブックがある OneDrive のユーザー（ユーザー プリンシパル名またはユーザー ID）。空欄の場合は資格情報の既定値、またはサイト ID を使います。'
output_schema:
  type: object
  properties:
    workbooks:
      type: array
      description: Excel workbooks
      items:
        type: object
        properties:
          id:
            type: string
            description: Drive item ID
          name:
            type: string
            description: Name
          size:
            type: integer
            description: Size in bytes
          modified_date:
            type: string
            description: Last modified time
          web_url:
            type: string
            description: Link to open it
          path:
            type: string
            description: Folder path
    count:
      type: integer
      description: Number of workbooks
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
extra:
  python:
    source: tools/list_workbooks.py
