identity:
  author: langgenius
  description:
    en_US: Connect to Microsoft Excel 365 for spreadsheet operations
    ja_JP: Microsoft Excel 365に接続してスプレッドシート操作を実行
    zh_Hans: 连接 Microsoft Excel 365 进行电子表格操作
  icon: icon.svg
  label:
    en_US: Microsoft Excel 365
    ja_JP: Microsoft Excel 365
    zh_Hans: Microsoft Excel 365
  name: excel365
  tags:
  - utilities
credentials_for_provider:
  auth_mode:
    default: service_principal
    help:
      en_US: 'Each user signs in: the first time a chat user needs Excel, the tool returns a Microsoft sign-in link for them;
        after signing in, the tools work on that user''s own workbooks. Needs the Sign-in Callback URL below and delegated
        Graph permissions on the app.'
      ja_JP: 'ユーザーごとにサインイン: チャットのユーザーが初めて Excel を使うとき、ツールが Microsoft のサインイン リンクを返します。サインイン後は、そのユーザー本人のブックを操作します。下のサインイン コールバック
        URL と、アプリへの委任された Graph のアクセス許可が必要です。'
      zh_Hans: 每个用户自己登录：聊天用户第一次用到 Excel 时，工具会返回 Microsoft 登录链接；登录后，工具操作的是该用户自己的工作簿。需要填写下方的登录回调 URL，并为应用配置委托的 Graph 权限。
    label:
      en_US: Mode
      ja_JP: モード
      zh_Hans: 模式
    options:
    - label:
        en_US: Service Principal (app identity, a named drive or site)
        ja_JP: サービス プリンシパル（アプリ ID、指定したユーザーまたはサイトのファイル）
        zh_Hans: Service Principal（应用身份，访问指定用户或站点的文件）
      value: service_principal
    - label:
        en_US: Each user signs in (own workbooks, for chat agents)
        ja_JP: ユーザーごとにサインイン（本人のブック、チャット エージェント向け）
        zh_Hans: 每个用户自己登录（各自的工作簿，适用于对话 Agent）
      value: per_user
    required: false
    type: select
  tenant_id:
    help:
      en_US: Your directory (tenant) ID, from Microsoft Entra ID > Overview or the app registration's Overview. Service Principal
        must use it ('common' does not work); with Each user signs in it limits sign-in to your organization.
      ja_JP: ディレクトリ（テナント）ID です。Microsoft Entra ID > 概要、またはアプリ登録の概要で確認できます。サービス プリンシパルでは必須です（'common' は使えません）。ユーザーごとのサインインでは、自組織のアカウントだけがサインインできるようにします。
      zh_Hans: 目录（租户）ID，可在 Microsoft Entra ID > 概述或应用注册的概述页找到。Service Principal 必须填它（不能用 'common'）；“每个用户自己登录”模式下，填它可以只允许本组织的账号登录。
    label:
      en_US: Tenant ID
      ja_JP: テナント ID
      zh_Hans: 租户 ID
    placeholder:
      en_US: Directory (tenant) ID, e.g. 00000000-0000-0000-0000-000000000000
      ja_JP: 'ディレクトリ（テナント）ID、例: 00000000-0000-0000-0000-000000000000'
      zh_Hans: 目录（租户）ID，例如 00000000-0000-0000-0000-000000000000
    required: true
    type: text-input
    url: https://portal.azure.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Overview
  client_id:
    help:
      en_US: The Application (client) ID on the app registration's Overview page.
      ja_JP: アプリ登録の「概要」ページにある「アプリケーション (クライアント) ID」です。
      zh_Hans: 应用注册“概述”页上的“应用程序(客户端) ID”。
    label:
      en_US: Client ID
      ja_JP: クライアント ID
      zh_Hans: 客户端 ID
    placeholder:
      en_US: Application (client) ID of the app registration
      ja_JP: アプリ登録のアプリケーション（クライアント）ID
      zh_Hans: 应用注册的应用程序（客户端）ID
    required: true
    type: text-input
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  client_secret:
    help:
      en_US: Copy the secret's Value (not its Secret ID). Service Principal needs the Graph application permission Files.ReadWrite.All
        with admin consent. Each user signs in needs the delegated permissions User.Read, Files.ReadWrite, Files.ReadWrite.All,
        Sites.Read.All, offline_access.
      ja_JP: シークレットの「値」をコピーしてください（シークレット ID ではありません）。サービス プリンシパルには管理者の同意を付与した Graph のアプリケーションのアクセス許可 Files.ReadWrite.All、ユーザーごとのサインインには委任されたアクセス許可
        User.Read、Files.ReadWrite、Files.ReadWrite.All、Sites.Read.All、offline_access が必要です。
      zh_Hans: 复制密钥的“值”（不是“机密 ID”）。Service Principal 需要已获管理员同意的 Graph 应用程序权限 Files.ReadWrite.All；“每个用户自己登录”需要委托权限 User.Read、Files.ReadWrite、Files.ReadWrite.All、Sites.Read.All、offline_access。
    label:
      en_US: Client Secret
      ja_JP: クライアントシークレット
      zh_Hans: 客户端密钥
    placeholder:
      en_US: Client secret value of the app registration
      ja_JP: アプリ登録のクライアントシークレットの値
      zh_Hans: 应用注册的客户端密钥值
    required: true
    type: secret-input
    url: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  drive_user:
    help:
      en_US: 'Service Principal: the user (user principal name or user ID) whose OneDrive holds the workbooks; a tool''s Drive
        Owner or Site ID overrides it. Not used when each user signs in.'
      ja_JP: 'サービス プリンシパル: ブックがある OneDrive のユーザー（ユーザー プリンシパル名またはユーザー ID）。ツールの「ドライブ所有者」またはサイト ID が優先されます。ユーザーごとのサインインでは使いません。'
      zh_Hans: Service Principal：工作簿所在 OneDrive 的用户（用户主体名称或用户 ID），工具的“网盘所有者”或站点 ID 会覆盖此值。每个用户自己登录时不使用。
    label:
      en_US: Default Drive Owner
      ja_JP: 既定のドライブ所有者
      zh_Hans: 默认网盘所有者
    placeholder:
      en_US: e.g. alice@contoso.com
      ja_JP: 例 alice@contoso.com
      zh_Hans: 例如 alice@contoso.com
    required: false
    type: text-input
  redirect_uri:
    help:
      en_US: Create this plugin's endpoint (plugin details > Endpoints), paste its /excel/callback URL here, and add the same
        URL to the app registration's Web redirect URIs.
      ja_JP: このプラグインのエンドポイントを作成し（プラグインの詳細 > エンドポイント）、その /excel/callback の URL をここに貼り付け、同じ URL をアプリ登録の Web リダイレクト URI に追加してください。
      zh_Hans: 先创建本插件的端点（插件详情 > 端点），把它的 /excel/callback URL 粘贴到这里，并把同一个 URL 加到应用注册的 Web 重定向 URI 中。
    label:
      en_US: Sign-in Callback URL
      ja_JP: サインイン コールバック URL
      zh_Hans: 登录回调 URL
    placeholder:
      en_US: Only for "Each user signs in", e.g. https://dify.example.com/e/xxxx/excel/callback
      ja_JP: 'ユーザーごとのサインインのみ。例: https://dify.example.com/e/xxxx/excel/callback'
      zh_Hans: 仅用于“每个用户自己登录”，例如 https://dify.example.com/e/xxxx/excel/callback
    required: false
    type: text-input
  cloud:
    default: global
    help: &id001
      en_US: Choose a national cloud only if your Microsoft 365 tenant lives there; it changes the sign-in and Graph endpoints.
      ja_JP: Microsoft 365 テナントが各国のクラウドにある場合のみ選択します。サインインと Graph のエンドポイントが変わります。
      zh_Hans: 仅当您的 Microsoft 365 租户位于国家云时才选择；它会同时改变登录和 Graph 地址。
    label:
      en_US: Microsoft Cloud
      ja_JP: Microsoft クラウド
      zh_Hans: Microsoft 云
    options: &id002
    - label:
        en_US: Global (graph.microsoft.com)
        ja_JP: グローバル (graph.microsoft.com)
        zh_Hans: 全球 (graph.microsoft.com)
      value: global
    - label:
        en_US: US Government (graph.microsoft.us)
        ja_JP: 米国政府 (graph.microsoft.us)
        zh_Hans: 美国政府 (graph.microsoft.us)
      value: usgov
    - label:
        en_US: US Government DoD (dod-graph.microsoft.us)
        ja_JP: 米国政府 DoD (dod-graph.microsoft.us)
        zh_Hans: 美国政府 DoD (dod-graph.microsoft.us)
      value: dod
    - label:
        en_US: China, operated by 21Vianet (microsoftgraph.chinacloudapi.cn)
        ja_JP: 中国、21Vianet 運営 (microsoftgraph.chinacloudapi.cn)
        zh_Hans: 中国，世纪互联运营 (microsoftgraph.chinacloudapi.cn)
      value: china
    required: false
    type: select
oauth_schema:
  client_schema:
  - help:
      en_US: Get your Client ID from Azure Portal
      ja_JP: Azure ポータルからクライアント ID を取得
      zh_Hans: 从 Azure 门户获取您的客户端 ID
    label:
      en_US: Client ID
      ja_JP: クライアント ID
      zh_Hans: 客户端 ID
    name: client_id
    placeholder:
      en_US: Enter your Azure App Client ID
      ja_JP: Azure アプリクライアント ID を入力
      zh_Hans: 输入您的 Azure 应用客户端 ID
    required: true
    type: secret-input
    url: https://portal.azure.com/#blade/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  - help:
      en_US: Get your Client Secret from Azure Portal
      ja_JP: Azure ポータルからクライアントシークレットを取得
      zh_Hans: 从 Azure 门户获取您的客户端密钥
    label:
      en_US: Client Secret
      ja_JP: クライアントシークレット
      zh_Hans: 客户端密钥
    name: client_secret
    placeholder:
      en_US: Enter your Azure App Client Secret
      ja_JP: Azure アプリクライアントシークレットを入力
      zh_Hans: 输入您的 Azure 应用客户端密钥
    required: true
    type: secret-input
    url: https://portal.azure.com/#blade/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
  - default: common
    help:
      en_US: Leave 'common' for any work or personal account (the behaviour before this setting existed); your directory ID
        limits sign-in to your organization.
      ja_JP: common のままにすると、職場または個人のどのアカウントでもサインインできます（従来の動作）。ディレクトリ ID を指定すると自組織のアカウントに限定されます。
      zh_Hans: 保留 common 表示任何工作或个人账号都可登录（与之前的行为相同）；填写目录 ID 则只允许本组织的账号。
    label:
      en_US: Tenant ID
      ja_JP: テナント ID
      zh_Hans: 租户 ID
    name: tenant_id
    placeholder:
      en_US: common, organizations, or your directory (tenant) ID
      ja_JP: common、organizations、またはディレクトリ（テナント）ID
      zh_Hans: common、organizations 或您的目录（租户）ID
    required: false
    type: text-input
  - default: global
    help: *id001
    label:
      en_US: Microsoft Cloud
      ja_JP: Microsoft クラウド
      zh_Hans: Microsoft 云
    name: cloud
    options: *id002
    required: false
    type: select
  credentials_schema:
  - label:
      en_US: Access Token
      ja_JP: アクセストークン
      zh_Hans: 访问令牌
    name: access_token
    type: secret-input
  - label:
      en_US: Refresh Token
      ja_JP: リフレッシュトークン
      zh_Hans: 刷新令牌
    name: refresh_token
    type: secret-input
