model: zai-org/GLM-5.3
label:
  zh_Hans: zai-org/GLM-5.3
  en_US: zai-org/GLM-5.3
model_type: llm
features:
  - tool-call
  - agent-thought
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 32768
    min: 1
    max: 131072
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式。
      en_US: Specifies the format that the model must output.
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: reasoning_effort
    label:
      zh_Hans: 推理强度
      en_US: Reasoning Effort
    type: string
    help:
      zh_Hans: 模型始终启用思考模式，通过此参数调整推理强度。
      en_US: Reasoning is always enabled. Use this parameter to adjust reasoning effort.
    required: false
    options:
      - low
      - high
      - max
pricing:
  input: "8"
  output: "28"
  unit: "0.000001"
  currency: RMB
