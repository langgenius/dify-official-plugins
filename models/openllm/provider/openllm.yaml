background: '#F9FAFB'
configurate_methods:
  - customizable-model
extra:
  python:
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
    provider_source: provider/openllm.py
help:
  title:
    en_US: How to deploy OpenLLM
    zh_Hans: 如何部署 OpenLLM
  url:
    en_US: https://github.com/bentoml/OpenLLM
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: OpenLLM
model_credential_schema:
  credential_form_schemas:
    - label:
        en_US: Server url
        zh_Hans: 服务器URL
      placeholder:
        en_US: Enter the url of your OpenLLM, e.g. http://192.168.1.100:3000
        zh_Hans: 在此输入OpenLLM的服务器地址，如 http://192.168.1.100:3000
      required: true
      type: text-input
      variable: server_url
    - label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every OpenLLM call. The headers are written into the `extra_headers`
            credential and forwarded as `extra_headers=` on the
            `OpenLLMGenerate.generate(...)` call, which the plugin merges into the
            outbound `headers` dict on every `requests.post()` call. The
            headers are used for observability / proxy-side propagation. OpenLLM
            does not document them. Default is `disabled`, so the request shape
            is unchanged unless you opt in. This opt-in applies to the LLM
            endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 OpenLLM 调用中附加当前
            Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source`
            请求头。底层 `requests.post()` 调用会通过 `OpenLLMGenerate.generate`
            构造参数将其随每个出站请求一并转发，用于可观测性与代理侧传播。
            OpenLLM API 不会消费它们。默认值为 `disabled`，即未开启时请求结构
            保持不变。该选项仅作用于 LLM 端点。
      type: select
      required: false
      default: disabled
      options:
      - value: enabled
        label:
          en_US: Enabled
          zh_Hans: 启用
      - value: disabled
        label:
          en_US: Disabled
          zh_Hans: 禁用
      show_on:
      - value: llm
        variable: __model_type
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
      - models/text_embedding/*.yaml
provider: openllm
supported_model_types:
  - llm
  - text-embedding
