background: '#e3f0ff'
configurate_methods:
- predefined-model
description:
  en_US: PerfXCloud (Pengfeng Technology) is an AI development and deployment platform
    tailored for developers and enterprises, providing reasoning capabilities for
    multiple models.
  zh_Hans: PerfXCloud（澎峰科技）为开发者和企业量身打造的AI开发和部署平台，提供多种模型的的推理能力。
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/text_embedding/text_embedding.py
    provider_source: provider/perfxcloud.py
help:
  title:
    en_US: Get your API Key from PerfXCloud
    zh_Hans: 从 PerfXCloud 获取 API Key
  url:
    en_US: https://cloud.perfxlab.cn/panel/token
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: PerfXCloud
  zh_Hans: PerfXCloud
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
    - models/text_embedding/*.yaml
provider: perfxcloud
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: api_key
  - label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: Base URL, e.g. https://cloud.perfxlab.cn/v1
      zh_Hans: Base URL, e.g. https://cloud.perfxlab.cn/v1
    required: false
    type: text-input
    variable: endpoint_url
  - variable: enable_request_metadata
    label:
      en_US: Attach Dify app_id as request headers
      zh_Hans: 附加 Dify app_id 作为请求头
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
          every PerfXCloud API call. The headers are written into the
          `extra_headers` credential, which the underlying OpenAI SDK
          forwards on every outbound request via the `default_headers`
          client constructor argument. The headers are used for
          observability / proxy-side propagation. PerfXCloud does not
          document them. Default is `disabled`, so the request shape
          is unchanged unless you opt in. This opt-in applies to the
          LLM endpoint only.
        zh_Hans: |-
          启用后，插件会通过 `extra_headers` 凭据在每次 PerfXCloud 调用中附加当前 Dify
          app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
          底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其随每个出站
          请求一并转发，用于可观测性与代理侧传播。PerfXCloud API 不会消费它们。
          默认值为 `disabled`，即未开启时请求结构保持不变。该选项仅作用于 LLM
          端点。
    type: select
    required: false
    default: disabled
    options:
      - value: enabled
        label:
          en_US: Enabled
          zh_Hans: 启用
      - value: disabled
        label:
          en_US: Disabled
          zh_Hans: 禁用
    show_on:
      - variable: __model_type
        value: llm
supported_model_types:
- llm
- text-embedding
