model: zai-org/GLM-4.7-Flash
label:
  en_US: GLM 4.7 Flash
  zh_Hans: GLM 4.7 Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 202752
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 202752
    default: 4096
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: presence_penalty
    use_template: presence_penalty
  - name: response_format
    use_template: response_format
pricing:
  input: '0.06'
  output: '0.4'
  unit: '0.000001'
  currency: USD
