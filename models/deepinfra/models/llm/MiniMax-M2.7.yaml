model: MiniMaxAI/MiniMax-M2.7
label:
  en_US: MiniMax M2.7
  zh_Hans: MiniMax M2.7
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 196608
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 196608
    default: 4096
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: presence_penalty
    use_template: presence_penalty
  - name: response_format
    use_template: response_format
pricing:
  input: '0.25'
  output: '1'
  unit: '0.000001'
  currency: USD
