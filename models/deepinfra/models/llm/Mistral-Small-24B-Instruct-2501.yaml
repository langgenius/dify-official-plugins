model: mistralai/Mistral-Small-24B-Instruct-2501
label:
  en_US: Mistral Small 24B Instruct 2501
  zh_Hans: Mistral Small 24B Instruct 2501
model_type: llm
features:
  - agent-thought
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 32768
    default: 4096
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: presence_penalty
    use_template: presence_penalty
  - name: response_format
    use_template: response_format
pricing:
  input: '0.05'
  output: '0.08'
  unit: '0.000001'
  currency: USD
