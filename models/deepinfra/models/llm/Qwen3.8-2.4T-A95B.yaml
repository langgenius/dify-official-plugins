model: Qwen/Qwen3.8-2.4T-A95B
label:
  en_US: Qwen3.8 2.4T A95B
  zh_Hans: Qwen3.8 2.4T A95B
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 262144
    default: 4096
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: presence_penalty
    use_template: presence_penalty
  - name: response_format
    use_template: response_format
pricing:
  input: '2'
  output: '6'
  unit: '0.000001'
  currency: USD
