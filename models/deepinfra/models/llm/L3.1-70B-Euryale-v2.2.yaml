model: Sao10K/L3.1-70B-Euryale-v2.2
label:
  en_US: L3.1 70B Euryale v2.2
  zh_Hans: L3.1 70B Euryale v2.2
model_type: llm
features:
  - agent-thought
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 131072
    default: 4096
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: presence_penalty
    use_template: presence_penalty
  - name: response_format
    use_template: response_format
pricing:
  input: '0.85'
  output: '0.85'
  unit: '0.000001'
  currency: USD
