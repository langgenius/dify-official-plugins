model: glm-5.3
label:
  en_US: GLM-5.3
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 0.6
  - name: top_p
    use_template: top_p
    default: 0.95
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 128000
    default: 16384
pricing:
  input: '8'
  output: '28'
  unit: '0.000001'
  currency: RMB
