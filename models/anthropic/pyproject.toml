[project]
name = "dify-anthropic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

# Managed with uv; refresh the lockfile with `uv lock`.
dependencies = [
    "anthropic>=1.3.0",
    # 0.10.0 introduces get_current_session(), required to resolve the
    # current Dify app_id for Anthropic request metadata.
    "dify_plugin>=0.10.2",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
]
