[project]
name = "dify-anthropic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

# Managed with uv; refresh the lockfile with `uv lock`.
dependencies = [
    "anthropic>=1.8.0",
    # 0.10.0 introduces get_current_session(), required to resolve the
    # current Dify app_id for Anthropic request metadata.
    "dify_plugin>=0.10.2",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
# Use the reviewed replay fix until a containing SDK release is published.
dify-plugin = { git = "https://github.com/langgenius/dify-plugin-sdks.git", rev = "5d5799eeceb938eda4337bcd229f3dcf41b27596" }
