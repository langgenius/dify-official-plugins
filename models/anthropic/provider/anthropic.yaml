background: '#F0F0EB'
configurate_methods:
- predefined-model
- customizable-model
description:
  en_US: Anthropic’s powerful models, such as Claude 3.
  zh_Hans: Anthropic 的强大模型，例如 Claude 3。
extra:
  python:
    model_sources:
    - models/llm/llm.py
    provider_source: provider/anthropic.py
help:
  title:
    en_US: Get your API Key from Anthropic
    zh_Hans: 从 Anthropic 获取 API Key
  url:
    en_US: https://console.anthropic.com/account/keys
icon_large:
  en_US: icon_l_en.png
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Anthropic
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 在此输入模型名称
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: anthropic_api_key
  - label:
      en_US: API URL
    placeholder:
      en_US: Enter your API URL
      zh_Hans: 在此输入您的 API URL
    required: false
    type: text-input
    variable: anthropic_api_url
  - label:
      en_US: Workspace ID
      zh_Hans: 工作区 ID
    placeholder:
      en_US: Enter your Anthropic workspace ID
      zh_Hans: 在此输入您的 Anthropic 工作区 ID
    help:
      text:
        en_US: >-
          Required for identity-linked and service-account API keys created on
          platform.claude.com. Sent as the anthropic-workspace-id request
          header. Leave blank for legacy API keys from console.anthropic.com.
        zh_Hans: >-
          在 platform.claude.com 上创建的身份关联密钥或服务账号密钥需要填写。
          将作为 anthropic-workspace-id 请求头发送。console.anthropic.com
          的旧版 API Key 可留空。
    required: false
    type: text-input
    variable: anthropic_workspace_id
  - label:
      en_US: Enable request metadata
      zh_Hans: 启用请求元数据
    help:
      text:
        en_US: >-
          Attach Dify app_id and dify_source to each Anthropic request as
          metadata so usage can be attributed to a specific Dify app in the
          Anthropic admin console. Default is disabled.
        zh_Hans: >-
          将 Dify app_id 与 dify_source 作为元数据附加到每次 Anthropic 请求，
          以便在 Anthropic 管理控制台按 Dify 应用归因用量。默认禁用。
    options:
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    required: false
    type: select
    variable: enable_request_metadata
    default: disabled
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
provider: anthropic
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: anthropic_api_key
  - label:
      en_US: API URL
    placeholder:
      en_US: Enter your API URL
      zh_Hans: 在此输入您的 API URL
    required: false
    type: text-input
    variable: anthropic_api_url
  - label:
      en_US: Workspace ID
      zh_Hans: 工作区 ID
    placeholder:
      en_US: Enter your Anthropic workspace ID
      zh_Hans: 在此输入您的 Anthropic 工作区 ID
    help:
      text:
        en_US: >-
          Required for identity-linked and service-account API keys created on
          platform.claude.com. Sent as the anthropic-workspace-id request
          header. Leave blank for legacy API keys from console.anthropic.com.
        zh_Hans: >-
          在 platform.claude.com 上创建的身份关联密钥或服务账号密钥需要填写。
          将作为 anthropic-workspace-id 请求头发送。console.anthropic.com
          的旧版 API Key 可留空。
    required: false
    type: text-input
    variable: anthropic_workspace_id
  - label:
      en_US: Enable request metadata
      zh_Hans: 启用请求元数据
    help:
      text:
        en_US: >-
          Attach Dify app_id and dify_source to each Anthropic request as
          metadata so usage can be attributed to a specific Dify app in the
          Anthropic admin console. Default is disabled.
        zh_Hans: >-
          将 Dify app_id 与 dify_source 作为元数据附加到每次 Anthropic 请求，
          以便在 Anthropic 管理控制台按 Dify 应用归因用量。默认禁用。
    options:
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    required: false
    type: select
    variable: enable_request_metadata
    default: disabled
supported_model_types:
- llm
