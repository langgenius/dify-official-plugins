
# References:
# https://platform.claude.com/docs/en/models/mythos-5-2/overview
# https://www.anthropic.com/claude-fable-and-mythos-5-2
# https://platform.claude.com/docs/en/release-notes/overview
# https://platform.claude.com/docs/en/build-with-claude/adaptive-thinking
# https://platform.claude.com/docs/en/build-with-claude/effort
model: claude-mythos-5-2
label:
  en_US: Claude Mythos 5.2 (restricted access)
  zh_Hans: Claude Mythos 5.2（需组织获准访问）
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - stream-tool-call
  - document
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: thinking_display
    label:
      zh_Hans: 推理内容展示
      en_US: Thinking Display
    type: string
    default: summarized
    required: false
    options:
      - omitted
      - summarized
    help:
      en_US: Adaptive thinking is always on. Select summarized to see thought summaries or omitted to hide them.
      zh_Hans: 自适应思考始终开启。选择 summarized 可查看思考摘要，omitted 可隐藏摘要。
  - name: effort
    label:
      zh_Hans: 推理投入等级
      en_US: Effort
    type: string
    default: high
    required: false
    options:
      - low
      - medium
      - high
      - xhigh
      - max
    help:
      en_US: High is the API default. Higher settings allow more reasoning tokens.
      zh_Hans: API 默认为 high。更高的档位允许使用更多推理 token。
  - name: task_budget
    label:
      zh_Hans: 任务预算
      en_US: Task budget
    type: int
    default: 0
    min: 0
    max: 1000000
    required: false
    help:
      zh_Hans: 达到 20000 时启用跨工具调用的建议性 token 预算。0 表示关闭。
      en_US: Give the model an advisory token budget across tool calls. Set at least 20,000 to enable or 0 to omit.
  - name: speed
    label:
      en_US: Speed
      zh_Hans: 速度
    type: string
    required: false
    options:
      - standard
      - fast
    help:
      en_US: Fast mode doubles input and output prices.
      zh_Hans: Fast 模式的输入和输出价格均为标准价格的两倍。
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 128000
    min: 1
    max: 128000
  - name: prompt_caching_message_flow
    label:
      zh_Hans: 大消息自动缓存阈值
      en_US: Cache Message Flow Threshold
    type: int
    default: 0
    required: false
    help:
      zh_Hans: 当用户或助手消息的单词数超过此阈值时，自动为该消息添加缓存控制。0 表示禁用。
      en_US: If a user or assistant message exceeds this word count, add cache_control automatically. 0 disables the feature.
  - name: prompt_caching_ttl
    label:
      zh_Hans: 缓存有效期
      en_US: Cache TTL
    type: string
    default: 5m
    required: true
    options:
      - 5m
      - 1h
    help:
      zh_Hans: 控制 prompt caching 的 cache_control.ttl。5m 为默认有效期；1h 可延长缓存有效期，但缓存写入成本更高。
      en_US: Controls prompt caching cache_control.ttl. 5m is the default duration; 1h extends cache lifetime but has a higher cache write cost.
  - name: prompt_caching_system_message
    label:
      zh_Hans: 缓存系统消息
      en_US: Cache System Message
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用系统消息的提示缓存。<cache></cache>中的内容将自动缓存。
      en_US: Enable prompt caching for system messages. Content within <cache></cache> will be cached.
  - name: prompt_caching_images
    label:
      zh_Hans: 缓存图片
      en_US: Cache Images
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用图片的提示缓存。
      en_US: Enable prompt caching for images.
  - name: prompt_caching_documents
    label:
      zh_Hans: 缓存文档
      en_US: Cache Documents
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用文档的提示缓存。
      en_US: Enable prompt caching for documents.
  - name: prompt_caching_tool_definitions
    label:
      zh_Hans: 缓存工具定义
      en_US: Cache Tool Definitions
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用工具定义的提示缓存。
      en_US: Enable prompt caching for tool definitions.
  - name: prompt_caching_tool_results
    label:
      zh_Hans: 缓存工具结果
      en_US: Cache Tool Results
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用工具结果的提示缓存。
      en_US: Enable prompt caching for tool results.
  - name: response_format
    use_template: response_format
  - name: json_schema
    use_template: json_schema

# https://platform.claude.com/docs/en/models/mythos-5-2/overview#pricing
pricing:
  input: '8.00'
  output: '40.00'
  unit: '0.000001'
  currency: USD
