background: '#EFFDFD'
configurate_methods:
  - customizable-model
description:
  en_US: NVIDIA NIM, a set of easy-to-use inference microservices.
  zh_Hans: NVIDIA NIM，一组易于使用的模型推理微服务。
extra:
  python:
    model_sources:
      - models/llm/llm.py
    provider_source: provider/nvidia_nim.py
help:
  title:
    en_US: Learn more about NVIDIA NIM
    zh_Hans: 了解 NVIDIA NIM 更多信息
  url:
    en_US: https://www.nvidia.com/en-us/ai/
icon_large:
  en_US: icon_l_en.png
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: NVIDIA NIM
model_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Base URL
        zh_Hans: API Base URL
      placeholder:
        en_US: Base URL, e.g. http://192.168.1.100:8000/v1
        zh_Hans: Base URL, e.g. http://192.168.1.100:8000/v1
      required: true
      type: text-input
      variable: endpoint_url
    - default: chat
      label:
        en_US: Completion mode
      options:
        - label:
            en_US: Completion
            zh_Hans: 补全
          value: completion
        - label:
            en_US: Chat
            zh_Hans: 对话
          value: chat
      placeholder:
        en_US: Select completion mode
        zh_Hans: 选择对话类型
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: select
      variable: mode
    - default: '4096'
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      placeholder:
        en_US: Enter your Model context size
        zh_Hans: 在此输入您的模型上下文长度
      required: true
      type: text-input
      variable: context_size
    - default: '4096'
      label:
        en_US: Upper bound for max tokens
        zh_Hans: 最大 token 上限
      show_on:
        - value: llm
          variable: __model_type
      type: text-input
      variable: max_tokens_to_sample
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every NVIDIA NIM API call. The headers are written into the
            `extra_headers` credential, which the underlying OpenAI SDK
            forwards on every outbound request via the `default_headers`
            client constructor argument. The headers are used for
            observability / proxy-side propagation. NVIDIA NIM does not
            document them. Default is `disabled`, so the request shape
            is unchanged unless you opt in. This opt-in applies to the
            LLM endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 NVIDIA NIM 调用中附加当前 Dify
            app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
            底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其随每个出站
            请求一并转发，用于可观测性与代理侧传播。NVIDIA NIM API 不会消费它们。
            默认值为 `disabled`，即未开启时请求结构保持不变。该选项仅作用于 LLM
            端点。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter full model name
      zh_Hans: 输入模型全称
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
provider: nvidia_nim
supported_model_types:
  - llm
