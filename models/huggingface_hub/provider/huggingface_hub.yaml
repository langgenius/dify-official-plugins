background: '#FFF8DC'
configurate_methods:
- customizable-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/text_embedding/text_embedding.py
    provider_source: provider/huggingface_hub.py
help:
  title:
    en_US: Get your API key from Hugging Face Hub
    zh_Hans: 从 Hugging Face Hub 获取 API Key
  url:
    en_US: https://huggingface.co/settings/tokens
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Hugging Face Model
model_credential_schema:
  credential_form_schemas:
  - default: hosted_inference_api
    label:
      en_US: Endpoint Type
      zh_Hans: 端点类型
    options:
    - label:
        en_US: Hosted Inference API
      value: hosted_inference_api
    - label:
        en_US: Inference Endpoints
      value: inference_endpoints
    required: true
    type: radio
    variable: huggingfacehub_api_type
  - label:
      en_US: API Token
      zh_Hans: API Token
    placeholder:
      en_US: Enter your Hugging Face Hub API Token here
      zh_Hans: 在此输入您的 Hugging Face Hub API Token
    required: true
    type: secret-input
    variable: huggingfacehub_api_token
  - label:
      en_US: User Name / Organization Name
      zh_Hans: 用户名 / 组织名称
    placeholder:
      en_US: Enter your User Name / Organization Name here
      zh_Hans: 在此输入您的用户名 / 组织名称
    required: true
    show_on:
    - value: text-embedding
      variable: __model_type
    - value: inference_endpoints
      variable: huggingfacehub_api_type
    type: text-input
    variable: huggingface_namespace
  - label:
      en_US: Endpoint URL
      zh_Hans: 端点 URL
    placeholder:
      en_US: Enter your Endpoint URL here
      zh_Hans: 在此输入您的端点 URL
    required: true
    show_on:
    - value: inference_endpoints
      variable: huggingfacehub_api_type
    type: text-input
    variable: huggingfacehub_endpoint_url
  - label:
      en_US: Task
      zh_Hans: Task
    options:
    - label:
        en_US: Text-to-Text Generation
      show_on:
      - value: llm
        variable: __model_type
      value: text2text-generation
    - label:
        en_US: Text Generation
        zh_Hans: 文本生成
      show_on:
      - value: llm
        variable: __model_type
      value: text-generation
    - label:
        en_US: Feature Extraction
      show_on:
      - value: text-embedding
        variable: __model_type
      value: feature-extraction
    show_on:
    - value: inference_endpoints
      variable: huggingfacehub_api_type
    type: select
    variable: task_type
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every Hugging Face Hub call. The headers are written into the
            `extra_headers` credential and forwarded as `headers=` on the
            `InferenceClient` constructor, which the huggingface_hub SDK sends on
            every outbound request. The headers are used for observability /
            proxy-side propagation. Hugging Face Hub does not document them.
            Default is `disabled`, so the request shape is unchanged unless you
            opt in. This opt-in applies to the LLM endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 Hugging Face Hub 调用中附加
            当前 Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source`
            请求头。底层 huggingface_hub SDK 会通过 `InferenceClient` 构造参数将其
            随每个出站请求一并转发，用于可观测性与代理侧传播。Hugging Face Hub
            API 不会消费它们。默认值为 `disabled`，即未开启时请求结构保持不变。
            该选项仅作用于 LLM 端点。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
      show_on:
        - variable: __model_type
          value: llm
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
models:
  llm:
    predefined:
    - models/llm/*.yaml
  text_embedding:
    predefined:
    - models/text_embedding/*.yaml
provider: huggingface_hub
supported_model_types:
- llm
- text-embedding
