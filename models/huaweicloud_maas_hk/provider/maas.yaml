background: "#ffecff"
configurate_methods:
  - predefined-model
  - customizable-model
extra:
  python:
    model_sources:
      - models/llm/llm.py
    provider_source: provider/maas.py
help:
  title:
    en_US: Get your API Key from Huawei Cloud MaaS HK Region
    zh_Hans: 从 华为云MaaS平台香港站点 获取 API Key
  url:
    en_US: https://console-intl.huaweicloud.com/modelarts/?locale=zh-cn&agencyId=3ff2dd2fd7fc4ba7a0c1ff02564fba83®ion=ap-southeast-1#/model-studio/authmanage
icon_large:
  en_US: maas_square.svg
icon_small:
  en_US: maas_square.svg
label:
  en_US: Huawei Cloud MaaS - HK
  zh_Hans: 华为云MaaS平台 - HK
model_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Base URL
        zh_Hans: API Base URL
      placeholder:
        en_US: Base URL, e.g. https://api-ap-southeast-1.modelarts-maas.com/v1 or https://infer-modelarts-ap-southeast-1.modelarts-infer.com/v1/infers/{service-id}/v1
        zh_Hans: Base URL, e.g. https://api-ap-southeast-1.modelarts-maas.com/v1 or https://infer-modelarts-ap-southeast-1.modelarts-infer.com/v1/infers/{service-id}/v1
      required: true
      type: text-input
      variable: endpoint_url
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
      variable: api_key
    - default: "4096"
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      placeholder:
        en_US: Enter your Model context size
        zh_Hans: 在此输入您的模型上下文长度
      required: true
      type: text-input
      variable: context_size
    - default: "4096"
      label:
        en_US: Upper bound for max tokens
        zh_Hans: 最大 token 上限
      show_on:
        - value: llm
          variable: __model_type
      type: text-input
      variable: max_tokens
    - default: no_call
      label:
        en_US: Function calling
      options:
        - label:
            en_US: Not Support
            zh_Hans: 不支持
          value: no_call
        - label:
            en_US: Support
            zh_Hans: 支持
          value: function_call
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: select
      variable: function_calling_type
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
provider: huaweicloud_maas_hk
provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
      variable: api_key
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every Huawei Cloud MAAS HK API call. The headers are written into the
            `extra_headers` credential, which the underlying OpenAI SDK
            forwards on every outbound request via the `default_headers`
            client constructor argument. The headers are used for
            observability / proxy-side propagation. Huawei Cloud MAAS HK
            does not document them. Default is `disabled`, so the request
            shape is unchanged unless you opt in. This opt-in applies to
            the LLM endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次华为云 MAAS HK 调用中附加当前 Dify
            app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
            底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其随每个出站
            请求一并转发，用于可观测性与代理侧传播。华为云 MAAS HK API 不会消费它们。
            默认值为 `disabled`，即未开启时请求结构保持不变。该选项仅作用于 LLM
            端点。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
supported_model_types:
  - llm
