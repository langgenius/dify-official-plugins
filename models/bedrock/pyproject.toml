[project]
name = "bedrock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Managed with uv; refresh the lockfile with `uv lock`.
dependencies = [
    "boto3>=1.43.89",
    "botocore>=1.43.89",
    # 0.10.0 introduces get_current_session(), required to resolve the
    # current Dify app_id for Bedrock requestMetadata.
    "dify_plugin>=0.10.2",
    "tiktoken>=0.14.0",
    "openai>=3.8.0",
    "aws-bedrock-token-generator>=1.1.0",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
