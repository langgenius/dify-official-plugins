background: '#FCFDFF'
configurate_methods:
- predefined-model
- customizable-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/text_embedding/text_embedding.py
    provider_source: provider/fireworks.py
help:
  title:
    en_US: Get your API Key from Fireworks AI
    zh_Hans: 从 Fireworks AI 获取 API Key
  url:
    en_US: https://fireworks.ai/account/api-keys
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Fireworks AI
  zh_Hans: Fireworks AI
model_credential_schema:
  credential_form_schemas:
  - label:
      en_US: The zh_Hans of Model
      zh_Hans: 模型中文名称
    placeholder:
      en_US: Enter your zh_Hans of Model
      zh_Hans: 在此输入您的模型中文名称
    required: true
    type: text-input
    variable: model_label_zh_Hans
  - label:
      en_US: The en_US of Model
      zh_Hans: 模型英文名称
    placeholder:
      en_US: Enter your en_US of Model
      zh_Hans: 在此输入您的模型英文名称
    required: true
    type: text-input
    variable: model_label_en_US
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: fireworks_api_key
  - default: '4096'
    label:
      en_US: Model context size
      zh_Hans: 模型上下文长度
    placeholder:
      en_US: Enter your Model context size
      zh_Hans: 在此输入您的模型上下文长度
    required: true
    type: text-input
    variable: context_size
  - default: '4096'
    label:
      en_US: Upper bound for max tokens
      zh_Hans: 最大 token 上限
    show_on:
    - value: llm
      variable: __model_type
    type: text-input
    variable: max_tokens
  - default: no_call
    label:
      en_US: Function calling
    options:
    - label:
        en_US: Not Support
        zh_Hans: 不支持
      value: no_call
    - label:
        en_US: Support
        zh_Hans: 支持
      value: function_call
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: select
    variable: function_calling_type
  model:
    label:
      en_US: Model URL
      zh_Hans: 模型URL
    placeholder:
      en_US: Enter your Model URL
      zh_Hans: 输入模型URL
models:
  llm:
    predefined:
    - models/llm/*.yaml
  text_embedding:
    predefined:
    - models/text_embedding/*.yaml
provider: fireworks
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: fireworks_api_key
  - default: disabled
    label:
      en_US: Attach Dify app_id as request metadata
      zh_Hans: 附加 Dify app_id 作为请求元数据
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as a `metadata` field via the `extra_body` argument to
          the underlying `openai` SDK call. The Fireworks API is
          OpenAI-compatible and silently ignores unknown body fields, so the
          metadata travels alongside the rest of the request payload and is
          used for observability / proxy-side propagation. Fireworks does not
          currently consume the metadata. Default is `disabled`, so the
          request shape is unchanged unless you opt in.
        zh_Hans: |-
          启用后，插件会通过 `openai` SDK 的 `extra_body` 参数附加当前 Dify
          app_id 与 `dify` 源标记，作为 `metadata` 字段。Fireworks API 与
          OpenAI 兼容，会静默忽略未知的 body 字段，因此该元数据随请求一起
          传递，可用于可观测性与代理侧传播。Fireworks API 当前不会消费该
          元数据。默认值为 `disabled`，即未开启时请求结构保持不变。
    options:
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    required: false
    show_on: []
    type: select
    variable: enable_request_metadata
supported_model_types:
- llm
- text-embedding
