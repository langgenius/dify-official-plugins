[project]
name = "sarvam"
version = "0.1.0"
description = "Dify model provider for Sarvam AI Token Factory"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dify_plugin>=0.10.2,<0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
markers = [
    "live: sends billable requests to the real Sarvam API",
]
