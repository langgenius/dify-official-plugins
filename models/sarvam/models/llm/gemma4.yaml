model: gemma4
label:
  en_US: gemma4
  zh_Hans: gemma4
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - structured-output
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 0.7
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
    default: 1.0
    min: 0.0
    max: 1.0
  - name: presence_penalty
    use_template: presence_penalty
    default: 0.0
    min: -2.0
    max: 2.0
  - name: frequency_penalty
    use_template: frequency_penalty
    default: 0.0
    min: -2.0
    max: 2.0
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 262144
  - name: reasoning_effort
    label:
      en_US: Reasoning Effort
      zh_Hans: 推理强度
    type: string
    default: none
    required: false
    options:
      - none
      - low
      - high
      - max
    help:
      en_US: Gemma 4 answers directly by default. Set low, high, or max to reason first.
      zh_Hans: Gemma 4 默认直接回答。设置为 low、high 或 max 可先进行推理。
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.3723404255"
  output: "0.9574468085"
  unit: "0.000001"
  currency: USD
