model: glm5.3-flash
label:
  en_US: glm5.3-flash
  zh_Hans: glm5.3-flash
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 0.7
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
    default: 1.0
    min: 0.0
    max: 1.0
  - name: presence_penalty
    use_template: presence_penalty
    default: 0.0
    min: -2.0
    max: 2.0
  - name: frequency_penalty
    use_template: frequency_penalty
    default: 0.0
    min: -2.0
    max: 2.0
  - name: max_tokens
    use_template: max_tokens
    default: 32768
    min: 1
    max: 1048576
  - name: reasoning_effort
    label:
      en_US: Reasoning Effort
      zh_Hans: 推理强度
    type: string
    default: high
    required: false
    options:
      - low
      - high
      - max
    help:
      en_US: Controls reasoning depth. GLM-5.3 Flash cannot turn thinking off. The default is high.
      zh_Hans: 控制推理强度。GLM-5.3 Flash 无法关闭思考，默认值为 high。
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.1436170213"
  output: "0.4787234043"
  unit: "0.000001"
  currency: USD
