background: '#FFEFEF'
configurate_methods:
- predefined-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/text_embedding/text_embedding.py
    - models/tts/tts.py
    provider_source: provider/minimax.py
help:
  title:
    en_US: Get your API Key from Minimax
    zh_Hans: 从 Minimax 获取您的 API Key
  url:
    en_US: https://platform.minimax.io/user-center/payment/token-plan
icon_large:
  en_US: icon_l_en.png
icon_small:
  en_US: icon_s_en.png
label:
  en_US: Minimax
models:
  llm:
    predefined:
    - models/llm/*.yaml
  text_embedding:
    predefined:
    - models/text_embedding/*.yaml
  tts:
    predefined:
    - models/tts/*.yaml
provider: minimax
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: minimax_api_key
  - label:
      en_US: Group ID
    placeholder:
      en_US: Required only for legacy ABAB chat, embedding, and TTS models. Leave empty for MiniMax-M series.
      zh_Hans: 仅在使用 ABAB chat、Embedding、TTS 模型时需要；MiniMax-M 系列留空即可。
    required: false
    type: text-input
    variable: minimax_group_id
  - default: https://api.minimaxi.com
    label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: Enter your API Base URL
      zh_Hans: 在此输入您的 API Base URL
    required: false
    type: text-input
    variable: endpoint_url
  - default: '1'
    label:
      en_US: Max Embedding Batch Size
      zh_Hans: 嵌入请求批量大小
    placeholder:
      en_US: Number of texts sent per embedding request. Default 1 (unchanged behavior). Raise it (e.g. 10) to batch texts into fewer API calls and avoid per-minute rate limits; each request must stay within the 4096-token context window.
      zh_Hans: 每次嵌入请求处理的文本数。默认 1（行为不变）。调大（如 10）可把多条文本合并为更少的 API 调用，避免每分钟请求数限制；单次请求不能超过 4096 token 的上下文上限。
    required: false
    type: text-input
    variable: batch_size
  - label:
      en_US: Enable request metadata
      zh_Hans: 启用请求元数据
    help:
      text:
        en_US: >-
          Attach Dify app_id and dify_source to each MiniMax request as
          metadata fields, so usage can be attributed to a specific
          Dify app. The Anthropic-compatible metadata field accepts
          arbitrary string keys, so this is safe whether or not the
          upstream service consumes the values. Default is disabled.
        zh_Hans: >-
          将 Dify app_id 与 dify_source 作为元数据字段附加到每次 MiniMax 请求，
          以便按 Dify 应用归因用量。Anthropic 兼容的 metadata 字段接受任意字符串键，
          因此无论上游服务是否消费都安全。默认禁用。
    options:
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    required: false
    type: select
    variable: enable_request_metadata
    default: disabled
supported_model_types:
- llm
- text-embedding
- tts
