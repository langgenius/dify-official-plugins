background: '#ECE9E3'
configurate_methods:
- predefined-model
- customizable-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/rerank/rerank.py
    - models/text_embedding/text_embedding.py
    provider_source: provider/cohere.py
help:
  title:
    en_US: Get your API key from cohere
    zh_Hans: 从 cohere 获取 API Key
  url:
    en_US: https://dashboard.cohere.com/api-keys
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Cohere
  zh_Hans: Cohere
model_credential_schema:
  credential_form_schemas:
  - default: chat
    label:
      en_US: Completion mode
    options:
    - label:
        en_US: Completion
        zh_Hans: 补全
      value: completion
    - label:
        en_US: Chat
        zh_Hans: 对话
      value: chat
    placeholder:
      en_US: Select completion mode
      zh_Hans: 选择对话类型
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: select
    variable: mode
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: api_key
  - label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: Enter your API Base URL, e.g. https://api.cohere.ai/v1
      zh_Hans: 在此输入您的 API Base URL，如 https://api.cohere.ai/v1
    required: false
    type: text-input
    variable: base_url
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
  rerank:
    position: models/rerank/_position.yaml
    predefined:
    - models/rerank/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
    - models/text_embedding/*.yaml
provider: cohere
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
      zh_Hans: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    show_on: []
    type: secret-input
    variable: api_key
  - label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: Enter your API Base URL, e.g. https://api.cohere.ai/v1
      zh_Hans: 在此输入您的 API Base URL，如 https://api.cohere.ai/v1
    required: false
    type: text-input
    variable: base_url
  - default: disabled
    label:
      en_US: Attach Dify app_id as request metadata
      zh_Hans: 附加 Dify app_id 作为请求元数据
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
          every Cohere SDK call via `RequestOptions.additional_headers`. The
          headers are forwarded by the underlying HTTP client alongside the
          rest of the request and are used for observability / proxy-side
          propagation. The Cohere API does not consume them. Default is
          `disabled`, so the request shape is unchanged unless you opt in.
        zh_Hans: |-
          启用后，插件会通过 `RequestOptions.additional_headers` 在每次 Cohere SDK
          调用中附加当前 Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` /
          `X-Dify-Source` 请求头。这些请求头由底层 HTTP 客户端随请求一起转发，
          用于可观测性与代理侧传播，Cohere API 不会消费它们。默认值为 `disabled`，
          即未开启时请求结构保持不变。
    options:
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    required: false
    show_on: []
    type: select
    variable: enable_request_metadata
supported_model_types:
- llm
- text-embedding
- rerank
