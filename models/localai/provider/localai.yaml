background: '#F3F4F6'
configurate_methods:
- customizable-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/rerank/rerank.py
    - models/text_embedding/text_embedding.py
    - models/speech2text/speech2text.py
    provider_source: provider/localai.py
help:
  title:
    en_US: How to deploy LocalAI
    zh_Hans: 如何部署 LocalAI
  url:
    en_US: https://github.com/go-skynet/LocalAI
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: LocalAI
model_credential_schema:
  credential_form_schemas:
  - default: chat_completion
    label:
      en_US: Completion type
    options:
    - label:
        en_US: Completion
        zh_Hans: 补全
      value: completion
    - label:
        en_US: ChatCompletion
        zh_Hans: 对话
      value: chat_completion
    placeholder:
      en_US: Select completion type
      zh_Hans: 选择对话类型
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: select
    variable: completion_type
  - label:
      en_US: Server url
      zh_Hans: 服务器URL
    placeholder:
      en_US: Enter the url of your LocalAI, e.g. http://192.168.1.100:8080
      zh_Hans: 在此输入LocalAI的服务器地址，如 http://192.168.1.100:8080
    required: true
    type: text-input
    variable: server_url
  - label:
      en_US: Context size
      zh_Hans: 上下文大小
    placeholder:
      en_US: Enter context size
      zh_Hans: 输入上下文大小
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: text-input
    variable: context_size
  - label:
      en_US: Attach Dify app_id as request headers
      zh_Hans: 附加 Dify app_id 作为请求头
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
          every LocalAI call. The headers are written into the `extra_headers`
          credential and forwarded as `default_headers` on the OpenAI SDK
          client constructor, which the OpenAI SDK sends on every outbound
          request. The headers are used for observability / proxy-side
          propagation. LocalAI does not document them. Default is
          `disabled`, so the request shape is unchanged unless you opt in.
          This opt-in applies to the LLM endpoint only.
        zh_Hans: |-
          启用后，插件会通过 `extra_headers` 凭据在每次 LocalAI 调用中附加当前
          Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source`
          请求头。底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其
          随每个出站请求一并转发，用于可观测性与代理侧传播。LocalAI API 不
          会消费它们。默认值为 `disabled`，即未开启时请求结构保持不变。该
          选项仅作用于 LLM 端点。
    type: select
    required: false
    default: disabled
    options:
    - value: enabled
      label:
        en_US: Enabled
        zh_Hans: 启用
    - value: disabled
      label:
        en_US: Disabled
        zh_Hans: 禁用
    show_on:
    - value: llm
      variable: __model_type
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
provider: localai
supported_model_types:
- llm
- text-embedding
- rerank
- speech2text
