model: "deepseek-v4.1-flash"
label:
  en_US: "deepseek-v4.1-flash"
  zh_Hans: "deepseek-v4.1-flash"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
  - agent-thought
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 393216
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: temperature
    use_template: temperature
    type: float
    default: 1.0
    min: 0.0
    max: 2.0
  - name: max_completion_tokens
    use_template: max_tokens
    type: int
    default: 393216
    min: 1
    max: 393216
  - name: reasoning_effort
    type: string
    required: false
    default: high
    options:
      - low
      - high
      - max
  - name: enable_search
    type: boolean
    default: false
  - name: enable_thinking
    required: false
    type: boolean
    default: true
pricing:
  input: "0.300000"
  output: "1.200000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
