model: "grok-4.6"
label:
  en_US: "grok-4.6"
  zh_Hans: "grok-4.6"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 500000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 500000
  - name: search_parameters
    type: text
    default: "{\n  \"mode\": \"on\"\n}"
    required: false
  - name: response_format
    type: string
    required: false
    options:
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: temperature
    use_template: temperature
    default: 1.0
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
  - name: reasoning_effort
    type: string
    required: false
    default: high
    options:
      - low
      - medium
      - high
      - xhigh
  - name: service_tier
    type: string
    required: false
    default: default
    options:
      - default
      - priority
pricing:
  input: "2.000000"
  output: "6.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
