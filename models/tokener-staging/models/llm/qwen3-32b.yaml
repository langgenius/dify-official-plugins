model: "qwen3-32b"
label:
  en_US: "qwen3-32b"
  zh_Hans: "qwen3-32b"
model_type: llm
features: []
model_properties:
  mode: chat
  context_size: 32000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8000
    min: 1
    max: 8000
  - name: temperature
    use_template: temperature
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    min: 0.01
    max: 1
  - name: top_k
    type: int
    min: 0
    max: 100
  - name: repetition_penalty
    type: float
    min: 0
    max: 2
  - name: seed
    type: int
    required: false
  - name: enable_search
    type: boolean
    required: false
pricing:
  input: "0.150000"
  output: "0.600000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
