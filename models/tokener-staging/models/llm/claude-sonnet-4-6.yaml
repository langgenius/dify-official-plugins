model: "claude-sonnet-4-6"
label:
  en_US: "claude-sonnet-4-6"
  zh_Hans: "claude-sonnet-4-6"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 128000
  - name: temperature
    use_template: temperature
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    min: 0.01
    max: 1
  - name: top_k
    type: int
    min: 0
    max: 100
  - name: prompt_caching_tool_definitions
    type: boolean
    required: false
  - name: prompt_caching_system_message
    type: boolean
    required: false
  - name: prompt_caching_images
    type: boolean
    required: false
  - name: prompt_caching_documents
    type: boolean
    required: false
  - name: prompt_caching_tool_results
    type: boolean
    required: false
  - name: prompt_caching_ttl
    type: string
    required: false
    options:
      - 5m
      - 1h
  - name: prompt_caching_message_flow
    type: int
    required: false
  - name: thinking
    type: boolean
    required: false
  - name: thinking_display
    type: string
    required: false
    options:
      - summarized
      - omitted
  - name: thinking_budget
    type: int
    required: false
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    help:
      en_US: Specify the format that the model must output.
      zh_Hans: 指定模型必须输出的格式。
    required: false
    default: text
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "3.000000"
  output: "15.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
