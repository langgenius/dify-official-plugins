model: "qwen3.7-flash"
label:
  en_US: "qwen3.7-flash"
  zh_Hans: "qwen3.7-flash"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 131072
  - name: seed
    required: false
    type: int
    default: 1234
  - name: enable_search
    type: boolean
    default: false
  - name: enable_thinking
    required: false
    type: boolean
    default: false
  - name: thinking_budget
    required: false
    type: int
    default: 2048
    min: 1
    max: 262144
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: temperature
    use_template: temperature
    type: float
    default: 0.3
    min: 0.0
    max: 2.0
  - name: max_completion_tokens
    use_template: max_tokens
    type: int
    default: 8192
    min: 1
    max: 131072
  - name: top_p
    use_template: top_p
    type: float
    default: 0.8
    min: 0.1
    max: 0.9
  - name: top_k
    type: int
    min: 0
    max: 99
  - name: repetition_penalty
    required: false
    type: float
    default: 1.1
pricing:
  input: "0.030000"
  output: "0.130000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
