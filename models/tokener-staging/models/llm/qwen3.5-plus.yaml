model: "qwen3.5-plus"
label:
  en_US: "qwen3.5-plus"
  zh_Hans: "qwen3.5-plus"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: temperature
    use_template: temperature
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    min: 0.01
    max: 1
  - name: top_k
    type: int
    min: 0
    max: 100
  - name: repetition_penalty
    type: float
    min: 0
    max: 2
  - name: seed
    type: int
    required: false
  - name: enable_search
    type: boolean
    required: false
  - name: enable_thinking
    type: boolean
    required: false
  - name: thinking_budget
    type: int
    required: false
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    help:
      en_US: Specify the format that the model must output.
      zh_Hans: 指定模型必须输出的格式。
    required: false
    default: text
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.400000"
  output: "2.400000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
