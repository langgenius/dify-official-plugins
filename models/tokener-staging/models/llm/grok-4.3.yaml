model: "grok-4.3"
label:
  en_US: "grok-4.3"
  zh_Hans: "grok-4.3"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
  - agent-thought
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 30000
  - name: temperature
    use_template: temperature
    default: 1.0
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
  - name: search_parameters
    type: text
    default: "{\n  \"mode\": \"auto\"\n}"
    required: false
  - name: response_format
    type: string
    required: false
    options:
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: reasoning_effort
    type: string
    required: false
    options:
      - low
      - high
pricing:
  input: "1.250000"
  output: "2.500000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
