model: "deepseek-v4-pro"
label:
  en_US: "deepseek-v4-pro"
  zh_Hans: "deepseek-v4-pro"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
  - agent-thought
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 393216
  - name: temperature
    use_template: temperature
    default: 1.0
  - name: top_p
    use_template: top_p
    default: 1.0
  - name: presence_penalty
    use_template: presence_penalty
    min: -2
    max: 2
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: seed
    type: int
    required: false
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: top_k
    type: int
    required: false
  - name: enable_search
    type: boolean
    default: false
  - name: reasoning_effort
    type: string
    required: false
    default: high
    options:
      - high
      - max
  - name: enable_thinking
    required: false
    type: boolean
    default: true
pricing:
  input: "1.320000"
  output: "3.960000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
