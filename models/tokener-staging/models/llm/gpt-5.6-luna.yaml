model: "gpt-5.6-luna"
label:
  en_US: "gpt-5.6-luna"
  zh_Hans: "gpt-5.6-luna"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 128000
  - name: reasoning_effort
    type: string
    required: false
    default: medium
    options:
      - none
      - low
      - medium
      - high
      - xhigh
      - max
  - name: enable_stream
    type: boolean
    required: true
    default: true
  - name: reasoning_summary
    type: string
    required: false
    options:
      - auto
  - name: service_tier
    type: string
    required: false
    default: auto
    options:
      - auto
      - default
      - flex
      - priority
  - name: verbosity
    type: string
    required: false
    default: medium
    options:
      - low
      - medium
      - high
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: reasoning_mode
    type: string
    required: false
    default: standard
    options:
      - standard
      - pro
  - name: reasoning_context
    type: string
    required: false
    default: auto
    options:
      - auto
      - current_turn
      - all_turns
pricing:
  input: "0.200000"
  output: "1.200000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
