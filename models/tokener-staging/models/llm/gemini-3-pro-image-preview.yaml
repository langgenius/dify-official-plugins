model: "gemini-3-pro-image-preview"
label:
  en_US: "gemini-3-pro-image-preview"
  zh_Hans: "gemini-3-pro-image-preview"
model_type: llm
features:
  - vision
  - document
  - structured-output
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 32768
  - name: temperature
    type: float
    required: true
    default: 1
    min: 0
    max: 1
  - name: top_p
    use_template: top_p
    default: 0.95
  - name: top_k
    type: int
    min: 0
    max: 100
  - name: use_inline_file
    type: boolean
    required: false
  - name: media_resolution
    type: string
    required: false
    options:
      - Default
      - Low
      - Medium
      - High
  - name: aspect_ratio
    type: string
    required: true
    default: Auto
    options:
      - Auto
      - '1:1'
      - '9:16'
      - '16:9'
      - '3:4'
      - '4:3'
      - '3:2'
      - '2:3'
      - '5:4'
      - '4:5'
      - '21:9'
  - name: resolution
    type: string
    required: true
    default: 1K
    options:
      - 1K
      - 2K
      - 4K
  - name: include_thoughts
    type: boolean
    required: true
    default: true
  - name: grounding
    type: boolean
    required: true
    default: false
  - name: max_output_tokens
    type: int
    required: true
    default: 32768
    min: 1
    max: 32768
  - name: flex_inference
    type: boolean
    required: true
    default: false
  - name: json_schema
    use_template: json_schema
pricing:
  input: "2.000000"
  output: "120.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
