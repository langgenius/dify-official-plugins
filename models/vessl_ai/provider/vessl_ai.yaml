background: "#F1EFED"
configurate_methods:
  - customizable-model
extra:
  python:
    model_sources:
      - models/llm/llm.py
    provider_source: provider/vessl_ai.py
help:
  title:
    en_US: How to deploy VESSL AI LLM Model Endpoint
  url:
    en_US: https://docs.vessl.ai/guides/get-started/llama3-deployment
icon_large:
  en_US: icon_l_en.png
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: VESSL AI
model_credential_schema:
  credential_form_schemas:
    - label:
        en_US: Endpoint Url
      placeholder:
        en_US: Enter VESSL AI service endpoint url
      required: true
      type: text-input
      variable: endpoint_url
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter VESSL AI secret key
      required: true
      type: secret-input
      variable: api_key
    - default: chat
      label:
        en_US: Completion Mode
      options:
        - label:
            en_US: Completion
          value: completion
        - label:
            en_US: Chat
          value: chat
      placeholder:
        en_US: Select completion mode
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: select
      variable: mode
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every VESSL AI API call. The headers are written into the
            `extra_headers` credential, which the underlying OpenAI SDK
            forwards on every outbound request via the `default_headers`
            client constructor argument. The headers are used for
            observability / proxy-side propagation. VESSL AI does not
            document them. Default is `disabled`, so the request shape
            is unchanged unless you opt in. This opt-in applies to the
            LLM endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 VESSL AI 调用中附加当前 Dify
            app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
            底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其随每个出站
            请求一并转发，用于可观测性与代理侧传播。VESSL AI API 不会消费它们。
            默认值为 `disabled`，即未开启时请求结构保持不变。该选项仅作用于 LLM
            端点。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
  model:
    label:
      en_US: Model Name
    placeholder:
      en_US: Enter model name
provider: vessl_ai
supported_model_types:
  - llm
