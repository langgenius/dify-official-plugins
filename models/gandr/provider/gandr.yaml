provider: gandr
label:
  en_US: Gandr TTS
description:
  en_US: Text-to-speech models provided by Gandr, an OpenAI-compatible speech API with 23 languages and six stock voices.
  zh_Hans: Gandr 提供的文本转语音模型，兼容 OpenAI 语音接口，支持 23 种语言与六个内置声线。
icon_small:
  en_US: icon.svg
icon_large:
  en_US: icon.svg
background: "#E5E7EB"
help:
  title:
    en_US: Get your API key from Gandr
    zh_Hans: 从 Gandr 获取你的 API Key
  url:
    en_US: https://tts.gandr.ai
    zh_Hans: https://tts.gandr.ai
supported_model_types:
  - tts
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your Gandr API key
        zh_Hans: 在此输入您的 Gandr API Key
      help:
        en_US: Your Gandr API key (GANDRA_KEY or a gnd_ key from tts.gandr.ai).
        zh_Hans: 您的 Gandr API Key（来自 tts.gandr.ai 的 GANDRA_KEY 或 gnd_ 开头的密钥）。
    - variable: api_base
      label:
        en_US: API Base URL
        zh_Hans: API Base URL
      type: text-input
      required: false
      default: https://tts.gandr.ai
      placeholder:
        en_US: Enter your API Base URL
        zh_Hans: 在此输入您的 API Base URL
      help:
        en_US: "Defaults to https://tts.gandr.ai. Also try tts-nyc.gandr.ai or tts-eu.gandr.ai."
        zh_Hans: "默认 https://tts.gandr.ai，也可使用 tts-nyc.gandr.ai 或 tts-eu.gandr.ai。"
models:
  tts:
    predefined:
      - "models/tts/*.yaml"
extra:
  python:
    provider_source: provider/gandr.py
    model_sources:
      - "models/tts/tts.py"