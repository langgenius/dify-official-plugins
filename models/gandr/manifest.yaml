version: 0.0.1
type: plugin
author: "langgenius"
name: "gandr"
label:
  en_US: Gandr TTS
description:
  en_US: Text-to-speech models provided by Gandr, an OpenAI-compatible speech API with 23 languages and six stock voices.
  zh_Hans: Gandr 提供的文本转语音模型，兼容 OpenAI 语音接口，支持 23 种语言与六个内置声线。
icon: icon.svg
created_at: "2026-08-11T00:00:00.000Z"
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: false
      text_embedding: false
      rerank: false
      tts: true
      speech2text: false
      moderation: false
plugins:
  models:
    - "provider/gandr.yaml"
meta:
  version: 0.0.1
  arch:
    - "amd64"
    - "arm64"
  runner:
    language: "python"
    version: "3.12"
    entrypoint: "main"