# https://openrouter.ai/x-ai/grok-4.6
model: x-ai/grok-4.6
label:
  en_US: Grok 4.6
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
model_properties:
  mode: chat
  context_size: 500000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: reasoning_effort
    label:
      zh_Hans: 推理程度
      en_US: Reasoning Effort
    type: string
    help:
      zh_Hans: 指定模型推理的难度
      en_US: specifying the difficulty of the model's reasoning
    required: false
    options:
      - xhigh
      - high
      - medium
      - low
  - name: exclude_reasoning_tokens
    label:
      zh_Hans: 隐藏思考过程
      en_US: Hide the thought process
    type: boolean
    default: true
    help:
      zh_Hans: 是否隐藏思考过程。
      en_US: Whether to hide the thought process.
    required: false
pricing:
  input: "2.00"
  output: "6.00"
  unit: "0.000001"
  currency: USD
