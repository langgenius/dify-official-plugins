model: google/gemini-3.1-flash-lite-preview
label:
  en_US: gemini-3.1-flash-lite-preview
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
  - vision
  - document
  - video
  - audio
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
  - name: top_p
    use_template: top_p
    default: 0.95
  - name: max_tokens
    use_template: max_tokens
    default: 65536
    min: 1
    max: 65536
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: exclude_reasoning_tokens
    label:
      zh_Hans: 隐藏思考过程
      en_US: Hide the thought process
    type: boolean
    default: true
    help:
      zh_Hans: 是否隐藏思考过程。
      en_US: Whether to hide the thought process.
    required: false
  - name: reasoning_effort
    label:
      zh_Hans: 推理程度
      en_US: Reasoning Effort
    type: string
    help:
      zh_Hans: 指定模型推理的难度
      en_US: specifying the difficulty of the model's reasoning
    required: false
    options:
      - high
      - low
  - name: service_tier
    label:
      zh_Hans: 服务层级
      en_US: Service Tier
    type: string
    help:
      zh_Hans: auto 使用默认路由。flex 优先使用 flex 端点（价格更低，可能更慢），只会回退到价格不高于 flex 的端点，否则返回容量错误。没有 flex 端点时按默认方式路由。Dify 中显示的费用按标准价格计算。
      en_US: auto uses default routing. flex tries flex endpoints first (lower price, can be slower) and only falls back to endpoints priced at or below them, otherwise it returns a capacity error. Without a flex endpoint the request routes normally. Costs shown in Dify use standard prices.
    required: false
    default: auto
    options:
      - auto
      - flex
pricing:
  input: "0.25"
  output: "1.50"
  unit: "0.000001"
  currency: USD
