# https://openrouter.ai/openai/gpt-chat-latest
model: openai/gpt-chat-latest
label:
  en_US: gpt-chat-latest
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
model_properties:
  mode: chat
  context_size: 400000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 128000
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "5.00"
  output: "30.00"
  unit: "0.000001"
  currency: USD
