# https://openrouter.ai/deepseek/deepseek-v4.1-flash-1017
model: deepseek/deepseek-v4.1-flash-1017
label:
  en_US: deepseek-v4.1-flash-1017
model_type: llm
features:
  - structured-output
  - agent-thought
  - tool-call
  - stream-tool-call
  - multi-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 393216
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    required: false
    options:
    - text
    - json_object
    - json_schema
  - name: json_schema
    use_template: json_schema
  - name: exclude_reasoning_tokens
    label:
      en_US: Hide the thought process
      zh_Hans: 隐藏思考过程
    type: boolean
    required: false
    default: true
pricing:
  input: '0.15'
  output: '0.6'
  unit: '0.000001'
  currency: USD
