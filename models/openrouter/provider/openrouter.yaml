background: '#F1EFED'
configurate_methods:
- predefined-model
- customizable-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/rerank/rerank.py
    - models/text_embedding/text_embedding.py
    provider_source: provider/openrouter.py
help:
  title:
    en_US: Get your API key from openrouter.ai
    zh_Hans: 从 openrouter.ai 获取 API Key
  url:
    en_US: https://openrouter.ai/keys
icon_large:
  en_US: openrouter.svg
icon_small:
  en_US: openrouter_square.svg
label:
  en_US: OpenRouter
model_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: api_key
  - label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: Base URL, e.g. https://openrouter.ai/api/v1
      zh_Hans: Base URL，例如 https://openrouter.ai/api/v1
    required: false
    type: text-input
    variable: endpoint_url
  - default: chat
    label:
      en_US: Completion mode
    options:
    - label:
        en_US: Completion
        zh_Hans: 补全
      value: completion
    - label:
        en_US: Chat
        zh_Hans: 对话
      value: chat
    placeholder:
      en_US: Select completion mode
      zh_Hans: 选择对话类型
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: select
    variable: mode
  - default: '4096'
    label:
      en_US: Model context size
      zh_Hans: 模型上下文长度
    placeholder:
      en_US: Enter your Model context size
      zh_Hans: 在此输入您的模型上下文长度
    required: true
    type: text-input
    variable: context_size
  - default: '4096'
    label:
      en_US: Upper bound for max tokens
      zh_Hans: 最大 token 上限
    show_on:
    - value: llm
      variable: __model_type
    type: text-input
    variable: max_tokens_to_sample
  - default: no_support
    label:
      en_US: Vision Support
      zh_Hans: 是否支持 Vision
    options:
    - label:
        en_US: 'Yes'
        zh_Hans: 是
      value: support
    - label:
        en_US: 'No'
        zh_Hans: 否
      value: no_support
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: radio
    variable: vision_support
  - default: no_support
    label:
      en_US: Reasoning Support
      zh_Hans: 是否支持推理
    options:
    - label:
        en_US: 'Yes'
        zh_Hans: 是
      value: support
    - label:
        en_US: 'No'
        zh_Hans: 否
      value: no_support
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: radio
    variable: reasoning_support
  - default: no_call
    label:
      en_US: Function calling
    options:
      - label:
          en_US: Not Support
          zh_Hans: 不支持
        value: no_call
      - label:
          en_US: Support
          zh_Hans: 支持
        value: tool_call
    required: false
    show_on:
      - value: llm
        variable: __model_type
    type: select
    variable: function_calling_type
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter full model name
      zh_Hans: 输入模型全称
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
  rerank:
    position: models/rerank/_position.yaml
    predefined:
    - models/rerank/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
    - models/text_embedding/*.yaml
provider: openrouter
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: api_key
  - label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: Base URL, e.g. https://openrouter.ai/api/v1
      zh_Hans: Base URL，例如 https://openrouter.ai/api/v1
    required: false
    type: text-input
    variable: endpoint_url
  - default: disabled
    label:
      en_US: Attach Dify app_id as request headers
      zh_Hans: 附加 Dify app_id 作为请求头
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
          every OpenRouter SDK call. The headers are written into the
          `extra_headers` credential, which the underlying OAICompat base
          class merges into the outbound request alongside the rest of the
          headers. The headers are forwarded by the underlying HTTP client
          and are used for observability / proxy-side propagation. OpenRouter
          does not document them. Default is `disabled`, so the request
          shape is unchanged unless you opt in.
        zh_Hans: |-
          启用后，插件会通过 `extra_headers` 凭据在每次 OpenRouter 调用中附加当前
          Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source`
          请求头。底层 OAICompat 基类会将其与其它请求头合并后一并发送。这些请求头由
          底层 HTTP 客户端转发，用于可观测性与代理侧传播，OpenRouter API 不会
          消费它们。默认值为 `disabled`，即未开启时请求结构保持不变。
    options:
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    required: false
    show_on: []
    type: select
    variable: enable_request_metadata
supported_model_types:
- llm
- rerank
- text-embedding
