identity:
  author: langgenius
  name: deerapi
  label:
    en_US: DeerAPI
    zh_Hans: DeerAPI
    ja_JP: DeerAPI
    pt_BR: DeerAPI
  description:
    en_US: One-stop AI model API aggregation platform.
    zh_Hans: AI 大模型 API 一站式聚合平台。
    ja_JP: 500以上のAIモデルAPIを一括提供。すべてはDeerAPIに。
    pt_BR: "500+ modelos de IA em uma única API. Tudo em um só lugar : DeerAPI."
  icon: deerapi_small.png
background: "#1E40AF"
configurate_methods:
  - predefined-model
  - customizable-model
extra:
  python:
    source: provider/deerapi.py
    provider_source: provider/deerapi.py
    model_sources:
      - "models/llm/llm.py"
      - "models/text_embedding/text_embedding.py"
      - "models/speech2text/speech2text.py"
      - "models/tts/tts.py"
help:
  title:
    en_US: Get your API key from DeerAPI Console
    zh_Hans: 从 DeerAPI 控制台获取 API Key
    ja_JP: DeerAPI コンソールから API キーを取得
    pt_BR: Obtenha sua chave de API do Console DeerAPI
  url:
    en_US: https://api.deerapi.com/token
    zh_Hans: https://api.deerapi.com/token
    ja_JP: https://api.deerapi.com/token
    pt_BR: https://api.deerapi.com/token
supported_model_types:
  - llm
  - text-embedding
  - speech2text
  - tts
icon_large:
  en_US: deerapi_large.png
  zh_Hans: deerapi_large.png
  ja_JP: deerapi_large.png
  pt_BR: deerapi_large.png
icon_small:
  en_US: deerapi_small.png
  zh_Hans: deerapi_small.png
  ja_JP: deerapi_small.png
  pt_BR: deerapi_small.png
label:
  en_US: DeerAPI
  zh_Hans: DeerAPI
  ja_JP: DeerAPI
  pt_BR: DeerAPI
model_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API 密钥
        ja_JP: API キー
        pt_BR: Chave da API
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
        ja_JP: API キーを入力してください
        pt_BR: Digite sua chave de API
    - variable: mode
      label:
        en_US: Completion mode
        zh_Hans: 完成模式
        ja_JP: 完了モード
        pt_BR: Modo de conclusão
      type: select
      required: false
      default: chat
      options:
        - label:
            en_US: Completion
            zh_Hans: 补全
            ja_JP: 完了
            pt_BR: Conclusão
          value: completion
        - label:
            en_US: Chat
            zh_Hans: 对话
            ja_JP: チャット
            pt_BR: Chat
          value: chat
      placeholder:
        en_US: Select completion mode
        zh_Hans: 选择对话类型
        ja_JP: 完了モードを選択
        pt_BR: Selecione o modo de conclusão
      show_on:
        - variable: __model_type
          value: llm
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
        ja_JP: Dify app_id をリクエストヘッダーとして添付
        pt_BR: Anexar app_id do Dify como cabeçalhos de requisição
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
          ja_JP: これはどのように機能しますか？
          pt_BR: Como isso funciona?
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every DeerAPI call. The headers are written into the `extra_headers`
            credential (merged on top of the existing `HTTP-Referer` / `X-Title`
            observability markers; on collision the Dify keys win), which the
            underlying OpenAI SDK forwards on every outbound request via the
            `default_headers` client constructor argument. The headers are used
            for observability / proxy-side propagation. DeerAPI does not document
            them. Default is `disabled`, so the request shape is unchanged unless
            you opt in. This opt-in applies to the LLM endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 DeerAPI 调用中附加当前
            Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source`
            请求头。底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其
            随每个出站请求一并转发，用于可观测性与代理侧传播。DeerAPI API 不
            会消费它们。默认值为 `disabled`，即未开启时请求结构保持不变。该选
            项仅作用于 LLM 端点。
          ja_JP: |-
            有効にすると、プラグインは現在の Dify app_id と `dify` ソースマーカー
            を `X-Dify-App-Id` / `X-Dify-Source` リクエストヘッダーとして毎回
            DeerAPI 呼び出しに付加します。ヘッダーは `extra_headers` 資格情報
            に書き込まれ（既存の `HTTP-Referer` / `X-Title` 可観測性マーカーの上に
            マージされ、衝突時は Dify キーが優先されます）、基盤となる OpenAI
            SDK が `default_headers` クライアントコンストラクタ引数を通じて全て
            の送信リクエストに転送します。DeerAPI API はこれらを消費しません。
            デフォルトは `disabled` で、有効にしない限りリクエストの構造は変更
            されません。このオプトインは LLM エンドポイントのみに適用されます。
          pt_BR: |-
            Quando ativado, o plugin anexa o app_id atual do Dify e um marcador de
            origem `dify` como cabeçalhos de requisição `X-Dify-App-Id` /
            `X-Dify-Source` em cada chamada da DeerAPI. Os cabeçalhos são
            gravados na credencial `extra_headers` (mesclados sobre os
            marcadores de observabilidade `HTTP-Referer` / `X-Title` existentes;
            em caso de colisão, as chaves Dify vencem), que o OpenAI SDK
            subjacente encaminha em cada requisição de saída por meio do
            argumento do construtor `default_headers`. Os cabeçalhos são usados
            para observabilidade / propagação no proxy. A DeerAPI não os
            documenta. O padrão é `disabled`, portanto o formato da requisição
            permanece inalterado, a menos que você opte por ativar. Este opt-in
            aplica-se apenas ao endpoint LLM.
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
            ja_JP: 有効
            pt_BR: Ativado
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
            ja_JP: 無効
            pt_BR: Desativado
      show_on:
        - variable: __model_type
          value: llm
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
      ja_JP: モデル名
      pt_BR: Nome do Modelo
    placeholder:
      en_US: Enter full model name
      zh_Hans: 输入模型全称
      ja_JP: 完全なモデル名を入力
      pt_BR: Digite o nome completo do modelo
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/anthropic/*.yaml
      - models/llm/deepseek/*.yaml
      - models/llm/gemini/*.yaml
      - models/llm/llama/*.yaml
      - models/llm/openai/*.yaml
      - models/llm/qwen/*.yaml
      - models/llm/x-ai/*.yaml
  text_embedding:
    predefined:
      - "models/text_embedding/*.yaml"
  tts:
    predefined:
      - "models/tts/*.yaml"
  speech2text:
    predefined:
      - "models/speech2text/*.yaml"
provider: deerapi
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API 密钥
        ja_JP: API キー
        pt_BR: Chave da API
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
        ja_JP: API キーを入力してください
        pt_BR: Digite sua chave de API
