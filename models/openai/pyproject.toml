[project]
name = "dify-openai"
version = "1.0.5"
description = "OpenAI models for Dify"
readme = "README.md"
requires-python = ">=3.12"
# Managed with uv; refresh the lockfile with `uv lock`.
dependencies = [
    # 0.10.0 introduces get_current_session(), required to resolve the
    # current Dify app_id for OpenAI request metadata.
    "dify_plugin>=0.10.2",
    "openai>=3.8.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
markers = [
    "live: sends billable requests to the real OpenAI API",
]
