background: '#faf7f5'
configurate_methods:
- predefined-model
description:
  en_US: Models provided by Xiaomi MiMo, such as mimo-v2.5-pro, mimo-v2.5, mimo-v2-flash. Supports Token Plan subscription.
  zh_Hans: Xiaomi MiMo 提供的模型，例如 mimo-v2.5-pro、mimo-v2.5、mimo-v2-flash。支持 Token Plan 订阅计划。
extra:
  python:
    model_sources:
    - models/llm/llm.py
    provider_source: provider/mimo.py
help:
  title:
    en_US: Get your API Key from Xiaomi MiMo
    zh_Hans: 从 Xiaomi MiMo 获取 API Key
  url:
    en_US: https://platform.xiaomimimo.com/#/console/api-keys
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.png
label:
  en_US: Xiaomi MiMo
  zh_Hans: Xiaomi MiMo
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
provider: mimo
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key (sk-xxx for pay-per-use, tp-xxx for Token Plan)
      zh_Hans: 输入 API Key（按量付费 sk-xxx，Token Plan 订阅 tp-xxx）
    required: true
    type: secret-input
    variable: api_key
  - label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: Select or enter Base URL
      zh_Hans: 选择或输入 Base URL
    required: false
    type: select
    default: https://api.xiaomimimo.com/v1
    options:
    - value: https://api.xiaomimimo.com/v1
      label:
        en_US: Default (Pay-per-use)
        zh_Hans: 默认（按量付费）
    - value: https://token-plan-cn.xiaomimimo.com/v1
      label:
        en_US: Token Plan - China
        zh_Hans: Token Plan - 中国集群
    - value: https://token-plan-sgp.xiaomimimo.com/v1
      label:
        en_US: Token Plan - Singapore
        zh_Hans: Token Plan - 新加坡集群
    - value: https://token-plan-ams.xiaomimimo.com/v1
      label:
        en_US: Token Plan - Europe
        zh_Hans: Token Plan - 欧洲集群
    variable: endpoint_url
  - default: disabled
    label:
      en_US: Attach Dify app_id as request headers
      zh_Hans: 附加 Dify app_id 作为请求头
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
          every Xiaomi MiMo API call. The headers are written into the
          `extra_headers` credential, which the underlying OAICompat base
          class merges into the outbound request alongside the rest of the
          headers. The headers are forwarded by the underlying HTTP client
          and are used for observability / proxy-side propagation. Xiaomi
          MiMo does not document them. Default is `disabled`, so the
          request shape is unchanged unless you opt in.
        zh_Hans: |-
          启用后，插件会通过 `extra_headers` 凭据在每次 Xiaomi MiMo 调用中附加当前 Dify
          app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
          底层 OAICompat 基类会将其与其它请求头合并后一并发送。这些请求头由底层
          HTTP 客户端转发，用于可观测性与代理侧传播，Xiaomi MiMo API 不会消费它们。
          默认值为 `disabled`，即未开启时请求结构保持不变。
    options:
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    required: false
    show_on: []
    type: select
    variable: enable_request_metadata
supported_model_types:
- llm
