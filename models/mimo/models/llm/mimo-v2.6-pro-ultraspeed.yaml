model: mimo-v2.6-pro-ultraspeed
label:
  zh_Hans: mimo-v2.6-pro-ultraspeed
  en_US: mimo-v2.6-pro-ultraspeed
model_type: llm
features:
  - vision
  - video
  - tool-call
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_completion_tokens
    use_template: max_tokens
    default: 131072
    min: 1
    max: 131072
  - name: temperature
    use_template: temperature
    type: float
    default: 1.0
    min: 0
    max: 1.5
    help:
      zh_Hans: 控制生成结果的多样性和随机性。数值越小，越严谨；数值越大，越发散。
      en_US: Control the diversity and randomness of generated results. The smaller the value, the more rigorous it is; the larger the value, the more divergent it is.
  - name: top_p
    use_template: top_p
    type: float
    default: 0.95
    min: 0.01
    max: 1.00
    help:
      zh_Hans: 控制生成结果的随机性。数值越小，随机性越弱；数值越大，随机性越强。一般而言，top_p 和 temperature 两个参数选择一个进行调整即可。
      en_US: Control the randomness of generated results. The smaller the value, the weaker the randomness; the larger the value, the stronger the randomness. Generally speaking, you can adjust one of the two parameters top_p and temperature.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
  - name: thinking
    required: false
    type: string
    default: disabled
    label:
      zh_Hans: 思考模式
      en_US: Thinking mode
    help:
      zh_Hans: 是否开启思考模式。启用时 temperature 和 top_p 固定为 1.0 和 0.95。
      en_US: Whether to enable thinking mode. When enabled, temperature and top_p are fixed at 1.0 and 0.95.
    options:
      - enabled
      - disabled
pricing:
  input: "4.35"
  output: "8.7"
  unit: "0.000001"
  currency: USD
