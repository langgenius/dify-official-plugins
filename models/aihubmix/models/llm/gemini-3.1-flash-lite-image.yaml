model: gemini-3.1-flash-lite-image
label:
  en_US: Gemini 3.1 Flash-Lite Image
model_type: llm
features:
  - vision
model_properties:
  mode: chat
  context_size: 65536
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    default: 0.95
  - name: max_output_tokens
    use_template: max_tokens
    type: int
    required: true
    default: 4096
    min: 1
    max: 4096
    label:
      en_US: Output length
      zh_Hans: 输出长度
    help:
      en_US: The maximum number of tokens to generate in the response.
      zh_Hans: 模型单次输出的最大 tokens 数。
# https://ai.google.dev/gemini-api/docs/pricing
pricing:
  input: '0.25'
  output: '1.5'
  unit: '0.000001'
  currency: USD
