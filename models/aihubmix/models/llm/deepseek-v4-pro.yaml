model: deepseek-v4-pro
label:
  en_US: DeepSeek V4 Pro
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - multi-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 384000
  - name: reasoning_effort
    label:
      zh_Hans: 推理强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: high
    options:
      - none
      - low
      - high
      - max
    help:
      zh_Hans: 控制模型的思考强度。none 关闭思考（即非思考模式），low/high/max 对应不同强度的思考。
      en_US: Controls the model's reasoning intensity. none disables thinking (non-thinking mode); low/high/max enable progressively stronger thinking.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.478'
  output: '0.956'
  unit: '0.000001'
  currency: USD
