model: hy3-preview
label:
  en_US: Hunyuan 3 Preview
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - multi-tool-call
  - structured-output
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 128000
  - name: reasoning_effort
    label:
      zh_Hans: 推理深度
      en_US: Reasoning Effort
    type: string
    required: false
    default: no_think
    options:
      - no_think
      - low
      - high
    help:
      zh_Hans: 控制推理深度。公网投影给出的官方枚举是 no_think / low / high，no_think 为关闭思考。
      en_US: Controls reasoning depth. The projection's official enum is no_think / low / high; no_think turns thinking off.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.17'
  output: '0.566661'
  unit: "0.000001"
  currency: USD
