# yaml-language-server: $schema=../../schemas/model-schema.json

model: claude-fable-5-1
label:
  en_US: Claude Fable 5.1
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - stream-tool-call
  - document
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: thinking_display
    label:
      zh_Hans: 推理内容展示
      en_US: Thinking Display
    type: string
    default: summarized
    required: false
    options:
      - omitted
      - summarized
    help:
      zh_Hans: Claude Fable 5.1 的 adaptive thinking 始终开启。此参数仅控制响应中推理内容的展示方式。
      en_US: Claude Fable 5.1 always runs with adaptive thinking. This parameter only controls how thinking content is exposed in the response.
  - name: effort
    label:
      zh_Hans: 推理投入等级
      en_US: Effort
    type: string
    default: high
    required: false
    options:
      - low
      - medium
      - high
      - xhigh
      - max
  - name: task_budget
    label:
      zh_Hans: 任务预算
      en_US: Task Budget
    type: int
    default: 0
    min: 0
    max: 1000000
    required: false
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 128000
    min: 1
    max: 128000
  - name: prompt_caching_message_flow
    label:
      zh_Hans: 大消息自动缓存阈值
      en_US: Cache Message Flow Threshold
    type: int
    default: 0
    required: false
  - name: prompt_caching_ttl
    label:
      zh_Hans: 缓存有效期
      en_US: Cache TTL
    type: string
    default: 5m
    required: true
    options:
      - 5m
      - 1h
  - name: prompt_caching_system_message
    label:
      zh_Hans: 缓存系统消息
      en_US: Cache System Message
    type: boolean
    default: true
    required: false
  - name: prompt_caching_images
    label:
      zh_Hans: 缓存图片
      en_US: Cache Images
    type: boolean
    default: true
    required: false
  - name: prompt_caching_documents
    label:
      zh_Hans: 缓存文档
      en_US: Cache Documents
    type: boolean
    default: true
    required: false
  - name: prompt_caching_tool_definitions
    label:
      zh_Hans: 缓存工具定义
      en_US: Cache Tool Definitions
    type: boolean
    default: true
    required: false
  - name: prompt_caching_tool_results
    label:
      zh_Hans: 缓存工具结果
      en_US: Cache Tool Results
    type: boolean
    default: true
    required: false
  - name: response_format
    use_template: response_format
  - name: json_schema
    use_template: json_schema
pricing:
  input: '11.00'
  output: '55.00'
  unit: '0.000001'
  currency: USD
