model: coding-kimi-k3
label:
  zh_Hans: Coding Kimi K3
  en_US: Coding Kimi K3
model_type: llm
features:
  - vision
  - video
  - structured-output
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: max_completion_tokens
    use_template: max_tokens
    default: 131072
    min: 1
    max: 1048576
  - name: reasoning_effort
    label:
      zh_Hans: 推理强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: medium
    options:
      - low
      - medium
      - high
      - max
    help:
      zh_Hans: 控制推理努力程度，取值来自 AiHubMix 公网投影中该模型的官方枚举。
      en_US: Controls reasoning effort. The values come from this model's official enum in the AiHubMix public projection.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.44'
  output: '1.61333'
  unit: '0.000001'
  currency: USD
