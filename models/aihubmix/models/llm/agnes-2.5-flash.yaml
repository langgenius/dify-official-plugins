model: agnes-2.5-flash
label:
  en_US: Agnes 2.5 Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
model_properties:
  mode: chat
  context_size: 512000
parameter_rules:
  - name: enable_thinking
    label:
      zh_Hans: 开启思考
      en_US: Enable Thinking
    type: boolean
    required: false
    default: true
    help:
      zh_Hans: 是否开启深度思考。插件会转成官方的 chat_template_kwargs.enable_thinking 下发。
      en_US: Whether to enable deep thinking. The plugin sends it as the official chat_template_kwargs.enable_thinking.
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65500
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.03'
  output: '0.15'
  unit: '0.000001'
  currency: USD
