model: gemini-3.8-flash
label:
  en_US: Gemini 3.8 Flash
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - agent-thought
  - vision
  - stream-tool-call
  - document
  - video
  - audio
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: include_thoughts
    type: boolean
    required: true
    default: false
    label:
      en_US: Include thoughts
      zh_Hans: 返回思考过程
  - name: media_resolution
    type: string
    required: true
    default: Default
    options:
      - Default
      - Low
      - Medium
      - High
    label:
      en_US: Media resolution
      zh_Hans: 媒体分辨率
  - name: thinking_level
    type: string
    required: true
    default: Medium
    options:
      - Low
      - Medium
      - High
    label:
      en_US: Thinking level
      zh_Hans: 思考层级
  - name: grounding
    type: boolean
    required: true
    default: false
    label:
      en_US: Grounding
      zh_Hans: 事实核查
  - name: url_context
    type: boolean
    required: true
    default: false
    label:
      en_US: URL context
      zh_Hans: 链接详情
  - name: code_execution
    type: boolean
    required: true
    default: false
    label:
      en_US: Code execution
      zh_Hans: 代码执行
  - name: max_output_tokens
    use_template: max_tokens
    type: int
    required: true
    default: 65536
    min: 1
    max: 65536
  - name: service_tier
    type: string
    required: true
    default: standard
    options:
      - flex
      - standard
      - priority
    label:
      en_US: Service tier
      zh_Hans: 服务等级
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.75'
  output: '3.75'
  unit: '0.000001'
  currency: USD
