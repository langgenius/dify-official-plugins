# Served through the OpenAI-compatible endpoint; thinking is disabled upstream.
model: gemini-3.1-flash-lite-nothink
label:
  en_US: Gemini 3.1 Flash-Lite (no think)
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - audio
  - document
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.25'
  output: '1.5'
  unit: '0.000001'
  currency: USD
