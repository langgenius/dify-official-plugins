model: gpt-6-astra
label:
  en_US: GPT 6 Astra
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
model_properties:
  mode: chat
  context_size: 1050000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 128000
  - name: reasoning_effort
    label:
      zh_Hans: 推理努力程度
      en_US: Reasoning Effort
    type: string
    help:
      zh_Hans: GPT-6 Astra 支持 low、medium、high 和 xhigh，默认值为 medium。
      en_US: GPT-6 Astra supports low, medium, high and xhigh, defaulting to medium.
    required: false
    default: medium
    options:
      - low
      - medium
      - high
      - xhigh
  - name: verbosity
    label:
      zh_Hans: 详细程度
      en_US: Verbosity
    type: string
    help:
      zh_Hans: 约束模型响应的详细程度。较低的值将产生更简洁的响应，而较高的值将产生更详细的响应。支持的值包括 low、medium 和 high
      en_US: Constrains the verbosity of the model's response. Lower values will result in more concise responses, while higher values will result in more verbose responses. Currently supported values are low, medium, and high
    required: false
    default: medium
    options:
      - low
      - medium
      - high
  - name: enable_stream
    label:
      zh_Hans: 流式响应
      en_US: Streaming
    type: boolean
    help:
      zh_Hans: OpenAI 新模型的流式输出需要组织完成 KYC 验证，若想跳过这个限制使用模型，请关闭流式响应。
      en_US: Streaming output on new OpenAI models requires a KYC-verified organization; turn streaming off to use the model without that verification.
    required: true
    default: true
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '10'
  output: '50'
  unit: '0.000001'
  currency: USD
