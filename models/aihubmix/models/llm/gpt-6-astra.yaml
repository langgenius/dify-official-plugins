model: gpt-6-astra
label:
  en_US: GPT 6 Astra
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
model_properties:
  mode: chat
  context_size: 1050000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 128000
  - name: reasoning_effort
    label:
      zh_Hans: 推理努力程度
      en_US: Reasoning Effort
    type: string
    help:
      zh_Hans: 推理投入档位，默认 medium。目录里还有一个 max 档，但插件走的是 chat/completions 通道，实测该通道上 max 的推理 token 数和 medium 完全一致（6 vs 6），只有 xhigh 会真正加码（21～43），所以这里不提供 max。
      en_US: Reasoning effort, defaulting to medium. The catalog also lists max, but the plugin
        dispatches this id over chat/completions, where max spends exactly as many reasoning
        tokens as medium (6 vs 6) while xhigh really does escalate (21-43), so max is not offered.
    required: false
    default: medium
    options:
      - low
      - medium
      - high
      - xhigh
  - name: verbosity
    label:
      zh_Hans: 详细程度
      en_US: Verbosity
    type: string
    help:
      zh_Hans: 约束模型响应的详细程度。较低的值将产生更简洁的响应，而较高的值将产生更详细的响应。支持的值包括 low、medium 和 high
      en_US: Constrains the verbosity of the model's response. Lower values will result in more concise responses, while higher values will result in more verbose responses. Currently supported values are low, medium, and high
    required: false
    default: medium
    options:
      - low
      - medium
      - high
  - name: enable_stream
    label:
      zh_Hans: 流式响应
      en_US: Streaming
    type: boolean
    help:
      zh_Hans: OpenAI 新模型的流式输出需要组织完成 KYC 验证，若想跳过这个限制使用模型，请关闭流式响应。
      en_US: Streaming output on new OpenAI models requires a KYC-verified organization; turn streaming off to use the model without that verification.
    required: true
    default: true
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '10'
  output: '50'
  unit: '0.000001'
  currency: USD
