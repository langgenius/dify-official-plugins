# AIHubMix Smart Router: the gateway picks the best model for each request.
# Pricing is an average estimate; the actual price depends on the model that is routed to.
model: auto
label:
  en_US: Auto (Smart Router)
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - audio
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 32768
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '2'
  output: '2'
  unit: '0.000001'
  currency: USD
