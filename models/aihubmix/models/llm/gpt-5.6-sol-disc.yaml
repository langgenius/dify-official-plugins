model: gpt-5.6-sol-disc
label:
  en_US: GPT 5.6 Sol Disc
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1050000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 128000
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: reasoning_effort
    label:
      zh_Hans: 推理努力程度
      en_US: Reasoning Effort
    type: string
    help:
      zh_Hans: GPT-5.6 Sol Disc 支持 none、low、medium、high、xhigh 和 max，默认值为 medium。
      en_US: GPT-5.6 Sol Disc supports none, low, medium, high, xhigh, and max, defaulting to medium.
    required: false
    default: medium
    options:
      - none
      - low
      - medium
      - high
      - xhigh
      - max
  - name: reasoning_mode
    label:
      zh_Hans: 推理模式
      en_US: Reasoning Mode
    type: string
    help:
      zh_Hans: 标准模式平衡质量与延迟；Pro 模式会投入更多模型计算。公网投影在 responses 协议下把该字段标为 official-model-level，枚举 standard/pro，默认 standard。
      en_US: Standard mode balances quality and latency; Pro mode applies more model work. The public projection marks this field official-model-level on the responses protocol with the enum standard/pro, defaulting to standard.
    required: false
    default: standard
    options:
      - standard
      - pro
  - name: reasoning_summary
    label:
      zh_Hans: 推理摘要
      en_US: Reasoning Summary
    type: string
    help:
      zh_Hans: 让模型回传思考过程的摘要，concise 为简要、detailed 为详细、auto 由服务端决定；流式下以 reasoning_summary_text 事件返回（线上实测 detailed 产出 79 个摘要增量）。
      en_US: Asks the model to return a summary of its reasoning - concise, detailed, or auto (server decides). It streams back as reasoning_summary_text events (verified live - detailed produced 79 summary deltas).
    required: false
    options:
      - auto
      - concise
      - detailed
  - name: reasoning_context
    label:
      zh_Hans: 推理上下文
      en_US: Reasoning Context
    type: string
    help:
      zh_Hans: 控制模型在推理时可以回看多少历史：auto 由服务端决定，current_turn 只看本轮，all_turns 看完整会话。
      en_US: Controls how much history the model may revisit while reasoning - auto lets the server decide, current_turn keeps it to this turn, all_turns spans the whole conversation.
    required: false
    options:
      - auto
      - current_turn
      - all_turns
  - name: verbosity
    label:
      zh_Hans: 详细程度
      en_US: Verbosity
    type: string
    help:
      zh_Hans: 约束模型响应的详细程度。较低的值将产生更简洁的响应，而较高的值将产生更详细的响应。支持的值包括 low、medium 和 high
      en_US: Constrains the verbosity of the model's response. Lower values will result in more concise responses, while higher values will result in more verbose responses. Currently supported values are low, medium, and high
    required: false
    default: medium
    options:
      - low
      - medium
      - high
  - name: enable_stream
    label:
      zh_Hans: 流式响应
      en_US: Streaming
    type: boolean
    help:
      zh_Hans: GPT-5 系列模型流式输出需要 KYC 验证，若想跳过这个限制使用模型，请关闭流式响应。
      en_US: GPT-5 series models require KYC validation for streaming output, if you want to use the models without this limitation, please turn off streaming responses.
    required: true
    default: true
pricing:
  input: '4'
  output: '20'
  unit: '0.000001'
  currency: USD
