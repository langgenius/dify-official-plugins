model: mai-thinking-1
label:
  en_US: MAI Thinking 1
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 64000
pricing:
  input: '2'
  output: '8'
  unit: '0.000001'
  currency: USD
