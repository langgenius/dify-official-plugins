model: deepseek-v4-flash-vision-exp
label:
  en_US: DeepSeek V4 Flash Vision Exp
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - stream-tool-call
  - multi-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 384000
  - name: reasoning_effort
    label:
      zh_Hans: 推理强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: medium
    options:
      - none
      - low
      - medium
      - high
      - max
    help:
      zh_Hans: 控制推理努力程度；low/high/max 为公网投影的官方枚举，medium 为其默认档，none 关闭思考（线上实测生效）。
      en_US: Controls reasoning effort. low/high/max are the projection's official enum, medium its default; none disables thinking (verified live).
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.155'
  output: '0.62'
  unit: '0.000001'
  currency: USD
