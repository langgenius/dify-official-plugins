model: deepseek-v4-flash-vision-exp
label:
  en_US: DeepSeek V4 Flash Vision Exp
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - stream-tool-call
  - multi-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 384000
  - name: reasoning_effort
    label:
      zh_Hans: 推理强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: medium
    options:
      - low
      - medium
      - high
      - max
    help:
      zh_Hans: 公网投影 fields 收录的官方枚举为 low/high/max，medium 是其默认档；关闭思考请改用 thinking 开关。
      en_US: The projection's fields record the official enum low/high/max with medium as its default; use the thinking toggle to turn reasoning off.
  - name: thinking
    label:
      zh_Hans: 推理模式
      en_US: Thinking Mode
    type: boolean
    required: false
    default: true
    help:
      zh_Hans: 公网投影在 chat_completions 协议下把 thinking 标为 official-model-level 的思考开关（对象形式 {"type":"enabled"/"disabled"}，默认思考）；插件会把这个布尔值翻译成官方要求的对象。线上实测关闭后不再产生推理 token。
      en_US: The public projection marks thinking as the official model-level toggle on chat_completions (object form {"type":"enabled"/"disabled"}, thinking on by default); the plugin translates this boolean into that object. Verified on the gateway - turning it off stops reasoning tokens.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
pricing:
  input: '0.155'
  output: '0.62'
  unit: '0.000001'
  currency: USD
