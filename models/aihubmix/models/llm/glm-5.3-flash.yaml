model: glm-5.3-flash
label:
  en_US: GLM 5.3 Flash
model_type: llm
features:
  - vision
  - video
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 65536
    min: 1
    max: 128000
  - name: reasoning_effort
    label:
      zh_Hans: 推理强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: max
    options:
      - low
      - high
      - max
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
pricing:
  input: '0.11268'
  output: '0.39438'
  unit: '0.000001'
  currency: USD
