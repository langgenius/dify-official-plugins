# yaml-language-server: $schema=../../schemas/model-schema.json

# https://platform.claude.com/docs/en/about-claude/models/overview.md
# https://platform.claude.com/docs/en/about-claude/models/whats-new-opus-5.md
# https://platform.claude.com/docs/en/about-claude/models/migration-guide.md
# https://platform.claude.com/docs/en/resources/overview.md
model: claude-opus-5
label:
  en_US: Claude Opus 5
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - stream-tool-call
  - document
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: thinking
    label:
      zh_Hans: 自适应推理
      en_US: Adaptive Thinking
    type: boolean
    default: true
    required: true
    help:
      zh_Hans: |
        Claude Opus 5 默认启用自适应推理，推理深度由 Effort 参数控制。
        开启此项时，插件发送 `thinking.type=adaptive`（等价于 API 默认，模型自行决定何时、思考多少）。
        关闭此项时，插件发送 `thinking.type=disabled` 完全关闭推理，以获得最低延迟与成本。
        注意：关闭推理时 effort 仅支持 `high` 及以下；若设置为 `xhigh`/`max`，插件会自动降为 `high` 以避免 400。
      en_US: |
        Claude Opus 5 runs adaptive thinking by default; depth is controlled by the Effort parameter.
        When enabled, the plugin sends `thinking.type=adaptive` (equivalent to the API default; the model decides when and how much to think).
        When disabled, the plugin sends `thinking.type=disabled` to turn off reasoning for the lowest latency and cost.
        Note: when thinking is disabled, effort is capped at `high`; `xhigh`/`max` are automatically clamped to `high` by the plugin to avoid a 400.
  - name: thinking_display
    label:
      zh_Hans: 推理内容展示
      en_US: Thinking Display
    type: string
    default: omitted
    required: true
    options:
      - omitted
      - summarized
    help:
      zh_Hans: 响应中推理内容的展示方式。omitted 为官方默认值（响应中不返回 thinking 文本）；summarized 返回摘要化的推理过程，便于在前端展示思考进度。
      en_US: How thinking content is exposed in the response. `omitted` is the official default (thinking text not returned); `summarized` returns summarized reasoning so clients can display progress.
  - name: effort
    label:
      zh_Hans: 推理投入等级
      en_US: Effort
    type: string
    default: high
    required: true
    options:
      - low
      - medium
      - high
      - xhigh
      - max
    help:
      zh_Hans: |
        通过 output_config.effort 控制智能/token 消耗的权衡。Claude Opus 5 对 effort 更敏感，能更可靠地将额外 effort 转化为更优结果。
        `high` 为官方默认值，适合复杂推理、编码与智能体场景；`max` 为最深推理的顶档，适合最具挑战的长程任务；`xhigh`/`max` 建议同时将 max_tokens 设置到 64k 以上。
        `low`/`medium` 适合延迟或成本敏感场景。注意：关闭推理时 effort 仅支持 `high` 及以下。
      en_US: |
        Controls the intelligence vs. token cost trade-off via output_config.effort. Claude Opus 5 is more responsive to effort and converts additional effort into better results more reliably.
        `high` is the official default for complex reasoning, coding, and agentic tasks; `max` is the top tier for the deepest reasoning on the most demanding long-horizon tasks; with `xhigh`/`max`, set max_tokens to at least 64k.
        Use `low`/`medium` for latency- or cost-sensitive workloads. Note: when thinking is disabled, effort is capped at `high`.
  - name: task_budget
    label:
      zh_Hans: 任务预算
      en_US: Task Budget
    type: int
    default: 0
    min: 0
    max: 1000000
    required: false
    help:
      zh_Hans: |
        跨完整智能体循环（推理+工具调用+工具结果+最终输出）下发给模型的建议性 token 预算。这是"建议"（模型可见并据此自我调度），不是硬上限；真正的硬上限由 max_tokens 控制。
        · 0（默认）：不发送该字段 → 模型看不到预算倒计时，按 max_tokens 自由发挥，适合质量优先的开放式任务。这不是"无上限"，而是"不启用预算建议"。
        · <20000：插件会静默忽略（API 要求最小 20000，避免 400）。
        · ≥20000：启用并自动追加 beta 头 `task-budgets-2026-03-13`；预算过紧可能导致模型潦草收尾。
      en_US: |
        Advisory token budget visible to the model across the full agentic loop (thinking + tool calls + tool results + final output). This is advisory — the hard per-request cap is `max_tokens`.
        · 0 (default): field is not sent → model runs without a countdown, bounded only by `max_tokens`. Recommended for open-ended agentic tasks where quality matters more than speed. "0" means "no budget hint", NOT "unlimited".
        · <20000: silently ignored by the plugin (API requires a minimum of 20000 and would otherwise return 400).
        · ≥20000: enabled and the `task-budgets-2026-03-13` beta header is attached automatically. Overly tight budgets can cause the model to wrap up prematurely.
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 128000
    min: 1
    max: 128000
  - name: prompt_caching_message_flow
    label:
      zh_Hans: 大消息自动缓存阈值
      en_US: Cache Message Flow Threshold
    type: int
    default: 0
    required: false
    help:
      zh_Hans: 当用户或助手消息的单词数超过此阈值时，自动为该消息添加缓存控制。0 表示禁用。
      en_US: If a user or assistant message exceeds this word count, add cache_control automatically. 0 disables the feature.
  - name: prompt_caching_ttl
    label:
      zh_Hans: 缓存有效期
      en_US: Cache TTL
    type: string
    default: 5m
    required: true
    options:
      - 5m
      - 1h
    help:
      zh_Hans: 控制 prompt caching 的 cache_control.ttl。5m 为默认有效期；1h 可延长缓存有效期，但缓存写入成本更高。
      en_US: Controls prompt caching cache_control.ttl. 5m is the default duration; 1h extends cache lifetime but has a higher cache write cost.
  - name: prompt_caching_system_message
    label:
      zh_Hans: 缓存系统消息
      en_US: Cache System Message
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用系统消息的提示缓存。<cache></cache>中的内容将自动缓存。
      en_US: Enable prompt caching for system messages. Content within <cache></cache> will be cached.
  - name: prompt_caching_images
    label:
      zh_Hans: 缓存图片
      en_US: Cache Images
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用图片的提示缓存。
      en_US: Enable prompt caching for images.
  - name: prompt_caching_documents
    label:
      zh_Hans: 缓存文档
      en_US: Cache Documents
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用文档的提示缓存。
      en_US: Enable prompt caching for documents.
  - name: prompt_caching_tool_definitions
    label:
      zh_Hans: 缓存工具定义
      en_US: Cache Tool Definitions
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用工具定义的提示缓存。
      en_US: Enable prompt caching for tool definitions.
  - name: prompt_caching_tool_results
    label:
      zh_Hans: 缓存工具结果
      en_US: Cache Tool Results
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用工具结果的提示缓存。
      en_US: Enable prompt caching for tool results.
  - name: response_format
    use_template: response_format
  - name: json_schema
    use_template: json_schema

# https://aihubmix.com/model/claude-opus-5
pricing:
  input: '5.00'
  output: '25.00'
  unit: '0.000001'
  currency: USD
