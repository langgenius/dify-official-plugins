provider: llama-api
label:
  en_US: Llama API
description:
  en_US: Models provided by Llama API.
  zh_Hans: LlamaApi 提供的模型。
icon_small:
  en_US: icon_s_en.svg
icon_large:
  en_US: icon_l_en.svg
background: "#E5E7EB"
help:
  title:
    en_US: Get your API Key from Llama API
    zh_Hans: 从 Llama API 获取 API Key
  url:
    en_US: https://llama.developer.meta.com?utm_source=partner-dify&utm_medium=readme
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
  credential_form_schemas:
    - variable: llama_api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        zh_Hans: 在此输入您的 API Key
        en_US: Enter your API Key
provider_credential_schema:
  credential_form_schemas:
    - variable: llama_api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        zh_Hans: 在此输入您的 API Key
        en_US: Enter your API Key
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every Llama API call. The headers are written into the
            `extra_headers` credential, which the underlying OpenAI SDK
            forwards on every outbound request via the `default_headers`
            client constructor argument. The headers are used for
            observability / proxy-side propagation. Llama API does not
            document them. Default is `disabled`, so the request shape
            is unchanged unless you opt in. This opt-in applies to the
            LLM endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 Llama API 调用中附加当前 Dify
            app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
            底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其随每个出站
            请求一并转发，用于可观测性与代理侧传播。Llama API 不会消费它们。
            默认值为 `disabled`，即未开启时请求结构保持不变。该选项仅作用于 LLM
            端点。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
      show_on: []
models:
  llm:
    predefined:
      - "models/llm/*.yaml"
extra:
  python:
    provider_source: provider/llama-api.py
    model_sources:
      - "models/llm/llm.py"
