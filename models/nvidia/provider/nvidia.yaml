background: '#FFFFFF'
configurate_methods:
  - predefined-model
description:
  en_US: API Catalog
  zh_Hans: API Catalog
extra:
  python:
    model_sources:
      - models/llm/llm.py
      - models/rerank/rerank.py
      - models/text_embedding/text_embedding.py
    provider_source: provider/nvidia.py
help:
  title:
    en_US: Get your API Key from NVIDIA
    zh_Hans: 从 NVIDIA 获取 API Key
  url:
    en_US: https://build.nvidia.com/explore/discover
icon_large:
  en_US: icon_l_en.png
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: API Catalog
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
  rerank:
    position: models/rerank/_position.yaml
    predefined:
      - models/rerank/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
      - models/text_embedding/*.yaml
provider: nvidia
provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
      variable: api_key
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every NVIDIA LLM call. The headers are written into the
            `extra_headers` credential, which the underlying OpenAI SDK forwards
            on every outbound request via the `default_headers` client
            constructor argument. The headers are used for observability /
            proxy-side propagation. NVIDIA does not document them. Default is
            `disabled`, so the request shape is unchanged unless you opt in. The
            opt-in is wired into the LLM module only; the text-embedding and
            rerank modules are unaffected by this credential.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 NVIDIA LLM 调用中附加当前
            Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source`
            请求头。底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其
            随每个出站请求一并转发，用于可观测性与代理侧传播。NVIDIA API 不
            会消费它们。默认值为 `disabled`，即未开启时请求结构保持不变。该
            接入点仅作用于 LLM 模块，text-embedding 与 rerank 模块不受影响。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
supported_model_types:
  - llm
  - text-embedding
  - rerank
