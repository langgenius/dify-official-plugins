background: "#c7fce2"
configurate_methods:
  - predefined-model
description:
  en_US: An LLM API that matches various application scenarios with high cost-effectiveness.
  zh_Hans: 适配多种海外应用场景的高性价比 LLM API
extra:
  python:
    model_sources:
      - models/llm/llm.py
    provider_source: provider/novita.py
help:
  title:
    en_US: Get your API key from Novita AI
    zh_Hans: 从 Novita AI 获取 API Key
  url:
    en_US: https://novita.ai/settings/key-management?utm_source=dify&utm_medium=ch&utm_campaign=api
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Novita AI
models:
  llm:
    predefined:
      - models/llm/*.yaml
provider: novita
provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
      variable: api_key
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every Novita AI API call. The headers are written into the
            `extra_headers` credential, which the underlying OpenAI SDK
            forwards on every outbound request via the `default_headers`
            client constructor argument. They co-exist with the
            existing `X-Novita-Source: dify.ai` marker (the plugin
            merges the new headers with the existing marker via
            `_update_endpoint_url`). The headers are used for
            observability / proxy-side propagation. Novita AI does not
            document them. Default is `disabled`, so the request shape
            is unchanged unless you opt in. This opt-in applies to the
            LLM endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 Novita AI 调用中附加当前 Dify
            app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
            底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其随每个出站
            请求一并转发。它们会与现有的 `X-Novita-Source: dify.ai` 标记共存
            （插件会在 `_update_endpoint_url` 中将新头与现有标记合并）。
            用于可观测性与代理侧传播。Novita AI API 不会消费它们。默认值为 `disabled`，
            即未开启时请求结构保持不变。该选项仅作用于 LLM 端点。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
supported_model_types:
  - llm
