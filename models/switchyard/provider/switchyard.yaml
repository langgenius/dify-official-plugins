provider: switchyard
label:
  en_US: Switchyard
description:
  en_US: Route each LLM call between a capable and an efficient model with NVIDIA NeMo Switchyard.
  zh_Hans: 使用 NVIDIA NeMo Switchyard 在强模型和便宜模型之间自动路由每一次 LLM 调用。
icon_small:
  en_US: icon.png
icon_large:
  en_US: icon.png
background: "#E5E7EB"
help:
  title:
    en_US: How Switchyard routes requests
    zh_Hans: Switchyard 路由说明
  url:
    en_US: https://github.com/NVIDIA-NeMo/Switchyard/blob/main/docs/routing_algorithms/stage_router_routing.md
supported_model_types:
  - llm
configurate_methods:
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Route Name
      zh_Hans: 路由名称
    placeholder:
      en_US: Name shown in Dify, e.g. auto
      zh_Hans: 在 Dify 中显示的名称，例如 auto
  credential_form_schemas:
    # Capable tier
    - variable: capable_endpoint_url
      label:
        en_US: Capable model API base URL
        zh_Hans: 强模型 API Base URL
      type: text-input
      required: true
      placeholder:
        en_US: Base URL ending in /v1, e.g. https://your-endpoint/v1
        zh_Hans: 以 /v1 结尾的 Base URL，例如 https://your-endpoint/v1
    - variable: capable_api_key
      label:
        en_US: Capable model API key
        zh_Hans: 强模型 API Key
      type: secret-input
      required: false
    - variable: capable_model
      label:
        en_US: Capable model name
        zh_Hans: 强模型名称
      type: text-input
      required: true
      placeholder:
        en_US: Model ID served by this endpoint
        zh_Hans: 该接口提供的模型 ID
    - variable: capable_api_format
      label:
        en_US: Capable model API format
        zh_Hans: 强模型 API 格式
      type: select
      required: true
      default: chat_completions
      options:
        - value: chat_completions
          label:
            en_US: Chat Completions (/chat/completions)
        - value: responses
          label:
            en_US: Responses (/responses)
    # Efficient tier
    - variable: efficient_endpoint_url
      label:
        en_US: Efficient model API base URL
        zh_Hans: 便宜模型 API Base URL
      type: text-input
      required: true
      placeholder:
        en_US: Base URL ending in /v1, e.g. https://your-endpoint/v1
        zh_Hans: 以 /v1 结尾的 Base URL，例如 https://your-endpoint/v1
    - variable: efficient_api_key
      label:
        en_US: Efficient model API key
        zh_Hans: 便宜模型 API Key
      type: secret-input
      required: false
    - variable: efficient_model
      label:
        en_US: Efficient model name
        zh_Hans: 便宜模型名称
      type: text-input
      required: true
      placeholder:
        en_US: Model ID served by this endpoint
        zh_Hans: 该接口提供的模型 ID
    - variable: efficient_api_format
      label:
        en_US: Efficient model API format
        zh_Hans: 便宜模型 API 格式
      type: select
      required: true
      default: chat_completions
      options:
        - value: chat_completions
          label:
            en_US: Chat Completions (/chat/completions)
        - value: responses
          label:
            en_US: Responses (/responses)
    # Routing
    - variable: picker
      label:
        en_US: Default tier when signals are unclear
        zh_Hans: 信号不明确时的默认档
      type: select
      required: false
      default: efficient_first
      options:
        - value: efficient_first
          label:
            en_US: Efficient first (recommended)
            zh_Hans: 优先便宜模型（推荐）
        - value: capable_first
          label:
            en_US: Capable first (experimental)
            zh_Hans: 优先强模型（实验性）
    - variable: confidence_threshold
      label:
        en_US: Confidence threshold
        zh_Hans: 置信度阈值
      type: text-input
      required: false
      default: "0.5"
      placeholder:
        en_US: 0 to 1. Higher needs stronger tool signals before leaving the default tier.
        zh_Hans: 0 到 1。越高，越需要更强的工具信号才会离开默认档。
    - variable: context_size
      label:
        en_US: Context size
        zh_Hans: 上下文长度
      type: text-input
      required: false
      default: "128000"
      placeholder:
        en_US: Use the smaller context window of the two models
        zh_Hans: 填两个模型中较小的上下文长度
    - variable: max_tokens_to_sample
      label:
        en_US: Upper bound for max tokens
        zh_Hans: 最大 token 上限
      type: text-input
      required: false
      default: "8192"
extra:
  python:
    provider_source: provider/switchyard.py
    model_sources:
      - models/llm/llm.py
