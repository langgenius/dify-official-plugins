[project]
name = "switchyard-plugin"
version = "0.0.1"
description = "Dify model provider that routes LLM calls with NVIDIA NeMo Switchyard"
readme = "README.md"
requires-python = ">=3.12"

# Refresh the lockfile with: uv lock
dependencies = [
    "dify_plugin>=0.9.0,<0.11.0",
    "httpx>=0.28.1",
    "nemo-switchyard==0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
