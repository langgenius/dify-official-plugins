background: "#E5E7EB"
configurate_methods:
  - customizable-model
extra:
  python:
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
    provider_source: provider/replicate.py
help:
  title:
    en_US: Get your API Key from Replicate
    zh_Hans: 从 Replicate 获取 API Key
  url:
    en_US: https://replicate.com/account/api-tokens
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Replicate
model_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your Replicate API Key
        zh_Hans: 在此输入您的 Replicate API Key
      required: true
      type: secret-input
      variable: replicate_api_token
    - label:
        en_US: Model Version
      placeholder:
        en_US: Enter your model version, default to the latest version
        zh_Hans: 在此输入您的模型版本，默认为最新版本
      required: false
      type: text-input
      variable: model_version
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every Replicate API call. The headers are written into the
            `extra_headers` credential, which the underlying Replicate SDK
            forwards on every outbound request via the `headers` argument it
            passes to its underlying `httpx.Client`. The headers are used for
            observability / proxy-side propagation. Replicate does not document
            them. Default is `disabled`, so the request shape is unchanged
            unless you opt in. This opt-in applies to the LLM endpoint only.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 Replicate 调用中附加当前 Dify
            app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
            底层 Replicate SDK 会通过其内部 `httpx.Client` 的 `headers` 参数将其随每个
            出站请求一并转发，用于可观测性与代理侧传播。Replicate API 不会消费它们。
            默认值为 `disabled`，即未开启时请求结构保持不变。该选项仅作用于 LLM
            端点。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
      show_on:
        - variable: __model_type
          value: llm
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
provider: replicate
supported_model_types:
  - llm
  - text-embedding
