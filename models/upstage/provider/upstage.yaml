background: '#FFFFF'
configurate_methods:
- predefined-model
description:
  en_US: Models provided by Upstage, such as Solar-1-mini-chat.
  zh_Hans: Upstage 提供的模型，例如 Solar-1-mini-chat.
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/text_embedding/text_embedding.py
    provider_source: provider/upstage.py
help:
  title:
    en_US: Get your API Key from Upstage
    zh_Hans: 从 Upstage 获取 API Key
  url:
    en_US: https://console.upstage.ai/api-keys
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Upstage
model_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: upstage_api_key
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
  text_embedding:
    predefined:
    - models/text_embedding/*.yaml
provider: upstage
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: upstage_api_key
  - default: disabled
    label:
      en_US: Attach Dify app_id as request headers
      zh_Hans: 附加 Dify app_id 作为请求头
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
          every Upstage API call. The headers are written into the
          `extra_headers` credential, which the underlying OpenAI SDK
          forwards on every outbound request via the `default_headers`
          client constructor argument. The headers are used for
          observability / proxy-side propagation. Upstage does not
          document them. Default is `disabled`, so the request shape
          is unchanged unless you opt in. This opt-in applies to the
          LLM endpoint only; the text-embedding endpoint is not
          affected.
        zh_Hans: |-
          启用后，插件会通过 `extra_headers` 凭据在每次 Upstage 调用中附加当前 Dify
          app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
          底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其随每个出站
          请求一并转发，用于可观测性与代理侧传播。Upstage API 不会消费它们。
          默认值为 `disabled`，即未开启时请求结构保持不变。该选项仅作用于 LLM
          端点，不会影响 text-embedding 端点。
    options:
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    required: false
    show_on: []
    type: select
    variable: enable_request_metadata
supported_model_types:
- llm
- text-embedding
