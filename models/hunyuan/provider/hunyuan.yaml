background: '#F6F7F7'
configurate_methods:
- predefined-model
description:
  en_US: Models provided by Tencent Hunyuan, such as hunyuan-standard, hunyuan-standard-256k,
    hunyuan-pro and hunyuan-lite.
  zh_Hans: 腾讯混元提供的模型，例如 hunyuan-standard、 hunyuan-standard-256k, hunyuan-pro 和 hunyuan-lite。
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/text_embedding/text_embedding.py
    provider_source: provider/hunyuan.py
help:
  title:
    en_US: Get your API Key from Tencent Hunyuan
    zh_Hans: 从腾讯混元获取 API Key
  url:
    en_US: https://console.cloud.tencent.com/cam/capi
icon_large:
  en_US: icon_l_en.png
icon_small:
  en_US: icon_s_en.png
label:
  en_US: Hunyuan
  zh_Hans: 腾讯混元
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
  text_embedding:
    predefined:
    - models/text_embedding/*.yaml
provider: hunyuan
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: Secret ID
    placeholder:
      en_US: Enter your Secret ID
      zh_Hans: 在此输入您的 Secret ID
    required: true
    type: secret-input
    variable: secret_id
  - label:
      en_US: Secret Key
    placeholder:
      en_US: Enter your Secret Key
      zh_Hans: 在此输入您的 Secret Key
    required: true
    type: secret-input
    variable: secret_key
  - default: disabled
    label:
      en_US: Attach Dify app_id as request headers
      zh_Hans: 附加 Dify app_id 作为请求头
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
          every Hunyuan API call. The headers are written into the
          `extra_headers` credential, which the underlying Tencent SDK
          forwards on every outbound request by attaching the dict to
          `request.headers` on the `ChatCompletionsRequest` object. The
          SDK's `HunyuanClient.ChatCompletions` then passes them through
          to `_call_and_deserialize(..., headers=request.headers)`. The
          headers are used for observability / proxy-side propagation.
          Tencent Hunyuan does not document them. Default is `disabled`,
          so the request shape is unchanged unless you opt in. This
          opt-in applies to the LLM endpoint only.
        zh_Hans: |-
          启用后，插件会通过 `extra_headers` 凭据在每次 Hunyuan 调用中附加当前 Dify
          app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
          底层腾讯云 SDK 会将 `extra_headers` 字典赋值给 `ChatCompletionsRequest`
          的 `headers` 属性，并由 `HunyuanClient.ChatCompletions` 透传给
          `_call_and_deserialize(..., headers=request.headers)`，用于可观测性
          与代理侧传播。腾讯云 Hunyuan API 不会消费它们。默认值为 `disabled`，
          即未开启时请求结构保持不变。该选项仅作用于 LLM 端点。
    options:
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    required: false
    show_on:
    - variable: __model_type
      value: llm
    type: select
supported_model_types:
- llm
- text-embedding
