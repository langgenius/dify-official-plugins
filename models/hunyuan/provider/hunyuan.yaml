background: '#F6F7F7'
configurate_methods:
- predefined-model
description:
  en_US: Tencent Hunyuan chat, image generation, and text embedding models.
  zh_Hans: 腾讯混元提供的对话、生图和文本嵌入模型。
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/text_embedding/text_embedding.py
    provider_source: provider/hunyuan.py
help:
  title:
    en_US: Get your Tencent Cloud TokenHub API key
    zh_Hans: 获取腾讯云 TokenHub API Key
  url:
    en_US: https://console.cloud.tencent.com/tokenhub/apikey
icon_large:
  en_US: icon.svg
icon_large_dark:
  en_US: icon-dark.svg
icon_small:
  en_US: icon.svg
icon_small_dark:
  en_US: icon-dark.svg
label:
  en_US: Hunyuan
  zh_Hans: 腾讯混元
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
  text_embedding:
    predefined:
    - models/text_embedding/*.yaml
provider: hunyuan
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: TokenHub API Key
      zh_Hans: TokenHub API Key
    placeholder:
      en_US: Required for Hy4, Hy4 Flash, Hy3, and Hy-Image
      zh_Hans: Hy4、Hy4 Flash、Hy3 和 Hy-Image 模型需要此密钥
    required: false
    type: secret-input
    variable: tokenhub_api_key
  - label:
      en_US: Secret ID
    placeholder:
      en_US: Enter your Secret ID
      zh_Hans: 在此输入您的 Secret ID
    required: false
    type: secret-input
    variable: secret_id
  - label:
      en_US: Secret Key
    placeholder:
      en_US: Enter your Secret Key
      zh_Hans: 在此输入您的 Secret Key
    required: false
    type: secret-input
    variable: secret_key
supported_model_types:
- llm
- text-embedding
