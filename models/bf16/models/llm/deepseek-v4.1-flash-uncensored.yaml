model: "deepseek/deepseek-v4.1-flash-uncensored"
label:
  en_US: "DeepSeek V4.1 Flash Uncensored"
  zh_Hans: "DeepSeek V4.1 Flash Uncensored"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 130000
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    help:
      en_US: Specify the format that the model must output.
      zh_Hans: 指定模型必须输出的格式。
    required: false
    default: text
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.260000"
  output: "1.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
