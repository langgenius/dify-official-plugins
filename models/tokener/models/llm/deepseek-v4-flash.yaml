model: "deepseek-v4-flash"
label:
  en_US: "deepseek-v4-flash"
  zh_Hans: "deepseek-v4-flash"
model_type: llm
features:
  - tool-call
  - stream-tool-call
  - agent-thought
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: temperature
    use_template: temperature
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    min: 0.01
    max: 1
  - name: presence_penalty
    use_template: presence_penalty
    min: -2
    max: 2
  - name: frequency_penalty
    use_template: frequency_penalty
    min: -2
    max: 2
  - name: seed
    type: int
    required: false
pricing:
  input: "0.440000"
  output: "1.320000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
