model: "o3"
label:
  en_US: "o3"
  zh_Hans: "o3"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 100000
    min: 1
    max: 100000
  - name: reasoning_effort
    type: string
    required: false
    options:
      - low
      - medium
      - high
  - name: enable_stream
    type: boolean
    required: true
    default: true
  - name: reasoning_summary
    type: string
    required: false
    options:
      - auto
  - name: service_tier
    type: string
    required: false
    default: auto
    options:
      - auto
      - default
      - flex
      - priority
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "2.000000"
  output: "8.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
