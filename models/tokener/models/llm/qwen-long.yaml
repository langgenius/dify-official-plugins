model: "qwen-long"
label:
  en_US: "qwen-long"
  zh_Hans: "qwen-long"
model_type: llm
features:
  - document
  - structured-output
model_properties:
  mode: chat
  context_size: 10000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 2000
    min: 1
    max: 32768
  - name: temperature
    use_template: temperature
    type: float
    default: 0.3
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
    type: float
    default: 0.8
    min: 0.1
    max: 0.9
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_object
  - name: json_schema
    use_template: json_schema
  - name: top_k
    type: int
    min: 0
    max: 99
  - name: seed
    required: false
    type: int
    default: 1234
  - name: repetition_penalty
    required: false
    type: float
    default: 1.1
pricing:
  input: "0.072000"
  output: "0.287000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
