model: "gpt-5.6-sol"
label:
  en_US: "gpt-5.6-sol"
  zh_Hans: "gpt-5.6-sol"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: seed
    type: int
    required: false
  - name: reasoning_effort
    type: string
    required: false
    default: medium
    options:
      - none
      - low
      - medium
      - high
      - xhigh
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    help:
      en_US: Specify the format that the model must output.
      zh_Hans: 指定模型必须输出的格式。
    required: false
    default: text
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "4.000000"
  output: "20.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
