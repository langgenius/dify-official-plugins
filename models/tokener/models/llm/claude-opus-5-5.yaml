model: "claude-opus-5-5"
label:
  en_US: "claude-opus-5-5"
  zh_Hans: "claude-opus-5-5"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 128000
    min: 1
    max: 128000
  - name: prompt_caching_tool_definitions
    type: boolean
    default: true
    required: false
  - name: prompt_caching_system_message
    type: boolean
    default: true
    required: false
  - name: prompt_caching_images
    type: boolean
    default: true
    required: false
  - name: prompt_caching_documents
    type: boolean
    default: true
    required: false
  - name: prompt_caching_tool_results
    type: boolean
    default: true
    required: false
  - name: prompt_caching_ttl
    type: string
    default: 5m
    required: true
    options:
      - 5m
      - 1h
  - name: prompt_caching_message_flow
    type: int
    default: 0
    required: false
  - name: thinking
    type: boolean
    required: false
  - name: thinking_display
    type: string
    default: summarized
    required: false
    options:
      - omitted
      - summarized
  - name: effort
    type: string
    default: medium
    required: false
    options:
      - low
      - medium
      - high
      - xhigh
      - max
  - name: response_format
    use_template: response_format
  - name: json_schema
    use_template: json_schema
  - name: task_budget
    type: int
    default: 0
    min: 0
    max: 1000000
    required: false
pricing:
  input: "4.000000"
  output: "20.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
