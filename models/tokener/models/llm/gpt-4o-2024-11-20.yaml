model: "gpt-4o-2024-11-20"
label:
  en_US: "gpt-4o-2024-11-20"
  zh_Hans: "gpt-4o-2024-11-20"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 16384
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: enable_stream
    type: boolean
    required: false
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: service_tier
    type: string
    required: false
    default: auto
    options:
      - auto
      - default
      - priority
pricing:
  input: "2.500000"
  output: "10.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
