model: "qwen-mt-flash"
label:
  en_US: "qwen-mt-flash"
  zh_Hans: "qwen-mt-flash"
model_type: llm
features:
  - agent-thought
model_properties:
  mode: chat
  context_size: 8192
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 8192
  - name: source_lang
    type: string
    required: false
  - name: target_lang
    type: string
    required: false
  - name: domains
    type: string
    required: false
pricing:
  input: "0.160000"
  output: "0.490000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
