model: "kimi-k2.5"
label:
  en_US: "kimi-k2.5"
  zh_Hans: "kimi-k2.5"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - agent-thought
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 1024
    min: 1
    max: 32768
  - name: temperature
    use_template: temperature
    type: float
    default: 0.6
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
    type: float
    default: 0.95
    min: 0.0
    max: 1.0
  - name: enable_thinking
    type: boolean
    default: false
    required: false
  - name: thinking_budget
    required: false
    type: int
    default: 512
    min: 1
    max: 32768
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_object
pricing:
  input: "0.574000"
  output: "3.011000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
