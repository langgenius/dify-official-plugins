model: "qwen3-vl-plus"
label:
  en_US: "qwen3-vl-plus"
  zh_Hans: "qwen3-vl-plus"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 8192
    min: 1
    max: 32768
  - name: seed
    required: false
    type: int
    default: 1234
  - name: enable_search
    type: boolean
    required: false
  - name: enable_thinking
    required: false
    type: boolean
    default: false
  - name: thinking_budget
    required: false
    type: int
    default: 512
    min: 1
    max: 8192
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_object
  - name: json_schema
    use_template: json_schema
  - name: temperature
    use_template: temperature
    type: float
    default: 0.3
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
    type: float
    default: 0.8
    min: 0.1
    max: 1.0
  - name: top_k
    type: int
    min: 0
    max: 99
  - name: repetition_penalty
    required: false
    type: float
    default: 1.1
pricing:
  input: "0.200000"
  output: "1.600000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
