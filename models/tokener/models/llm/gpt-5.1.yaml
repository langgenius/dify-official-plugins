model: "gpt-5.1"
label:
  en_US: "gpt-5.1"
  zh_Hans: "gpt-5.1"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 400000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 128000
  - name: reasoning_effort
    type: string
    required: false
    default: medium
    options:
      - low
      - medium
      - high
  - name: enable_stream
    type: boolean
    required: false
  - name: reasoning_summary
    type: string
    required: false
    options:
      - auto
  - name: service_tier
    type: string
    required: false
    options:
      - auto
      - default
      - flex
      - priority
  - name: verbosity
    type: string
    required: false
    options:
      - low
      - medium
      - high
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    help:
      en_US: Specify the format that the model must output.
      zh_Hans: 指定模型必须输出的格式。
    required: false
    default: text
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "1.250000"
  output: "10.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
