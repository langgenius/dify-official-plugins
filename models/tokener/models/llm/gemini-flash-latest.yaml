model: "gemini-flash-latest"
label:
  en_US: "gemini-flash-latest"
  zh_Hans: "gemini-flash-latest"
model_type: llm
features:
  - tool-call
  - vision
  - document
  - video
  - audio
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: use_inline_file
    type: boolean
    required: false
  - name: grounding
    type: boolean
    required: false
  - name: url_context
    type: boolean
    required: false
  - name: code_execution
    type: boolean
    required: false
  - name: include_thoughts
    type: boolean
    required: false
  - name: thinking_mode
    type: boolean
    required: false
  - name: thinking_budget
    type: int
    required: false
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    help:
      en_US: Specify the format that the model must output.
      zh_Hans: 指定模型必须输出的格式。
    required: false
    default: text
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.750000"
  output: "3.750000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
