model: "claude-sonnet-4-5-20250929"
label:
  en_US: "claude-sonnet-4-5-20250929"
  zh_Hans: "claude-sonnet-4-5-20250929"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 64000
    min: 1
    max: 64000
  - name: prompt_caching_tool_definitions
    type: boolean
    default: true
    required: false
  - name: prompt_caching_system_message
    type: boolean
    default: true
    required: false
  - name: prompt_caching_images
    type: boolean
    default: true
    required: false
  - name: prompt_caching_documents
    type: boolean
    default: true
    required: false
  - name: prompt_caching_tool_results
    type: boolean
    default: true
    required: false
  - name: prompt_caching_message_flow
    type: int
    default: 0
    required: false
  - name: thinking
    type: boolean
    default: false
    required: false
  - name: thinking_display
    type: string
    required: false
    options:
      - summarized
      - omitted
  - name: thinking_budget
    type: int
    default: 1024
    min: 0
    max: 64000
    required: false
  - name: response_format
    use_template: response_format
  - name: json_schema
    use_template: json_schema
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: top_k
    type: int
    required: false
  - name: context_1m
    type: boolean
    default: true
    required: false
pricing:
  input: "3.000000"
  output: "15.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
