model: "gpt-5.4-nano-2026-03-17"
label:
  en_US: "gpt-5.4-nano-2026-03-17"
  zh_Hans: "gpt-5.4-nano-2026-03-17"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
  - agent-thought
  - structured-output
model_properties:
  mode: chat
  context_size: 400000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 128000
  - name: reasoning_effort
    type: string
    required: false
    default: none
    options:
      - none
      - low
      - medium
      - high
      - xhigh
  - name: enable_stream
    type: boolean
    required: true
    default: true
  - name: reasoning_summary
    type: string
    required: false
    options:
      - auto
  - name: service_tier
    type: string
    required: false
    default: auto
    options:
      - auto
      - default
      - flex
  - name: verbosity
    type: string
    required: false
    default: medium
    options:
      - low
      - medium
      - high
  - name: response_format
    type: string
    required: false
    options:
      - text
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.200000"
  output: "1.250000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
