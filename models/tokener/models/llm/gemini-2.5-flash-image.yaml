model: "gemini-2.5-flash-image"
label:
  en_US: "gemini-2.5-flash-image"
  zh_Hans: "gemini-2.5-flash-image"
model_type: llm
features:
  - vision
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 32768
