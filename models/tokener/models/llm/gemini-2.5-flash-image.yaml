    use_template: temperature
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    min: 0.01
    max: 1
pricing:
  input: "0.300000"
  output: "30.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
