model: "gemini-2.5-flash-image"
label:
  en_US: "gemini-2.5-flash-image"
  zh_Hans: "gemini-2.5-flash-image"
model_type: llm
features:
  - vision
  - document
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 32768
  - name: temperature
    type: float
    required: true
    default: 1
    min: 0
    max: 1
  - name: top_p
    use_template: top_p
    min: 0.01
    max: 1
  - name: top_k
    type: int
    min: 0
    max: 100
  - name: use_inline_file
    type: boolean
    required: false
  - name: aspect_ratio
    type: string
    required: true
    default: Auto
    options:
      - Auto
      - '1:1'
      - '9:16'
      - '16:9'
      - '3:4'
      - '4:3'
      - '3:2'
      - '2:3'
      - '5:4'
      - '4:5'
      - '21:9'
  - name: flex_inference
    type: boolean
    required: true
    default: false
  - name: max_output_tokens
    type: float
    required: true
    default: 32768
    min: 1
    max: 32768
pricing:
  input: "0.300000"
  output: "30.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
