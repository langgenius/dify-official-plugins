model: "gemini-3-pro-image-preview"
label:
  en_US: "gemini-3-pro-image-preview"
  zh_Hans: "gemini-3-pro-image-preview"
model_type: llm
features:
  - vision
  - document
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 32768
  - name: temperature
    use_template: temperature
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    min: 0.01
    max: 1
  - name: top_k
    type: int
    min: 0
    max: 100
  - name: use_inline_file
    type: boolean
    required: false
  - name: media_resolution
    type: string
    required: false
    options:
      - Default
      - Low
      - Medium
      - High
  - name: aspect_ratio
    type: string
    required: false
  - name: resolution
    type: string
    required: false
    options:
      - 1K
      - 2K
      - 4K
pricing:
  input: "2.000000"
  output: "120.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
