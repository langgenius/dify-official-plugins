model: "gpt-4o-mini-2024-07-18"
label:
  en_US: "gpt-4o-mini-2024-07-18"
  zh_Hans: "gpt-4o-mini-2024-07-18"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 16384
  - name: temperature
    use_template: temperature
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    min: 0
    max: 1
  - name: presence_penalty
    use_template: presence_penalty
    min: -2
    max: 2
  - name: frequency_penalty
    use_template: frequency_penalty
    min: -2
    max: 2
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    help:
      en_US: Specify the format that the model must output.
      zh_Hans: 指定模型必须输出的格式。
    required: false
    default: text
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.150000"
  output: "0.600000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
