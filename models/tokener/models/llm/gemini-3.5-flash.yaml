model: "gemini-3.5-flash"
label:
  en_US: "gemini-3.5-flash"
  zh_Hans: "gemini-3.5-flash"
model_type: llm
features:
  - tool-call
  - vision
  - document
  - video
  - audio
  - agent-thought
  - structured-output
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: temperature
    use_template: temperature
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    min: 0.01
    max: 1
  - name: top_k
    type: int
    min: 0
    max: 100
  - name: use_inline_file
    type: boolean
    required: false
  - name: media_resolution
    type: string
    required: true
    default: Default
    options:
      - Default
      - Low
      - Medium
      - High
  - name: grounding
    type: boolean
    required: true
    default: false
  - name: url_context
    type: boolean
    required: true
    default: false
  - name: code_execution
    type: boolean
    required: true
    default: false
  - name: include_thoughts
    type: boolean
    required: true
    default: false
  - name: thinking_level
    type: string
    required: true
    default: Medium
    options:
      - Minimal
      - Low
      - Medium
      - High
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    help:
      en_US: Specify the format that the model must output.
      zh_Hans: 指定模型必须输出的格式。
    required: false
    default: text
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: max_output_tokens
    use_template: max_tokens
    type: int
    required: true
    default: 65536
    min: 1
    max: 65536
  - name: service_tier
    type: string
    required: true
    default: standard
    options:
      - flex
      - standard
      - priority
pricing:
  input: "1.500000"
  output: "9.000000"
  unit: "0.000001"
  currency: "USD"
deprecated: false
