background: '#F9FAFB'
configurate_methods:
- customizable-model
- predefined-model
description:
  en_US: Volcengine Ark pre-provided model invocation.
  zh_Hans: 火山方舟预置模型调用。
extra:
  python:
    model_sources:
    - models/llm/llm.py
    provider_source: provider/volcengine.py
help:
  title:
    en_US: Get your Ark API Key from Volcengine Console
    zh_Hans: 从火山引擎控制台获取 Ark API Key
  url:
    en_US: https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey
    zh_Hans: https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey
icon_large:
  en_US: icon_l_en.svg
  zh_Hans: icon_l_zh.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Volcengine Ark
  zh_Hans: 火山方舟
model_credential_schema:
  model:
    label:
      en_US: Video Model ID / Endpoint ID
      zh_Hans: 视频模型 ID / Endpoint ID
    placeholder:
      en_US: Enter a video model ID or Endpoint ID, e.g. doubao-seedance-2-0-260128 or ep-xxx
      zh_Hans: 输入视频模型 ID 或 Endpoint ID，例如 doubao-seedance-2-0-260128 或 ep-xxx
  credential_form_schemas:
  - label:
      en_US: API Key
      zh_Hans: API Key
    placeholder:
      en_US: Enter your Ark API Key
      zh_Hans: 输入 Ark API Key
    required: true
    type: secret-input
    variable: ark_api_key
  - default: https://ark.cn-beijing.volces.com/api/v3
    label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: https://ark.cn-beijing.volces.com/api/v3
      zh_Hans: https://ark.cn-beijing.volces.com/api/v3
    required: true
    type: text-input
    variable: api_endpoint_host
  - default: video_generation
    label:
      en_US: Endpoint Type
      zh_Hans: Endpoint Type
    options:
    - label:
        en_US: Video Generation
        zh_Hans: 视频生成
      value: video_generation
    required: true
    type: select
    variable: endpoint_type
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
    - models/llm/*.yaml
provider: volcengine
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
      zh_Hans: API Key
    placeholder:
      en_US: Enter your Ark API Key
      zh_Hans: 输入 Ark API Key
    required: true
    type: secret-input
    variable: ark_api_key
  - default: https://ark.cn-beijing.volces.com/api/v3
    label:
      en_US: API Base URL
      zh_Hans: API Base URL
    placeholder:
      en_US: https://ark.cn-beijing.volces.com/api/v3
      zh_Hans: https://ark.cn-beijing.volces.com/api/v3
    required: true
    type: text-input
    variable: api_endpoint_host
  - label:
      en_US: Enable request metadata
      zh_Hans: 启用请求元数据
    help:
      text:
        en_US: >-
          Attach Dify app_id and dify_source to each Ark request as a
          metadata field in the body, so usage can be attributed to a
          specific Dify app. The Ark API is OpenAI-compatible and
          silently ignores unknown body fields, so this is safe whether
          or not the upstream service consumes the field. Default is
          disabled.
        zh_Hans: >-
          将 Dify app_id 与 dify_source 作为 metadata 字段附加到每次 Ark 请求
          的 body 中，以便按 Dify 应用归因用量。Ark API 兼容 OpenAI 协议，
          会静默忽略未知的 body 字段，因此无论上游服务是否消费该字段都安全。
          默认禁用。
    options:
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    required: false
    type: select
    variable: enable_request_metadata
    default: disabled
supported_model_types:
- llm
