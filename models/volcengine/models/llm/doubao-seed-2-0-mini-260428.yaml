model: doubao-seed-2-0-mini-260428
label:
  en_US: doubao-seed-2-0-mini-260428
  zh_Hans: doubao-seed-2-0-mini-260428
model_type: llm
features:
  - agent-thought
  - vision
  - video
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: reasoning_effort
    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: high
    options:
      - none
      - minimal
      - low
      - medium
      - high
      - xhigh
      - max
    help:
      zh_Hans: 控制思维链长度，平衡效果、时延与成本。none/minimal 关闭思考直接回答；low 轻量思考侧重快速响应；medium 均衡模式；high 深度分析；xhigh/max 进一步加长思维链处理最复杂的问题。
      en_US: Controls chain-of-thought length to balance quality, latency, and cost. none/minimal answer directly without thinking; low favors fast response; medium is balanced; high enables deep analysis; xhigh/max extend the chain further for the hardest problems.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.2"
  output: "2.0"
  unit: "0.000001"
  currency: RMB
