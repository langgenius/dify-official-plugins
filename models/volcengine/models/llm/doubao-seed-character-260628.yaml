model: doubao-seed-character-260628
label:
  en_US: doubao-seed-character-260628
  zh_Hans: doubao-seed-character-260628
model_type: llm
features:
  - agent-thought
  - vision
  - video
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
  - name: thinking
    label:
      zh_Hans: 深度思考模式
      en_US: Thinking Mode
    type: string
    required: false
    default: enabled
    options:
      - enabled
    help:
      zh_Hans: 启用后模型会在回答前进行系统性分析和多步骤规划。本模型的分级思考强度依赖该参数为 enabled，故不提供 disabled 选项；要关闭思考请把下面的思考强度设为 none 或 minimal。
      en_US: When enabled, the model performs systematic analysis and multi-step planning before answering. This model's graded reasoning levels require this to be enabled, so no disabled option is offered; to turn thinking off, set Reasoning Effort below to none or minimal.
  - name: reasoning_effort
    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: high
    options:
      - none
      - minimal
      - low
      - medium
      - high
      - xhigh
      - max
    help:
      zh_Hans: 控制思维链长度。none/minimal 直接回答不思考；low 至 max 逐级加长思维链。
      en_US: Controls chain-of-thought length. none/minimal answer directly without thinking; low through max progressively lengthen the chain.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.8"
  output: "2.0"
  unit: "0.000001"
  currency: RMB
