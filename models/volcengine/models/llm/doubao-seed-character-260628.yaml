model: doubao-seed-character-260628
label:
  en_US: doubao-seed-character-260628
  zh_Hans: doubao-seed-character-260628
model_type: llm
features:
  - agent-thought
  - vision
  - video
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
  - name: thinking
    label:
      zh_Hans: 深度思考模式
      en_US: Thinking Mode
    type: string
    required: false
    default: enabled
    options:
      - enabled
      - disabled
    help:
      zh_Hans: 启用后模型会在回答前进行系统性分析和多步骤规划，适用于复杂推理任务。
      en_US: When enabled, the model performs systematic analysis and multi-step planning before answering, suitable for complex reasoning tasks.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.8"
  output: "2.0"
  unit: "0.000001"
  currency: RMB
