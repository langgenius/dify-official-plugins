    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: max
    options:
      - low
      - high
      - max
    help:
      zh_Hans: 控制思维链长度以平衡质量、延迟与成本。low 快速响应；high 深度分析；max 为最难任务最大化推理。
      en_US: Controls chain-of-thought length to balance quality, latency, and cost. low favors fast response; high enables deep analysis; max maximizes reasoning for hardest tasks.
  - name: max_tokens
    use_template: max_tokens
    max: 131072
    default: 32768
pricing:
  input: "0.8"
