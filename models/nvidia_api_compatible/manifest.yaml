version: 0.1.0
type: plugin
author: "dangnhuhieu"
name: "nvidia_api_compatible"
description:
  en_US: NVIDIA NIM / build.nvidia.com models (LLM, Text Embedding, Rerank) with configurable endpoint, model name and per-type request parameters such as input_type and truncate.
  zh_Hans: NVIDIA NIM / build.nvidia.com 模型（LLM、文本向量、重排序），可配置端点、模型名称以及 input_type、truncate 等参数。
label:
  en_US: "NVIDIA API Compatible"
created_at: "2026-11-06T00:00:00.000000000Z"
icon: icon.svg
resource:
  memory: 1048576
  permission:
    model:
      enabled: true
      llm: true
      text_embedding: true
      rerank: true
      tts: false
      speech2text: false
      moderation: false
plugins:
  models:
    - "provider/nvidia_api_compatible.yaml"
meta:
  version: 0.0.1
  arch:
    - "amd64"
    - "arm64"
  runner:
    language: "python"
    version: "3.12"
    entrypoint: "main"
