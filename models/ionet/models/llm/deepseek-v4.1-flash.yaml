model: deepseek-ai/DeepSeek-V4.1-Flash
label:
  en_US: DeepSeek V4.1 Flash
  zh_Hans: DeepSeek V4.1 Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 262124
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 131072
    help:
      zh_Hans: 指定生成结果长度的上限。如果生成结果截断，可以调大该参数。
      en_US: Specifies the upper limit on the length of generated results. If truncated, increase this parameter.
  - name: frequency_penalty
    use_template: frequency_penalty
