model: meta-llama/Llama-3.3-70B-Instruct
label:
  en_US: Llama 3.3 70B Instruct
  zh_Hans: Llama 3.3 70B Instruct
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 32768
    help:
      zh_Hans: 指定生成结果长度的上限。如果生成结果截断，可以调大该参数。
      en_US: Specifies the upper limit on the length of generated results. If truncated, increase this parameter.
  - name: frequency_penalty
    use_template: frequency_penalty
pricing:
  input: "0.6066"
  output: "1.0386"
  unit: "0.000001"
  currency: USD
