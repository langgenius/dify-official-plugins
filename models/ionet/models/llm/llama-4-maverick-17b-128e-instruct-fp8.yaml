model: meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8
label:
  en_US: Llama 4 Maverick 17B 128E Instruct FP8
  zh_Hans: Llama 4 Maverick 17B 128E Instruct FP8
model_type: llm
features:
  - vision
model_properties:
  mode: chat
  context_size: 430000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 32768
