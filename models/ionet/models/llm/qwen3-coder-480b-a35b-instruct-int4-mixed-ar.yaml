model: Intel/Qwen3-Coder-480B-A35B-Instruct-int4-mixed-ar
label:
  en_US: Qwen3 Coder 480B A35B Instruct INT4 Mixed AR
  zh_Hans: Qwen3 Coder 480B A35B Instruct INT4 Mixed AR
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 106000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 32768
    help:
      zh_Hans: 指定生成结果长度的上限。如果生成结果截断，可以调大该参数。
      en_US: Specifies the upper limit on the length of generated results. If truncated, increase this parameter.
  - name: frequency_penalty
    use_template: frequency_penalty
pricing:
  input: "0.445"
  output: "2.145"
  unit: "0.000001"
  currency: USD
