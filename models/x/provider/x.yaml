configurate_methods:
  - predefined-model
description:
  en_US:
    xAI is a company working on building artificial intelligence to accelerate
    human scientific discovery. We are guided by our mission to advance our collective
    understanding of the universe.
extra:
  python:
    model_sources:
      - models/llm/llm.py
    provider_source: provider/x.py
models:
  llm:
    predefined:
      - models/llm/*.yaml
help:
  title:
    en_US: Get your token from xAI
    zh_Hans: 从 xAI 获取 token
  url:
    en_US: https://x.ai/api
icon_large:
  en_US: x-ai-logo.svg
icon_small:
  en_US: x-ai-logo.svg
label:
  en_US: xAI
provider: x
provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
      variable: api_key
    - default: grok-4.6
      label:
        en_US: Model
        zh_Hans: 模型
      options:
        - label:
            en_US: grok-4.6
          value: grok-4.6
        - label:
            en_US: grok-4.5
          value: grok-4.5
        - label:
            en_US: grok-4.3
          value: grok-4.3
        - label:
            en_US: grok-4-fast
          value: grok-4-fast
        - label:
            en_US: grok-4-fast-non-reasoning
          value: grok-4-fast-non-reasoning
        - label:
            en_US: grok-4
          value: grok-4
        - label:
            en_US: grok-4-1-fast
          value: grok-4-1-fast
        - label:
            en_US: grok-4-1-fast-non-reasoning
          value: grok-4-1-fast-non-reasoning
        - label:
            en_US: grok-4.20-beta-latest
          value: grok-4.20-beta-latest
        - label:
            en_US: grok-4.20-beta-latest-non-reasoning
          value: grok-4.20-beta-latest-non-reasoning
        - label:
            en_US: grok-4.20-multi-agent-beta-latest
          value: grok-4.20-multi-agent-beta-latest
        - label:
            en_US: grok-code-fast-1
          value: grok-code-fast-1
        - label:
            en_US: grok-3-mini
          value: grok-3-mini
        - label:
            en_US: grok-3
          value: grok-3
      required: false
      type: select
      variable: model
    - default: https://api.x.ai/v1
      label:
        en_US: API Base URL
      placeholder:
        en_US: Enter your API Base URL
        zh_Hans: 在此输入您的 API Base URL
      required: false
      type: text-input
      variable: endpoint_url
    - default: disabled
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every xAI SDK call. The headers are written into the
            `extra_headers` credential, which the underlying OAICompat base
            class merges into the outbound request alongside the rest of the
            headers. The headers are forwarded by the underlying HTTP client
            and are used for observability / proxy-side propagation. xAI
            does not document them. Default is `disabled`, so the request
            shape is unchanged unless you opt in.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 xAI 调用中附加当前 Dify
            app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
            底层 OAICompat 基类会将其与其它请求头合并后一并发送。这些请求头由底层
            HTTP 客户端转发，用于可观测性与代理侧传播，xAI API 不会消费它们。
            默认值为 `disabled`，即未开启时请求结构保持不变。
      options:
        - label:
            en_US: Enabled
            zh_Hans: 启用
          value: enabled
        - label:
            en_US: Disabled
            zh_Hans: 禁用
          value: disabled
      required: false
      show_on: []
      type: select
      variable: enable_request_metadata
supported_model_types:
  - llm
