model: grok-4.6
label:
  en_US: grok-4.6
model_type: llm
features:
  - vision
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - structured-output
model_properties:
  mode: chat
  context_size: 500000
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1.0
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
  - name: reasoning_effort
    label:
      zh_Hans: 推理工作
      en_US: reasoning_effort
    type: string
    help:
      zh_Hans: 限制推理模型的推理工作
      en_US: constrains effort on reasoning for reasoning models
    required: false
    default: high
    options:
      - low
      - medium
      - high
      - xhigh
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
  - name: search_parameters
    label:
      zh_Hans: 联网搜索参数
      en_US: Live Search Parameters
    type: text
    default: "{\n  \"mode\": \"on\"\n}"
    help:
      zh_Hans: 联网搜索的 JSON 参数，支持 mode、max_search_results、return_citations、sources、from_date 和 to_date，详见 https://docs.x.ai/developers/rest-api-reference/inference/chat
      en_US: JSON parameters for live search. Supported keys include mode, max_search_results, return_citations, sources, from_date, and to_date. See https://docs.x.ai/developers/rest-api-reference/inference/chat
    required: false
  - name: service_tier
    label:
      zh_Hans: 服务层级
      en_US: Service Tier
    type: string
    help:
      zh_Hans: Default 使用标准处理，Priority 使用双倍价格的低延迟处理
      en_US: Default uses standard processing; Priority uses lower-latency processing at twice the price
    required: false
    default: default
    options:
      - default
      - priority
# Base standard pricing below the 200k prompt threshold. Cached, long-context,
# and priority rates are not representable by PriceConfig.
pricing:
  input: "2.00"
  output: "6.00"
  unit: "0.000001"
  currency: USD
