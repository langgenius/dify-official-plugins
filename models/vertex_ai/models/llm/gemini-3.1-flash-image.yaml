# https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-1-flash-image
model: gemini-3.1-flash-image
label:
  en_US: Nano Banana 2 (Gemini 3.1 Flash Image)
model_type: llm
features:
  - vision
  - document
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    type:  float
    required: true
    default: 1
    min: 0
    max: 2
    label:
      en_US: Temperature
      zh_Hans: 温度
    help:
      en_US: For Gemini 3, best results at default 1.0. Lower values may impact reasoning.
      zh_Hans: 对于 Gemini 3，使用默认值 1.0 可获得最佳效果。数值过低可能会影响推理能力。
  - name: aspect_ratio
    type: string
    required: true
    default: "Auto"
    options:
      - "Auto"
      - "1:1"
      - "9:16"
      - "16:9"
      - "3:4"
      - "4:3"
      - "3:2"
      - "2:3"
      - "5:4"
      - "4:5"
      - "21:9"
      - "4:1"
      - "1:4"
      - "8:1"
      - "1:8"
    label:
      en_US: Aspect ratio
      zh_Hans: 宽高比
    help:
      en_US: Aspect ratio of the generated images.
      zh_Hans: 生成图片的宽高比。
  - name: resolution
    type: string
    required: true
    default: "1K"
    options:
      - "512"
      - "1K"
      - "2K"
      - "4K"
    label:
      en_US: Resolution
      zh_Hans: 分辨率
    help:
      en_US: Resolution of the generated images. Defaults to 1K.
      zh_Hans: 生成图片的分辨率，默认为 1K。
  - name: include_thoughts
    type: boolean
    required: true
    default: true
    label:
      en_US: Include thoughts
      zh_Hans: 返回思考过程
    help:
      en_US: Indicates whether to include thoughts in the response. If true, thoughts are returned only if the model supports thought and thoughts are available. Default is true.
      zh_Hans: 是否返回思考过程。若为 true 则只有模型支持思考且启动思考模式时才返回思考过程。默认为 true。
  - name: max_output_tokens
    type: int
    required: true
    default: 32768
    min: 1
    max: 32768
    label:
        en_US: Output length
        zh_Hans: 输出长度
    help:
      en_US: Maximum number of tokens in response
      zh_Hans: 最大生成 tokens 数
# https://cloud.google.com/vertex-ai/generative-ai/pricing (Standard, global endpoint)
pricing:
  # Text output is $3 per 1,000,000 tokens; image output is $60 per 1,000,000 tokens.
  # Output images consume 747 tokens at 512, 1120 at 1K, 1680 at 2K and 2520 at 4K,
  # so a 1K image costs about $0.067. Output is priced at the image rate.
  input: '0.5'
  output: '60.0'
  unit: '0.000001'
  currency: USD
