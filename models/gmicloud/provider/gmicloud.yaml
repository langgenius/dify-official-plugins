provider: gmicloud
label:
  en_US: "GMI Cloud"
description:
  en_US: "Models provided by GMI Cloud."
  zh_Hans: "GMI Cloud 提供的模型。"
  ja_JP: "GMI Cloudが提供するモデル。"
icon_small:
  en_US: "icon_gmi_small.svg"
icon_large:
  en_US: "icon_gmi_black.svg"
background: "#E5E7EB"
help:
  title:
    en_US: "Get your API Key from GMI Cloud"
    zh_Hans: "从 GMI Cloud 获取 API Key"
    ja_JP: "GMI CloudからAPIキーを取得"
  url:
    en_US: "https://console.gmicloud.ai/user-setting/organization/api-key-management"
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
      ja_JP: モデル名
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
      ja_JP: モデル名を入力してください
  credential_form_schemas:
    - variable: gmicloud_api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        zh_Hans: 在此输入您的 API Key
        en_US: Enter your API Key
provider_credential_schema:
  credential_form_schemas:
    - variable: gmicloud_api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        zh_Hans: 在此输入您的 API Key
        en_US: Enter your API Key
    - variable: endpoint_url
      label:
        en_US: API Base URL
        zh_Hans: API Base URL
      type: text-input
      required: false
      placeholder:
        en_US: https://api.gmi-serving.com
        zh_Hans: https://api.gmi-serving.com
    - variable: enable_request_metadata
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every GMI Cloud call. The headers are written into the `extra_headers`
            credential (merged on top of the existing `HTTP-Referer` / `X-Title`
            observability markers; on collision the Dify keys win), which the
            underlying OpenAI SDK forwards on every outbound request via the
            `default_headers` client constructor argument. The headers are used
            for observability / proxy-side propagation. GMI Cloud does not
            document them. Default is `disabled`, so the request shape is
            unchanged unless you opt in.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 GMI Cloud 调用中附加当前
            Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source`
            请求头。底层 OpenAI SDK 会通过 `default_headers` 客户端构造参数将其
            随每个出站请求一并转发，用于可观测性与代理侧传播。GMI Cloud API 不
            会消费它们。默认值为 `disabled`，即未开启时请求结构保持不变。
      type: select
      required: false
      default: disabled
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
models:
  llm:
    predefined:
      - "models/llm/*.yaml"
extra:
  python:
    provider_source: provider/gmicloud.py
    model_sources:
      - "models/llm/llm.py"
