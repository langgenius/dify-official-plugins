model: cohere.command-a-vision
label:
  en_US: cohere.command-a-vision
model_type: llm
features:
  - vision
  - agent-thought
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 0.3
    min: 0
    max: 1.0
  - name: topP
    use_template: top_p
    default: 0.75
    min: 0
    max: 1
  - name: topK
    label:
      zh_Hans: 取样数量
      en_US: Top k
    type: int
    help:
      zh_Hans: 仅从每个后续标记的前 K 个选项中采样。
      en_US: Only sample from the top K options for each subsequent token.
    required: false
    default: 0
    min: 0
    max: 500
  - name: presencePenalty
    use_template: presence_penalty
    min: 0
    max: 1
    default: 0
  - name: frequencyPenalty
    use_template: frequency_penalty
    min: 0
    max: 1
    default: 0
  - name: maxTokens
    use_template: max_tokens
    default: 4000
    min: 1
    max: 4000
# "Large Cohere" on-demand list price (USD 0.0156 per 10K transactions), kept on the
# same per-10K-token unit the other Cohere yamls in this plugin use.
pricing:
  input: '0.0156'
  output: '0.0156'
  unit: '0.0001'
  currency: USD
