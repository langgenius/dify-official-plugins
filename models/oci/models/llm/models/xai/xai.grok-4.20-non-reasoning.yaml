model: xai.grok-4.20-non-reasoning
label:
  zh_Hans: xai.grok-4.20-non-reasoning
  en_US: xai.grok-4.20-non-reasoning
  ja_JP: xai.grok-4.20-non-reasoning
model_type: llm
features:
  - vision
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 2.0
  - name: topP
    use_template: top_p
    default: 1
    min: 0.05
    max: 1
  - name: maxTokens
    use_template: max_tokens
    default: 4000
    min: 1
    max: 131072
# Standard-tier, short-context (<200K prompt tokens) list price. Long-context,
# cached-input and priority-processing rates are not representable by PriceConfig.
pricing:
  input: '1.25'
  output: '2.50'
  unit: '0.000001'
  currency: USD
