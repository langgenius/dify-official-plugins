model: xai.grok-4.3
label:
  zh_Hans: xai.grok-4.3
  en_US: xai.grok-4.3
  ja_JP: xai.grok-4.3
model_type: llm
features:
  - vision
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 2.0
  - name: topP
    use_template: top_p
    default: 1
    min: 0.05
    max: 1
  - name: maxTokens
    use_template: max_tokens
    default: 4000
    min: 1
    max: 131072
  - name: reasoningEffort
    label:
      zh_Hans: 推理努力程度
      en_US: Reasoning Effort
      ja_JP: 推論の深さ
    type: string
    help:
      zh_Hans: 限制推理模型的推理努力程度。留空则使用服务端默认值。
      en_US: Constrains how much effort the model spends on reasoning. Leave unset to use the service default.
      ja_JP: 推論に費やす労力を制限します。未設定の場合はサービスのデフォルト値が使われます。
    required: false
    options:
      - LOW
      - MEDIUM
      - HIGH
# Standard-tier, short-context (<200K prompt tokens) list price. Long-context,
# cached-input and priority-processing rates are not representable by PriceConfig.
pricing:
  input: '1.25'
  output: '2.50'
  unit: '0.000001'
  currency: USD
