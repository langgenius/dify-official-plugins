model: openai.gpt-oss-120b
label:
  zh_Hans: openai.gpt-oss-120b
  en_US: openai.gpt-oss-120b
  ja_JP: openai.gpt-oss-120b
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 2.0
  - name: topP
    use_template: top_p
    default: 1
    min: 0.05
    max: 1
  - name: presencePenalty
    use_template: presence_penalty
    min: -2
    max: 2
    default: 0
  - name: frequencyPenalty
    use_template: frequency_penalty
    min: -2
    max: 2
    default: 0
  - name: maxTokens
    use_template: max_tokens
    default: 4000
    max: 128000
  - name: reasoningEffort
    label:
      zh_Hans: 推理努力程度
      en_US: Reasoning Effort
      ja_JP: 推論の深さ
    type: string
    help:
      zh_Hans: 限制推理模型的推理努力程度。留空则使用服务端默认值。
      en_US: Constrains how much effort the model spends on reasoning. Leave unset to use the service default.
      ja_JP: 推論に費やす労力を制限します。未設定の場合はサービスのデフォルト値が使われます。
    required: false
    options:
      - LOW
      - MEDIUM
      - HIGH
pricing:
  input: '0.15'
  output: '0.60'
  unit: '0.000001'
  currency: USD
