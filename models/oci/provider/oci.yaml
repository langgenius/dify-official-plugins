provider: oci
author: langgenius
label:
  en_US: OCI Generative AI Service
  zh_Hans: OCI 生成式 AI 服务

description:
  en_US: Models provided by OCI, such as Grok, Cohere Command and Llama.
  zh_Hans: OCI 提供的模型，例如 Grok、Cohere Command 和 Llama。

icon_large:
  en_US: icon_l_en.png
icon_small:
  en_US: icon_s_en.png

background: '#FFFFFF'

help:
  title:
    en_US: Get your API Key from OCI
    zh_Hans: 从 OCI 获取 API Key
  url:
    en_US: https://docs.cloud.oracle.com/Content/API/Concepts/sdkconfig.htm

supported_model_types:
  - llm
  - text-embedding

configurate_methods:
  - predefined-model

provider_credential_schema:
  credential_form_schemas:
    - variable: default_region
      label:
        en_US: Default Region
        zh_Hans: 默认区域
      type: text-input
      required: true
      default: us-chicago-1
      placeholder:
        en_US: us-chicago-1

    - variable: compartment_ocid
      label:
        en_US: Compartment OCID
        zh_Hans: 区间 OCID
      type: text-input
      required: true
      placeholder:
        en_US: ocid1.compartment.oc1..<unique_ID>


    - variable: authentication_method
      label:
        en_US: Authentication Method
        zh_Hans: 认证方法
      type: radio
      required: true
      options:
        - value: instance_principal_authentication
          label:
            en_US: Instance Principal Authentication
            zh_Hans: 实例主体认证
        - value: api_key_authentication
          label:
            en_US: API Key Authentication
            zh_Hans: API 密钥认证

    - variable: user_ocid
      show_on:
        - variable: authentication_method
          value: api_key_authentication
      label:
        en_US: User OCID
        zh_Hans: 用户 OCID
      type: text-input
      #required: true
      placeholder:
        en_US: ocid1.user.oc1..<unique_ID>

    - variable: tenancy_ocid
      show_on:
        - variable: authentication_method
          value: api_key_authentication
      label:
        en_US: Tenancy OCID
        zh_Hans: 租户 OCID
      type: text-input
      #required: true
      placeholder:
        en_US: ocid1.tenancy.oc1..<unique_ID>

    - variable: fingerprint
      show_on:
        - variable: authentication_method
          value: api_key_authentication
      label:
        en_US: Fingerprint of your public key
      type: text-input
      #required: true
      placeholder:
        en_US: "dd:3e:......:44:e0"

    - variable: key_content
      show_on:
        - variable: authentication_method
          value: api_key_authentication
      label:
        en_US: Key File Content
        zh_Hans: 密钥文件内容文本
      type: secret-input
      #required: true      


    - default: disabled
      label:
        en_US: Attach Dify app_id as request headers
        zh_Hans: 附加 Dify app_id 作为请求头
      help:
        title:
          en_US: How does this work?
          zh_Hans: 这是如何工作的？
        text:
          en_US: |-
            When enabled, the plugin attaches the current Dify app_id and a `dify`
            source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
            every OCI LLM call. The headers are written into the
            `extra_headers` credential, which the underlying OCI base
            client merges into the outbound request via the
            `header_params` dict on the `call_api(...)` call. The headers
            are forwarded by the underlying HTTP client and are used
            for observability / proxy-side propagation. OCI does not
            document them. Default is `disabled`, so the request shape
            is unchanged unless you opt in. This opt-in applies to the
            LLM endpoint only; the text-embedding endpoint is not
            affected.
          zh_Hans: |-
            启用后，插件会通过 `extra_headers` 凭据在每次 OCI LLM 调用中附加当前 Dify
            app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source` 请求头。
            底层 OCI base client 会将其合并到 `call_api(...)` 的 `header_params` 字典
            中随出站请求一并发送。这些请求头由底层 HTTP 客户端转发，用于可观测性
            与代理侧传播，OCI API 不会消费它们。默认值为 `disabled`，即未开启时
            请求结构保持不变。该选项仅作用于 LLM 端点，不会影响 text-embedding 端点。
      options:
        - value: enabled
          label:
            en_US: Enabled
            zh_Hans: 启用
        - value: disabled
          label:
            en_US: Disabled
            zh_Hans: 禁用
      required: false
      show_on: []
      type: select
      variable: enable_request_metadata


models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/models/xai/*.yaml
      - models/llm/models/google/*.yaml
      - models/llm/models/openai/*.yaml
      - models/llm/models/cohere/*.yaml
      - models/llm/models/llama/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
      - models/text_embedding/models/*.yaml

extra:
  python:
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
    provider_source: provider/oci.py

