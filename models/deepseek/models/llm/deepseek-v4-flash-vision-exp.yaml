model: deepseek-v4-flash-vision-exp
label:
  zh_Hans: deepseek-v4-flash-vision-exp
  en_US: deepseek-v4-flash-vision-exp
model_type: llm
deprecated: false
features:
  - vision
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 1
    min: 0.0
    max: 2.0
    help:
      zh_Hans: 控制非思考模式下的随机性。思考模式下不生效。
      en_US: Controls randomness in non-thinking mode. Has no effect in thinking mode.
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 393216
    help:
      zh_Hans: 输出 token 上限，包含思考内容，最大 393216。输入和输出总长度不能超过上下文限制。
      en_US: Maximum output tokens, including reasoning, up to 393216. Input and output together must fit within the context window.
  - name: top_p
    use_template: top_p
    type: float
    default: 1
    min: 0.95
    max: 1.00
    help:
      zh_Hans: 思考模式下的核采样概率，取值 0.95 至 1.0。非思考模式下固定为 1.0。
      en_US: Nucleus sampling in thinking mode, from 0.95 to 1.0. Fixed at 1.0 in non-thinking mode.
  - name: thinking
    label:
      zh_Hans: 思考模式
      en_US: Thinking Mode
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 控制是否启用 DeepSeek 的思考模式，默认启用。普通函数工具与联网搜索、阅读链接、安全检查或标题混用时自动启用。
      en_US: Controls thinking mode, enabled by default. Automatically enabled when client function tools are combined with web tools, safety checks, or titles.
  - name: reasoning_effort
    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    default: high
    required: false
    options:
      - low
      - high
      - max
    help:
      zh_Hans: 控制思考模式下的推理强度。官方文档支持 low、high 和 max。
      en_US: Controls reasoning effort in thinking mode. The official docs support low, high, and max.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
  - name: deepseek_web_search
    label:
      zh_Hans: 联网搜索
      en_US: Web Search
    type: boolean
    default: false
    required: false
    help:
      zh_Hans: 由 DeepSeek 服务端自动搜索。开启思考模式时使用深度思考搜索，搜索和网页抓取按次计费。与普通函数工具混用时自动开启思考。
      en_US: Enables server-side web search, with deep search in thinking mode. Searches and page fetches are billed separately. Mixing with client function tools automatically enables thinking.
  - name: deepseek_read_url
    label:
      zh_Hans: 阅读链接
      en_US: Read URLs
    type: boolean
    default: false
    required: false
    help:
      zh_Hans: 自动阅读最后一条用户消息中的链接。思考模式下同时启用联网搜索时使用深度思考搜索。网页抓取按次计费。与普通函数工具混用时自动开启思考。
      en_US: Reads links in the last user message. Mixing with client function tools automatically enables thinking. With thinking and web search enabled, deep search takes precedence. Page fetches are billed separately.
  - name: safety_check
    label:
      zh_Hans: 内容安全检查
      en_US: Content Safety Check
    type: string
    required: false
    options:
      - low
      - high
    help:
      zh_Hans: high 开启基础输入输出风控；low 使用 API 默认检查。high 与普通函数工具混用时自动开启思考。
      en_US: high enables basic input and output safety checks; low uses the API default checks. high with client function tools automatically enables thinking.
  - name: title
    label:
      zh_Hans: 生成会话标题
      en_US: Generate Conversation Title
    type: boolean
    default: false
    required: false
    help:
      zh_Hans: 请求生成简短标题，保存在响应元数据中，不会自动修改 Dify 会话标题。与普通函数工具混用时自动开启思考。
      en_US: Requests a short title in response metadata. Does not automatically rename the Dify conversation. Mixing with client function tools automatically enables thinking.
