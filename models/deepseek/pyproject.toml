[project]
name = "deepseek"
version = "0.1.0"
description = "Dify model provider for the official DeepSeek API"
readme = "README.md"
requires-python = ">=3.12"

# Managed with uv; refresh the lockfile with `uv lock`.
dependencies = [
    "dify-plugin @ git+https://github.com/langgenius/dify-plugin-sdks.git@c378d255ea6155d5dcdd91f31ded9bd24ad9d446",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "live: sends billable requests to the real DeepSeek API",
]
