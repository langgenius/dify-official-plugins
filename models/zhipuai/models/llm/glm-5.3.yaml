model: glm-5.3
label:
  en_US: glm-5.3
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 131072
  - name: reasoning_effort
    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    default: max
    required: false
    options:
      - low
      - high
      - max
    help:
      zh_Hans: 控制模型的思考强度。GLM-5.3 始终启用思考模式。
      en_US: Controls the model's reasoning effort. GLM-5.3 always uses thinking mode.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: Specifies the format that the model must output
    required: false
    options:
      - text
      - json_object
