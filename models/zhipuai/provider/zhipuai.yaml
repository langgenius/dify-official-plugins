background: '#EFF1FE'
configurate_methods:
  - predefined-model
extra:
  python:
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
    provider_source: provider/zhipuai.py
help:
  title:
    en_US: Get your API key from ZHIPU AI
    zh_Hans: 从智谱 AI 获取 API Key
  url:
    en_US: https://open.bigmodel.cn/usercenter/apikeys
icon_large:
  en_US: icon_l_en.svg
  zh_Hans: icon_l_zh.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: ZHIPU AI
  zh_Hans: 智谱 AI
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
      - models/text_embedding/*.yaml
provider: zhipuai
provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: APIKey
      placeholder:
        en_US: Enter your APIKey
        zh_Hans: 在此输入您的 APIKey
      required: true
      type: secret-input
      variable: api_key

    - default: https://open.bigmodel.cn/api/paas/v4/
      label:
        en_US: API Base URL
        zh_Hans: API Base URL
      placeholder:
        en_US: Enter your API Base URL
        zh_Hans: 输入您的 API Base URL
      required: false
      type: text-input
      variable: base_url

    - default: glm-5-turbo
      label:
        en_US: Validate Model Name
        zh_Hans: 验证模型名称
      placeholder:
        en_US: Model name used to test credentials (default glm-5-turbo)
        zh_Hans: 用于连通性测试的模型名称（默认 glm-5-turbo）
      required: false
      type: text-input
      variable: validate_model
  - label:
      en_US: Enable request metadata
      zh_Hans: 启用请求元数据
    help:
      text:
        en_US: >-
          Attach Dify app_id and dify_source to each ZhipuAI request as
          a metadata field in the body, so usage can be attributed to
          a specific Dify app. The ZhipuAI API is OpenAI-compatible and
          silently ignores unknown body fields, so this is safe
          whether or not the upstream service consumes the field.
          Default is disabled.
        zh_Hans: >-
          将 Dify app_id 与 dify_source 作为 metadata 字段附加到每次 ZhipuAI
          请求的 body 中，以便按 Dify 应用归因用量。ZhipuAI API 兼容 OpenAI
          协议，会静默忽略未知的 body 字段，因此无论上游服务是否消费该字段都
          安全。默认禁用。
    options:
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    required: false
    type: select
    variable: enable_request_metadata
    default: disabled

supported_model_types:
  - llm
  - text-embedding
