background: "#0B0F14"
configurate_methods:
  - predefined-model
  - customizable-model
description:
  en_US: OpenCode Go is a $10/month subscription gateway for curated open coding models (GLM, Kimi, DeepSeek, MiMo, MiniMax, Qwen, LongCat, Hy, and more).
  zh_Hans: OpenCode Go 是 $10/月 的订阅网关，提供精选开源编码模型（GLM、Kimi、DeepSeek、MiMo、MiniMax、Qwen、LongCat、Hy 等）。
extra:
  python:
    model_sources:
      - models/llm/llm.py
    provider_source: provider/opencode_go.py
help:
  title:
    en_US: Get your API Key from OpenCode
    zh_Hans: 从 OpenCode 获取 API Key
  url:
    en_US: https://opencode.ai/auth
icon_large:
  en_US: icon.svg
icon_large_dark:
  en_US: icon-dark.svg
icon_small:
  en_US: icon.svg
icon_small_dark:
  en_US: icon-dark.svg
label:
  en_US: OpenCode Go
  zh_Hans: OpenCode Go
model_credential_schema:
  model:
    label:
      en_US: Model ID
      zh_Hans: 模型 ID
    placeholder:
      en_US: Enter model id, e.g. kimi-k2.6
      zh_Hans: 输入模型 ID，例如 kimi-k2.6
  credential_form_schemas:
    - variable: display_name
      label:
        en_US: Display Name
        zh_Hans: 显示名称
      type: text-input
      required: false
      placeholder:
        en_US: Optional. Shown in the model list. Defaults to Model ID.
        zh_Hans: 可选。模型列表中显示的名称，默认与模型 ID 相同。
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your OpenCode Go API Key
        zh_Hans: 在此输入你的 OpenCode Go API Key
    - variable: endpoint_url
      label:
        en_US: API Base URL
        zh_Hans: API Base URL
      type: text-input
      required: false
      default: https://opencode.ai/zen/go/v1
    - variable: context_size
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      type: text-input
      required: false
      default: "262144"
    - variable: max_tokens
      label:
        en_US: Upper bound for max tokens
        zh_Hans: 最大 token 上限
      type: text-input
      required: false
      default: "32768"
      show_on:
        - variable: __model_type
          value: llm
    - variable: function_calling_type
      label:
        en_US: Function calling
        zh_Hans: Function Calling
      type: select
      required: false
      default: tool_call
      options:
        - label:
            en_US: Support
            zh_Hans: 支持
          value: tool_call
        - label:
            en_US: Not Support
            zh_Hans: 不支持
          value: no_call
      show_on:
        - variable: __model_type
          value: llm
    - variable: api_protocol
      label:
        en_US: API Protocol
        zh_Hans: API 协议
      type: select
      required: false
      default: chat
      options:
        - label:
            en_US: Chat Completions (/chat/completions)
            zh_Hans: Chat Completions（/chat/completions）
          value: chat
        - label:
            en_US: Anthropic Messages (/messages)
            zh_Hans: Anthropic Messages（/messages）
          value: anthropic
        - label:
            en_US: OpenAI Responses (/responses)
            zh_Hans: OpenAI Responses（/responses）
          value: responses
      show_on:
        - variable: __model_type
          value: llm
      help:
        title:
          en_US: Upstream protocol
          zh_Hans: 上游协议
        text:
          en_US: |-
            Chat (default) works for most OpenCode Go models.
            Choose Anthropic Messages for models that only expose /messages
            (e.g. minimax-m2.7) and OpenAI Responses for models that only
            expose /responses (e.g. grok-4.7, grok-4.6, gpt-5.6-luna, muse-spark-*).
          zh_Hans: |-
            Chat（默认）适用于大多数 OpenCode Go 模型。
            仅支持 /messages 的模型（如 minimax-m2.7）请选择 Anthropic Messages；
            仅支持 /responses 的模型（如 grok-4.7、grok-4.6、gpt-5.6-luna、muse-spark-*）
            请选择 OpenAI Responses。
    - variable: thinking_support
      label:
        en_US: Thinking / Agent Thought
        zh_Hans: 思考模式
      type: select
      required: false
      default: "true"
      options:
        - label:
            en_US: "True"
            zh_Hans: "是"
          value: "true"
        - label:
            en_US: "False"
            zh_Hans: "否"
          value: "false"
      show_on:
        - variable: __model_type
          value: llm
      help:
        title:
          en_US: Agent thought
          zh_Hans: 思考模式
        text:
          en_US: |-
            Enable when the model returns reasoning / thinking content.
            Adds the agent-thought feature and thinking parameters.
          zh_Hans: |-
            模型会输出思考 / 推理内容时开启。将启用 agent-thought 能力
            并暴露思考相关参数。
    - variable: vision_support
      label:
        en_US: Vision support
        zh_Hans: 视觉支持
      type: select
      required: false
      default: "false"
      options:
        - label:
            en_US: "True"
            zh_Hans: "是"
          value: "true"
        - label:
            en_US: "False"
            zh_Hans: "否"
          value: "false"
      show_on:
        - variable: __model_type
          value: llm
    - variable: audio_support
      label:
        en_US: Audio support
        zh_Hans: 音频支持
      type: select
      required: false
      default: "false"
      options:
        - label:
            en_US: "True"
            zh_Hans: "是"
          value: "true"
        - label:
            en_US: "False"
            zh_Hans: "否"
          value: "false"
      show_on:
        - variable: __model_type
          value: llm
    - variable: video_support
      label:
        en_US: Video support
        zh_Hans: 视频支持
      type: select
      required: false
      default: "false"
      options:
        - label:
            en_US: "True"
            zh_Hans: "是"
          value: "true"
        - label:
            en_US: "False"
            zh_Hans: "否"
          value: "false"
      show_on:
        - variable: __model_type
          value: llm
    - variable: document_support
      label:
        en_US: Document support
        zh_Hans: 文档支持
      type: select
      required: false
      default: "false"
      options:
        - label:
            en_US: "True"
            zh_Hans: "是"
          value: "true"
        - label:
            en_US: "False"
            zh_Hans: "否"
          value: "false"
      show_on:
        - variable: __model_type
          value: llm
    - variable: structured_output_support
      label:
        en_US: Structured output
        zh_Hans: 结构化输出
      type: select
      required: false
      default: "false"
      options:
        - label:
            en_US: "True"
            zh_Hans: "是"
          value: "true"
        - label:
            en_US: "False"
            zh_Hans: "否"
          value: "false"
      show_on:
        - variable: __model_type
          value: llm
      help:
        title:
          en_US: Structured output
          zh_Hans: 结构化输出
        text:
          en_US: |-
            Enable when the model supports JSON schema / structured responses.
            Adds response_format and json_schema parameters.
          zh_Hans: |-
            模型支持 JSON Schema / 结构化回复时开启。将暴露
            response_format 与 json_schema 参数。
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
provider: opencode_go
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your OpenCode Go API Key
        zh_Hans: 在此输入你的 OpenCode Go API Key
    - variable: endpoint_url
      label:
        en_US: API Base URL
        zh_Hans: API Base URL
      type: text-input
      required: false
      default: https://opencode.ai/zen/go/v1
      placeholder:
        en_US: https://opencode.ai/zen/go/v1
        zh_Hans: https://opencode.ai/zen/go/v1
    - variable: user_agent
      label:
        en_US: User-Agent
        zh_Hans: User-Agent
      type: text-input
      required: false
      default: dify-opencode-go-plugin/0.4.0
      placeholder:
        en_US: dify-opencode-go-plugin/0.4.0
        zh_Hans: dify-opencode-go-plugin/0.4.0
    - variable: session_id
      label:
        en_US: Session ID (optional)
        zh_Hans: 会话 ID（可选）
      type: text-input
      required: false
      placeholder:
        en_US: Leave empty (recommended) — sessions are isolated automatically
        zh_Hans: 留空即可（推荐）— 会按对话/按次自动隔离
      help:
        title:
          en_US: x-opencode-session header
          zh_Hans: x-opencode-session 请求头
        text:
          en_US: |-
            Usually leave empty. By default the plugin already sends a
            per-conversation session (Chatflow) or a per-run session (Workflow).
            Fill this only if you need ONE fixed session id for the whole
            workspace (e.g. debugging or a shared cache). A value here is
            ignored when the LLM node already sets x-opencode-session via
            extra_headers.
          zh_Hans: |-
            一般无需填写。插件默认已按对话（Chatflow）或按次运行（工作流）
            自动隔离会话。仅在需要整个工作空间共用一个固定会话 ID 时才填写
            （例如调试或共享缓存）。若 LLM 节点已通过 extra_headers 指定
            x-opencode-session，则本凭证项不会生效。
supported_model_types:
  - llm
