model: longcat-2.5-preview-free
label:
  en_US: LongCat 2.5 Preview Free (limited time)
  zh_Hans: LongCat 2.5 Preview Free（限时）
description:
  en_US: Free for a limited time (Unlimited). This preview model may be taken offline at any time without prior notice. Do not rely on it for production.
  zh_Hans: 限时免费（Unlimited）。该预览模型可能随时下线，且不另行通知，请勿用于生产环境。
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 131072
    help:
      zh_Hans: 指定生成结果长度的上限。如果生成结果截断，可以调大该参数。
      en_US: Specifies the upper limit on the length of generated results. If truncated, increase this parameter.
  - name: frequency_penalty
    use_template: frequency_penalty
pricing:
  input: "0"
  output: "0"
  unit: "0.000001"
  currency: USD
