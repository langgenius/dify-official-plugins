model: kimi-k2.7-code
label:
  en_US: Kimi K2.7 Code
  zh_Hans: Kimi K2.7 Code
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - vision
  - video
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 2
    help:
      en_US: OpenCode Go only accepts temperature=1 for this model. The plugin forces 1 regardless of the UI value.
      zh_Hans: 该模型在 OpenCode Go 仅接受 temperature=1。插件会强制覆盖为你在界面填写的其他值。
  - name: top_p
    use_template: top_p
    default: 0.95
    min: 0
    max: 1
    help:
      en_US: OpenCode Go only accepts top_p=0.95 for this model. The plugin forces 0.95 regardless of the UI value.
      zh_Hans: 该模型在 OpenCode Go 仅接受 top_p=0.95。插件会强制覆盖为你在界面填写的其他值。
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 262144
    help:
      zh_Hans: 指定生成结果长度的上限。如果生成结果截断，可以调大该参数。
      en_US: Specifies the upper limit on the length of generated results. If truncated, increase this parameter.
  - name: frequency_penalty
    use_template: frequency_penalty
pricing:
  input: "0.95"
  output: "4.00"
  unit: "0.000001"
  currency: USD
