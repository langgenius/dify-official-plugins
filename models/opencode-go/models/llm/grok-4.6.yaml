model: grok-4.6
label:
  en_US: Grok 4.6
  zh_Hans: Grok 4.6
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 500000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 500000
    help:
      en_US: Maps to Responses API max_output_tokens.
      zh_Hans: 映射到 Responses API 的 max_output_tokens。
pricing:
  input: "2.00"
  output: "6.00"
  unit: "0.000001"
  currency: USD
