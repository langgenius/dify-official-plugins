model: union-alpha
label:
  en_US: Union Alpha Free (Limited-time trial — may be removed anytime)
  zh_Hans: Union Alpha 免费（限时体验，可能随时下线）
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
    help:
      en_US: >-
        Limited-time free trial model from OpenCode Go. Availability is not
        guaranteed long-term; upstream may 503 or disappear without notice.
        Prefer a paid/stable model for production workflows.
      zh_Hans: >-
        OpenCode Go 限时免费体验模型，无法保证长期可用；上游可能间歇 503
        或随时下线。生产工作流请改用可长期使用的模型。
  - name: top_p
    use_template: top_p
    help:
      en_US: >-
        Limited-time free trial model — not for long-term / production use.
      zh_Hans: >-
        限时免费体验模型，不适合长期或生产环境使用。
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 32768
    help:
      en_US: >-
        Maximum tokens to generate. Note: this is a limited-time free trial
        model (Union Alpha) and may become unavailable anytime.
      zh_Hans: >-
        生成 token 上限。注意：Union Alpha 为限时免费体验模型，
        可能随时不可用，请勿用于长期生产依赖。
pricing:
  input: "0.00"
  output: "0.00"
  unit: "0.000001"
  currency: USD
