background: '#EFF1FE'
configurate_methods:
- predefined-model
- customizable-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/rerank/rerank.py
    - models/text_embedding/text_embedding.py
    - models/tts/tts.py
    - models/speech2text/speech2text.py
    provider_source: provider/tongyi.py
help:
  title:
    en_US: Get your API key from AliCloud
    zh_Hans: 从阿里云百炼获取 API Key
  url:
    en_US: https://bailian.console.aliyun.com/?apiKey=1#/api-key
icon_large:
  en_US: icon_l_en.png
  zh_Hans: icon_l_zh.png
icon_small:
  en_US: icon_s_en.png
label:
  en_US: Tongyi
  zh_Hans: 通义
model_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: dashscope_api_key
  - label:
      en_US: DashScope API Base URL
      zh_Hans: DashScope API Base URL
    placeholder:
      en_US: Leave blank for the default DashScope endpoint
      zh_Hans: 留空则使用默认 DashScope 端点
    help:
      text:
        en_US: >-
          Optional. Use an Alibaba Cloud Model Studio workspace-specific
          native endpoint such as
          https://<workspace-id>.cn-beijing.maas.aliyuncs.com/api/v1
          (OpenAI-compatible .../compatible-mode/v1 is also accepted and
          converted for the DashScope SDK). When set, this overrides
          Use International Endpoint. Speech WebSocket calls derive
          wss://<host>/api-ws/v1/inference from the same host; leave
          blank if your workspace does not expose that path.
        zh_Hans: >-
          可选。用于阿里云百炼工作空间专属原生端点，例如
          https://<workspace-id>.cn-beijing.maas.aliyuncs.com/api/v1。
          也接受 OpenAI 兼容的 compatible-mode/v1，并会转换为 DashScope SDK
          使用的 /api/v1。填写后将覆盖「使用国际端点」。语音 WebSocket
          会从同一主机推导 wss://<host>/api-ws/v1/inference；
          若工作空间未提供该路径请留空。
    required: false
    type: text-input
    variable: dashscope_api_base
  - default: '4096'
    label:
      en_US: Model context size
      zh_Hans: 模型上下文长度
    placeholder:
      en_US: Enter your Model context size
      zh_Hans: 在此输入您的模型上下文长度
    required: true
    type: text-input
    variable: context_size
  - default: '4096'
    label:
      en_US: Upper bound for max tokens
      zh_Hans: 最大 token 上限
    show_on:
    - value: llm
      variable: __model_type
    type: text-input
    variable: max_tokens
  - default: no_call
    label:
      en_US: Function calling
    options:
    - label:
        en_US: Not Support
        zh_Hans: 不支持
      value: no_call
    - label:
        en_US: Support
        zh_Hans: 支持
      value: function_call
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: select
    variable: function_calling_type
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
  rerank:
    position: models/rerank/_position.yaml
    predefined:
      - models/rerank/*.yaml
  speech2text:
    predefined:
      - models/speech2text/*.yaml
  text_embedding:
    predefined:
      - models/text_embedding/*.yaml
  tts:
    predefined:
      - models/tts/*.yaml
provider: tongyi
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: dashscope_api_key
  - label:
      en_US: Use International Endpoint
      zh_Hans: 使用国际端点
    type: radio
    required: true
    default: "false"
    variable: use_international_endpoint
    options:
      - label:
          en_US: "True"
          zh_Hans: "是"
        value: "true"
      - label:
          en_US: "False"
          zh_Hans: "否"
        value: "false"
  - label:
      en_US: DashScope API Base URL
      zh_Hans: DashScope API Base URL
    placeholder:
      en_US: Leave blank for the default DashScope endpoint
      zh_Hans: 留空则使用默认 DashScope 端点
    help:
      text:
        en_US: >-
          Optional. Use an Alibaba Cloud Model Studio workspace-specific
          native endpoint such as
          https://<workspace-id>.cn-beijing.maas.aliyuncs.com/api/v1
          (OpenAI-compatible .../compatible-mode/v1 is also accepted and
          converted for the DashScope SDK). When set, this overrides
          Use International Endpoint. Speech WebSocket calls derive
          wss://<host>/api-ws/v1/inference from the same host; leave
          blank if your workspace does not expose that path.
        zh_Hans: >-
          可选。用于阿里云百炼工作空间专属原生端点，例如
          https://<workspace-id>.cn-beijing.maas.aliyuncs.com/api/v1。
          也接受 OpenAI 兼容的 compatible-mode/v1，并会转换为 DashScope SDK
          使用的 /api/v1。填写后将覆盖「使用国际端点」。语音 WebSocket
          会从同一主机推导 wss://<host>/api-ws/v1/inference；
          若工作空间未提供该路径请留空。
    required: false
    type: text-input
    variable: dashscope_api_base
  - label:
      en_US: Enable request metadata
      zh_Hans: 启用请求元数据
    help:
      text:
        en_US: >-
          Attach Dify app_id and dify_source to each Tongyi request as
          X-Dify-App-Id and X-Dify-Source headers, so usage can be
          attributed to a specific Dify app. Routed through custom
          headers because the DashScope API does not document a
          body-level metadata field. Default is disabled.
        zh_Hans: >-
          将 Dify app_id 与 dify_source 作为 X-Dify-App-Id 和 X-Dify-Source
          头附加到每次 Tongyi 请求，以便按 Dify 应用归因用量。由于 DashScope
          API 不支持 body 级别的元数据，因此通过自定义头传递。默认禁用。
    options:
    - label:
        en_US: Disabled
        zh_Hans: 禁用
      value: disabled
    - label:
        en_US: Enabled
        zh_Hans: 启用
      value: enabled
    required: false
    type: select
    variable: enable_request_metadata
    default: disabled
supported_model_types:
  - llm
  - text-embedding
  - rerank
  - speech2text
  - tts
