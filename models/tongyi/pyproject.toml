[project]
name = "tongyi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

# Managed with uv; refresh the lockfile with `uv lock`.
dependencies = [
    "dify_plugin>=0.11.0,<0.12.0",
    "numpy>=2.5.3",
    "dashscope>=1.27.4",
    "openai>=3.8.0",
    "pydub>=0.25.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
# Pin the complete tool-call contract until a containing SDK release is published.
dify-plugin = { git = "https://github.com/langgenius/dify-plugin-sdks.git", rev = "0fa060a11fd774fe8ed70c915d7881e20a765b64" }
