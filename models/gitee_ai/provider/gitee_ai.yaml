configurate_methods:
  - customizable-model
  - predefined-model
description:
  en_US: 快速体验大模型，领先探索 AI 开源世界
  zh_Hans: 快速体验大模型，领先探索 AI 开源世界
extra:
  python:
    model_sources:
      - models/llm/llm.py
      - models/rerank/rerank.py
      - models/text_embedding/text_embedding.py
      - models/tts/tts.py
      - models/speech2text/speech2text.py
    provider_source: provider/gitee_ai.py
help:
  title:
    en_US: Get your token from Gitee AI
    zh_Hans: 从 Gitee AI 获取 token
  url:
    en_US: https://ai.gitee.com/dashboard/settings/tokens
icon_large:
  en_US: Gitee-AI-Logo-full.svg
icon_small:
  en_US: Gitee-AI-Logo.svg
label:
  en_US: Gitee AI
  zh_Hans: 模力方舟
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
  rerank:
    position: models/rerank/_position.yaml
    predefined:
      - models/rerank/*.yaml
  speech2text:
    position: models/speech2text/_position.yaml
    predefined:
      - models/speech2text/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
      - models/text_embedding/*.yaml
  tts:
    position: models/tts/_position.yaml
    predefined:
      - models/tts/*.yaml
provider: gitee_ai
provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
      variable: api_key
model_credential_schema:
  credential_form_schemas:
  - label:
      en_US: API Key
    placeholder:
      en_US: Enter your API Key
      zh_Hans: 在此输入您的 API Key
    required: true
    type: secret-input
    variable: api_key
  - default: '4096'
    label:
      en_US: Model context size
      zh_Hans: 模型上下文长度
    placeholder:
      en_US: Enter your Model context size
      zh_Hans: 在此输入您的模型上下文长度
    required: true
    type: text-input
    variable: context_size
  - default: '4096'
    label:
      en_US: Upper bound for max tokens
      zh_Hans: 最大 token 上限
    show_on:
    - value: llm
      variable: __model_type
    type: text-input
    variable: max_tokens
  - default: no_call
    label:
      en_US: Function calling
    options:
    - label:
        en_US: Not Support
        zh_Hans: 不支持
      value: no_call
    - label:
        en_US: Support
        zh_Hans: 支持
      value: tool_call
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: select
    variable: function_calling_type
  - label:
      en_US: Attach Dify app_id as request headers
      zh_Hans: 附加 Dify app_id 作为请求头
    help:
      title:
        en_US: How does this work?
        zh_Hans: 这是如何工作的？
      text:
        en_US: |-
          When enabled, the plugin attaches the current Dify app_id and a `dify`
          source marker as `X-Dify-App-Id` / `X-Dify-Source` request headers on
          every Gitee AI call. The headers are written into the `extra_headers`
          credential, which the plugin's `_generate` merges into the outbound
          `headers` dict on every request. The headers are used for
          observability / proxy-side propagation. Gitee AI does not document
          them. Default is `disabled`, so the request shape is unchanged
          unless you opt in. This opt-in applies to the LLM endpoint only.
        zh_Hans: |-
          启用后，插件会通过 `extra_headers` 凭据在每次 Gitee AI 调用中附加当前
          Dify app_id 与 `dify` 源标记，作为 `X-Dify-App-Id` / `X-Dify-Source`
          请求头。插件的 `_generate` 会将 `extra_headers` 合并到每个出站
          请求的 `headers` 字典中，用于可观测性与代理侧传播。Gitee AI API
          不会消费它们。默认值为 `disabled`，即未开启时请求结构保持不变。
          该选项仅作用于 LLM 端点。
    type: select
    required: false
    default: disabled
    options:
    - value: enabled
      label:
        en_US: Enabled
        zh_Hans: 启用
    - value: disabled
      label:
        en_US: Disabled
        zh_Hans: 禁用
    show_on:
    - value: llm
      variable: __model_type
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
supported_model_types:
  - llm
  - text-embedding
  - rerank
  - speech2text
  - tts
