model: MiniMax-M2.7
label:
  zh_Hans: MiniMax-M2.7
  en_US: MiniMax-M2.7
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 196608
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: top_k
    use_template: top_k
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 196608
pricing:
  input: '0.6'
  output: '2.4'
  unit: '0.000001'
  currency: USD
