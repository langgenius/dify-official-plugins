model: gemma-4-31B-it
label:
  zh_Hans: gemma-4-31B-it
  en_US: gemma-4-31B-it
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: top_k
    use_template: top_k
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 262144
pricing:
  input: '0.38'
  output: '1.15'
  unit: '0.000001'
  currency: USD
