model: MiniMax-M3
label:
  zh_Hans: MiniMax-M3
  en_US: MiniMax-M3
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: top_k
    use_template: top_k
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 1048576
pricing:
  input: '0.6'
  output: '2.4'
  unit: '0.000001'
  currency: USD
