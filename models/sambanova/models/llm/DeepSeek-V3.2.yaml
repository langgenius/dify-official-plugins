model: DeepSeek-V3.2
label:
  zh_Hans: DeepSeek-V3.2
  en_US: DeepSeek-V3.2
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: top_k
    use_template: top_k
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 7168
pricing:
  input: '3'
  output: '4.5'
  unit: '0.000001'
  currency: USD
