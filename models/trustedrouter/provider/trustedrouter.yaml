identity:
  author: langgenius
  name: trustedrouter
  label:
    en_US: TrustedRouter
    zh_Hans: TrustedRouter
    ja_JP: TrustedRouter
    pt_BR: TrustedRouter
  description:
    en_US: OpenAI-compatible LLM router with privacy-focused routing tiers, including zero-data-retention and end-to-end confidential inference.
    zh_Hans: OpenAI 兼容的大模型路由服务，提供注重隐私的路由等级，包括零数据保留和端到端机密推理。
    ja_JP: ゼロデータ保持やエンドツーエンドの機密推論など、プライバシー重視のルーティング階層を備えた OpenAI 互換の LLM ルーター。
    pt_BR: Roteador de LLM compatível com OpenAI com níveis de roteamento focados em privacidade, incluindo retenção zero de dados e inferência confidencial de ponta a ponta.
  icon: trustedrouter_square.svg
background: "#0d1117"
configurate_methods:
  - predefined-model
  - customizable-model
extra:
  python:
    source: provider/trustedrouter.py
    provider_source: provider/trustedrouter.py
    model_sources:
      - "models/llm/llm.py"
help:
  title:
    en_US: Get your API key from trustedrouter.com
    zh_Hans: 从 trustedrouter.com 获取 API Key
    ja_JP: trustedrouter.com から API キーを取得
    pt_BR: Obtenha sua chave de API em trustedrouter.com
  url:
    en_US: https://trustedrouter.com/keys
    zh_Hans: https://trustedrouter.com/keys
    ja_JP: https://trustedrouter.com/keys
    pt_BR: https://trustedrouter.com/keys
supported_model_types:
  - llm
icon_large:
  en_US: trustedrouter.svg
  zh_Hans: trustedrouter.svg
  ja_JP: trustedrouter.svg
  pt_BR: trustedrouter.svg
icon_small:
  en_US: trustedrouter_square.svg
  zh_Hans: trustedrouter_square.svg
  ja_JP: trustedrouter_square.svg
  pt_BR: trustedrouter_square.svg
label:
  en_US: TrustedRouter
  zh_Hans: TrustedRouter
  ja_JP: TrustedRouter
  pt_BR: TrustedRouter
model_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API 密钥
        ja_JP: API キー
        pt_BR: Chave da API
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
        ja_JP: API キーを入力してください
        pt_BR: Digite sua chave de API
    - variable: mode
      label:
        en_US: Completion mode
        zh_Hans: 完成模式
        ja_JP: 完了モード
        pt_BR: Modo de conclusão
      type: select
      required: false
      default: chat
      options:
        - label:
            en_US: Completion
            zh_Hans: 补全
            ja_JP: 完了
            pt_BR: Conclusão
          value: completion
        - label:
            en_US: Chat
            zh_Hans: 对话
            ja_JP: チャット
            pt_BR: Chat
          value: chat
      placeholder:
        en_US: Select completion mode
        zh_Hans: 选择对话类型
        ja_JP: 完了モードを選択
        pt_BR: Selecione o modo de conclusão
      show_on:
        - variable: __model_type
          value: llm
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
      ja_JP: モデル名
      pt_BR: Nome do Modelo
    placeholder:
      en_US: Enter full model name, e.g. trustedrouter/auto
      zh_Hans: 输入模型全称，例如 trustedrouter/auto
      ja_JP: 完全なモデル名を入力（例：trustedrouter/auto）
      pt_BR: Digite o nome completo do modelo, ex. trustedrouter/auto
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - "models/llm/*.yaml"
provider: trustedrouter
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API 密钥
        ja_JP: API キー
        pt_BR: Chave da API
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
        ja_JP: API キーを入力してください
        pt_BR: Digite sua chave de API
