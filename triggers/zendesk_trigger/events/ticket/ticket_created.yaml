identity:
  name: ticket_created
  author: langgenius
  label:
    en_US: Ticket Created
    zh_Hans: 工单创建
    ja_JP: チケット作成

description:
  en_US: Triggered when a new support ticket is created
  zh_Hans: 当创建新的支持工单时触发
  ja_JP: 新しいサポートチケットが作成されたときにトリガーされます

parameters:
- name: status
  label:
    en_US: Status Filter
    zh_Hans: 状态过滤
    ja_JP: ステータスフィルター
  type: string
  required: false
  description:
    en_US: Comma separated status values (e.g., new,open,pending). Leave empty to accept all.
    zh_Hans: 逗号分隔的状态值（例如 new,open,pending）。留空表示接受所有状态。
    ja_JP: カンマ区切りのステータス値（例 new,open,pending）。空の場合は全て受け入れます。

- name: priority
  label:
    en_US: Priority Filter
    zh_Hans: 优先级过滤
    ja_JP: 優先度フィルター
  type: string
  required: false
  description:
    en_US: Comma separated priority values (e.g., urgent,high). Leave empty to accept all.
    zh_Hans: 逗号分隔的优先级值（例如 urgent,high）。留空表示接受所有优先级。
    ja_JP: カンマ区切りの優先度値（例 urgent,high）。空の場合は全て受け入れます。

- name: tags
  label:
    en_US: Required Tags
    zh_Hans: 必需标签
    ja_JP: 必須タグ
  type: string
  required: false
  description:
    en_US: Comma separated tag names. Trigger only if ticket has all these tags.
    zh_Hans: 逗号分隔的标签名。仅当工单包含所有这些标签时触发。
    ja_JP: カンマ区切りのタグ名。チケットに全て含まれる場合のみトリガーします。

- name: type
  label:
    en_US: Ticket Type
    zh_Hans: 工单类型
    ja_JP: チケットタイプ
  type: string
  required: false
  description:
    en_US: Comma separated ticket types (e.g., problem,incident,question,task).
    zh_Hans: 逗号分隔的工单类型（例如 problem,incident,question,task）。
    ja_JP: カンマ区切りのチケットタイプ（例 problem,incident,question,task）。

- name: subject_contains
  label:
    en_US: Subject Contains
    zh_Hans: 主题包含
    ja_JP: 件名に含む
  type: string
  required: false
  description:
    en_US: Comma separated keywords. Trigger if subject contains any keyword.
    zh_Hans: 逗号分隔的关键词。如果主题包含任何关键词则触发。
    ja_JP: カンマ区切りのキーワード。件名にいずれかが含まれる場合トリガーします。

- name: description_contains
  label:
    en_US: Description Contains
    zh_Hans: 描述包含
    ja_JP: 説明に含む
  type: string
  required: false
  description:
    en_US: Comma separated keywords. Trigger if description contains any keyword.
    zh_Hans: 逗号分隔的关键词。如果描述包含任何关键词则触发。
    ja_JP: カンマ区切りのキーワード。説明にいずれかが含まれる場合トリガーします。

output_schema:
  type: object
  properties:
    ticket:
      type: object
      description: Ticket details (the `detail` object of the Zendesk event). IDs are strings; enum values are upper-case, e.g. OPEN.
      properties:
        id:
          type: string
        subject:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        custom_status:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        is_public:
          type: boolean
        tags:
          type: array
          items:
            type: string
        actor_id:
          type: ["string", "null"]
        assignee_id:
          type: ["string", "null"]
        brand_id:
          type: ["string", "null"]
        external_id:
          type: ["string", "null"]
        form_id:
          type: ["string", "null"]
        group_id:
          type: ["string", "null"]
        organization_id:
          type: ["string", "null"]
        requester_id:
          type: ["string", "null"]
        submitter_id:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        via:
          type: object
          properties:
            channel:
              type: string
    ticket_url:
      type: ["string", "null"]
      description: Agent URL of the ticket, e.g. https://acme.zendesk.com/agent/tickets/123
  required:
  - ticket

extra:
  python:
    source: events/ticket/ticket_created.py
