name: Tokener staging package

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "models/tokener-staging/**"
      - ".github/workflows/tokener-staging-artifact.yaml"

permissions:
  contents: read

concurrency:
  group: tokener-staging-package-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.19"
          enable-cache: false

      - name: Download the pinned Dify CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.6.15 --repo langgenius/dify-plugin-daemon \
            --pattern dify-plugin-linux-amd64 --dir "$RUNNER_TEMP"
          printf '%s  %s\n' \
            d0a1e3b25bd6c5f6cd749cad2cf04817ea808344e6cc07a2c49bb0108019ab93 \
            "$RUNNER_TEMP/dify-plugin-linux-amd64" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/dify-plugin-linux-amd64"

      - name: Build the unsigned staging package
        env:
          PLUGIN_PATH: models/tokener-staging
          OUT_DIR: ${{ runner.temp }}/tokener-staging
        run: |
          test -f "$PLUGIN_PATH/manifest.yaml"
          grep -Fx 'name: tokener-staging' "$PLUGIN_PATH/manifest.yaml"
          grep -Fx 'ENDPOINT_URL = "https://api-staging.tokener.dev/v1"' \
            "$PLUGIN_PATH/models/_credentials.py"
          bash .github/scripts/export-legacy-requirements.sh "$PLUGIN_PATH"
          mkdir -p "$OUT_DIR"
          pkg="$OUT_DIR/tokener-staging-unsigned.difypkg"
          "$RUNNER_TEMP/dify-plugin-linux-amd64" plugin package "$PLUGIN_PATH" --output_path "$pkg"
          unzip -tq "$pkg"
          (cd "$OUT_DIR" && sha256sum tokener-staging-unsigned.difypkg > SHA256SUMS)
          printf '%s\n' 'Unsigned staging-only package. A trusted signer is required before installation.' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the package without publishing it
        uses: actions/upload-artifact@v4
        with:
          name: tokener-staging-unsigned-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/tokener-staging/
          if-no-files-found: error
          retention-days: 7
