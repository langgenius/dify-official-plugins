name: Upload Merged Plugin

on:
  push:
    branches:
      - main
    paths:
      - "agent-strategies/**"
      - "datasources/**"
      - "extensions/**"
      - "models/**"
      - "tools/**"
      - "triggers/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: depot-ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      plugins: ${{ steps.filter.outputs.plugins }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: base-sha
        name: Resolve base SHA from last successful run
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          FALLBACK_SHA: ${{ github.event.before }}
        run: |
          API_RESPONSE=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/upload-merged-plugin.yaml/runs?status=success&branch=${{ github.ref_name }}&per_page=10")

          LAST_SUCCESS_SHA=$(echo "$API_RESPONSE" | jq -r \
            --arg current "$CURRENT_SHA" \
            --argjson run_number "$CURRENT_RUN_NUMBER" \
            '[.workflow_runs[] | select(.head_sha != $current and .run_number < $run_number)] | max_by(.run_number) | .head_sha // empty')

          if [ -n "$LAST_SUCCESS_SHA" ]; then
            echo "base_sha=$LAST_SUCCESS_SHA" >> "$GITHUB_OUTPUT"
            echo "Using last successful run SHA: $LAST_SUCCESS_SHA"
          else
            echo "base_sha=$FALLBACK_SHA" >> "$GITHUB_OUTPUT"
            echo "No prior successful run found; falling back to github.event.before: $FALLBACK_SHA"
          fi

      - id: filter
        name: Detect changed plugins
        env:
          BASE_SHA: ${{ steps.base-sha.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/detect-changed-plugins.sh

  upload-merged-plugin:
    permissions:
      # contents: write is only what lets the failure report post a commit
      # comment. The toolkit and the CLI are cloned with
      # ORG_SCOPE_GITHUB_TOKEN, not with this token.
      contents: write
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: depot-ubuntu-24.04-4
    strategy:
      matrix:
        plugin_path: ${{ fromJson(needs.detect-changes.outputs.plugins) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve external tool versions
        id: external
        env:
          GH_TOKEN: ${{ secrets.ORG_SCOPE_GITHUB_TOKEN }}
        run: |
          echo "toolkit_sha=$(gh api repos/langgenius/dify-marketplace-toolkit/commits/HEAD --jq .sha)" >> $GITHUB_OUTPUT
          echo "cli_tag=$(gh release view -R langgenius/dify-plugin-daemon --json tagName --jq .tagName)" >> $GITHUB_OUTPUT

      - name: Cache .scripts (toolkit + CLI)
        id: scripts-cache
        uses: actions/cache@v4
        with:
          path: .scripts
          key: scripts-${{ steps.external.outputs.toolkit_sha }}-${{ steps.external.outputs.cli_tag }}

      - name: Clone Marketplace Toolkit
        if: steps.scripts-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ORG_SCOPE_GITHUB_TOKEN }}
        run: |
          gh repo clone langgenius/dify-marketplace-toolkit -- .scripts/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.7

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          activate-environment: false
          enable-cache: true
          cache-dependency-glob: |
            ${{ matrix.plugin_path }}/uv.lock
            ${{ matrix.plugin_path }}/requirements.txt

      - name: Download Dify CLI
        if: steps.scripts-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ORG_SCOPE_GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.external.outputs.cli_tag }}" -R langgenius/dify-plugin-daemon --pattern "dify-plugin-linux-amd64" --dir .scripts
          chmod +x .scripts/dify-plugin-linux-amd64
          mv .scripts/dify-plugin-linux-amd64 .scripts/dify

      - name: Validate Dependencies
        run: |
          cd "${{ matrix.plugin_path }}"

          if [ -f "uv.lock" ]; then
            VENV_DIR="$RUNNER_TEMP/plugin-dependency-check-venv"

            cleanup() {
              rm -rf "$VENV_DIR"
            }
            trap cleanup EXIT

            rm -rf "$VENV_DIR"
            UV_PROJECT_ENVIRONMENT="$VENV_DIR" uv sync --all-groups --frozen --python 3.12
          elif [ -f "requirements.txt" ]; then
            VENV_DIR=".ci-requirements-check-venv"

            cleanup() {
              rm -rf "$VENV_DIR"
            }
            trap cleanup EXIT

            rm -rf "$VENV_DIR"
            uv venv "$VENV_DIR" --python 3.12
            uv pip install --python "$VENV_DIR/bin/python" -r requirements.txt
          else
            echo "!!! uv.lock or requirements.txt is required for dependency validation"
            exit 1
          fi

      - name: Generate Legacy Requirements for Packaging
        run: |
          bash .github/scripts/export-legacy-requirements.sh "${{ matrix.plugin_path }}"

      - name: Upload Plugin (production)
        run: |
          uv run --with requests --with dify_plugin python .scripts/uploader -d "${{ matrix.plugin_path }}" -t "${{ secrets.MARKETPLACE_TOKEN }}" --plugin-daemon-path .scripts/dify -u "${{ secrets.MARKETPLACE_BASE_URL }}" -f

      # Staging exists to exercise the publish pipeline -- several backend
      # scheduler tasks (sync_latest_plugins and the rest of the
      # upload-signal-driven set) only run when an upload signals them, so a
      # staging deployment that never receives one cannot be tested at all.
      #
      # It must never decide whether a plugin reaches production, so this step
      # is allowed to fail and reports itself through a commit comment instead
      # of a red workflow. It also runs after production, so a package
      # production rejects never lands on staging either.
      #
      # -f keeps a re-run idempotent: staging is not the record of truth, and a
      # 409 from a version some backfill already put there would hide whether
      # the pipeline reached it.
      #
      # Packaging repeats here (the uploader packages what -d points at). The
      # requirements.txt export above is not redone, and a full security scan
      # measures 16s, so the second leg costs seconds -- not worth passing the
      # package between steps for.
      - name: Upload Plugin (staging)
        id: upload-staging
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ secrets.MARKETPLACE_STAGING_BASE_URL }}
          STAGING_TOKEN: ${{ secrets.MARKETPLACE_STAGING_TOKEN }}
        run: |
          if [ -z "$STAGING_BASE_URL" ] || [ -z "$STAGING_TOKEN" ]; then
            echo "MARKETPLACE_STAGING_BASE_URL / _TOKEN are not set; skipping the staging upload"
            exit 0
          fi
          uv run --with requests --with dify_plugin python .scripts/uploader -d "$PLUGIN_PATH" -t "$STAGING_TOKEN" \
            --plugin-daemon-path .scripts/dify -u "$STAGING_BASE_URL" -f

      - name: Report a failed staging upload
        if: steps.upload-staging.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLUGIN: ${{ matrix.plugin_path }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(printf '%s\n' \
              "**Staging upload failed** for \`$PLUGIN\`." \
              "" \
              "The plugin **is** published to production -- only <https://marketplace-staging.dify.dev> is missing it, so nothing needs re-merging or re-reviewing." \
              "" \
              "Reason: [workflow run]($RUN_URL). The next push of this plugin, or a backfill run, will bring staging back in line." \
              "" \
              "_This comment exists because the staging leg is deliberately non-blocking._")"
